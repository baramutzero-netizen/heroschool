<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>튜토리얼 · 세로형 12종</title>
<style>*{box-sizing:border-box}body{margin:0;background:#242426;color:#f4ead7;font:16px/1.7 system-ui,sans-serif}header{padding:28px 22px;max-width:1200px;margin:auto}h1{font-size:27px;margin:0}p{color:#c4b89f;margin:8px 0}main{max-width:1200px;margin:auto;padding:0 22px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start}figure{margin:0}figcaption{margin:0 0 8px}img{display:block;width:100%;border-radius:12px;border:1px solid #8e7449}a{color:inherit}small{font-size:13px;color:#c4b89f}</style>
<header><h1>튜토리얼 · 세로형 12종</h1><p>현재 UI와 규칙을 반영한 안내입니다. 이미지를 누르면 원본 크기로 볼 수 있습니다.</p><small>게임에서는 실제 글자로 표시되어 화면 폭에 맞춰 줄바꿈됩니다.</small></header><main id="gallery"></main>
<script>const titles=['주간 스케줄','개인 행동','멘탈리티','대회 목표','라이벌','원정과 유물','친선전','라커룸','졸업생 리그','인가와 증축','겨울 진로 준비','카드 표식'];gallery.innerHTML=titles.map((t,i)=>{const n=String(i+1).padStart(2,'0'),src='../../assets/tutorial-v2/'+n+'.png';return `<figure><figcaption>${n} · ${t}</figcaption><a href="${src}" target="_blank"><img src="${src}" alt="${t} 안내" loading="lazy"></a></figure>`}).join('');</script></html>
