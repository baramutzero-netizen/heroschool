<!doctype html><html lang="ko"><meta charset="utf-8"><title>진행 페이지 테스트</title><style>body{margin:0;background:#342619;font:13px sans-serif}nav{padding:8px;background:#f0e4cb}button{padding:6px 12px}iframe{border:0;width:100%;height:calc(100vh - 46px)}</style><nav>저장 데이터와 분리된 미리보기 <button id="more">학생 18명</button> <button id="plan">진행</button> <button id="opt">설정</button></nav><iframe></iframe><script>
const f=document.querySelector('iframe');f.onload=()=>{if(!f.srcdoc)return;f.contentWindow.eval(`newGame('별빛 용사 학원');UI.ceremonies=[];closeModal();PREF.chronicleTest=true;UI.view='plan';render();`);document.querySelector('#more').onclick=()=>f.contentWindow.eval(`while(S.students.length<18)S.students.push(newStudent(1,'A',JOB_KEYS[S.students.length%JOB_KEYS.length]));UI.view='plan';render();`);for(const k of ['plan','opt'])document.querySelector('#'+k).onclick=()=>f.contentWindow.eval(`UI.view='${k}';render();`)};fetch('../../heroschool.html').then(r=>r.text()).then(h=>{const isolated=`<script>for(const key of ['localStorage','sessionStorage']){const m=new Map();Object.defineProperty(window,key,{value:{getItem:k=>m.get(String(k))??null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}});}<\/script>`;f.srcdoc=h.replace('<head>','<head>'+isolated)});
</script></html>
