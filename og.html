<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#13141b;color:#e8e7f0;
  font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  display:flex;flex-direction:column;justify-content:center;padding:76px 88px;position:relative;overflow:hidden}
.glow{position:absolute;inset:-40% -10% auto auto;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,162,74,.16),transparent 62%)}
svg{width:96px;height:96px}
h1{font-size:88px;font-weight:700;letter-spacing:-.02em;margin:26px 0 14px;font-family:"Gowun Batang","Nanum Myeongjo",serif}
p{font-size:29px;color:#9c9eb4;line-height:1.5;max-width:900px}
.row{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.t{border:1px solid #333747;border-radius:4px;padding:7px 18px;font-size:22px;color:#c8a24a}
.bar{position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,#c8a24a,#8a86ec 55%,transparent)}

<div class="glow"></div>

<div class="row"><span class="t">직업 12종</span><span class="t">스킬 48종</span><span class="t">ATB 전투</span><span class="t">세이브 자동</span></div>
