function synthDo(){
  const U = UI.synth; if(!U) return;
  const A = relicById(U.a), B = relicById(U.b);
  if(!A || !B || A.grade!=="S" || B.grade!=="S") return;
  const plan = synthPlan(A, B, U.lock), cost = synthCost(U.lock);
  if(S.gold < cost){ toast(`자금이 ${fmt(cost - S.gold)} G 모자란다.`); return; }
  S.gold -= cost;
  const R = synthRoll(plan);
  S.relicPool = (S.relicPool||[]).filter(r=> r!==A && r!==B);
  S.relicPool.push(R);
  const plus = R.grade === "S+";
  logE(`유물 합성 — <b style="color:${GRADE_COLOR.S}">${esc(A.name)}</b> + <b style="color:${GRADE_COLOR.S}">${esc(B.name)}</b> → <b style="color:${GRADE_COLOR[R.grade]}">${esc(R.name)}</b> (${R.grade}) · 자금 -${fmt(cost)}`, plus? "big" : "good");
  UI.synth = null;
  save(); render();
  showModal(`<div class="cerhead"><div class="eyebrow">유물 합성 완료</div>
      <h2 style="font-size:22px;margin-top:2px;color:${GRADE_COLOR[R.grade]}">${plus? "S+ 유물이 탄생했다!" : "새 유물을 얻었다"}</h2>
      ${plus? `<p style="color:var(--muted);font-size:13px;margin-top:4px">모든 수치가 2배로 굳었다.</p>` : ""}</div>
    <div class="opt syn-card ${plus?"splus":""}" style="max-width:360px;margin:14px auto 0;cursor:default">${relicNameHtml(R)}${relicAffHtml(R)}</div>
    <div class="btnrow" style="justify-content:center;margin-top:14px"><button class="btn primary" data-close>확인</button></div>`, null, false);

}
/* 유물 장착 미리보기 — 같은 유물도 누가 끼느냐에 따라 오르는 전투력이 다르다.
   slot 이 있으면 그 칸의 유물과 바꾼 경우, 없으면 빈 칸에 더한 경우 */
function relicPowerAfter(st, r, slot){
  const rel = (st.relics||[]).slice();
  if(slot != null && slot >= 0) rel[slot] = r; else rel.push(r);
  return power(Object.assign({}, st, {relics:rel}));
}
function powerChangeHtml(a, b){
  const d = b - a, c = d > 0 ? "ok" : d < 0 ? "bad" : "dim";
  return `전투력 <b style="color:var(--text)">${fmt(a)}</b> → <b style="color:var(--text)">${fmt(b)}</b> <b style="color:var(--${c})">${d>0?"+":d<0?"−":"±"}${fmt(Math.abs(d))}</b>`;
}
function relicEquipPreview(r, st){
  if(!r || !st) return "";
  const full = (st.relics||[]).filter(Boolean).length >= relicSlots(st);
  if(full) return "";                 // 칸이 가득 찬 학생 — 교체 팝업에서 칸마다 변화를 보여준다
  if(r.grade==="EX" && exCount(st) >= EX_PER_STUDENT) return `<span style="color:var(--bad)">EX 유물을 이미 차고 있다 (한 명당 하나)</span>`;
  return powerChangeHtml(power(st), relicPowerAfter(st, r));
}
function relicSwapModal(poolIdx, sid){

  if(!s || !want) return;
  const worn = (s.relics||[]).map((r,i)=> r? {r,i} : null).filter(Boolean);
  if(!worn.length) return;

  showModal(`<div class="cerhead"><div class="eyebrow">유물 교체</div>
      <h2 style="font-size:22px;margin-top:2px">${dnH(s)} <span class="tag">${JOBS[s.job].name}</span></h2>
      <p style="color:var(--muted);font-size:13px;margin-top:6px">유물 칸이 가득 찼다. 바꿀 유물을 고르면 그 자리에 새 유물이 들어가고, 벗은 유물은 보관고로 돌아간다.</p></div>
    <div class="rswap">
      <div>
        <div class="eyebrow" style="margin-bottom:6px">장착 중</div>
        ${worn.map(({r,i},k)=>{ const exB = want.grade==="EX" && r.grade!=="EX" && exCount(s) >= EX_PER_STUDENT;
          const d = relicPowerAfter(s, want, i) - power(s);
          return `<button class="opt rswap-w" data-rsw="${i}" style="text-align:left;width:100%;margin-bottom:6px">${card(r, `<div class="od" style="color:var(--dim)">유물 ${k+1}${exB? "" : ` · 바꾸면 전투력 <b style="color:var(--${d>0?"ok":d<0?"bad":"dim"})">${d>0?"+":d<0?"−":"±"}${fmt(Math.abs(d))}</b>`}</div>`)}</button>`; }).join("")}
      </div>
      <div class="rswap-arrow"><span>→</span></div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">변경할 유물</div>
        <div class="opt sel" style="cursor:default">${card(want)}</div>
        <div class="od" id="rswDiff" style="margin-top:8px;min-height:1.6em;color:var(--muted)">왼쪽에서 바꿀 유물을 고른다.</div>
      </div>
    </div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn primary" id="rswOk" disabled>확인</button>
      <button class="btn ghost" data-close>취소</button>
    </div>`, ()=>{
    const root = $("#modalRoot"), ok = root.querySelector("#rswOk"), diff = root.querySelector("#rswDiff");
    root.querySelectorAll("[data-rsw]").forEach(b=> b.onclick=()=>{
      pick = +b.dataset.rsw;
      root.querySelectorAll("[data-rsw]").forEach(x=> x.classList.toggle("sel", x===b));
      const old = s.relics[pick];
      const exBlock = want.grade==="EX" && old.grade!=="EX" && exCount(s) >= EX_PER_STUDENT;
      diff.innerHTML = exBlock
        ? `<span style="color:var(--bad)">EX 유물은 한 명당 하나까지 — 차고 있는 EX 유물과 바꿔야 한다.</span>`
        : `<b style="color:${GRADE_COLOR[old.grade]}">${esc(old.name)}</b> → <b style="color:${GRADE_COLOR[want.grade]}">${esc(want.name)}</b><br>${relicDiffText(old, want)}<br>${powerChangeHtml(power(s), relicPowerAfter(s, want, pick))}`;
      ok.disabled = exBlock;
    });
    ok.onclick = ()=>{
      if(pick<0) return;
      const old = s.relics[pick];
      if(want.grade==="EX" && old.grade!=="EX" && exCount(s) >= EX_PER_STUDENT) return;
      const cur = S.relicPool.indexOf(want); if(cur<0) return;
      S.relicPool.splice(cur,1);
      s.relics[pick] = want;
      addRelicToPool(old);
      logE(`<b>${dnH(s)}</b> 유물 교체 — <b style="color:${GRADE_COLOR[old.grade]}">${esc(old.name)}</b> → <b style="color:${GRADE_COLOR[want.grade]}">${esc(want.name)}</b>`,"good");
      closeModal(); save(); render(); toast(`${dn(s)} · ${want.name} 장착`);
    };
  });
}

const SCOUT_INFO_PER = 5;    // 마스터 정보력 이만큼마다 정찰 1단계
function scoutLevel(){ return clamp(Math.floor(S.master.info/SCOUT_INFO_PER) + (S.items.scope?1:0), 0, 3); }
function rivalAcademy(strength, teams, prof, name){
  name = name || (pick(ACAD)+" 학원");
  const T=[];
  for(let i=0;i<teams;i++){
    const lv = Math.max(1, Math.round(strength + rnd(-2,2) - i*1.1));
    const t = genFoeTeam(lv, 1, 3, prof||"rival");
    // 전형적인 탱-딜-힐 구성으로 보정
    const comp = pick([
      ["paladin","archer","priest"],["sword","rogue","priest"],["monk","archer","timemage"],
      ["sword","archer","priest"],["paladin","rogue","timemage"],["monk","rogue","priest"],
      ["druid","wizard","priest"],["paladin","wizard","enchanter"],["sword","forcemage","darkpriest"],
      ["druid","archer","darkpriest"],["monk","wizard","enchanter"],["forcemage","rogue","priest"],
      ["druid","forcemage","darkpriest"],["paladin","wizard","timemage"],["sword","wizard","enchanter"]]);
    t.forEach((s,k)=>{ s.job=comp[k]; autoSkMod(s, lv); });
    T.push(assignFoeForm(t));
  }
  return {name, teams:T};
}
function ourAvgLevel(pool){ const p = pool||S.students; return p.reduce((a,s)=>a+s.level,0)/Math.max(1,p.length); }

const SPRING_LV_OFF = -3;   // 신인전 상대 기준 레벨 = 우리 1·2학년 평균 + 이 값
function startSpringTour(){
  const pool = S.students.filter(s=>s.year<=2);
  UI.tour = {
    kind:"spring", title:`${yrName(S.year+1)} 봄 신인전`, stage:"prep", _prepOpen:true,
    myTeams:[[]], entryTeams:[], round:0, maxRound:1, results:[], matchIdx:0,
    opps: (()=>{ const nm = acadNames(4);
      if(portalOn()) return Array.from({length:4},(_,i)=> ({name:nm[i], teams:[portalTeam(PORTAL_SPEC.spring)], tier:PORTAL_TIER}));
      return Array.from({length:4},(_,i)=> Object.assign(
        rivalAcademy(ourAvgLevel(pool) + SPRING_LV_OFF + tierSpringLv() + i*1.0, 1, "rival", nm[i]), {tier:0})); })(),
    pool
  };
  UI.tour.rivals = UI.tour.opps.map((o,i)=> ({name:o.name, str: 1 + i*.12 + rnd(-.25,.35), pts:0, w:0, l:0}));
  UI.pendingTour = true;
}
/* 봄 신인전 순위표 — 우리 4경기 뒤, 상대 학원끼리 남은 경기를 시뮬레이션한다 */
function springTable(t){
  const R = t.rivals || [];
  t.results.forEach((r,i)=>{ const v=R[i]; if(!v) return;
    if(r.win){ v.l++; } else { v.w++; v.pts+=3; } });
  for(let i=0;i<R.length;i++) for(let j=i+1;j<R.length;j++){
    const p = R[i].str/(R[i].str+R[j].str);
    if(RNG()<p){ R[i].pts+=3; R[i].w++; R[j].l++; } else { R[j].pts+=3; R[j].w++; R[i].l++; }
  }
  const wins = t.results.filter(r=>r.win).length;
  const me = {name:S.acadName, pts:wins*3, w:wins, l:t.results.length-wins, me:true};
  const table = R.map(r=>({name:r.name, pts:r.pts, w:r.w, l:r.l})).concat([me]);
  table.sort((a,b)=> b.pts-a.pts || b.w-a.w || (b.me?-1:0)-(a.me?-1:0) || RNG()-.5);
  t.standings = table;
  t.rank = table.findIndex(x=>x.me)+1;
  t.champ = t.rank===1;
  return table;
}
function tourMatchStudents(ids){ return ids.map(id=>S.students.find(s=>s.id===id)).filter(Boolean); }

const BANNER_MUL = 1.25;
/* 학원기 — 대회에서 얻는 학원 명성을 올린다 */
function bannerFame(v){ return (S.items && S.items.banner) ? v * BANNER_MUL : v; }
function finishTournament(t){
  const wins = t.results.filter(r=>r.win).length;
  const total = t.results.length;
  const tierM = tierMul();
  let fame=0, gold=0, msg="";
  if(t.kind==="spring"){
    if(!t.standings) springTable(t);
    fame = wins*34*tierM; gold = wins*260*tierM;
    msg = `봄 신인전 ${t.rank}위 (${wins}승 ${total-wins}패)`;
    if(t.champ){ fame*=1.6; gold*=1.45; msg = `봄 신인전 우승! (${wins}승 ${total-wins}패)`; missionProgress("debut"); }
  } else {
    const champ = t.roundWins===t.maxRound;
    fame = t.roundWins*95*tierM + (champ?260*tierM:0);
    gold = t.roundWins*620*tierM + (champ?1500*tierM:0);
    msg = champ? `가을 대회 우승!` : `가을 대회 ${t.roundWins}라운드 진출`;
  }
  fame = bannerFame(fame);
  addFame(fame); addGold(gold);
  // 출전 학생 개인 명성
  const ups=[], rows=[];
  const parts = new Set();
  t.results.forEach(r=> (r.myIds||[]).forEach(id=>parts.add(id)));
  // 진로 평가 — 승리는 크게, 무승은 감점
  const evalNotes = [];
  parts.forEach(id=>{
    const s = S.students.find(x=>x.id===id); if(!s) return;
    const myW = t.results.filter(r=>r.win && (r.myIds||[]).includes(id)).length;
    let d = 0;
    if(t.kind==="spring"){
      d = wins*4 + (t.champ? 8:0);
      if(wins===0) d = -6;
    } else {
      const myWins = t.results.filter(r=>r.win && (r.myIds||[]).includes(id)).length;
      const champ = t.roundWins===t.maxRound;
      d = myWins*4 + (t.roundWins||0)*5 + (champ? 12:0);
      if(wins===0) d = -8;
    }
    const got = addEval(s, d);
    if(got) evalNotes.push(`${dnH(s)} ${got>0?"+":""}${got.toFixed(0)}`);
    if(t.kind==="spring" ? t.champ : t.roundWins===t.maxRound){ s.wins = s.wins||[]; s.wins.push({y:S.year, n: t.kind==="spring" ? "봄 신인전" : "가을 대회"}); }
    const fg = Math.round((t.kind==="spring"?wins*9:(t.roundWins||0)*22)+8);
    s.fame += fg;
    const lv0 = s.level;
    let xp = t.kind==="spring"? 320+wins*130 : 900+(t.roundWins||0)*480;
    xp = Math.round(xp * broExpMul(s, [...parts]));
    const n = gainExp(s, xp, true);
    ups.push({s, n});
    rows.push({name:dn(s), job:JOBS[s.job].name, wins:myW, lv0, lv1:s.level, lvUp:n>0,
      exp:Math.round(xp), ev:Math.round(got||0), fame:fg});
  });
  rows.sort((a,b)=> b.wins-a.wins || b.ev-a.ev);
  tryEpithetTour("tour", t, parts, t.title);
  if(evalNotes.length) logE(`진로 평가 — ${evalNotes.join(", ")}`, wins? "good":"bad");
  levelReport(ups);
  logE(`<b>${msg}</b> — 명성 +${fmt(fame)} · 자금 +${fmt(gold)}`,"big");
  S.lastTour = {title:t.title, msg, fame:Math.round(fame), gold:Math.round(gold), results:t.results.map(r=>({vs:r.vs,win:r.win,score:r.score}))};
  const REC = {title:t.title, msg, w:wins, l:total-wins, fame:Math.round(fame), gold:Math.round(gold),
    matches:t.results.map(r=>({label:r.label, vs:r.vs, win:r.win, score:r.score})),
    standings:(t.kind==="spring"? t.standings : null), top2:false, rows, next:null};
  UI.tour=null; UI.pendingTour=false;
  closeModal();
  advancePhase();
  UI.view = "home";
  save();
  tourResultModal(REC, ()=>{ if((UI.ceremonies||[]).length) showCeremony(); else render(); });
}

  const b = runBattle(my, FT, Object.assign({titleA:S.acadName, titleB:foe.name, moodA:L.mood}, teamBattleOpt(TM), foeBattleOpt(FT)));
  const after = ()=> ladderRecord(t, b, foe.name, ids);
  if(quick) after();
  else openBattle(b, {titleA:S.acadName, titleB:foe.name, field:t.step, bgm:ladderBgm(t), jingle:true,
    cheer: t.step==="final",
    head:`${t.title} — ${ladderMatchLabel(t)}`, doneLabel:"결과 확정"}, after);
}
/* 대회 단계별 전투곡 — 컵의 마지막 라운드는 결승 전용 곡 */
function ladderBgm(t){
  const c = t.cfg || LADDER[t.step] || {};
  const fin = c.kind==="cup" && (t.round|0) >= ((t.maxRound|| c.rounds ||4) - 1);
  if(t.step==="qual")  return "fest";
  if(t.step==="final") return fin ? "festFinal" : "fest";
  return fin ? "tourFinal" : "tour";
}
function ladderRecord(t, b, oppName, ids){
  if(UI.tour!==t) return;
  t._busy = false;
  const win = b.winner==="A";
  const aliveA = b.A.filter(u=>u.alive).length, aliveB = b.B.filter(u=>u.alive).length;
  t.results.push({vs:oppName, win, score:`${aliveA}-${aliveB}`, myIds:ids.slice(), label:ladderMatchLabel(t), foes:b.B.map(u=>u.name)});
  if(t.cfg.kind==="cup"){
    const U = ladderUse(t.step);
    const tie = ladderTie(t);
    if(win){ t.rw++; if(!tie && t.wonSlot==null) t.wonSlot = t.slot; }
    else   { t.rl++; if(!tie && t.lostSlot==null) t.lostSlot = t.slot; }
    t.slot++;
    // 라운드가 결정됐는가
    const need = U===3 ? 2 : U;            // 1팀=1승, 2팀=2승, 3팀=2승
    let took = null;
    if(U===1)      took = win;
    else if(U===2){
      if(t.rw>=2) took = true;
      else if(t.rl>=2) took = false;
      else if(tie) took = win;             // 1:1 뒤 결정전
      // 1:1 이면 결정전으로 (took 는 null 유지)
    } else {
      if(t.rw>=2) took = true; else if(t.rl>=2) took = false;
    }
    if(took === null){ renderTournament(); return; }
    const sc = tie ? `${t.rw}:${t.rl} (결정전)` : `${t.rw}:${t.rl}`;
    logE(`${t.title} ${ladderRoundLabel(t)} — <b>${esc(oppName)}</b> 상대 ${sc} ${took?"승리":"패배"}`, took?"good":"bad");
    if(took){
      t.w++; t.round++;
      if(t.step==="city" && t.round===2) missionProgress("debut");   // 시내 4강 진입
      if(t.round >= t.maxRound){ t.stage="result"; t.advanced=true; renderTournament(); return; }
      t.slot=0; t.rw=0; t.rl=0; t.wonSlot=null; t.lostSlot=null;
      t.stage = U>1 ? "scout" : "match";
      renderTournament(); return;
    }
    t.l++; t.stage="result"; t.advanced=false; renderTournament(); return;
  }
  if(win) t.w++; else t.l++;
  // 리그
  t.rivals[t.round].pts += win? 0 : 3;
  t.rivals[t.round].l += win?1:0; t.rivals[t.round].w += win?0:1;
  t.round++;
  if(t.round >= t.maxRound){ ladderLeagueTable(t); t.stage="result"; renderTournament(); return; }
  t.useTeam = (t.useTeam+1) % ladderUse(t.step);
  renderTournament();
}
function ladderLeagueTable(t){
  // 남은 리그 경기(상대끼리)를 전력 기반으로 시뮬레이션
  const R = t.rivals;
  for(let i=0;i<R.length;i++) for(let j=i+1;j<R.length;j++){
    const p = R[i].str/(R[i].str+R[j].str);
    if(RNG()<p){ R[i].pts+=3; R[i].w++; R[j].l++; } else { R[j].pts+=3; R[j].w++; R[i].l++; }
  }
  const me = {name:S.acadName, pts:t.w*3, w:t.w, l:t.l, me:true};
  const table = R.map(r=>({name:r.name, pts:r.pts, w:r.w, l:r.l})).concat([me]);
  table.sort((a,b)=> b.pts-a.pts || (b.me?-1:0) - (a.me?-1:0) || RNG()-.5);
  t.standings = table;
  t.rank = table.findIndex(x=>x.me)+1;
  t.advanced = t.rank<=2;
}
function finishLadder(t){
  const cfg = t.cfg;
  let fame = 0, gold = cfg.gold * t.w;
  const champ = cfg.kind==="cup" && t.advanced;
  const top = ladderTop(t);
  if(top && cfg.champFame){ fame += cfg.champFame; gold += cfg.champGold||0; }
  if(champ) missionProgress(t.step);
  if(champ && t.step==="city") missionProgress("debut");   // 우승은 4강을 포함한다
  if(champ && t.step==="final") S.finalWins = (S.finalWins|0) + 1;   // 이계에서의 편지 조건
  if(t.step==="city" && !shopUnlocked()){ S.shopUnlock = S.year; queueCeremony({type:"shopopen", year:S.year}); }   // 시설 · 구매 해금 (0929)
  fame = Math.round(bannerFame(fame));
  if(fame) addFame(fame);
  if(gold) addGold(gold);
  // 출전 학생 — 진로 평가 · 경험 · 개인 명성
  const parts = new Set(); t.results.forEach(r=> r.myIds.forEach(id=>parts.add(id)));
  const ups=[], notes=[], rows=[];
  parts.forEach(id=>{
    const s = S.students.find(x=>x.id===id); if(!s) return;
    if(champ){ s.wins = s.wins||[]; s.wins.push({y:S.year, n:cfg.n}); }      // 졸업 증서용 — 우승 경력
    const myWins = t.results.filter(r=>r.win && r.myIds.includes(id)).length;
    let d = myWins*5 + (t.advanced? 8:0) + (champ? 20:0);
    if(t.w===0) d = -8;
    const got = addEval(s, d);
    if(got) notes.push(`${dnH(s)} ${got>0?"+":""}${got.toFixed(0)}`);
    const fg = Math.round(myWins*10 + (t.advanced?12:0));
    s.fame += fg;
    const lv0 = s.level;
    const mates = t.results.filter(r=>r.myIds.includes(id)).reduce((a,r)=>a.concat(r.myIds),[]);
    const xp = Math.round((260 + myWins*220 + (champ?600:0)) * broExpMul(s, mates));
    const n = gainExp(s, xp, true);
    ups.push({s, n});
    rows.push({name:dn(s), job:JOBS[s.job].name, wins:myWins, lv0, lv1:s.level, lvUp:n>0,
      exp:Math.round(xp), ev:Math.round(got||0), fame:fg});
  });
  rows.sort((a,b)=> b.wins-a.wins || b.ev-a.ev);
  tryEpithetTour("tour", t, parts, t.title);
  levelReport(ups);
  if(notes.length) logE(`진로 평가 — ${notes.join(", ")}`, t.w? "good":"bad");
  const msg = cfg.kind==="league"
    ? (t.advanced? `${t.rank}위로 본선 진출` : `${t.rank}위 — 본선 진출 실패`)
    : (champ? `우승!` : `${ladderRoundLabel({cfg,round:t.round,maxRound:t.maxRound})}에서 탈락`);
  logE(`<b>${t.title}</b> ${t.w}승 ${t.l}패 — ${msg}${fame? ` · 학원 명성 +${fmt(fame)}`:""}${gold? ` · 자금 +${fmt(gold)}`:""}`,"big");
  S.lastTour = {title:t.title, msg:`${t.w}승 ${t.l}패 · ${msg}`, fame:Math.round(fame), gold:Math.round(gold),
    results:t.results.map(r=>({vs:r.vs,win:r.win,score:r.score}))};
  // 우승 팝업에 세울 1번 출전 팀 — 그 시점의 이름과 직업만 담는다
  const winners = champ ? ((t.myTeams && t.myTeams[0]) || []).map(id=>{
      const st = S.students.find(x=>x.id===id);
      return st? {name:dn(st), job:st.job} : null;
    }).filter(Boolean) : null;
  const REC = {title:t.title, msg, w:t.w, l:t.l, fame:Math.round(fame), gold:Math.round(gold), win:winners,
    matches:t.results.map(r=>({label:r.label, vs:r.vs, win:r.win, score:r.score})),
    standings:t.standings||null, top2:(cfg.kind==="league"), rows,
    next: (t.advanced && ladderNext(t.step)) ? LADDER[ladderNext(t.step)].n : null};
  S.fallRun.entry = t.myTeams.map(a=>a.slice());
  S.fallRun.done.push({step:t.step, w:t.w, l:t.l, advanced:!!t.advanced});
  const rawNext = LADDER[t.step] && LADDER[t.step].next;
  const goNext = t.advanced && ladderNext(t.step);
  if(goNext) S.fallRun.step = goNext;
  else {
    S.fallRun.alive = false;
    if(t.advanced && rawNext && ladderLocked(rawNext)){
      const g = UNLOCKS[LADDER_GATE[rawNext]];
      logE(`<b>${LADDER[rawNext].n}</b>에는 아직 초대장이 없다 — ${esc(g.from)} 지침을 먼저 달성해야 문이 열린다. 올해 가을은 여기서 끝난다.`,"bad");
    }
  }
  S.fallRun.pending = null;
  UI.tour=null; UI.pendingTour=false; closeModal();
  UI.view = "home";
  if(t.step==="final" || !goNext){
    if(S.week >= PHASES.fall.weeks) advancePhase();
  }
  save();
  tourResultModal(REC, ()=>{ if((UI.ceremonies||[]).length) showCeremony(); else render(); });
}

const CSL_LEAD = .04, CSL_INFO = .06, CSL_NET = .04;
function cslLead(){ return S.master.lead + cslFacBonus().lead; }
function cslInfo(){ return S.master.info + cslFacBonus().info; }
function cslNet(){  return S.master.net  + cslFacBonus().net;  }
function cslLeadP(){ return clamp(cslLead()*CSL_LEAD, 0, .95); }
function cslInfoP(){ return clamp(cslInfo()*CSL_INFO, 0, .95); }
function cslNetP(){  return clamp(cslNet() *CSL_NET,  0, .95); }
const CSL_QUEUE_MAX = 5;
const CSL_PER_STUDENT = 3;   // 학생 한 명이 한 해에 찾아오는 횟수
function newCounselState(){ return {queue:[], done:[], usedC:[], usedS:[]}; }
function cslCount(C, sid){ return (C.usedS||[]).filter(x=> x===sid).length; }
function counselState(){
  if(!S.counsel || S.counsel.year !== S.year){ S.counsel = newCounselState(); S.counsel.year = S.year; }
  const C = S.counsel;
  if(!Array.isArray(C.queue)){ C.queue = C.pending? [C.pending] : []; }
  delete C.pending;
  C.done = C.done||[]; C.usedC = C.usedC||[]; C.usedS = C.usedS||[];
  // 학원을 떠난 학생(졸업 등)이나 사라진 상담거리는 대기열에서 내린다
  C.queue = C.queue.filter(q=> q && counselOf(q.cid) && S.students.some(x=>x.id===q.sid));
  return C;
}
function counselOf(id){ return COUNSEL.find(c=>c.id===id) || null; }
function tryCounsel(){
  const C = counselState();
  if(C.queue.length >= CSL_QUEUE_MAX) return;
  if(RNG() >= .30) return;
  const qS = C.queue.map(q=>q.sid), qC = C.queue.map(q=>q.cid);
  const cand = S.students.filter(s=> cslCount(C, s.id) < CSL_PER_STUDENT && !qS.includes(s.id));
  if(!cand.length) return;
  const pool = COUNSEL.filter(c=> !C.usedC.includes(c.id) && !qC.includes(c.id));
  if(!pool.length) return;
  const st = pick(cand), c = pick(pool);
  C.queue.push({sid:st.id, cid:c.id, order: shuffled([0,1,2]),
    reveal: RNG() < cslInfoP(), phase:S.phase, week:S.week+1});
  const n = C.queue.length;
  logE(`상담 요청 — <b>${dnH(st)}</b>${iga(st.name)} 할 말이 있다고 찾아왔다. <b style="color:var(--brass)">상담</b> 탭에서 들어줄 수 있다.${n>1? ` (대기 ${n}건)`:""}`,"big");
}
function shuffled(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=ri(0,i); const t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function answerCounsel(qi, oi){
  const C = counselState();
  const q = C.queue[qi];
  if(!q) return;
  const st = S.students.find(x=>x.id===q.sid);
  const c = counselOf(q.cid);
  if(!st || !c){ C.queue.splice(qi,1); save(); render(); return; }
  const o = c.o[oi];
  const fit = (o.f||[]).includes(st.pers||"plain");
  // 지도력 — 성격에 맞지 않아도 설득해낸다
  const byLead = !fit && (RNG() < cslLeadP());
  const byTrust = !fit && !byLead && trustFull(st);   // 운명 단계는 무슨 말이든 닿는다
  const ok = fit || byLead || byTrust;
  let gain = null, dbl = false, capped = false;
  if(ok){
    const ks = MENTAL.filter(m=>!m.fixed && st.ment[m.k] < mentCapOf(st, m.k));
    capped = !ks.length;
    if(ks.length){
      const m = pick(ks);
      let d = ri(2,4);
      // 호소력 — 상승폭 2배
      if(RNG() < cslNetP()){ d *= 2; dbl = true; }
      const before = st.ment[m.k];
      st.ment[m.k] = clamp(before + d, 1, mentCapOf(st, m.k));
      gain = {k:m.k, n:m.n, d: +(st.ment[m.k]-before).toFixed(2)};
    }
  }
  const tUp = ok ? (addTrust(st, 1), true) : false;
  C.queue.splice(qi,1);
  C.usedC.push(c.id); C.usedS.push(st.id);
  C.done.push({sid:st.id, name:dn(st), pers:st.pers, cid:c.id, oi, fit:ok, byLead, dbl, gain, capped,
    phase:q.phase||S.phase, week:q.week||(S.week+1)});
  logE(ok
    ? `상담 — <b>${dnH(st)}</b>(${personaOf(st).n})의 마음에 닿았다.${byLead? ` <span style="color:var(--brass)">지도력으로 설득</span>`:""}${byTrust? ` <span style="color:var(--brass)">운명 단계 — 무엇을 말해도 닿는다</span>`:""}${gain? ` <b style="color:var(--ok)">${gain.n} +${gain.d}</b>${dbl? ` <span style="color:var(--brass)">(호소력 2배)</span>`:""}`:""}${capped? ` <span style="color:var(--dim)">더 오를 항목이 없다 — 멘탈리티가 모두 한계다</span>`:""} · <span style="color:var(--brass)">신뢰 ${trustGainWord(1)}</span>`
    : `상담 — <b>${dnH(st)}</b>(${personaOf(st).n})${eunn(personaOf(st).n)} 아직 납득하지 못한 표정이다.`, ok?"good":"");
  save(); render();
  toast(ok? (gain? `${dn(st)} — ${gain.n} +${gain.d}${dbl?" (2배)":""}` : capped? `${dn(st)} — 멘탈리티가 모두 한계다. 신뢰만 깊어졌다` : `${dn(st)}의 마음에 닿았다`) : `${dn(st)}${eunn(st.name)} 납득하지 못했다`);
}

      // 대전용 — 이 기록만으로 전투 유닛을 다시 세울 수 있어야 한다
      grade:st.grade, pers:st.pers||"plain", raw:st.name,
      ment:Object.assign({}, st.ment), skMod:JSON.parse(JSON.stringify(st.skMod||{})),
      // 졸업 증서용
      enrollYear: S.year - (st.year-1), ment0: st.ment0 ? Object.assign({}, st.ment0) : null,
      expedN: Object.assign({}, st.expedN||{}), expedTotal: st._exp|0, wins: (st.wins||[]).slice(), careerD: c.d||"",
      relics:(st.relics||[]).filter(Boolean).map(r=>({grade:r.grade, name:r.name, aff:r.aff.map(a=>({k:a.k,n:a.n,v:a.v}))}))};
    // 졸업 선물 — 가장 깊이 체득한 기술 하나를 마스터에게 남긴다
    const abil = skillsOf(st).map(sk=>({cat: sk.kind==="basic"?"basic":sk.kind==="ult"?"ult":"skill",
      id:sk.id, name:sk.name, m:modOf(st, sk.id)}));
    const Pg = passiveOf(passiveJobOf(st));
    if(Pg) abil.push({cat:"passive", id:"passive", name:Pg.n, m:modOf(st,"passive")});
    abil.sort((a,b)=> (b.m.up||0)-(a.m.up||0) || RNG()-.5);
    const bestA = abil[0];
    cer.gifts.push({name:bestA.name, cat:bestA.cat,
      job: bestA.cat==="passive" ? passiveJobOf(st) : (ownerJobOf(bestA.id)||st.job),
      skillId: bestA.id, mod: Object.assign({}, bestA.m), from: dn(st), year: S.year});
    rec.gift = bestA.name;
    cer.list.push(rec); cer.fame += fame; cer.gold += gold;
    cer.logs.push({h:`졸업 — <b>${dnH(st)}</b>(${JOBS[st.job].name}) 진로: <b>${c.n}</b>${c.dark? ` <span style="color:var(--bad)">(업보 ${karmaOf(st)})</span>`:""}${tr? ` <span style="color:var(--brass)">신뢰 ${trustBand(tr).step}</span>`:""}. ${reason}`, c: c.dark? (c.id==="lord"?"big":"bad") : (c.fame>=110?"big":(c.fame<20?"bad":"good"))});
    (st.relics||[]).forEach(r=> r && addRelicToPool(r));
  });
  S.students = S.students.filter(s=>s.year<3);
  S.pendingGrad = cer;
  logE(`3학년 ${gr.length}명이 모든 과정을 마쳤다. 진로 발표와 졸업식은 겨울이 끝난 뒤에 열린다.`,"big");
}
function announceGraduation(){
  const cer = S.pendingGrad;
  if(!cer) return;
  cer.list.forEach(rec=> S.graduates.push(rec));
  S.skillPool = S.skillPool||[];
  (cer.gifts||[]).forEach(g=> S.skillPool.push(g));
  if((cer.gifts||[]).length) logE(`졸업생이 남긴 기술 ${cer.gifts.length}개가 보관고에 들어왔다 — ${cer.gifts.map(g=>g.name).join(", ")}`,"good");
  addFame(cer.fame); addGold(cer.gold);
  (cer.logs||[]).forEach(l=> logE(l.h, l.c));
  queueCeremony(cer);
  S.pendingGrad = null;
}
const SCOUT_DIST = [
  {D:40, C:40, B:16, A:4,  S:0},    // 무명
  {D:26, C:38, B:24, A:11, S:0},    // 유명
  {D:16, C:32, B:28, A:18, S:6},    // 강호  (명성 600~)
  {D:8,  C:24, B:30, A:26, S:12},   // 명문
  {D:4,  C:14, B:26, A:34, S:22}    // 초명문
];
const SCOUT_TRIES = 4;
/* 신입생 정원 — 무명·유명 3 · 강호·명문 4 · 초명문 5 */
const ENROLL_CAP = [3, 3, 4, 4, 5];
function enrollCap(){ return ENROLL_CAP[clamp(fameTitleIdx(S.fame), 0, 4)]; }
function fameTitleIdx(f){ return FAME_TITLES.reduce((a,x,i)=> f>=x.min? i : a, 0); }
function scoutTriesMax(){ return SCOUT_TRIES + fameTitleIdx(S.fame); }
function scoutFull(){ return ((S.incoming||[]).length) >= enrollCap(); }
function scoutOpen(){ return !scoutFull() && (S.scoutTries||0) > 0; }
/* 유명도 단계별 영입 성공률 보정 — 무명 0 · 유명 +5 · 강호 +10 · 명문 +15 · 초명문 +20%p */
const SCOUT_FAME_BONUS = [0, .05, .10, .15, .20];
function scoutFameBonus(){ return SCOUT_FAME_BONUS[clamp(fameTitleIdx(S.fame), 0, 4)] || 0; }
function scoutRate(g){
  const base = {D:.66,C:.54,B:.40,A:.25,S:.13}[g];
  return clamp(base + S.master.net*.05 + scoutFameBonus() + (S.tier-1)*.04, .08, .95);
}
function genScouts(){
  const ti = fameTitleIdx(S.fame);
  const dist = SCOUT_DIST[ti];
  S.scoutTries = scoutTriesMax();
  const GR = {S:5,A:4,B:3,C:2,D:1};
  S.scouts = Array.from({length:8},()=>{
    const g = wchoose(dist);
    const st = newStudent(1, g);
    return {st, rate:scoutRate(g), state:"open", tried:0};
  }).sort((a,b)=> (GR[b.st.grade]-GR[a.st.grade]) || (b.st.ment.pot-a.st.ment.pot));
  S.incoming = [];
}
function tryScout(i){
  const c = S.scouts[i];
  if(!c || (c.state!=="open" && c.state!=="retry")) return;
  if(scoutFull()){ toast(`이미 ${enrollCap()}명을 확보했다.`); return; }
  if((S.scoutTries||0) <= 0){ toast("남은 스카우트 시도가 없다."); return; }
  S.scoutTries--;
  c.tried = (c.tried||0)+1;
  if(RNG() < c.rate){
    c.state="got"; S.incoming.push(c.st);
    logE(`스카우트 성공 — <b>${dnH(c.st)}</b> (${c.st.grade}급 ${JOBS[c.st.job].name}) 입학 예정.${
      scoutFull()? ` <b style="color:var(--ok)">${enrollCap()}명을 모두 확보해 스카우트를 마친다</b> (남은 시도 ${S.scoutTries}회는 소멸)`
                 : ` 남은 시도 ${S.scoutTries}회`}`,"good");
  } else if(c.tried===1){
    c.state="retry"; c.rate = clamp(c.rate + .10, 0, .97);
    logE(`스카우트 실패 — ${dnH(c.st)}${iga(c.st.name)} 망설이고 있다. 한 번 더 설득할 수 있다 (성공률 ${(c.rate*100).toFixed(0)}%). 남은 시도 ${S.scoutTries}회`,"bad");
  } else {
    c.state="lost";
    logE(`스카우트 실패 — ${dnH(c.st)}${eunn(c.st.name)} 다른 학원을 택했다. 남은 시도 ${S.scoutTries}회`,"bad");
  }
  save(); render();
}
function enrollAll(){
  announceGraduation();
  S.students.forEach(s=> s.year++);
  const back = S.students.slice();   // 방학을 마치고 돌아오는 재학생
  let inc = (S.incoming||[]).slice();
  const cap = enrollCap();
  while(inc.length < cap){
    const st = newStudent(1, wchoose({D:52,C:40,B:8}));
    inc.push(st);
  }
  inc = inc.slice(0, cap);
  const usedNote = [];
  inc.forEach(st=>{ st.year=1; st.note = st.note || pickUnique(ENROLL_NOTE, usedNote); S.students.push(st); });
  S.students.forEach(s=> s.cond = 100);   // 방학 — 전원 컨디션 회복
  logE(`방학이 끝났다 — 재학생 ${back.length}명이 돌아왔다. 전원 컨디션 100.`,"good");
  logE(`신입생 ${inc.length}명 입학 — ${inc.map(s=>`${dnH(s)}(${s.grade})`).join(", ")}`,"big");
  queueCeremony({type:"enroll", year:S.year+1, list:inc.slice(), back:back.map(s=>({name:dn(s), job:s.job, year:s.year}))});
  // 지난해 지침으로 얻은 참가 자격 — 초대장은 한 해에 한 장만 온다
  {
    const q = (S.pendingUnlock||[]).filter(k=> UNLOCKS[k] && !unlocked(k));
    const k = q.shift();
    if(k){
      S.unlock = S.unlock||{}; S.unlock[k] = true;
      logE(`<b>${UNLOCKS[k].n} 초대장</b>이 도착했다 — 올해부터 ${esc(UNLOCKS[k].from)} 시 진출할 수 있다.`,"big");
      queueCeremony({type:"unlock", kind:k, year:S.year+1, rest:q.length});
    }
    S.pendingUnlock = q;
  }
  bumpTeamCap();
  S.scouts=null; S.incoming=[];
}

/* ══════ 오류 잡기 ══════
   조용히 죽으면 화면이 멈춘 것처럼 보인다. 무슨 일이 있었는지 남겨 두고 바로 알려준다. */
const ERR_KEY = "heroacademy_err";
let ERRLOG = (()=>{ try{ return JSON.parse(localStorage.getItem(ERR_KEY)||"[]"); }catch(e){ return []; } })();
function errWhere(){
  try{
    return [ "탭 " + (UI.view||"?"),
             S.year? `${yrName(S.year)} ${(PHASES[S.phase]||{}).n||S.phase} ${S.week+1}주` : "",
             UI.wrun? `주간진행 ${UI.wrun.day+1}일차` : "",
             $("#modalRoot") && $("#modalRoot").innerHTML ? "팝업 열림" : "" ].filter(Boolean).join(" · ");
  }catch(e){ return "?"; }
}
function errPush(kind, msg, stack){
  const e = {t:new Date().toLocaleString("ko-KR"), kind:kind, where:errWhere(),
             msg:String(msg||"").slice(0,300), stack:String(stack||"").slice(0,900)};
  ERRLOG.push(e);
  while(ERRLOG.length > 20) ERRLOG.shift();
  try{ localStorage.setItem(ERR_KEY, JSON.stringify(ERRLOG)); }catch(x){}
  errBar(e);
  return e;
}
function errText(){
  return ERRLOG.map(e=> `[${e.t}] ${e.kind} · ${e.where}\n${e.msg}\n${e.stack}`).join("\n\n");
}
function errBar(e){
  let el = document.getElementById("errbar");
  if(!el){ el = document.createElement("div"); el.id = "errbar"; document.body.appendChild(el); }
  el.innerHTML = `<b>문제가 생겼다</b><span>${esc(e.msg)}</span>
    <button class="btn sm" id="errCopy">내용 복사</button>
    <button class="btn sm" id="errHide">닫기</button>`;
  el.style.display = "flex";
  el.querySelector("#errHide").onclick = ()=>{ el.style.display="none"; };
  el.querySelector("#errCopy").onclick = ()=>{
    const t = errText();
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("복사했다."), ()=>toast("복사하지 못했다."));
    else toast("복사하지 못했다.");
  };
}
window.addEventListener("error", ev=> errPush("error", ev.message, ev.error && ev.error.stack));
window.addEventListener("unhandledrejection", ev=>
  errPush("promise", (ev.reason && ev.reason.message) || ev.reason, ev.reason && ev.reason.stack));

const ROSTER_SORT = [
  {k:"default", n:"기본 (학년 · 전투력)"},
  {k:"team",    n:"소속 팀"},
  {k:"power",   n:"전투력"},

  {k:"name",    n:"이름"}

function teamSortKey(st){
  const at = teamOfStudent(st.id);
  if(!at) return [9, 9];
  const ti = teamsOf().findIndex(t=>t.n===at.t.n);
  const si = formSlots(at.t.form).indexOf(at.slot);
  return [ti<0?8:ti, si<0?8:si];
}
function sortRoster(list, mode){
  const L = list.slice();
  if(mode==="team"){
    return L.sort((a,b)=>{
      const ka=teamSortKey(a), kb=teamSortKey(b);

    });
  }
  if(mode==="power") return L.sort((a,b)=> power(b)-power(a));
  if(mode==="eval")  return L.sort((a,b)=> (b.eval||0)-(a.eval||0) || power(b)-power(a));
  if(mode==="cond")  return L.sort((a,b)=> a.cond-b.cond || power(b)-power(a));
  if(mode==="name")  return L.sort((a,b)=> a.name.localeCompare(b.name,"ko"));
  return L.sort((a,b)=> b.year-a.year || power(b)-power(a));
}

const LEAGUE_URL = "https://heroschool-b06e6-default-rtdb.asia-southeast1.firebasedatabase.app";   // Firebase Realtime Database 주소 (끝 슬래시 없이). 비어 있으면 리그 기능이 꺼진다

const LEAGUE_LP  = [30, 24, 19, 15, 12, 9, 6, 4];
const LEAGUE_KEY = "heroacademy_league_id";

function leagueOn(){ return !!LEAGUE_URL; }
/* 내 팀 자리를 가리키는 id — 이 브라우저에 남는다.
   이어하기로 기록을 옮기면 id 도 함께 따라가고, 새 학원을 열면 새로 판다. */
function leagueNewId(){
  const v = "t" + Date.now().toString(36) + RNG().toString(36).slice(2,8);
  try{ localStorage.setItem(LEAGUE_KEY, v); }catch(e){}
  return v;
}
function leagueId(){
  let v = null;
  try{ v = localStorage.getItem(LEAGUE_KEY); }catch(e){}
  return v || leagueNewId();
}
async function leagueReq(path, method, body){
  const r = await fetch(`${LEAGUE_URL}/${path}.json`, Object.assign(
    {method: method||"GET", cache:"no-store"},
    body? {headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {}));
  if(!r.ok) throw new Error("서버 응답 " + r.status);
  return await r.json();
}
/* 쿼리를 붙여 읽는다 — 실패하면 상태 번호를 달아 던진다 (400 = 규칙에 인덱스가 없다) */
async function leagueGet(path, query){
  const r = await fetch(`${LEAGUE_URL}/${path}.json${query? "?" + query : ""}`, {cache:"no-store"});
  if(!r.ok){ const e = new Error("서버 응답 " + r.status); e.status = r.status; throw e; }
  return await r.json();
}

/* ══════ 새 버전 알림 (0924) ══════
   배포 사이트의 version.json (wrap_site.py 가 index.html 과 함께 만든다) 을 읽어 내 빌드와 견준다.
   · 켤 때 · 30분마다 · 다른 탭에 있다 돌아왔을 때(마지막 확인에서 5분 넘게 지났으면) 확인한다
   · 서버 빌드가 더 새로우면 — 위에 띠를 띄운다. 닫고 계속 해도 된다
   · 서버의 전투 규칙 판번호가 내 것보다 높으면 — 필수. 리그 등록 · 시즌 정산 · 마왕전 기록 올리기를 막는다
   · 파일로 연 경우(file://) · 개발본(BUILD "dev") · version.json 이 없으면 아무것도 하지 않는다 */
const VER_EVERY = 30 * 60 * 1000, VER_BACK = 5 * 60 * 1000, VER_HIDE_KEY = "heroacademy_ver_hide";
const VER = {at:0, busy:false, srv:null};
function verOn(){ return /^https?:$/.test(location.protocol) && BUILD !== "dev" && BUILD_TS > 0; }
async function verCheck(){
  if(!verOn() || VER.busy) return;
  VER.busy = true;
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    if(r.ok){
      const j = await r.json();
      if(j && typeof j.build === "string" && +j.ts > 0)
        VER.srv = {build:j.build.slice(0,20), ts:+j.ts, rules:Math.max(0, j.rules|0), msg:String(j.msg||"").slice(0,140)};
    }
  }catch(e){}
  VER.busy = false; VER.at = Date.now();
  verPaint();
}
/* 0 = 최신 · 1 = 새 빌드 있음 · 2 = 필수 (전투 규칙이 바뀌었다) */
function verGap(){
  const v = VER.srv;
  if(!v) return 0;
  if(v.rules > RULES_VER) return 2;
  return v.ts > BUILD_TS ? 1 : 0;
}
function verBlock(){ return verGap() === 2; }
function verBlockToast(){ toast("새 버전이 나왔다 — 새로고침 전까지는 리그 기록을 서버에 올리지 않는다"); }
function verReload(){
  try{ save(); }catch(e){}
  const v = VER.srv ? VER.srv.build : String(Date.now());
  location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);   // 주소가 바뀌어야 캐시에 남은 옛 파일을 안 받는다
}
function verPaint(){
  const gap = verGap(), v = VER.srv;
  let bar = document.getElementById("verBar");
  let hid = ""; try{ hid = localStorage.getItem(VER_HIDE_KEY) || ""; }catch(e){}
  if(!gap || (gap === 1 && v && hid === v.build)){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement("div"); bar.id = "verBar"; document.body.appendChild(bar); }
  bar.className = "ver-bar" + (gap === 2 ? " must" : "");
  bar.innerHTML = (gap === 2
      ? `<span><b>필수 업데이트</b> — 전투 규칙이 바뀌었다. 새로고침 전까지 리그 기록이 서버에 올라가지 않는다.</span>`
      : `<span><b>새 버전이 나왔다</b> (빌드 ${esc(v.build)})</span>`)
    + (v.msg ? `<span class="ver-msg">${esc(v.msg)}</span>` : "")
    + `<button class="btn sm primary" id="verGo">저장하고 새로고침</button>`
    + (gap === 1 ? `<button class="ver-x" id="verX" aria-label="닫기" title="이 빌드는 다시 알리지 않는다">×</button>` : "");
  bar.querySelector("#verGo").onclick = verReload;
  const x = bar.querySelector("#verX");
  if(x) x.onclick = ()=>{ try{ localStorage.setItem(VER_HIDE_KEY, v.build); }catch(e){} bar.remove(); };
}
let VER_T = 0;
function verStart(){
  if(!verOn() || VER_T) return;
  VER_T = setInterval(()=>{ if(!document.hidden && Date.now() - VER.at >= VER_EVERY) verCheck(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && Date.now() - VER.at >= VER_BACK) verCheck(); });
  setTimeout(verCheck, 1500);
}

/* ══════ 채팅 ══════
   리그 서버의 chat/ 에 방 하나. 게임을 켠 모든 학원이 함께 쓴다.
   · 한 번에 100자 · 3초에 한 번 (게임에서 막는다)
   · 서버에는 최근 200개만 남긴다 — 보낼 때 가끔 오래된 것을 지운다 (파베 룰은 10분 지난 것만 지우게 허락)
   · 금칙어는 *** 로 가려서 보여준다 · 차단한 학원의 말은 내 화면에서만 숨긴다 (이 브라우저에 저장) */
const CHAT_MAX = 100, CHAT_GAP = 3000, CHAT_SHOW = 50, CHAT_KEEP = 200;
const CHAT_POLL_OPEN = 4000, CHAT_POLL_SHUT = 30000;
const CHAT_SEEN_KEY = "heroacademy_chat_seen", CHAT_BLOCK_KEY = "heroacademy_chat_block";
const CHAT_BAD = ["씨발","시발","씨바","시바","ㅅㅂ","ㅆㅂ","ㅅ발","개새끼","개새","새끼","ㅅㄲ","병신","ㅂㅅ","븅신","좆","존나","졸라","ㅈㄴ",
  "지랄","ㅈㄹ","미친놈","미친년","미친새","닥쳐","꺼져","엿먹","느금","니미","니애미","애미","애비","니엄","엠창","썅","쌍년","쌍놈",
  "fuck","shit","bitch","asshole","cunt","dick"];
const CHAT_BAD_RE = new RegExp(CHAT_BAD.map(w=> w.split("").map(c=> c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\s._\\-~*!@#^]*")).join("|"), "gi");
function chatClean(t){ return String(t||"").replace(CHAT_BAD_RE, m=> "*".repeat(Math.min(6, Math.max(2, m.replace(/\s/g,"").length)))); }
const CHAT_FULL_EVERY = 10 * 60 * 1000;   // 창을 열 때, 이만큼 지났으면 50개를 통째로 다시 받는다
const CHAT = {open:false, list:[], last:0, fullAt:0, busy:false, err:null, sentAt:0, timer:0, showBlocks:false, sends:0};
function chatOn(){ return leagueOn(); }
function chatBlocks(){ try{ const v = JSON.parse(localStorage.getItem(CHAT_BLOCK_KEY)||"[]"); return Array.isArray(v)? v : []; }catch(e){ return []; } }
function chatSetBlocks(v){ try{ localStorage.setItem(CHAT_BLOCK_KEY, JSON.stringify(v.slice(0,200))); }catch(e){} }
function chatSeen(){ try{ return localStorage.getItem(CHAT_SEEN_KEY) || ""; }catch(e){ return ""; } }
function chatSetSeen(k){ try{ localStorage.setItem(CHAT_SEEN_KEY, k||""); }catch(e){} }
/* 남이 올린 글은 전부 의심하고 깎는다 */
function chatSane(k, m){
  if(!m || typeof m!=="object" || typeof m.t!=="string") return null;
  return {k:String(k), tid:String(m.tid||"").slice(0,40), acad:String(m.acad||"이름 없는 학원").slice(0,24),
          t:m.t.slice(0,CHAT_MAX), ts:+m.ts||0};
}
async function chatReq(query){
  const r = await fetch(`${LEAGUE_URL}/chat.json${query||""}`, {cache:"no-store"});
  if(!r.ok) throw new Error("서버 응답 " + r.status);
  return await r.json();
}
/* 트래픽 절약 (0924) — 평소에는 마지막으로 받은 글부터만 묻는다.
   새 글이 없으면 그 한 개(약 0.2KB)만 돌아온다. 처음이거나 full 이면 최근 50개를 받는다. */
async function chatFetch(full){
  if(!chatOn() || CHAT.busy) return;
  CHAT.busy = true;
  const q = (k)=> `orderBy=${encodeURIComponent('"$key"')}` + (k? `&startAt=${encodeURIComponent(JSON.stringify(k))}` : "") + `&limitToLast=${CHAT_SHOW}`;
  const lastK = (!full && CHAT.list.length) ? CHAT.list[CHAT.list.length-1].k : "";
  try{
    const raw = await leagueGet("chat", q(lastK));
    const got = Object.keys(raw||{}).sort().map(k=> chatSane(k, raw[k])).filter(Boolean);
    if(lastK){
      const add = got.filter(m=> m.k > lastK);
      if(add.length) CHAT.list = CHAT.list.concat(add).slice(-CHAT_SHOW);
    } else { CHAT.list = got; CHAT.fullAt = Date.now(); }
    CHAT.err = null;
  }catch(e){ CHAT.err = xferErr(e); }
  CHAT.busy = false;
  CHAT.last = Date.now();
  chatPaint();
}
/* 오래된 글 정리 — 최근 CHAT_KEEP 개만 남긴다. 10분이 안 된 글은 룰이 막으므로 실패해도 그냥 넘어간다 */
async function chatPrune(){
  try{
    const keys = Object.keys(await chatReq("?shallow=true") || {}).sort();
    const old = keys.slice(0, Math.max(0, keys.length - CHAT_KEEP)).slice(0, 50);
    for(const k of old){ try{ await leagueReq("chat/" + k, "DELETE"); }catch(e){} }
  }catch(e){}
}
async function chatSend(text){
  text = String(text||"").replace(/\s+/g," ").trim().slice(0, CHAT_MAX);
  if(!text) return false;
  const wait = CHAT_GAP - (Date.now() - CHAT.sentAt);
  if(wait > 0){ toast(`${Math.ceil(wait/1000)}초 뒤에 보낼 수 있다.`); return false; }
  CHAT.sentAt = Date.now();
  try{
    await leagueReq("chat", "POST", {tid:leagueId(), acad:String(S.acadName||"이름 없는 학원").slice(0,24), t:text, ts:{".sv":"timestamp"}});
  }catch(e){ toast("채팅을 보내지 못했다 — " + xferErr(e)); CHAT.sentAt = 0; return false; }
  if(++CHAT.sends % 5 === 1) chatPrune();
  await chatFetch();
  return true;
}
function chatVisible(){ const bl = chatBlocks(); return CHAT.list.filter(m=> bl.indexOf(m.tid) < 0); }
function chatUnread(){
  const seen = chatSeen(), me = leagueId();
  return chatVisible().filter(m=> m.k > seen && m.tid !== me).length;
}
function chatHue(tid){ let h = 0; for(let i=0;i<tid.length;i++) h = (h*31 + tid.charCodeAt(i)) % 360; return h; }
function chatTime(ts){ if(!ts) return ""; const d = new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
/* 화면 — 뷰와 따로 body 에 붙여 둔다 (render 가 다시 그려도 입력 중인 글이 날아가지 않게) */
function chatMount(){
  if(!chatOn() || document.getElementById("chatRoot")) return;
  const root = document.createElement("div");
  root.id = "chatRoot";
  root.innerHTML = `<button class="chat-fab" id="chatFab" aria-label="채팅 열기" title="채팅">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/></svg>
      <b class="chat-badge" id="chatBadge" hidden></b></button>
    <section class="chat-panel" id="chatPanel" hidden aria-label="채팅">
      <header class="chat-h"><b>채팅</b><span class="chat-sub" id="chatSub">모든 학원</span>
        <button class="chat-x" id="chatBlockBtn" title="차단 목록">차단</button>
        <button class="chat-x" id="chatClose" aria-label="채팅 닫기">✕</button></header>
      <div class="chat-blocks" id="chatBlocks" hidden></div>
      <div class="chat-list" id="chatList"></div>
      <form class="chat-in" id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="${CHAT_MAX}" placeholder="메시지 (최대 ${CHAT_MAX}자)" aria-label="채팅 입력">
        <button class="btn sm primary" id="chatSendBtn">보내기</button>
      </form>
    </section>`;
  document.body.appendChild(root);
  const fab = root.querySelector("#chatFab"), panel = root.querySelector("#chatPanel");
  fab.onclick = ()=>{ CHAT.open = !CHAT.open; panel.hidden = !CHAT.open; fab.classList.toggle("on", CHAT.open);
    if(CHAT.open){ chatFetch(Date.now() - CHAT.fullAt >= CHAT_FULL_EVERY); setTimeout(()=>{ const i = root.querySelector("#chatInput"); if(i) i.focus(); }, 30); } chatPaint(); };
  root.querySelector("#chatClose").onclick = ()=>{ CHAT.open = false; panel.hidden = true; fab.classList.remove("on"); };
  root.querySelector("#chatBlockBtn").onclick = ()=>{ CHAT.showBlocks = !CHAT.showBlocks; chatPaint(); };
  root.querySelector("#chatForm").onsubmit = async (e)=>{
    e.preventDefault();
    const inp = root.querySelector("#chatInput");
    if(await chatSend(inp.value)) inp.value = "";
  };
  root.querySelector("#chatList").onclick = (e)=>{
    const b = e.target.closest("[data-chatblock]"); if(!b) return;
    const tid = b.dataset.chatblock, name = b.dataset.name || "이 학원";
    if(tid === leagueId()) return;
    const bl = chatBlocks(); if(bl.indexOf(tid) < 0){ bl.push(tid); chatSetBlocks(bl); toast(`${name}의 메시지를 숨겼다.`); }
    chatPaint();
  };
  root.querySelector("#chatBlocks").onclick = (e)=>{
    const b = e.target.closest("[data-chatunblock]"); if(!b) return;
    chatSetBlocks(chatBlocks().filter(x=> x !== b.dataset.chatunblock)); chatPaint();
  };
  chatTick();
}
function chatPaint(){
  const root = document.getElementById("chatRoot"); if(!root) return;
  const me = leagueId(), vis = chatVisible();
  const list = root.querySelector("#chatList"), badge = root.querySelector("#chatBadge");
  if(CHAT.open){
    const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
    list.innerHTML = CHAT.err && !CHAT.list.length ? `<div class="chat-empty">서버에 닿지 못했다 — ${esc(CHAT.err)}</div>`
      : !vis.length ? `<div class="chat-empty">아직 아무도 말하지 않았다. 첫 인사를 남겨 보자.</div>`
      : vis.map(m=>{ const mine = m.tid === me;
          return `<div class="chat-msg${mine?" me":""}">
            <div class="chat-who"><b style="color:hsl(${chatHue(m.tid)} 45% 42%)">${esc(m.acad)}</b><span>${chatTime(m.ts)}</span>${
              mine? "" : `<button class="chat-blk" data-chatblock="${esc(m.tid)}" data-name="${esc(m.acad)}" title="이 학원의 메시지 숨기기">차단</button>`}</div>
            <div class="chat-txt">${esc(chatClean(m.t))}</div></div>`; }).join("");
    if(atEnd || !list.dataset.init){ list.scrollTop = list.scrollHeight; list.dataset.init = "1"; }
    if(vis.length) chatSetSeen(vis[vis.length-1].k);
  }
  const bl = chatBlocks(), bbox = root.querySelector("#chatBlocks");
  bbox.hidden = !(CHAT.open && CHAT.showBlocks);
  if(!bbox.hidden){
    const names = {}; CHAT.list.forEach(m=> names[m.tid] = m.acad);
    bbox.innerHTML = bl.length ? `<div class="chat-sub" style="margin-bottom:4px">차단한 학원 — 누르면 풀린다</div>${bl.map(t=> `<button class="chat-ub" data-chatunblock="${esc(t)}">${esc(names[t] || "알 수 없는 학원")} ✕</button>`).join("")}`
      : `<div class="chat-sub">차단한 학원이 없다. 메시지 옆 <b>차단</b>으로 숨길 수 있다.</div>`;
  }
  root.querySelector("#chatBlockBtn").textContent = bl.length ? `차단 ${bl.length}` : "차단";
  const n = CHAT.open ? 0 : chatUnread();
  badge.hidden = !n; badge.textContent = n > 9 ? "9+" : String(n);
}
function chatTick(){
  clearTimeout(CHAT.timer);
  const gap = CHAT.open ? CHAT_POLL_OPEN : CHAT_POLL_SHUT;
  if(!document.hidden && Date.now() - CHAT.last >= gap - 200) chatFetch();
  CHAT.timer = setTimeout(chatTick, Math.min(gap, 5000));
}

/* ============================================================
   이어하기 코드 — 세이브를 짧은 코드 하나로 다른 기기에 옮긴다
   ============================================================ */
const XFER_ALPHA = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";  // 헷갈리는 0·1·I·O 는 빼둔다
const XFER_LEN   = 10;
const XFER_DAYS  = 30;        // 발급하고 이만큼 지난 코드는 받지 않는다
const XFER_MAX   = 400000;    // 올릴 수 있는 최대 길이
function xferOn(){ return !!LEAGUE_URL; }
function xferNew(){
  let out = "";
  for(let i=0;i<XFER_LEN;i++) out += XFER_ALPHA[Math.floor(RNG()*XFER_ALPHA.length)];
  return out;
}
function xferFmt(c){ return String(c||"").replace(/(.{5})(?=.)/g, "$1-"); }
function xferNorm(c){
  return String(c||"").toUpperCase().split("").filter(ch=> XFER_ALPHA.indexOf(ch)>=0).join("");
}
function xferB64(u8){
  let bin = "", CH = 0x8000;
  for(let i=0;i<u8.length;i+=CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(bin);
}
function xferBytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function xferBody(opt){
  save();
  let lg = null;
  /* 피드백에 실어 보내는 사본에는 리그 자리를 담지 않는다 —
     받은 쪽이 그대로 열면 보낸 사람의 리그 자리를 빼앗게 된다 */
  if(!(opt && opt.noLeague)){ try{ lg = localStorage.getItem(LEAGUE_KEY) || null; }catch(e){} }
  return {s:S, lg:lg};
}
async function xferPack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream === "function"){
    try{
      const cs = new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip")));
      return {z:"gz", d: xferB64(new Uint8Array(await cs.arrayBuffer()))};
    }catch(e){}
  }
  return {z:"raw", d: xferB64(bytes)};
}
async function xferUnpack(rec){
  let bytes = xferBytes(rec.d);
  if(rec.z === "gz"){
    const ds = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")));
    bytes = new Uint8Array(await ds.arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function xferMeta(){
  return {acad:String(S.acadName||"이름 없는 학원").slice(0,24), y:S.year|0, ph:S.phase,
          wk:(S.week|0)+1, fame:S.fame|0, gold:S.gold|0, n:(S.students||[]).length,
          build:String(BUILD), rv:RULES_VER};
}
function xferMetaLine(m, noName){
  if(!m) return "내용을 확인할 수 없는 기록";
  const ph = (PHASES[m.ph]||{}).n || "";
  return `${noName? "" : m.acad+" · "}${yrName(m.y)} ${ph} ${m.wk}주 · 명성 ${fmt(m.fame|0)} · 자금 ${fmt(m.gold|0)} G · 학생 ${m.n|0}명`;
}
/* 코드 발급 — 한 번 쓴 코드에는 덮어쓰지 않는다 */
async function xferIssue(opt){
  if(!xferOn()) throw new Error("서버 주소가 없다");
  const packed = await xferPack(xferBody(opt));
  if(packed.d.length > XFER_MAX) throw new Error("기록이 너무 커서 올릴 수 없다");
  const rec = {z:packed.z, d:packed.d, ts:Date.now(), m:xferMeta(), v:1};
  for(let i=0;i<5;i++){
    const code = xferNew();
    const cur = await leagueReq(`save/${code}`, "GET");
    if(cur) continue;
    await leagueReq(`save/${code}`, "PUT", rec);
    return {code, bytes:packed.d.length};
  }
  throw new Error("코드를 만들지 못했다");
}
function xferErr(e){
  const m = (e && e.message) ? String(e.message) : "";
  if(!m || /fetch|network|load failed|failed to/i.test(m)) return "서버에 닿지 못했다";
  return m;
}
async function xferGet(code){
  if(!xferOn()) throw new Error("서버 주소가 없다");
  const rec = await leagueReq(`save/${code}`, "GET");
  if(!rec || !rec.d) return null;
  rec.expired = !!(XFER_DAYS && rec.ts && (Date.now()-rec.ts) > XFER_DAYS*864e5);
  return rec;
}
/* 실제로 덮어쓴다 — 확인을 받은 뒤에만 부른다 */
async function xferApply(rec){
  const p = await xferUnpack(rec);
  const st = (p && p.s) ? p.s : p;
  if(!st || !Array.isArray(st.students)) throw new Error("기록을 읽지 못했다");
  localStorage.setItem(SAVE_KEY, JSON.stringify(st));
  if(p && p.lg){ try{ localStorage.setItem(LEAGUE_KEY, p.lg); }catch(e){} }
  location.reload();
}
/* 파일로 내보내고 들이는 길 — 서버가 막혀 있을 때의 우회로 */
function xferFileOut(){
  const body = xferBody();
  const blob = new Blob([JSON.stringify({s:body.s, lg:body.lg, m:xferMeta(), ts:Date.now(), v:1})],
                        {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `heroschool_${yrN(S.year)}년${(PHASES[S.phase]||{}).n||""}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
}

function leaguePackUnit(g){
  return {n:(g.raw||g.name||"").slice(0,12), e:g.epithet? String(g.epithet).slice(0,20):null,
          j:g.job, g:g.grade||"C", lv:g.lv|0, p:g.pers||"plain", k:g.karma|0,
          c:(g.career||"").slice(0,16),
          m:MENTAL.reduce((a,x)=>{ a[x.k]=Math.floor((g.ment&&g.ment[x.k])||10); return a; },{}),   // 소수점은 버린다
          sm:g.skMod||{},
          r:(g.relics||[]).slice(0,RELIC_SLOT_MAX).map(x=>({grade:x.grade,name:String(x.name||"").slice(0,20),
             aff:(x.aff||[]).map(a=>({k:a.k,n:a.n,v:a.v}))}))};
}
function leagueMyPack(sids, form){
  const gs = (sids||[]).filter(Boolean).map(id => (S.graduates||[]).find(g=>g.sid===id)).filter(gradCanFight);
  return {acad:String(S.acadName||"이름 없는 학원").slice(0,24), form:form||"wedge",
          t:gs.map(leaguePackUnit), ts:Date.now(), v:1,
          mi:clamp(S.master.info|0, 0, MASTER_MAX)};   // 마스터 정보 — 리그 전투에서 이 팀의 보정 (+2%/pt)
}
/* ---- 받는 쪽 — 남이 올린 값이므로 전부 의심하고 깎는다 ---- */
/* 남의 명단에도 같은 규칙을 적용한다 — EX 는 한 명당 하나 */
function exTrim(list){
  let n = 0;
  return (list||[]).filter(r=>{
    if(r && r.grade==="EX"){ n++; return n <= EX_PER_STUDENT; }
    return true;
  });
}
function leagueSaneUnit(u, tid, ui){
    if(!u || !JOBS[u.j]) return null;
    const m = {};
    MENTAL.forEach(x=>{ m[x.k] = clamp(Math.floor(+(u.m&&u.m[x.k])||10), 1, MENT_MAX); });
    return {sid:tid+"_"+ui, raw:String(u.n||"무명").slice(0,12),
            name:String(u.n||"무명").slice(0,12), epithet:u.e? String(u.e).slice(0,20):null,
            job:u.j, grade:["D","C","B","A","S"].indexOf(u.g)>=0? u.g : "C",
            lv:clamp(u.lv|0, 1, 30), pers:PERSONA[u.p]? u.p : "plain", karma:clamp(u.k|0,0,999),
            career:String(u.c||"").slice(0,16),
            ment:m, skMod:(u.sm && typeof u.sm==="object")? u.sm : {},
            relics:exTrim(Array.isArray(u.r)? u.r : []).slice(0, RELIC_SLOT_MAX).map(r=>({
              grade:["C","B","A","S","S+","EX"].indexOf(r&&r.grade)>=0? r.grade : "C",
              name:String((r&&r.name)||"유물").slice(0,20),
              aff:(Array.isArray(r&&r.aff)? r.aff : []).slice(0,4).map(a=>({k:a.k,n:a.n,v:+a.v||0}))}))};
}
function leagueSane(e, tid){
  if(!e || typeof e !== "object") return null;
  const t = Array.isArray(e.t) ? e.t : [];
  if(t.length !== LEAGUE_TEAM) return null;
  const units = t.map((u, ui)=> leagueSaneUnit(u, tid, ui));
  if(units.some(u=>!u)) return null;
  return {tid, acad:String(e.acad||"이름 없는 학원").slice(0,24),
          form: FORMS[e.form]? e.form : "wedge",
          lp: clamp(Math.round(+e.lp||LEAGUE_LP0), 0, 99999),
          w:Math.max(0,e.w|0), l:Math.max(0,e.l|0), n:Math.max(0,e.n|0),
          ts:+e.ts||0, mi:clamp(e.mi|0, 0, MASTER_MAX), units};
}
function leagueTeamUnits(T){ return T.units.map(gradUnit).filter(Boolean); }

function lgOrder(L){ L = L||leagueState(); const F = formData(L.form, lgIsDemon(L) && formPlusOn()); return F.front.concat(F.back).slice(0, lgCap(L)); }
function lgSids(L){ return ((L||leagueState()).sids||[]).filter(Boolean); }

/* ---- 리그 편성 · 진행 ---- */
function leagueRR(n){
  /* 원형 로테이션 — n팀 라운드로빈 대진. 홀수면 부전승 자리를 하나 끼워 넣는다. */
  const m = (n % 2) ? n + 1 : n;
  const idx = Array.from({length:m},(_,i)=>i), out = [];
  for(let r=0;r<m-1;r++){
    const pair = [];
    for(let i=0;i<m/2;i++){
      const a = idx[i], b = idx[m-1-i];
      if(a < n && b < n) pair.push([a, b]);
    }
    out.push(pair);
    idx.splice(1, 0, idx.pop());
  }
  return out;
}
/* ══════ 시즌 ══════
   리그를 각자 따로 돌리면 사람마다 결과가 달라진다. 그래서 시즌을 하나 만들어
   그 시점의 팀 명단을 통째로 얼리고 시드를 같이 박아 서버에 올린다.
   이후엔 누가 언제 열어봐도 같은 입력 → 같은 전투 → 같은 순위표가 나온다.
   라운드는 실제 시간으로 SEASON_STEP 마다 하나씩 열린다. */
const SEASON_STEP  = 5 * 60 * 1000;        // 라운드 하나가 열리는 간격
const SEASON_EVERY = 3 * 60 * 60 * 1000;   // 시즌이 새로 열리는 주기
/* 빌드 표식 — 지금 보고 있는 파일이 언제 만들어진 것인지. wrap.py 가 갈아끼운다. */
const BUILD = "0929-1027";
const BUILD_TS = 0;   // 같은 순간의 밀리초 — 새 빌드인지 비교할 때 쓴다 (wrap_site.py 가 갈아끼운다)
const SEASON_MIN   = 4;                    // 시즌이 열리기 위한 최소 팀 수
/* 전투 규칙 판번호 —
   시즌 문서는 명단만 얼릴 뿐, 전투는 각자의 브라우저가 같은 시드로 다시 돌려서 맞춘다.
   그러니 전투 계산이 한 줄이라도 달라지면 같은 시즌인데 순위표가 갈린다.
   전투에 닿는 수치를 고칠 때마다 이 번호를 올린다. 번호가 어긋난 시즌은 정산하지 않는다. */
const RULES_VER = 3;   // 3 (0924): 리그 정보 보정을 보는 사람이 아니라 각 팀의 등록값(mi)으로 · 유닛을 시드 밖에서 세운다
/* 시즌 번호와 시작 시각은 시계에서 바로 뽑는다 —
   그래야 서로 상의하지 않아도 모두가 같은 번호, 같은 시작 시각을 말하게 된다. */
/* ── 서버 시계 ──
   라운드가 열리는 때를 각자 PC 시계로 재면, 시계가 어긋난 사람은 남과 다른 라운드를 본다.
   그래서 서버에 시각을 한 번 찍어 받아 오고, 그 차이만큼 보정한 시각을 쓴다.
   서버에 닿지 못하면 보정값 0 — 그냥 내 시계를 쓴다. */
let LEAGUE_SKEW = 0, LEAGUE_SYNCED = 0;
const LEAGUE_SKEW_TTL = 10 * 60 * 1000;
function leagueNow(){ return Date.now() + LEAGUE_SKEW; }
async function leagueClockSync(force){
  if(!leagueOn()) return;
  if(!force && LEAGUE_SYNCED && Date.now() - LEAGUE_SYNCED < LEAGUE_SKEW_TTL) return;
  const t0 = Date.now();
  let v;
  try{ v = await leagueReq("clock", "PUT", {".sv":"timestamp"}); }
  catch(e){ return; }                                   // 규칙에 clock 이 없으면 그냥 넘어간다
  if(typeof v !== "number"){                            // 응답이 값을 안 주면 한 번 더 읽는다
    try{ v = await leagueReq("clock"); }catch(e){ return; }
  }
  if(typeof v !== "number" || !isFinite(v)) return;
  const mid = t0 + Math.round((Date.now() - t0) / 2);   // 왕복의 절반 지점을 서버가 찍은 순간으로 본다
  LEAGUE_SKEW = v - mid;
  LEAGUE_SYNCED = Date.now();
}
function seasonDue(){ return Math.floor(leagueNow() / SEASON_EVERY); }
/* 안에서 쓰는 번호는 시계에서 나온 큰 수다. 화면에는 1부터 세어 보여준다. */
const SEASON_BASE = Math.floor(Date.UTC(2026, 8, 1) / (3 * 60 * 60 * 1000));
function seasonNo(n){ return n - SEASON_BASE + 1; }
function seasonStartOf(n){ return n * SEASON_EVERY; }
function seasonSeedOf(n){ return "season-" + n; }   // 시드도 번호에서 뽑는다 (마음에 들 때까지 다시 뽑기 방지)
function seasonNextSeasonAt(){ return seasonStartOf(seasonDue() + 1); }

/* 서버에서 온 시즌 문서는 믿지 않는다 — 통째로 검사해서 다시 짓는다 */
function seasonSane(d){
  if(!d || typeof d !== "object") return null;
  const n = d.n|0, start = +d.start||0, step = clamp(+d.step||SEASON_STEP, 10000, 7*24*3600*1000);
  const seed = String(d.seed||"").slice(0, 40);
  if(n < 1 || !start || !seed) return null;
  if(n !== Math.floor(start / SEASON_EVERY)) return null;   // 번호와 시작 시각이 어긋난 문서는 버린다
  if(start > leagueNow() + 60000) return null;              // 아직 오지 않은 시즌도 버린다
  const t = {};
  Object.keys(d.t||{}).forEach(k=>{ const T = leagueSane(d.t[k], k); if(T) t[k] = T; });
  const g = (Array.isArray(d.g) ? d.g : [])
    .map(x => (Array.isArray(x) ? x : []).map(String))
    .filter(x => x.length >= 2 && x.length <= LEAGUE_N && x.every(id => t[id]));
  if(!g.length) return null;
  return {n, seed, start, step, t, g, v: Math.max(0, d.v|0)};
}
/* 0 = 맞다 · 1 = 내 게임이 낡았다 · -1 = 시즌이 낡은 판으로 열렸다 */
function seasonVerGap(SE){
  if(!SE) return 0;
  const v = Math.max(0, SE.v|0);
  return v === RULES_VER ? 0 : (v > RULES_VER ? 1 : -1);
}
function seasonGroupIdx(SE, tid){ return SE.g.findIndex(g => g.indexOf(tid) >= 0); }
function seasonRounds(SE, gi){ return leagueRR(SE.g[gi].length).length; }
/* 지금까지 열린 라운드 수 */
function seasonOpen(SE, gi){
  return clamp(Math.floor((leagueNow() - SE.start) / SE.step) + 1, 0, seasonRounds(SE, gi));
}
/* 다음 라운드가 열리는 시각 (다 열렸으면 0) */
function seasonNextAt(SE, gi){
  const o = seasonOpen(SE, gi);
  return o >= seasonRounds(SE, gi) ? 0 : SE.start + o * SE.step;
}
/* 순위에 따른 리그 포인트 — 조 크기가 달라도 1위와 꼴찌가 같은 폭을 받게 늘린다 */
function seasonLP(rank, size){
  if(size < 2) return 0;
  const i = Math.round((rank - 1) / (size - 1) * (LEAGUE_LP.length - 1));
  return LEAGUE_LP[clamp(i, 0, LEAGUE_LP.length - 1)] || 0;
}
/* 조 안의 대진 순서 — 시드로 섞는다. 리그 포인트 순서가 대진표에 그대로 드러나지 않게. */
function seasonOrder(SE, gi){
  const g = SE.g[gi].slice();
  return withSeed(SE.seed + ":order:" + gi, ()=> shuffle(g));
}
/* 한 경기 — 시드가 같으면 누가 어느 브라우저에서 돌려도 같은 전투가 나온다 */
function seasonBattle(SE, gi, order, r, i){
  const rr = leagueRR(order.length);
  if(!rr[r] || !rr[r][i]) return null;
  const A = SE.t[order[rr[r][i][0]]], B = SE.t[order[rr[r][i][1]]];
  if(!A || !B) return null;
  /* 유닛은 시드 밖에서 세운다 (0924) — gradUnit(newStudent)은 이름 중복 검사 때문에
     내 학생 명단 · 최근 이름 기록에 따라 난수를 다른 만큼 쓴다. 시드 안에서 세우면
     같은 경기라도 브라우저마다, 또 같은 브라우저에서도 순위표를 계산할 때와 관전할 때 전투가 갈렸다.
     전투에 닿는 값은 전부 기록에서 덮어쓰므로, 시드는 전투에만 박는다. (RULES_VER 3) */
  const ta = leagueTeamUnits(A), tb = leagueTeamUnits(B);
  return withSeed(SE.seed + ":" + SE.n + ":" + gi + ":" + r + ":" + i, ()=>{
    const ua = assignFoeForm(ta, A.form);
    const ub = assignFoeForm(tb, B.form);
    if(!ua.length || !ub.length) return null;
    /* 정보 보정은 각 팀이 등록할 때 올린 마스터 정보(mi)로 건다 (0924).
       비워 두면 runBattle 이 "보고 있는 사람"의 정보 포인트를 A 편에 얹어서, 같은 경기가 브라우저마다 다른 결과가 났다.
       mi 는 시즌 문서에 명단과 함께 얼어붙으므로 누가 돌려도 같다. 예전 기록(mi 없음)은 0 으로 친다. */
    const b = runBattle(ua, ub, Object.assign({titleA:A.acad, titleB:B.acad, infoM:infoMulOf(A.mi), infoMB:infoMulOf(B.mi)},
      {formA:ua.form, rowsA:ua.rows}, foeBattleOpt(ub)));
    return {b, A, B};
  });
}
/* 열린 라운드까지 전부 계산한다 — 바깥 상태를 건드리지 않는 순수 계산 */
function seasonCompute(SE, gi, upto){
  const order = seasonOrder(SE, gi), rr = leagueRR(order.length), row = {};
  order.forEach(tid =>{ row[tid] = {tid, acad:SE.t[tid].acad, pts:0, w:0, l:0, gf:0, ga:0}; });
  const results = [];
  for(let r=0; r<upto && r<rr.length; r++) for(let i=0; i<rr[r].length; i++){
    const m = seasonBattle(SE, gi, order, r, i);
    if(!m) continue;
    const aw = m.b.winner === "A";
    const alive = [m.b.A.filter(u=>u.alive).length, m.b.B.filter(u=>u.alive).length];
    const la = row[m.A.tid], lb = row[m.B.tid];
    if(aw){ la.pts += 3; la.w++; lb.l++; } else { lb.pts += 3; lb.w++; la.l++; }
    la.gf += alive[0]; la.ga += alive[1]; lb.gf += alive[1]; lb.ga += alive[0];
    results.push({r, i, a:m.A.acad, b:m.B.acad, at:m.A.tid, bt:m.B.tid, aw, score:alive.join("-")});
  }
  const table = order.map(t => row[t]).sort((a,b)=>
    b.pts - a.pts || (b.gf-b.ga) - (a.gf-a.ga) || b.gf - a.gf || (a.tid < b.tid ? -1 : 1));
  table.forEach((x,i)=>{ x.rank = i+1; x.lp = seasonLP(i+1, table.length); });
  return {order, rr, table, results};
}
/* 시즌이 끝났으면 리그 포인트를 한 번만 반영한다 */
function spOf(){ return Math.max(0, S.sp|0); }
function spAdd(v){
  v = Math.max(0, Math.round(v||0));
  if(!v) return 0;
  S.sp = Math.max(0, (S.sp|0) + v);
  return v;
}
function seasonSettle(SE, gi, C){
  const L = leagueState();
  if(L.lastSeason === SE.n) return false;
  const me = C.table.find(x => x.tid === leagueId());
  if(!me) return false;
  L.lastSeason = SE.n;
  L.lp = Math.max(0, L.lp + me.lp);
  const sp = spAdd(me.lp);                       // 받은 점수만큼 SP 도 들어온다
  L.w += me.w; L.l += me.l; L.n += 1;
  L.hist.unshift({ts:Date.now(), season:seasonNo(SE.n), rank:me.rank, size:C.table.length,
                  lp:me.lp, now:L.lp, w:me.w, l:me.l, sp:sp});
  if(L.hist.length > 20) L.hist.length = 20;
  logE(`졸업생 리그 시즌 ${seasonNo(SE.n)} — <b>${me.rank}위</b> / ${C.table.length}팀 (${me.w}승 ${me.l}패) · 리그 포인트 <b style="color:var(--brass)">+${me.lp}</b> → ${L.lp} · SP <b style="color:var(--indigo)">+${sp}</b>`,
       me.rank <= Math.ceil(C.table.length/3) ? "good" : "");
  save(); leagueSync();
  return true;
}

/* ---- 서버 주고받기 ---- */
async function seasonLoad(quiet){
  if(!leagueOn()) return;
  const U = UI.league = UI.league || {};
  U.loading = true; if(!quiet) render();
  await leagueClockSync();
  let raw = null, err = null;
  try{ raw = await leagueReq("season"); }catch(e){ err = String(e.message||e); }
  if(!err) await leagueServerMerge();       // 서버에 쌓인 내 성적부터 받아 온다
  U.loading = false;
  U.err = err;
  U.SE = err ? null : seasonSane(raw);
  if(!err && (!U.SE || U.SE.n < seasonDue()) && !U.making){   // 이번 시즌이 아직 없다 — 대신 연다
    seasonAuto(U.SE);
    return;
  }
  seasonRefresh();
}
/* 열린 라운드가 늘었으면 다시 계산한다 */
function seasonRefresh(){
  const U = UI.league; if(!U) return;
  const SE = U.SE;
  if(!SE){ U.gi = -1; U.vg = 0; U.C = null; render(); return; }
  U.gi = seasonGroupIdx(SE, leagueId());
  /* 보고 있는 조 — 내가 낀 조가 기본이고, 참가하지 않았으면 1조(리그 포인트 상위)를 본다 */
  if(!(U.vg >= 0 && U.vg < SE.g.length)) U.vg = U.gi >= 0 ? U.gi : 0;
  const o = seasonOpen(SE, U.vg);
  if(!(U.C && U.upto === o && U.cg === U.vg)){
    U.upto = o; U.cg = U.vg;
    U.C = seasonCompute(SE, U.vg, o);
  }
  /* 판번호가 어긋나면 이 시즌의 순위표는 사람마다 다르게 나온다 — 점수는 건드리지 않는다 */
  if(seasonVerGap(SE)){ render(); return; }
  /* 정산은 어느 조를 보고 있든 내 조 기준으로 한다 */
  if(U.gi >= 0 && seasonOpen(SE, U.gi) >= seasonRounds(SE, U.gi)){
    const mineC = U.vg === U.gi ? U.C : seasonCompute(SE, U.gi, seasonRounds(SE, U.gi));
    seasonSettle(SE, U.gi, mineC);
  }
  seasonSettleOthers(SE);
  render();
}
/* 시즌이 끝나면 클라이언트가 없는 팀(더미 등)의 성적도 대신 올린다.
   시즌 문서가 얼어 있어 계산이 결정적이므로, 누가 올리든 같은 값이 나온다.
   서버의 ls(마지막 정산 시즌)로 중복 반영을 막는다. */
async function seasonSettleOthers(SE){
  if(!leagueOn() || !SE || !Array.isArray(SE.g)) return;
  if(verBlock()) return;
  if(seasonVerGap(SE)) return;
  const U = UI.league = UI.league || {};
  if(U.setAll === SE.n || U.setting) return;
  for(let gi=0; gi<SE.g.length; gi++){                 // 아직 안 끝난 조가 있으면 기다린다
    if(seasonOpen(SE, gi) < seasonRounds(SE, gi)) return;
  }
  U.setting = true;
  let all = null;
  try{ all = await leagueReq("teams"); }
  catch(e){ U.setting = false; return; }
  const mine = leagueId();
  let n = 0;
  for(let gi=0; gi<SE.g.length; gi++){
    const C = seasonCompute(SE, gi, seasonRounds(SE, gi));
    for(const x of C.table){
      if(x.tid === mine) continue;                     // 내 자리는 내가 올린다
      const cur = all && all[x.tid];
      if(!cur || (cur.ls|0) >= SE.n) continue;         // 없는 팀 · 이미 반영된 팀
      try{
        await leagueReq("teams/" + x.tid, "PATCH", {
          lp: clamp(Math.round(+cur.lp||LEAGUE_LP0) + x.lp, 0, 99999),
          w:  Math.max(0, cur.w|0) + x.w,
          l:  Math.max(0, cur.l|0) + x.l,
          n:  Math.max(0, cur.n|0) + 1,
          ls: SE.n
        });
        n++;
      }catch(e){}
    }
  }
  U.setAll = SE.n; U.setting = false;
  if(n && UI.rank) UI.rank.at = 0;                     // 순위표를 다시 읽게 한다
  if(n) render();
}

/* 다른 조로 옮겨 본다 */
function seasonSeeGroup(gi){
  const U = UI.league; if(!U || !U.SE) return;
  U.vg = clamp(gi|0, 0, U.SE.g.length - 1);
  seasonRefresh();
}
/* 시즌 자동 개막 —
   3시간마다 한 번, 서버에 아직 그 시즌이 없으면 먼저 본 사람이 대신 올린다.
   번호·시작 시각·시드가 전부 시계에서 나오므로 누가 올리든 같은 시즌이 된다.
   그 순간 등록돼 있던 팀들이 리그 포인트 순으로 조에 배정되어 통째로 얼어붙는다. */
async function seasonAuto(prev){
  const U = UI.league = UI.league || {};
  if(!leagueOn() || U.making || verBlock()) return seasonRefresh();
  const n = seasonDue();
  /* 이미 올라와 있거나, 이번 시즌은 벌써 한 번 시도해 봤다 —
     어느 쪽이든 그냥 지금 서버에 있는 시즌을 펼친다.
     (규칙이 거부했거나 내 시계가 앞서 있어도 화면이 멈추지 않게 한다) */
  if((prev && prev.n >= n) || U.tried === n) return seasonRefresh();
  U.tried = n;
  U.making = true;
  let all;
  try{ all = await leagueReq("teams"); }
  catch(e){ U.making = false; return seasonRefresh(); }
  const pool = Object.keys(all||{}).map(k => leagueSane(all[k], k)).filter(Boolean);
  if(pool.length < SEASON_MIN){                   // 팀이 모자라면 이번 시즌은 그냥 건너뛴다
    U.making = false; U.few = true; U.fewN = pool.length; return seasonRefresh();
  }
  U.few = false;
  pool.sort((a,b)=> b.lp - a.lp || (a.tid < b.tid ? -1 : 1));
  const gn = Math.ceil(pool.length / LEAGUE_N);
  const g = Array.from({length:gn}, ()=> []);
  pool.forEach((t,i)=> g[Math.min(gn-1, Math.floor(i * gn / pool.length))].push(t.tid));
  const doc = {n, start: seasonStartOf(n), step: SEASON_STEP, seed: seasonSeedOf(n), g, t: {}, v: RULES_VER};
  pool.forEach(t =>{ const o = Object.assign({}, all[t.tid]); delete o.dm; doc.t[t.tid] = o; });   // 서버에 올라온 원본을 그대로 얼린다 (마왕 대항전 기록은 뺀다)
  try{ await leagueReq("season", "PUT", doc); }
  catch(e){ /* 남이 먼저 올렸다 — 그 쪽을 따르면 된다 */ }
  U.making = false;
  await seasonLoad(true);
}

/* 내 경기 다시 보기 — 집계에 쓴 것과 같은 시드로 같은 전투를 돌린다 */
function seasonWatch(r, i){
  const U = UI.league; if(!U || !U.SE || !U.C) return;

}
/* 화면에 떠 있는 동안 남은 시간을 센다 */
function hhmmss(ms){
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t/60)%60, sec = t%60;
  return (h? h + ":" + String(m).padStart(2,"0") : String(m)) + ":" + String(sec).padStart(2,"0");
}
let LG_T = 0;
function lgClockStop(){ if(LG_T){ clearInterval(LG_T); LG_T = 0; } }
function lgClockStart(){
  lgClockStop();
  LG_T = setInterval(()=>{
    const U = UI.league;
    if(UI.view !== "league" || !U || !U.SE || !U.C){ lgClockStop(); return; }
    const el = $("#lgClock");

    if(!at){
      const left = Math.max(0, seasonNextSeasonAt() - leagueNow());
      if(el) el.textContent = "다음 시즌까지 " + hhmmss(left);
      if(left <= 0) seasonLoad(true);
      return;
    }
    const left = Math.max(0, at - leagueNow());
    if(el) el.textContent = `다음 라운드까지 ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,"0")}`;
    if(left <= 0) seasonRefresh();
  }, 1000);
}

/* 내 자리만 갱신한다 — 남의 기록은 건드리지 않는다 */
/* 서버에 있는 내 성적을 내 저장으로 받아 온다 (0924).
   내가 게임을 켜지 않은 동안의 시즌은 다른 학원의 게임이 서버에 대신 반영한다 — 그 몫이 내 저장에는 없다.
   예전에는 등록할 때 내 저장 값으로 서버를 통째로 덮어써서, 그렇게 쌓인 성적이 지워졌다.
   리그 포인트 · 승 · 패 · 시즌 수는 줄어드는 일이 없으니 둘 중 큰 쪽을 남긴다.
   서버에 닿지 못하면 false — 그때는 서버에 쓰지 않는다. */
async function leagueServerMerge(L){
  L = L || leagueState();
  let cur;
  try{ cur = await leagueReq("teams/" + leagueId()); }catch(e){ return false; }
  if(cur && typeof cur === "object"){
    const n = (v, hi)=> clamp(Math.round(+v||0), 0, hi);
    const before = [L.lp, L.w, L.l, L.n].join("/");
    L.lp = Math.max(L.lp|0, n(cur.lp, 99999));
    L.w  = Math.max(L.w|0,  n(cur.w, 999999));
    L.l  = Math.max(L.l|0,  n(cur.l, 999999));
    L.n  = Math.max(L.n|0,  n(cur.n, 999999));
    L.lastSeason = Math.max(L.lastSeason|0, n(cur.ls, 1e9));   // 서버가 이미 정산한 시즌은 다시 더하지 않는다
    if(before !== [L.lp, L.w, L.l, L.n].join("/")) save();
  }
  return true;
}
async function leagueSync(){
  if(!leagueOn()) return false;
  if(verBlock()){ verBlockToast(); return false; }
  const L = leagueState();
  if(!(await leagueServerMerge(L))){ toast("리그 서버에 닿지 못했다 — 기록을 덮어쓰지 않도록 올리지 않았다"); return false; }
  /* 명단이 조건을 못 채워도 이미 등록해 둔 자리라면 점수만은 남긴다 —
     이게 없으면 시즌 결과가 내 저장에만 쌓이고 서버 순위표에는 안 올라간다 */
  if(!leagueReady()){
    if(!L.up) return false;
    try{
      await leagueReq("teams/" + leagueId(), "PATCH",
        {lp:L.lp, w:L.w, l:L.l, n:L.n, ls:L.lastSeason|0, mi:clamp(S.master.info|0, 0, MASTER_MAX)});
      L.up = Date.now(); save();
      if(UI.rank) UI.rank.at = 0;
      return true;
    }catch(e){ return false; }
  }
  const body = Object.assign(leagueMyPack(L.sids, L.form), {lp:L.lp, w:L.w, l:L.l, n:L.n, ls:L.lastSeason|0});
  { const dr = demonRec(demonState()); if(dr) body.dm = dr; }
  try{
    await leagueReq("teams/" + leagueId(), "PUT", body);
    L.up = Date.now(); save();
    if(UI.rank) UI.rank.at = 0;        // 순위표를 다음 렌더에서 다시 읽는다
    return true;
  }catch(e){ toast("리그 서버에 올리지 못했다 — " + (e.message||e)); return false; }
}

    <div class="panel-h"><h2>지난 시즌</h2><span class="hint">통산 ${L.w}승 ${L.l}패 · ${L.n}시즌</span></div>
      <div class="condbox">${L.hist.map(h=>`<div class="condrow">
        <span class="cn">${h.season? `시즌 ${h.season}` : new Date(h.ts).toLocaleDateString("ko-KR")}</span>
        <span class="cv num" style="color:var(--${h.rank<=3?"ok":"muted"})">${h.rank}위${h.size? ` / ${h.size}팀`:""}</span>

        <span class="cf num" style="color:var(--brass)">+${h.lp} → ${fmt(h.now)}${h.sp? ` · <span style="color:var(--indigo)">SP +${h.sp}</span>`:""}</span></div>`).join("")}</div>
  </section>` : "");
}

/* 시즌 판 — 서버에 얼려 둔 대진을 그대로 펼쳐 보여준다 */
function lgSeasonView(U, L){

       ? ` <span style="color:var(--warn)">· 이 컴퓨터 시계가 ${Math.round(Math.abs(LEAGUE_SKEW)/60000)}분 ${LEAGUE_SKEW>0?"느려":"빨라"} 서버 시각으로 맞춰 두었다</span>`

  if((U.loading || U.making) && !U.SE) return `<section class="panel">${head()}

  if(U.few && !U.SE) return `<section class="panel">${head()}
    <div class="empty">등록된 학원이 ${U.fewN|0}곳뿐이라 이번 시즌은 열리지 않았다.
      ${SEASON_MIN}곳이 모이면 다음 시각에 저절로 열린다.</div>
    <p class="opthint">${cycle}. 다음 시즌 ${new Date(seasonNextSeasonAt()).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}.</p></section>`;

    <div class="empty">아직 열린 시즌이 없다.</div>

  const SE = U.SE;
  const vg = U.vg|0, out = U.gi < 0;
  const total = seasonRounds(SE, vg), C = U.C, o = U.upto|0, done = o >= total, mine = leagueId();
  if(!C) return `<section class="panel">${head()}<div class="empty">대진을 펼치는 중…</div></section>`;
  /* 조가 여럿이면 골라서 볼 수 있다. 1조가 리그 포인트 상위 조다. */
  const picker = SE.g.length > 1 ? `<div class="btnrow" style="margin-bottom:10px">

  const verBan = !gap ? "" : gap > 0
    ? `<div class="empty" style="margin-bottom:10px">게임이 새 판으로 올라갔다 —

        그때까지 아래 순위표는 참고용이고 리그 포인트도 들어오지 않는다.</div>`
    : `<div class="empty" style="margin-bottom:10px">이 시즌은 예전 판으로 열렸다 —
        사람마다 순위표가 다르게 나올 수 있어 리그 포인트를 반영하지 않는다.
        다음 시즌부터는 정상으로 돌아온다.</div>`;
  const banner = out ? `<div class="empty" style="margin-bottom:10px">이번 시즌 명단에 우리 학원이 없다 —
      <b>등록 · 갱신</b>을 해 두면 다음 시즌에 자동으로 들어간다.</div>` : "";
  const acad = tid => SE.t[tid] ? SE.t[tid].acad : "?";
  const myRows = (vg !== U.gi) ? [] : C.rr.map((pairs, r)=>{
    const i = pairs.findIndex(pr => C.order[pr[0]]===mine || C.order[pr[1]]===mine);
    if(i < 0) return {r, bye:true};
    const res = C.results.find(x => x.r===r && x.i===i);
    const foeTid = C.order[pairs[i][0]]===mine ? C.order[pairs[i][1]] : C.order[pairs[i][0]];
    let sc = "";
    if(res){                                   // 생존 수는 늘 우리 쪽을 앞에 적는다
      const n = res.score.split("-");
      sc = res.at===mine ? `${n[0]}-${n[1]}` : `${n[1]}-${n[0]}`;
    }
    return {r, i, foe:acad(foeTid), res, sc,
            win: res ? ((res.at===mine) === res.aw) : null, open:r < o};
  });
  const myRank = vg === U.gi ? (C.table.find(x=>x.tid===mine)||{}).rank : 0;
  return `<section class="panel">
    ${head()}
    ${verBan}
    <div class="lgbar">
      <div class="lgstat"><span>시즌</span><b class="num">${seasonNo(SE.n)}</b></div>
      <div class="lgstat"><span>진행</span><b class="num">${o} / ${total} 라운드</b></div>

        SE.g.length>1? `${vg+1}조 · ` : ""}${C.table.length}팀</b></div>
      <div class="lgstat"><span>${out? "1위" : "현재 순위"}</span><b class="num" style="color:var(--${!out&&myRank<=3?"ok":"muted"})">${
        out? esc(C.table[0] ? C.table[0].acad : "-") : (myRank||"-") + "위"}</b></div>
    </div>
    ${banner}${picker}
    <p class="opthint">${done
      ? `시즌 ${seasonNo(SE.n)} 이 끝났다. 순위에 따른 리그 포인트가 반영됐다. ${cycle} — 다음 시즌 ${new Date(seasonNextSeasonAt()).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}.`
      : `라운드는 ${Math.round(SE.step/60000)}분마다 하나씩 열린다. 모두가 같은 시드로 계산하니 순위표는 어디서 봐도 같다. ${cycle}.`}</p>
    <table class="tb"><thead><tr><th>순위</th><th>학원</th><th>승점</th><th>승</th><th>패</th><th>생존</th><th>LP</th></tr></thead><tbody>
      ${C.table.map(x=>`<tr${x.tid===mine?' style="background:var(--brass-soft)"':""}>
        <td class="num">${x.rank}</td>
        <td>${esc(x.acad)}${x.tid===mine? ' <span class="tag" style="color:var(--brass);border-color:var(--brass)">우리</span>':""}</td>
        <td class="num"><b>${x.pts}</b></td><td class="num">${x.w}</td><td class="num">${x.l}</td>
        <td class="num" style="color:var(--dim)">${x.gf}:${x.ga}</td>
        <td class="num" style="color:var(--${x.lp>=0?"brass":"bad"})">${x.lp>=0?"+":""}${x.lp}</td></tr>`).join("")}
    </tbody></table>
    ${vg !== U.gi ? "" : `<div class="rule"></div><div class="eyebrow" style="margin-bottom:6px">우리 경기</div>
    <div class="condbox">${myRows.map(m=>{ const al = matchAlive(m.sc);
      return `<div class="lgrow">
      <span class="lm">${m.r+1}라운드</span>
      <span class="lw">${m.bye? "부전승" : "VS " + esc(m.foe)}</span>
      <span class="lr" style="color:var(--${m.bye?"dim":!m.open?"dim":m.win?"ok":"bad"})">${
        m.bye? "-" : !m.open? "아직" : m.win? "승리" : "패배"}</span>
      <span class="lsv num">${(!m.bye && m.open && al.ok)? `생존 ${al.me} : ${al.foe}` : ""}</span>
      <span class="lbt">${m.bye||!m.open? "" : `<button class="btn sm" data-lgw="${m.r}:${m.i}">관전</button>`}</span></div>`; }).join("")}</div>`}
    ${C.results.length? `<div class="rule"></div>
      <div class="eyebrow" style="margin-bottom:6px">${vg+1}조 전체 경기 <span style="color:var(--dim)">— 지금까지 치러진 경기는 모두 볼 수 있다</span></div>
      <div class="condbox">${C.results.slice().reverse().map(r=>{ const al = matchAlive(r.score);
        const win = r.aw? r.a : r.b, sv = r.aw? [al.me, al.foe] : [al.foe, al.me];
        return `<div class="lgrow">
        <span class="lm" style="color:var(--${r.at===mine||r.bt===mine?"text":"dim"})">${r.r+1}R · ${esc(r.a)} VS ${esc(r.b)}</span>
        <span class="lw">${esc(win)}</span>
        <span class="lr" style="color:var(--ok)">승리</span>
        <span class="lsv num">${al.ok? `생존 ${sv[0]} : ${sv[1]}` : ""}</span>
