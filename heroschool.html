function audSync(){
  const key = AWANT;

  const ctx = audCtx();
  if(!ctx){ AWEB = false; audHtml(key); return; }
  const t = BGM[key];
  const files = t.intro ? [t.loop, t.intro] : [t.loop];
  Promise.all(files.map(audLoad)).then(()=>{
    if(AWANT !== key) return;
    AWEB = true; audWeb(key);
  }).catch(()=>{
    if(AWANT !== key) return;

function audWeb(key){
  const ctx = ACTX, t = BGM[key];
  audStop(.7);
  const g = ctx.createGain(); g.gain.value = 0; g.connect(AMAST);
  const t0 = ctx.currentTime + .06;
  const n = {key:key, g:g, srcs:[]};
  let at = t0;
  if(t.intro && ABUF[t.intro]){
    const s = ctx.createBufferSource();
    s.buffer = ABUF[t.intro]; s.connect(g); s.start(t0);
    n.srcs.push(s);
    at = t0 + (t.len != null ? t.len : ABUF[t.intro].duration);
  }
  const vol = (t.v == null ? 1 : t.v);
  const durL = ABUF[t.loop].duration, RF = BGM_REFADE;
  if(t.refade && !t.once && durL > RF.out + RF.in + 2){
    /* 한 바퀴씩 따로 튼다 — 끝나기 out 초 전부터 꺼지고, gap 초 쉬고, in 초 동안 다시 켜진다.

      if(n.dead) return;

      n.srcs.push(L);

      g.gain.linearRampToValueAtTime(0, start + dur);

        if(n.dead || ANOW !== n) return;
        cycle(Math.max(ctx.currentTime, start + dur) + R.gap, false);
      };
    };
    cycle(at, true);
  } else {
    const L = ctx.createBufferSource();
    L.buffer = ABUF[t.loop]; L.loop = !t.once; L.connect(g); L.start(at);
    n.srcs.push(L);
    if(t.once) L.onended = ()=>{ if(ANOW === n) ANOW = null; };   // 다시 틀 수 있게 비워 둔다
  }

/* ── WebAudio 를 못 쓰는 환경 — <audio> 두 장으로 이어 붙인다 ── */
function audHtmlStop(){
  if(!AHTML) return;
  const list = AHTML; AHTML = null;
  list.forEach(el=>{
    const iv = setInterval(()=>{
      const v = (el.volume || 0) - .08;
      if(v <= .005){ clearInterval(iv); try{ el.pause(); el.volume = 0; }catch(e){} }
      else { try{ el.volume = v; }catch(e){ clearInterval(iv); } }
    }, 40);
  });

function audHtml(key){
  audHtmlStop();
  const t = BGM[key];
  const mk = (f, lp)=>{ const el = new Audio(BGM_DIR + f); el.preload = "auto"; el.loop = !!lp; el.volume = 0; return el; };
  const lo = mk(t.loop, !t.once && !t.refade), list = [lo];
  if(t.once) lo.addEventListener("ended", ()=>{ if(AHTML === list) ANOW = null; });
  if(t.refade && !t.once){
    /* <audio> 판 — 끝나기 전 볼륨을 내리고, 끝나면 잠깐 쉬었다가 처음부터 다시 올린다 */
    const R = BGM_REFADE;
    const full = ()=> (t.v == null ? 1 : t.v) * audGain();
    lo.addEventListener("timeupdate", ()=>{
      if(AHTML !== list || !lo.duration) return;
      const left = lo.duration - lo.currentTime;
      if(left < R.out){ try{ lo.volume = full() * Math.max(0, left / R.out); }catch(e){} }
    });
    lo.addEventListener("ended", ()=>{
      if(AHTML !== list) return;
      setTimeout(()=>{
        if(AHTML !== list) return;
        try{ lo.currentTime = 0; lo.volume = 0; }catch(e){}
        lo.play().catch(()=>{});
        const st = performance.now();
        const iv = setInterval(()=>{
          if(AHTML !== list){ clearInterval(iv); return; }
          const k = Math.min(1, (performance.now() - st) / (R.in*1000));
          try{ lo.volume = full() * k; }catch(e){}
          if(k >= 1) clearInterval(iv);
        }, 40);
      }, R.gap*1000);
    });

  if(t.intro){
    const it = mk(t.intro, false);
    it.addEventListener("ended", ()=>{ if(AHTML === list){ lo.volume = it.volume; lo.play().catch(()=>{}); } });
    list.unshift(it); head = it;
  }
  AHTML = list; ANOW = {key:key, html:true};
  const vol = (t.v == null ? 1 : t.v) * audGain();
  let v = 0;
  const iv = setInterval(()=>{
    if(AHTML !== list){ clearInterval(iv); return; }
    v = Math.min(vol, v + Math.max(vol, .02)/14);
    list.forEach(e=>{ try{ e.volume = v; }catch(x){} });

}

    .then(b=> new Promise((ok,no)=> ctx.decodeAudioData(b, ok, no)))

function sfxPlay(key){
  const t = SFX[key]; if(!t) return;

  if(now - (ASLAST[key]||0) < SFX_GAP) return;
  ASLAST[key] = now;
  const v = (t.v == null ? 1 : t.v);
  if(AWEB === false || ASBAD[t.f]) return sfxHtml(t, g*v);
  const ctx = audCtx();
  if(!ctx){ AWEB = false; return sfxHtml(t, g*v); }
  if(ctx.state === "suspended") ctx.resume().catch(()=>{});

  ASG.gain.value = g;
  try{
    const src = ctx.createBufferSource(); src.buffer = buf;
    const vg = ctx.createGain(); vg.gain.value = v;
    src.connect(vg); vg.connect(ASG); src.start();
    ASN++; src.onended = ()=>{ ASN = Math.max(0, ASN-1); };

/* 학기 시작에 한꺼번에 넘겨 보지 않고, 그 상황이 와야 열리는 장 */
const TUT_EXTRA = {"2":true, "5":true, "6":true, "7":true, "8":true, "9":true, "10":true, "11":true, "12":true};   /* 9 — 졸업생 리그 (첫 졸업식 뒤) · 10 — 학원 인가 (첫 인가 팝업 뒤) · 11 — 3학년 진로 준비 (3년차 겨울 진입) · 12 — 카드 표식 (표식 카드가 처음 손패에 들어온 주) */
function tutAll(){ return (typeof TUT_IMG!=="undefined") ? Object.keys(TUT_IMG).sort((a,b)=> (+a)-(+b)) : []; }   // 숫자 순 (10 이 2 앞에 오지 않게)
function tutSeen(k){ return !!(S.tutSeen && S.tutSeen[String(k)]); }
function tutMark(k){ S.tutSeen = S.tutSeen||{}; S.tutSeen[String(k)] = true; }
/* opt.start 면 처음 네 장만, 아니면 이미 열린 장까지 */
function tutPages(opt){
  const all = tutAll();
  if(opt && opt.start) return all.filter(k=> !TUT_EXTRA[k]);
  return all.filter(k=> !TUT_EXTRA[k] || tutSeen(k));
}
function tutHas(){ return tutPages().length > 0; }
function showTutorial(i, opt){
  opt = opt || {};

  if(!ks.length) return;
  i = clamp(i|0, 0, ks.length-1);
  const last = i >= ks.length-1;

      <button class="btn sm primary" id="tutNext">${last? (opt.start? "학원을 맡는다" : "닫기") : "다음"}</button>
      ${opt.start && !last? `<button class="btn sm ghost" id="tutSkip">건너뛰기</button>`:""}
      <span class="tutdots">${ks.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</span>
    </div>`, ()=>{
    const done = ()=>{ closeModal(); if(opt.after) opt.after(); };

  if(typeof S.teamCap !== "number") S.teamCap = teamCapNow();
  teamCap();
  S.scouts && S.scouts.forEach(c=>{ if(typeof c.tried!=="number") c.tried = c.state==="lost"?2:0; });
  if(S.week >= PHASES[S.phase].weeks) endPhase();
  if(!UI.tour && S.phase==="fall" && S.fallRun && S.fallRun.alive && S.fallRun.pending && LADDER[S.fallRun.pending]){
    startLadder(S.fallRun.pending);
  }
  // 대회 주차가 바뀌어 이미 지나쳐 버린 세이브 — 지금 열어준다
  if(!UI.tour && S.phase==="fall" && S.fallRun && S.fallRun.alive && !S.fallRun.pending){
    const cfg = LADDER[S.fallRun.step];
    if(cfg && S.week >= cfg.week && S.week < PHASES.fall.weeks){
      logE(`대회 일정 개편 — <b>${cfg.n}</b>이(가) ${cfg.week}주차로 옮겨졌다. 놓치지 않도록 지금 연다.`,"big");
      startLadder(S.fallRun.step);
    }
  }
  UI.view = "home";
  render();
  showTitle(had);
}
boot();
</script>
