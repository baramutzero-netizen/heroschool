/* 전투 스탯 산출: 직업 기본 + 레벨 성장(잠재력 연동) + 유물 */
/* 멘탈리티 상한 — 99를 넘길 수 있지만 잠재력이 받쳐줘야 하고, 넘은 몫은 절반만 힘이 된다 */
const MENT_MAX    = 129;   // 절대 상한
const MENT_SOFT   = 99;    // 여기까지가 본래 구간
const MENT_OVER_K = .5;    // 초과분 효율
const MENT_OVER_G = .35;   // 99를 넘어선 뒤의 성장 속도
/* 항목별 한계 — 잠재력에 성격 보정에 따른 폭을 얹어 입학할 때 정해진다 */
const MENT_CAP_BAND = {"5":[21,30], "0":[11,20], "-5":[1,10], "-10":[0,0]};
function mentCapBand(mod){
  const b = MENT_CAP_BAND[String(mod|0)];
  if(b) return b;
  if(mod >= 5)  return MENT_CAP_BAND["5"];
  if(mod <= -10) return MENT_CAP_BAND["-10"];
  if(mod < 0)   return MENT_CAP_BAND["-5"];
  return MENT_CAP_BAND["0"];
}
function mentCapRoll(st, k){
  const mod = ((personaOf(st).m)||{})[k] || 0;
  const b = mentCapBand(mod);
  const pot = (st && st.ment && st.ment.pot)||0;
  return clamp(Math.round(pot + ri(b[0], b[1])), 1, MENT_MAX);
}
/* 한계는 학생마다 한 번만 굴린다 — 옛 기록은 처음 열릴 때 그 자리에서 정해 준다 */
function rollMentCaps(st, only){
  if(!st) return;
  st.cap = st.cap || {};
  MENTAL.forEach(m=>{
    if(m.fixed) return;
    if(only && only.indexOf(m.k) < 0) return;
    const v = mentCapRoll(st, m.k);
    st.cap[m.k] = Math.max(v, Math.round((st.ment && st.ment[m.k]) || 0));   // 이미 넘어선 값은 깎지 않는다
  });
  return st.cap;
}
function mentCapOf(st, k){
  if(!st || !k || k==="pot") return MENT_MAX;
  if(!st.cap || st.cap[k]==null) rollMentCaps(st, [k]);
  return clamp((st.cap && st.cap[k])|0, 1, MENT_MAX);
}
/* 성장 곡선의 기준선 — 한계에 가까워질수록 상승이 느려진다 */
function mentGrowCap(st, k){ return Math.max(20, mentCapOf(st, k) - 10); }
/* 전투에 실제로 먹히는 값 — 99 위는 절반으로 친다 */
function mentEffVal(v){
  v = clamp(v||0, 0, MENT_MAX);
  return v <= MENT_SOFT ? v : MENT_SOFT + (v-MENT_SOFT)*MENT_OVER_K;
}
/* 멘탈리티가 전투 능력치에 주는 보정 (수치 100 기준) */
const MLERP = (v, lo, hi)=> lo + mentEffVal(v)/MENT_SOFT*(hi-lo);
/* 멘탈리티 0 → 99 구간의 전투 능력치 보정폭 */
const MENT_RANGE = {
  atk    : [-.10, .30],   // 적극성 — 공격력
  spd    : [-.20, .40],   // 적극성 — 속도
  hp     : [-.10, .50],   // 지구력 — 체력
  def    : [-.10, .30],   // 지구력 — 방어력
  ult    : [-.10, .40],   // 천재성 — 필살 게이지 획득
  crit   : [-.05, .30],   // 천재성 — 크리 확률
  cdmg   : [-.10, .50],   // 천재성 — 크리 피해
  proc   : [-.05, .40],   // 천재성 — 스킬 출현 확률
  cDef   : [ .00, .25],   // 침착성 — 방어력
  skAcc  : [-.10, .40],   // 침착성 — 스킬 성공률
  acc    : [-.10, .20],   // 침착성 — 피해 명중
  eva    : [-.10, .40],   // 침착성 — 피해 회피
  wAtk   : [ .00, .20],   // 정신력 — 공격력
  critRes: [ .00, .40],   // 정신력 — 받는 크리 피해 감소
  skRes  : [ .00, .60],   // 정신력 — 스킬 저항률
  teamAtk: [ .00, .15],   // 팀워크 — 공격력
  teamDef: [ .00, .25],   // 팀워크 — 방어력
  teamHp : [ .00, .25],   // 팀워크 — 체력
  teamSpd: [ .00, .25]    // 팀워크 — 속도
};
function MR(k, v){ const r = MENT_RANGE[k]; return MLERP(v, r[0], r[1]); }
function MENT_BONUS(m){
  m = m||{};
  return {
    atkM: 1 + MR("atk", m.aggr) + MR("wAtk", m.will),   // 적극성 + 정신력
    spdM: 1 + MR("spd", m.aggr),
    hpM:  1 + MR("hp",  m.stam),
    defM: 1 + MR("def", m.stam) + MR("cDef", m.calm),   // 지구력 + 침착성
    ultM: 1 + MR("ult", m.genius),
    crit:     MR("crit", m.genius),
    critDmg:  MR("cdmg", m.genius),
    procM:1 + MR("proc", m.genius),
    acc:      MR("acc",   m.calm),
    eva:      MR("eva",   m.calm),
    skAcc:    MR("skAcc", m.calm),
    skRes:    MR("skRes", m.will),
    critRes:  MR("critRes", m.will)
  };
}
function battleStats(st){
  const J = JOBS[st.job], b = J.base, g = J.grow;
  if(J.fixed) return Object.assign({critRes:0}, b);          // 마왕 — 적힌 값 그대로
  const ME = mentEff(st);
  const potF = .58 + ME.pot/100*.85;
  const lv = st.level-1;
  const s = {
    hp: b.hp + g.hp*lv*potF,
    atk: b.atk + g.atk*lv*potF,
    def: b.def + g.def*lv*potF,
    spd: b.spd + g.spd*lv*potF,
    crit:b.crit, critDmg:b.critDmg, acc:b.acc, eva:b.eva,
    skAcc:b.skAcc, skRes:b.skRes, ultGain:b.ultGain, leech:b.leech,
    critRes: 0
  };
  // 멘탈리티 → 전투 능력치 보정
  const M = MENT_BONUS(ME);
  s.atk *= M.atkM; s.spd *= M.spdM; s.hp *= M.hpM; s.def *= M.defM; s.ultGain *= M.ultM;
  s.acc += M.acc; s.eva += M.eva; s.skAcc += M.skAcc; s.skRes += M.skRes; s.crit += M.crit;
  s.critDmg += M.critDmg||0;
  s.critRes += M.critRes||0;
  (st.relics||[]).forEach(r=>{ if(!r) return; r.aff.forEach(a=> s[a.k] = (s[a.k]||0)+a.v); });
  if(st.mul) for(const k in st.mul) s[k] = (s[k]||0)*st.mul[k];
  // 컨디션 보정 (±12%)
  const cf = .82 + (st.cond/100)*.28;
  ["hp","atk","def","spd"].forEach(k=> s[k]*=cf);
  return s;
}
function corePower(st){ const c=st.cond; st.cond=100; const v=power(st); st.cond=c; return v; }
/* 표시 전투력 — 방어력 감쇠·회피·받는 크리 감소·스킬 저항을 실효 내구로,
   크리·명중·스킬 성공률을 실효 공격으로 환산해 더한다. */
/* 전투력 — 실제 전투 결과에 맞춘 식 (0924, 9만 판 시뮬레이션으로 가중치를 맞췄다).
   생존력(실효 체력)과 화력(실효 공격)을 곱한 값을 예전 전투력과 같은 폭으로 줄여 보여준다.
     실효 체력 = 체력 × 방어 감쇠 × 회피 × 받는 크리 감소 × 스킬 저항 × 피흡
     실효 화력 = 공격력 × 속도^1.44 × 크리 기대값 × 명중 × 스킬 성공률 × 필살 게이지
   팀 전투력(합)의 비율로 승패를 가장 잘 맞히도록 계수를 골랐다. */
const PW = {ehp:.6843, dps:.7751, spd:1.4374, ult:3.983, leech:.5845, skAcc:.12, skRes:.08, critExp:.75,
            crit:.5638, accRef:1.1546, evaRef:.3047, def:289.8913, t:.375, K:2.2145};
function powerParts(st){
  const s = battleStats(st);
  const ehp = s.hp * (1 + (s.def||0)/PW.def)
    / clamp(PW.accRef - (s.eva||0), .35, .99)                      // 적이 나를 맞힐 확률
    / (1 + PW.crit*(1 - clamp(s.critRes||0, 0, .8)))              // 받는 크리
    / (1 - PW.skRes*clamp(s.skRes||0, 0, 1))                      // 스킬 저항
    * (1 + PW.leech*(s.leech||0));                                // 피흡
  const dps = s.atk * Math.pow(Math.max(1, s.spd), PW.spd)
    * Math.pow(1 + clamp(s.crit||0, 0, 1)*((s.critDmg||1.5) - 1), PW.critExp)   // 크리 기대값
    * clamp((s.acc||.95) - PW.evaRef, .35, .99)                   // 명중
    * (1 + PW.skAcc*clamp(s.skAcc||0, 0, 2))                      // 스킬 성공률
    * (1 + PW.ult*(s.ultGain||0));                                // 필살 게이지
  return {s, ehp, dps};
}
function power(st){
  const q = powerParts(st);
  return Math.round(PW.K * Math.pow(Math.pow(q.ehp, PW.ehp) * Math.pow(q.dps, PW.dps), PW.t));
}
function mentAvg(st){ return Math.round(MENTAL.reduce((a,x)=>a+st.ment[x.k],0)/MENTAL.length); }

/* ============================================================
   로그
   ============================================================ */
function logE(html, cls){
  S.log.unshift({t:`${yrName(S.year)} ${PHASES[S.phase].n} ${S.week+1}주`, h:html, c:cls||""});
  if(S.log.length>260) S.log.length=260;
}

/* ============================================================
   전투 (ATB)
   ============================================================ */
function mkUnit(st, side, idx, row){
  const s = battleStats(st);
  return {
    uid: side+idx, ref: st.id, name: dn(st), job: st.job, side, idx, pers:st.pers||"plain",
    row: row || ROW_OF(st.job), lv: st.level,
    ment: Object.assign({}, mentEff(st)), injured: injWeeks(st), skMod: st.skMod||{}, skills: skillsOf(st), passiveJob: passiveJobOf(st),
    base: s, maxHp: Math.round(s.hp), hp: Math.round(s.hp),
    atb: ri(0,300), ult:0, shield:0, fx:[], alive:true, acted:0,
    dDealt:0, dHeal:0, dTaken:0,
    fixed: !!JOBS[st.job].fixed, consLine: JOBS[st.job].consLine, consMit: JOBS[st.job].consMit
  };
}
/* 0~1 척도로 다루는 항목 — 보정을 가산으로 얹는다 */
const RATE_STAT = ["crit","acc","eva","skAcc","skRes","leech","critDmg","ultGain","critRes"];
/* 봉인 해제 — 전체로 바뀌는 것은 피해를 주는 기술뿐 */
const UNSEAL_AOE = ["dmg","dmg_multi","drain"];
function eff(u, key){
  let v = u.base[key]||0, add=0, mul=0;
  u.fx.forEach(f=>{ if(f.stat===key || (f.stats && f.stats.indexOf(key)>=0)){ if(f.mode==="mul") mul+=f.val; else add+=f.val; } });
  if(RATE_STAT.includes(key)) return Math.max(0, v+add+ v*mul);
  return Math.max(1, (v+add)*(1+mul));
}
function consThr(stam){
  stam = clamp(mentEffVal(stam||1), 1, MENT_MAX);
  return stam<=30 ? 85 - (stam-1)*(15/29) : 70 - (stam-30)*(30/69);
}
function consOf(u){
  const hpP = u.maxHp? u.hp/u.maxHp*100 : 0;
  const thr = u.consLine!=null ? u.consLine : consThr(u.ment.stam);
  if(hpP >= thr || !u.alive) return {skill:1, ko:0, thr, hpP, lv:0};
  const mit = u.consMit!=null ? u.consMit : clamp(1 - (u.ment.will||0)/100*.7, .3, 1);
  const mild = Math.max(0, thr - Math.max(hpP, 30));
  const sev  = Math.max(0, 30 - hpP);
  return {
    skill: clamp(1 - (mild*.01 + sev*.02)*mit, .15, 1),
    ko:    clamp((mild*.001 + sev*.005)*mit, 0, .85),
    thr, hpP, lv: hpP<30? 2 : 1
  };
}
function aliveOf(team){ return team.filter(u=>u.alive); }

function hasFx(t, sk){ return !!(t && t.fx && t.fx.some(f=> f.name===sk.name && f.turns>1)); }
function freshFirst(pool, actor, sk){
  if(!pool || pool.length<2) return pool;
  if(!skDur(actor, sk)) return pool;
  const fresh = pool.filter(t=> !hasFx(t, sk));
  return fresh.length ? fresh : pool;
}
/* 전체 대상 — 침착성 판정에 실패하면 무작위로 한 명을 흘린다.
   남은 대상이 둘 이상일 때만 빠지고, 최소 한 명은 반드시 맞는다. */
function dropOne(pool, smart){
  if(smart || !pool || pool.length < 2) return pool;
  const i = ri(0, pool.length-1);
  return pool.filter((_,k)=> k !== i);
}
/* 도발에 걸리면 침착성이 흐려진다 */
function calmOf(u){
  let mul = 0;
  (u && u.fx || []).forEach(f=>{ if(f.stat==="calm" && f.mode==="mul") mul += f.val; });
  return Math.max(0, ((u && u.ment && u.ment.calm)||0) * (1 + mul));
}
/* 도발한 상대가 살아 있으면 그쪽을 먼저 본다 */
function tauntTarget(actor, pool){
  const f = (actor && actor.fx || []).filter(x=> x.taunt);
  for(let i=f.length-1; i>=0; i--){
    const t = pool.find(u=> u.uid === f[i].taunt && u.alive);
    if(t) return t;
  }
  return null;
}
function pickTarget(actor, foes, allies, sk){
  const calmP = clamp(.3 + calmOf(actor)/100*.65, .3, .95);
  const smart = RNG() < calmP;
  const t = sk.target;
  if(t==="self") return [actor];
  if(t.startsWith("ally")){
    let pool = aliveOf(allies);
    if(t==="ally_other" && pool.length>1) pool = pool.filter(u=>u.uid!==actor.uid);
    if(!pool.length) return [];
    if(t==="ally_all") return dropOne(pool, smart);
    if(t==="ally_low2"){
      if(pool.length<=2) return pool;
      if(smart) return pool.slice().sort((a,b)=> a.hp/a.maxHp - b.hp/b.maxHp).slice(0,2);
      const q=pool.slice(), o=[]; for(let i=0;i<2;i++) o.push(q.splice(ri(0,q.length-1),1)[0]); return o;
    }
    if(smart) pool = freshFirst(pool, actor, sk);
    if(smart){ return [pool.slice().sort((a,b)=> a.hp/a.maxHp - b.hp/b.maxHp)[0]]; }
    return [pick(pool)];
  }
  let pool = aliveOf(foes);
  if(!pool.length) return [];
  const allT = UNSEAL_AOE.includes(sk.type) && (actor.fx||[]).some(f=> f.allT);
  if(t==="enemy_all" || allT) return dropOne(pool, smart);
  { const tn = tauntTarget(actor, pool); if(tn) return [tn]; }
  if(smart){
    pool = freshFirst(pool, actor, sk);
    if(t==="enemy_front"){ const f=pool.filter(u=>u.row==="front"); if(f.length) pool=f; }
    if(t==="enemy_back"){ const f=pool.filter(u=>u.row==="back"); if(f.length) pool=f; }
    if(t==="enemy_low") return [pool.slice().sort((a,b)=>a.hp-b.hp)[0]];
    return [pool.slice().sort((a,b)=> (a.hp/a.maxHp) - (b.hp/b.maxHp))[0]];
  }
  return [pick(pool)];
}

let DMG_K = 1.8, DEF_K = 290;
/* ---------- 스킬 성장 ---------- */
const SK_GRADE = ["D","C","B","A","EX"];   // 스킬 등급 — 표시용, 최고는 EX
const SK_UP  = {pow:.12, proc:.15, dur:0};    // 단순 — 지속 시간은 제안되지 않는다
const SK_EVO = {pow:.24, proc:.30, dur:1};    // 진화 — 등급 +1
const SK_AWK = {pow:.48, proc:.50, dur:2};    // 각성 — 등급 +2
const SK_TIER   = [SK_UP, SK_EVO, SK_AWK];
const SK_TIER_N = ["단순 강화","진화 강화","각성 강화"];
const SK_TIER_C = ["var(--text)","var(--brass)","var(--ex)"];
const SK_LV_MAX = 5;                          // 스킬 최대 레벨 — 강화는 4회까지
function skillsOf(st){ return (st && st.skills) ? st.skills : JOBS[st.job].skills; }
function passiveJobOf(st){ return (st && st.passiveJob) || st.job; }
function modOf(o, id){
  if(!o.skMod) o.skMod = {};
  return o.skMod[id] || (o.skMod[id] = {pow:0, proc:0, dur:0, grade:0, up:0});
}
function autoSkMod(st, level){
  st.skMod = {};
  const ids = JOBS[st.job].skills.map(x=>x.id).concat(["passive"]);
  /* skMod 에 빈 항목을 만들지 않고 읽기만 한다 */
  const upOf = id => ((((st.skMod||{})[id])||{}).up) || 0;
  let n = Math.max(0, Math.floor(level/2));
  while(n-- > 0){
    const open = ids.filter(id=> upOf(id) < SK_LV_MAX - 1);   // 레벨 상한을 넘기지 않는다
    if(!open.length) break;
    const m = modOf(st, pick(open));
    m.pow += .12; m.up++;
    if(RNG() < .16) m.grade = Math.min(4, m.grade+1);
  }
}
function ownerJobOf(skillId){
  for(const k in JOBS){ if((JOBS[k].skills||[]).some(x=>x.id===skillId)) return k; }
  return null;
}
function skGrade(o, id){ return SK_GRADE[clamp(((o.skMod&&o.skMod[id])||{}).grade||0, 0, 4)]; }
function skLevel(o, id){ return 1 + (((o.skMod&&o.skMod[id])||{}).up||0); }
function skPow(o, sk){ return sk.power * (1 + (modOf(o,sk.id).pow||0)); }
function skDur(o, sk){ return (sk.dur||0) + (modOf(o,sk.id).dur||0); }
function skProc(o, sk, genius){
  return clamp(sk.proc * (1 + (modOf(o,sk.id).proc||0)) * (1 + MR("proc", genius)), 0, .85);
}
function passiveFor(o){
  const P = passiveOf(passiveJobOf(o));
  if(!P) return null;
  const k = 1 + (((o.skMod&&o.skMod.passive)||{}).pow||0);
  const out = Object.assign({}, P);
  ["takeLow","ultBasic","vsBack","vsFront","vsLow","vsHigh","healMul","aoe","regen","take","leech","leechAll","evaSelf","counter","atbOnDebuff","encore","mirage","regenAll"].forEach(x=>{ if(out[x]) out[x] = out[x]*k; });
  out.k = k;
  return out;
}

function runBattle(teamA, teamB, opt){
  opt = opt||{};
  const rowA = opt.rowsA||null, rowB = opt.rowsB||null;
  const A = teamA.map((st,i)=>mkUnit(st,"A",i, rowA? rowA[st.id] : null));
  const B = teamB.map((st,i)=>mkUnit(st,"B",i, rowB? rowB[st.id] : null));
  // 진형 보정
  [[A,opt.formA,opt.plusA],[B,opt.formB,opt.plusB]].forEach(([U,fk,pl])=>{
    U.forEach(u=>{ u.fOut=0; u.fIn=0; u.fGuard=0; });
    if(!fk || !FORMS[fk]) return;
    const F = formData(fk, !!pl).fx;
    U.forEach(u=>{
      if(u.row==="front"){
        if(F.fOut) u.fOut += F.fOut;
        if(F.fIn)  u.fIn  += F.fIn;
        if(F.fEva) u.base.eva = (u.base.eva||0) + F.fEva;
      } else {
        if(F.bOut) u.fOut += F.bOut;
        if(F.bIn)  u.fIn  += F.bIn;
        if(F.bCrit) u.base.crit = (u.base.crit||0) + F.bCrit;
        if(F.bInGuard) u.fGuard += F.bInGuard;
      }
    });
  });
  // 팀워크 진형 보정
  const infoM = opt.infoM!=null ? opt.infoM : infoBattleMul();   // 다시 보기 — 싸울 때의 값을 그대로 쓴다
  [[A,teamA,opt.hpA,"A"],[B,teamB,opt.hpB,"B"]].forEach(([U,T,ratio,side])=>{
    const tw = T.reduce((a,s)=>a+mentEff(s).team,0)/T.length;
    const m = MR("teamAtk", tw);
    const mS = {atk: m, def: MR("teamDef", tw), hp: MR("teamHp", tw), spd: MR("teamSpd", tw)};
    const im = side==="A" ? infoM : (opt.infoMB!=null ? opt.infoMB : 1);   // B 편 — 리그에서는 상대 학원의 정보 보정
    const mood = side==="A" ? (opt.moodA||null) : (opt.moodB||null);
    U.forEach(u=>{
      if(u.fixed){ u.moodMul = 1; u.formBonus = 0; return; }   // 마왕 — 팀 보정을 받지 않는다
      const stu = T[u.idx];
      const mm = (mood && stu) ? moodStatMul(mood[stu.id]) : 1;
      u.moodMul = mm;
      ["atk","def","hp","spd"].forEach(k=> u.base[k]*=(1+mS[k])*im*mm);
      u.maxHp=Math.round(u.base.hp); u.hp=u.maxHp; u.formBonus=m;
      if(ratio && ratio[u.ref]!=null) u.hp = Math.max(1, Math.round(u.maxHp*clamp(ratio[u.ref],.05,1)));
    });
  });
  // 소울메이트 — 같은 팀에 함께 서면
  [A,B].forEach(U=>{
    const refs = U.map(u=>u.ref);
    U.forEach(u=>{
      const st = S.students && S.students.find(x=>x.id===u.ref);
      if(!st || !st.bro || refs.indexOf(st.bro)<0) return;
      ["hp","atk","def","spd"].forEach(k=> u.base[k] *= (1+BRO_STAT_MUL));
      u.bro = true;
      u.maxHp = Math.round(u.base.hp);
      u.hp = Math.min(u.maxHp, Math.round(u.hp*(1+BRO_STAT_MUL)));
    });
  });
  // 패시브 — 상시 스탯
  [A,B].forEach(U=> U.forEach(u=>{
    const P = passiveFor(u); u.pas = P; if(!P) return;
    if(P.leech) u.base.leech = (u.base.leech||0) + P.leech;
    if(P.leechAll) U.forEach(a=> a.base.leech = (a.base.leech||0) + P.leechAll);
    if(P.evaSelf) u.base.eva = (u.base.eva||0) + P.evaSelf;
  }));
  // 패시브 — 전투 개시
  [[A,"A"],[B,"B"]].forEach(([U])=> U.forEach(u=>{
    const P = u.pas; if(!P || !P.onStart) return;
    if(P.onStart==="shieldAll") U.forEach(a=>{ if(a!==u) a.shield = Math.max(a.shield, Math.round(a.maxHp*.08*P.k)); });
    if(P.onStart==="atbSelf")   u.atb = Math.max(u.atb, Math.round(400*P.k));
    if(P.onStart==="atbAll")    U.forEach(a=> a.atb = Math.max(a.atb, Math.round(150*P.k)));
    if(P.onStart==="skAccAll")  U.forEach(a=> a.base.skAcc = (a.base.skAcc||0) + .05*P.k);
  }));
  const all = A.concat(B);
  const frames = [];
  const snap = ()=> all.map(u=>({hp:u.hp,maxHp:u.maxHp,sh:u.shield,ult:u.ult,atb:clamp(u.atb/1000,0,1),alive:u.alive,
    cs:consOf(u).lv, dd:u.dDealt|0, dh:u.dHeal|0, dt:u.dTaken|0,
    fx:u.fx.map(f=>({n:f.name,k:f.kind,stat:f.stat||null,regen:!!f.regen,mir:!!f.mir,taunt:!!f.taunt,allT:!!f.allT}))}));
  /* 누적 기록 — 피해 / 회복 / 받은 피해 */
  const recDmg  = (src, tgt, v)=>{ v=Math.round(v||0); if(v<=0) return; if(src) src.dDealt+=v; if(tgt) tgt.dTaken+=v; };
  const recHeal = (src, v)=>{ v=Math.round(v||0); if(v>0 && src) src.dHeal+=v; };
  /* pop = 유닛 머리 위에 띄울 숫자 — [{u:uid, v:값, k:종류}] */
  const push=(line,cls,actor,fx,pop)=> frames.push({line,cls:cls||"",actor:actor||null,fx:fx||null,
                                                    pop:(pop&&pop.length)?pop:null, units:snap()});
  push(`<b>${opt.titleA||"우리 팀"}</b> 대 <b>${opt.titleB||"상대"}</b> — 전투 개시`,"sec");

  let guard=0, winner=null, totalActs=0, fatigueNoted=false, capHit=false;
  const fatigue = ()=> 1 + Math.min(1.6, Math.max(0, totalActs-60)*.025);
  while(guard++ < 3000){
    if(opt.turnCap && totalActs >= opt.turnCap){ capHit = true; break; }   // 마왕 대항전 — 턴 상한
    // 필살기 — 게이지가 차는 즉시 행동 게이지와 무관하게 발동한다
    const uready = all.filter(x=> x.alive && x.ult>=100);
    if(uready.length){
      uready.sort((a,b)=> eff(b,"spd")-eff(a,"spd"));
      const uu = uready[0];
      const ufoes = uu.side==="A"?B:A, uallies = uu.side==="A"?A:B;
      uu.ult = 0;
      if(aliveOf(ufoes).length){
        const uSKL = uu.skills || JOBS[uu.job].skills;
        const uSk = uSKL.find(x=>x.kind==="ult");
        if(uSk){
          totalActs++;
          if(totalActs===61 && !fatigueNoted){ fatigueNoted=true; push(`장기전 — 양측 모두 지쳐 주고받는 피해가 커진다`,"sec"); }
          push(`<b>${epiH(uu.name)}</b> — 필살 게이지 개방`,"ult",uu.uid);
          resolve(uu, uSk, ufoes, uallies, true);
          if(checkEnd()) break;
          continue;
        }
      }
    }
    // ATB 진행
    let ready = all.filter(u=>u.alive && u.atb>=1000);
    if(!ready.length){
      let need = Infinity;
      all.forEach(u=>{ if(u.alive){ const sp=eff(u,"spd"); need=Math.min(need,(1000-u.atb)/Math.max(1,sp)); } });
      need = Math.max(need, .01);
      all.forEach(u=>{ if(u.alive) u.atb += eff(u,"spd")*need; });
      continue;
    }
    ready.sort((a,b)=> b.atb-a.atb);
    const u = ready[0];
    u.atb -= 1000;
    u.acted++; totalActs++;
    if(totalActs===61 && !fatigueNoted){ fatigueNoted=true; push(`장기전 — 양측 모두 지쳐 주고받는 피해가 커진다`,"sec"); }
    // 지속 효과 정리
    let dotDmg = 0; const dotHeal = [];
    u.fx = u.fx.filter(f=>{
      if(f.kind==="dot"){ dotDmg += f.val; if(f.heal && f.src!=null) dotHeal.push([f.src, f.val]); }
      f.turns--; return f.turns>0;
    });
    if(dotDmg>0){
      const hpBefore = u.hp;
      u.hp = Math.max(0, u.hp - Math.round(dotDmg));
      u.dTaken += Math.round(dotDmg);
      push(`<b>${epiH(u.name)}</b> 지속 피해 ${fmt(dotDmg)}`,"", u.uid);
      /* 저주 — 갉아낸 만큼 시전자 쪽 아군 전체가 회복한다 */
      const real = hpBefore - u.hp;
      if(real > 0 && dotHeal.length){
        const sum = dotHeal.reduce((a,x)=>a+x[1], 0);
        dotHeal.forEach(([sid, val])=>{
          const sv = all.find(x=> x.uid === sid);
          if(!sv) return;
          const h = Math.round(real * (val/sum));
          if(h <= 0) return;
          const pp = [];
          aliveOf(sv.side==="A"? A : B).forEach(a=>{
            const h0 = a.hp; a.hp = Math.min(a.maxHp, a.hp + h); recHeal(sv, a.hp - h0);
            if(a.hp > h0) pp.push({u:a.uid, v:a.hp-h0, k:"heal"});
          });
          if(pp.length) push(`저주가 갉아낸 만큼 아군 전체 ${fmt(h)} 회복`,"heal",sv.uid,null,pp);
        });
      }
      if(u.hp<=0){ u.alive=false; push(`<b>${epiH(u.name)}</b> 전투 불능`,"die",u.uid); }
    }
    if(!u.alive){ if(checkEnd()) break; continue; }
    {
      const Pr = u.pas;
      if(Pr && Pr.regen && u.hp < u.maxHp){
        const h = Math.min(u.maxHp-u.hp, Math.round(u.maxHp*Pr.regen));
        if(h>0){ u.hp += h; recHeal(u, h); push(`<b>${epiH(u.name)}</b> 자연 회복 ${fmt(h)}`,"heal",u.uid); }
      }
      /* 자연 회복 — 아군 전체 */
      if(Pr && Pr.regenAll){
        const pp = [];
        aliveOf(u.side==="A"? A : B).forEach(a=>{
          if(a.hp >= a.maxHp) return;
          const h = Math.min(a.maxHp-a.hp, Math.round(a.maxHp*Pr.regenAll));
          if(h>0){ a.hp += h; recHeal(u, h); pp.push({u:a.uid,v:h,k:"heal"}); }
        });
        if(pp.length) push(`아군 전체 자연 회복`,"heal",u.uid,null,pp);
      }
      /* 걸려 있는 지속 회복 — 시전자에게 공로가 간다 */
      u.fx.forEach(f=>{
        if(!f.regen || u.hp >= u.maxHp) return;
        const h = Math.min(u.maxHp-u.hp, Math.round(u.maxHp*f.regen));
        if(h<=0) return;
        u.hp += h;
        const sv = (f.src!=null) ? all.find(x=> x.uid===f.src) : null;
        recHeal(sv || u, h);
        push(`<b>${epiH(u.name)}</b> ${esc(f.name)} ${fmt(h)} 회복`,"heal",(sv||u).uid,null,[{u:u.uid,v:h,k:"heal"}]);
      });
    }

    const foes = u.side==="A"?B:A, allies = u.side==="A"?A:B;
    if(!aliveOf(foes).length) break;
    const SKL = u.skills || JOBS[u.job].skills;
    const basic = SKL.find(s=>s.kind==="basic");
    // (필살기는 게이지 충전 즉시 루프 상단에서 발동한다)
    const acts  = SKL.filter(s=>!s.kind);

    let chosen = null;
    const isUlt = false;
    {
      // 스킬 출현 판정 — 천재성
      const proc = acts.filter(s=> RNG() < skProc(u, s, u.ment.genius));
      if(proc.length){
        if(proc.length>1 && RNG() < u.ment.aggr/100){
          // 적극성: 상황에 맞는 쪽을 고른다
          proc.sort((a,b)=> actValue(b,u,foes,allies) - actValue(a,u,foes,allies));
          chosen = proc[0];
        } else chosen = pick(proc);
        // 적극성 — 이미 유지 중인 효과를 다시 걸지 않는다
        if(chosen !== basic && actValue(chosen,u,foes,allies) < .2 && RNG() < u.ment.aggr/100){
          push(`<b>${epiH(u.name)}</b> — ${chosen.name}${eunn(chosen.name)} 아직 유지 중, 다시 걸지 않는다`,"",u.uid);
          chosen = basic;
        }
        // 시전 성공 판정
        if(chosen !== basic){
          const tgt0 = pickTarget(u,foes,allies,chosen);
          const res = tgt0.length && chosen.target.startsWith("enemy") ? eff(tgt0[0],"skRes") : 0;
          if(RNG() > clamp(eff(u,"skAcc") - res, .25, 1)){
            push(`<b>${epiH(u.name)}</b>의 ${chosen.name} — 시전 실패`,"",u.uid);
            chosen = basic;
          }
        }
      } else chosen = basic;
    }
    resolve(u, chosen, foes, allies, isUlt);
    if(chosen !== basic) mirGain(u);
    /* 앙코르 — 같은 기본기·스킬을 한 번 더 (필살기 제외) */
    {
      const Pe = u.pas;
      if(Pe && Pe.encore && u.alive && aliveOf(foes).length && RNG() < Pe.encore){
        push(`<b>${epiH(u.name)}</b> — 앙코르! <b>${chosen.name}</b> 한 번 더`,"good",u.uid);
        resolve(u, chosen, foes, allies, isUlt);
      }
    }
    {
      const Pm = u.pas;
      const bb = (Pm && Pm.ultBasic && chosen && chosen.kind==="basic") ? 1+Pm.ultBasic : 1;
      u.ult = clamp(u.ult + 17*eff(u,"ultGain")*bb, 0, 100);
    }
    if(checkEnd()) break;
  }
  /* 마왕의 차례 — 턴 상한에 닿거나 우리 편이 쓰러지면 대사와 함께 살아 있는 학생 모두에게 회피할 수 없는 일격 */
  if(opt.finale && (capHit || winner==="B")){
    const boss = aliveOf(B)[0];
    if(boss){
      if(capHit) push(`${opt.turnCap}턴 — 마왕의 차례`,"sec");
      const tg = aliveOf(A), v = opt.finale.dmg|0;
      const bu = (boss.skills||JOBS[boss.job].skills).find(x=>x.kind==="ult");
      push(`<b>${epiH(boss.name)}</b> — “${esc(opt.finale.line)}”`,"ult",boss.uid,
        tg.length? {n:(bu&&bu.fx)||"burst", e:(bu&&bu.el)||"dark", u:true, s:bu? sfxOf(boss,bu) : "magic", t:tg.map(t=>t.uid)} : null);
      frames[frames.length-1].call = {text:opt.finale.line, kind:"ult", pers:boss.pers||"plain"};
      if(tg.length){
        const pop = [];
        tg.forEach(t=>{ t.hp = Math.max(0, t.hp - v); recDmg(boss, t, v); pop.push({u:t.uid, v, k:"dmg"}); });
        push(`회피할 수 없는 일격 — 살아 있던 ${tg.length}명에게 각각 ${fmt(v)} 피해`,"crit",boss.uid,null,pop);
        tg.forEach(t=>{ if(t.hp<=0){ t.alive=false; t.fx=[]; push(`<b>${epiH(t.name)}</b> 전투 불능`,"die",boss.uid,null,[{u:t.uid,k:"die"}]); } });
      }
      if(!aliveOf(A).length) winner = "B";
    }
  }
  if(!winner){
    const ra = aliveOf(A).reduce((a,u)=>a+u.hp/u.maxHp,0), rb = aliveOf(B).reduce((a,u)=>a+u.hp/u.maxHp,0);
    winner = ra>=rb ? "A":"B";
    push(`시간 종료 — 잔여 전력 판정`,"sec");
  }
  push(`<b>${winner==="A"?(opt.titleA||"우리 팀"):(opt.titleB||"상대")}</b> 승리`,"sec");

  function checkEnd(){
    if(!aliveOf(A).length){ winner="B"; return true; }
    if(!aliveOf(B).length){ winner="A"; return true; }
    return false;
  }
  function fxUp(t, sk){ return hasFx(t, sk); }
  function alreadyUp(sk, u, foes, allies){
    if(!skDur(u, sk)) return false;
    if(sk.target==="self") return fxUp(u, sk);
    const pool = sk.target.startsWith("ally") ? aliveOf(allies) : aliveOf(foes);
    if(!pool.length) return false;
    return pool.every(t=> fxUp(t, sk));
  }
  function actValue(sk,u,foes,allies){
    if(sk.type==="heal"||sk.type==="ult_heal"){
      const low = Math.min(...aliveOf(allies).map(a=>a.hp/a.maxHp));
      return (1-low)*2.2;
    }
    if(sk.type==="shield"){
      const pool = aliveOf(allies);
      const covered = pool.length>0 && pool.every(t=> t.shield > t.maxHp*.25);
      return covered ? .12 : pool.length*.5 + .4;
    }
    const dup = alreadyUp(sk, u, foes, allies);
    if(sk.type==="buff"||sk.type==="haste") return dup ? .08 : .8;
    if(sk.type==="debuff"||sk.type==="slow") return dup ? .07 : .7;
    if(sk.type==="dot") return dup ? .35 : 1.05;
    if(sk.type==="regen") return dup ? .1 : 1.0;
    return 1.0 + (sk.type==="dmg_aoe"? aliveOf(foes).length*.22 : 0);
  }

  function dealDamage(src, tgt, mult, o){
    o=o||{};
    const hitP = clamp(eff(src,"acc") - eff(tgt,"eva"), .35, .99);
    if(RNG()>hitP){ push(`<b>${epiH(tgt.name)}</b> 회피`,"",src.uid,null,[{u:tgt.uid,k:"miss"}]); return 0; }
    const pierce = o.pierce||0;
    const d = eff(tgt,"def")*(1-pierce);
    let dmg = eff(src,"atk") * mult * (1 - d/(d+DEF_K)) * rnd(.93,1.07) * fatigue() * DMG_K * passiveDmgMul(src,tgt,o);
    // 진형 — 주는 쪽 / 받는 쪽
    if(src.fOut) dmg *= (1 + src.fOut);
    if(tgt.fIn)  dmg *= (1 + tgt.fIn);
    if(tgt.fGuard){
      const allies = tgt.side==="A"? A : B;
      if(allies.some(a=> a.alive && a.row==="front")) dmg *= (1 + tgt.fGuard);
    }
    let crit = o.forceCrit || RNG() < eff(src,"crit");
    if(crit){
      const cd = eff(src,"critDmg");
      const cr = clamp(eff(tgt,"critRes")||0, 0, .8);   // 정신력 — 받는 크리 피해 감소
      dmg *= 1 + (cd-1)*(1-cr);
    }
    if(o.execute && tgt.hp/tgt.maxHp < .4) dmg *= (1+o.execute*2);
    /* 물그림자 — 한 겹을 흩어 피해를 줄인다 */
    { const Pw = tgt.pas;
      if(Pw && Pw.mirage && (tgt.mir|0)>0){
        dmg *= (1 - Pw.mirage); tgt.mir--; mirSync(tgt);
        push(`<b>${epiH(tgt.name)}</b> 물그림자가 흩어진다 — 피해 ${Math.round(Pw.mirage*100)}% 감소 (남은 ${tgt.mir}겹)`,"",tgt.uid);
      } }
    dmg = Math.max(1, Math.round(dmg));
    let absorbed = 0;
    if(tgt.shield>0){ absorbed = Math.min(tgt.shield, dmg); tgt.shield -= absorbed; dmg -= absorbed; }
    tgt.hp = Math.max(0, tgt.hp - dmg);
    recDmg(src, tgt, dmg);
    const lee = eff(src,"leech");
    let leeched = 0;
    if(lee>0 && dmg>0){ const hb=src.hp; src.hp = Math.min(src.maxHp, src.hp + Math.round(dmg*lee)); leeched = src.hp-hb; recHeal(src, leeched); }
    if(!o.noUlt) tgt.ult = clamp(tgt.ult + 7*eff(tgt,"ultGain"),0,100);
    const pop = [];
    if(absorbed) pop.push({u:tgt.uid, v:absorbed, k:"absorb"});
    if(dmg>0 || !absorbed) pop.push({u:tgt.uid, v:dmg, k:crit?"crit":"dmg"});
    if(leeched>0) pop.push({u:src.uid, v:leeched, k:"heal"});
    push(`<b>${epiH(tgt.name)}</b>에게 ${fmt(dmg)}${absorbed? ` (보호막 ${fmt(absorbed)} 흡수)`:""}${crit?" — 치명타!":""}`, crit?"crit":"", src.uid, null, pop);
    if(tgt.hp<=0){ tgt.alive=false; tgt.fx=[]; push(`<b>${epiH(tgt.name)}</b> 전투 불능`,"die",src.uid,null,[{u:tgt.uid,k:"die"}]); return dmg; }
    if(dmg>0){
      const cs = consOf(tgt);
      if(cs.ko>0 && RNG()<cs.ko){
        tgt.alive=false; tgt.fx=[]; tgt.hp = Math.max(1, tgt.hp);
        push(`<b>${epiH(tgt.name)}</b> 의식을 잃고 쓰러졌다`,"die",src.uid,null,[{u:tgt.uid,k:"die"}]);
      }
    }
    /* 반격 자세 — 단일 공격을 받으면 그만큼 되받아친다 */
    if(dmg>0 && tgt.alive && src.alive && !o.counter && singleHit(o)){
      const Pc = tgt.pas;
      if(Pc && Pc.counter){
        push(`<b>${epiH(tgt.name)}</b> 반격`,"",tgt.uid);
        dealDamage(tgt, src, Pc.counter, {counter:true, noUlt:true, type:"dmg"});
      }
    }
    return dmg;
  }
  /* 여럿을 한꺼번에 치는 공격인가 */
  function singleHit(o){
    if(!o) return true;
    if(o.type==="dmg_aoe" || o.type==="ult_aoe" || o.type==="ult_drain") return false;
    if(o.target==="enemy_all") return false;
    return true;
  }
  function addFx(tgt, o){ 
    const ex = tgt.fx.find(f=>f.name===o.name);
    if(ex){ Object.assign(ex,o); } else tgt.fx.push(o);
    if(o.kind==="d" || o.kind==="dot"){
      const P = tgt.pas;
      if(P && P.atbOnDebuff && tgt.alive) tgt.atb = Math.min(999, tgt.atb + 1000*P.atbOnDebuff);
    }
  }
  /* 물그림자 — 겹 수를 표시 칩으로 동기화한다 */
  function mirCap(){ return 2; }
  function mirSync(t){
    t.fx = t.fx.filter(f=> f.mir!==true);
    if((t.mir|0)>0) t.fx.push({name:`물그림자 ×${t.mir}`,kind:"b",turns:99,stat:null,val:0,mir:true});
  }
  function mirGain(t){
    const P = t.pas; if(!P || !P.mirage) return;
    t.mir = Math.min(mirCap(), (t.mir|0)+1); mirSync(t);
    push(`<b>${epiH(t.name)}</b> 물그림자 ${t.mir}겹`,"",t.uid);
  }
  function resolve(u, sk, foes, allies, isUlt){
    const p = skPow(u, sk) * (sk.kind==="basic" ? 1 : consOf(u).skill);
    const dur = skDur(u, sk);
    const tg = pickTarget(u, foes, allies, sk);
    if(!tg.length) return;
    const label = isUlt? `<b>${epiH(u.name)}</b> 필살기 — ${sk.name}!` : (sk.kind==="basic"? `<b>${epiH(u.name)}</b> ${sk.name}` : `<b>${epiH(u.name)}</b> 스킬 — ${sk.name}`);
    // 이 프레임에 "누구에게 무슨 이펙트" 를 실어 보낸다
    push(label, isUlt?"ult":"", u.uid,
      {n:sk.fx||null, e:sk.el||"phys", u:!!isUlt, s:sfxOf(u, sk), t:tg.filter(t=>t && t.alive).map(t=>t.uid)});
    frames[frames.length-1].call = {name:sk.name,kind:isUlt?"ult":sk.kind,pers:u.pers||"plain"};
    switch(sk.type){
      case "dmg": { tg.forEach(t=>{ if(!t.alive) return;
          dealDamage(u,t,p,sk);
          if(sk.atbCut && t.alive){ t.atb = Math.max(0, t.atb - 1000*sk.atbCut);
            push(`<b>${epiH(t.name)}</b> 행동 게이지 -${Math.round(sk.atbCut*100)}%`,"",u.uid); } });
        break; }
      case "dmg_multi": tg.forEach(t0=>{ for(let i=0;i<(sk.hits||2);i++){ const t=aliveOf(foes); if(!t.length)break; dealDamage(u, t0.alive?t0:pick(t), p, sk); } }); break;
      case "dmg_aoe": tg.forEach(t=> t.alive && dealDamage(u,t,p,sk)); break;
      case "dot": {
        const hit = [];
        tg.forEach(t=>{
          if(!t.alive) return;
          dealDamage(u,t,p*.8,sk);
          if(t.alive){ addFx(t,{name:sk.name,kind:"dot",turns:dur+1,val:eff(u,"atk")*p*.55,stat:null,
            heal:!!sk.drainDot, src:u.uid}); hit.push(t); }
        });
        if(hit.length) push(`${hit.length>1? `적 ${hit.length}인` : `<b>${epiH(hit[0].name)}</b>`} 중독 (${dur}턴)`,"",u.uid);
        break; }
      case "heal": {
        const h = Math.round(eff(u,"atk")*p*2.0*healMulOf(u));
        tg.forEach(t=>{ const b=Math.min(t.maxHp-t.hp,h); t.hp+=b; recHeal(u, b);
          let cl=null;
          if(sk.cleanse){ for(let c=0;c<sk.cleanse;c++){ const i=t.fx.findIndex(f=>f.kind==="d"||f.kind==="dot"); if(i<0) break; cl = t.fx.splice(i,1)[0].name; } }
          push(`<b>${epiH(t.name)}</b> 회복 ${fmt(b)}${cl?` · <b>${esc(cl)}</b> 해제`:""}`,"heal",u.uid,null,[{u:t.uid,v:b,k:"heal"}]); });
        break; }
      case "shield": {
        const sh = Math.round(eff(u, sk.scale||"def")*p*2.9);
        tg.forEach(t=>{ t.shield = sh; addFx(t,{name:"보호막",kind:"s",turns:dur+1,stat:null,val:0}); });
        push(`아군 ${tg.length}인 보호막 ${fmt(sh)}`,"heal",u.uid,null, tg.map(t=>({u:t.uid,v:sh,k:"shield"})));
        break; }
      case "buff": {
        tg.forEach(t=>{
          addFx(t,{name:sk.name,kind:"b",turns:dur+1,stat:sk.stat,mode:sk.stat==="crit"?"add":"mul",val:sk.stat==="crit"?p*.5:p,
                   regen:(sk.regen? sk.regen*(p/sk.power) : 0), src:u.uid});
          if(sk.leech) addFx(t,{name:sk.name+"·피흡",kind:"b",turns:dur+1,stat:"leech",mode:"add",val:sk.leech});
          if(sk.eva) addFx(t,{name:sk.name+"·회피",kind:"b",turns:dur+1,stat:"eva",mode:"add",val:sk.eva});
          if(sk.stat2 && sk.pow2){ const r2 = RATE_STAT.includes(sk.stat2);
            addFx(t,{name:sk.name+"·"+sk.stat2,kind:"b",turns:dur+1,stat:sk.stat2,mode:r2?"add":"mul",val: r2? sk.pow2*(p/sk.power) : p*(sk.pow2/sk.power)}); }
        });
        if(sk.atbSelf){ u.atb = Math.min(999, u.atb + 1000*sk.atbSelf); }
        push(`${tg.length>1?`아군 ${tg.length}인`:`<b>${epiH(tg[0].name)}</b>`} 강화 (${dur}턴)${sk.atbSelf?` · 행동 게이지 ${Math.round(sk.atbSelf*100)}% 회복`:""}`,"heal",u.uid);
        break; }
      case "taunt": {
        const t0 = tg[0];
        addFx(t0,{name:sk.name,kind:"d",turns:dur+1,stat:"calm",mode:"mul",val:-p,taunt:u.uid});
        push(`<b>${epiH(t0.name)}</b> 도발 — 침착성 ${Math.round(p*100)}% 저하 · <b>${epiH(u.name)}</b>에게 시선이 쏠린다 (${dur}턴)`,"",u.uid);
        break; }
      case "debuff": {
        const dm = RATE_STAT.includes(sk.stat) ? "add" : "mul";   // 명중·저항 등은 가산, 공격·속도 등은 곱연산
        tg.forEach(t=> addFx(t,{name:sk.name,kind:"d",turns:dur+1,stat:sk.stat,mode:dm,val:-p}));
        push(`적 ${tg.length}인 약화 (${dur}턴)`,"",u.uid);
        break; }
      case "haste": {
        tg.forEach(t=>{ t.atb = Math.min(999, t.atb + 1000*p); addFx(t,{name:sk.name,kind:"b",turns:dur+1,stat:"spd",mode:"mul",val:p*.6}); });
        push(`<b>${epiH(tg[0].name)}</b> 행동 게이지 +${Math.round(p*100)}%`,"heal",u.uid);
        break; }
      case "slow": {
        tg.forEach(t=>{ t.atb = Math.max(0, t.atb - 1000*p); addFx(t,{name:sk.name,kind:"d",turns:dur+1,stat:"spd",mode:"mul",val:-p*.5}); });
        push(`<b>${epiH(tg[0].name)}</b> 행동 게이지 -${Math.round(p*100)}%`,"",u.uid);
        break; }
      case "ult_single": tg.forEach(t=> t.alive && dealDamage(u, t, p + (sk.mirBonus? sk.mirBonus*(u.mir|0) : 0), sk)); if(sk.heal){ const h=Math.round(u.maxHp*sk.heal*.35); const h0=u.hp; u.hp=Math.min(u.maxHp,u.hp+h); recHeal(u, u.hp-h0); push(`<b>${epiH(u.name)}</b> 회복 ${fmt(h)}`,"heal",u.uid,null,[{u:u.uid,v:u.hp-h0,k:"heal"}]);} break;
      case "ult_aoe": { let tot = 0;
        tg.forEach(t=>{ if(t.alive) tot += dealDamage(u,t,p,sk); });
        if(!sk.noBreak) tg.forEach(t=> t.alive && addFx(t,{name:"방어 붕괴",kind:"d",turns:dur+1,stat:"def",mode:"mul",val:-.25}));
        if((sk.shieldSelf || sk.shieldDef) && tot>0){
          const sh = Math.round(tot*(sk.shieldSelf||0) + (sk.shieldDef? eff(u,"def")*sk.shieldDef : 0));
          u.shield += sh; u.shBy = u.uid;
          push(`<b>${epiH(u.name)}</b> 보호막 ${fmt(sh)} — 가른 만큼 몸을 두른다`,"heal",u.uid,null,[{u:u.uid,v:sh,k:"shield"}]);
        }
        if(sk.heal){ const h=Math.round(u.maxHp*sk.heal*.3); const h0=u.hp; u.hp=Math.min(u.maxHp,u.hp+h); recHeal(u, u.hp-h0); push(`<b>${epiH(u.name)}</b> 회복 ${fmt(h)}`,"heal",u.uid,null,[{u:u.uid,v:u.hp-h0,k:"heal"}]); }
        break; }
      case "drain": {
        let d = 0;
        tg.forEach(t=>{ if(t.alive) d += dealDamage(u,t,p,sk); });
        if(d>0){
          const low = aliveOf(allies).slice().sort((a,b)=> a.hp/a.maxHp - b.hp/b.maxHp)[0];
          if(low){ const h=Math.round(d*(sk.drain||.7)*healMulOf(u)), ab=Math.min(low.maxHp-low.hp,h); low.hp+=ab; recHeal(u, ab);
            push(`<b>${epiH(low.name)}</b> 흡수 회복 ${fmt(ab)}`,"heal",u.uid,null,[{u:low.uid,v:ab,k:"heal"}]); }
        }
        break; }
      case "ult_drain": {
        let tot=0;
        tg.forEach(t=>{ if(t.alive) tot += dealDamage(u,t,p,sk); });
        const hh=Math.round(tot*(sk.drain||.35));
        if(hh>0){ const pp=[];
          aliveOf(allies).forEach(a=>{ const h0=a.hp; a.hp=Math.min(a.maxHp,a.hp+hh); recHeal(u, a.hp-h0); if(a.hp>h0) pp.push({u:a.uid,v:a.hp-h0,k:"heal"}); });
          push(`아군 전체 ${fmt(hh)} 흡수 회복`,"heal",u.uid,null,pp); }
        break; }
      case "ult_bless": {
        const kk = p/sk.power;
        const am = (sk.atkMul!=null? sk.atkMul : .4)*kk, sm = (sk.spdMul!=null? sk.spdMul : .28)*kk, ug = (sk.ultGive|0);
        tg.forEach(t=>{
          if(am) addFx(t,{name:sk.name,kind:"b",turns:dur+1,stat:"atk",mode:"mul",val:am});
          if(sm) addFx(t,{name:sk.name+"·속도",kind:"b",turns:dur+1,stat:"spd",mode:"mul",val:sm});
          if(ug) t.ult = clamp(t.ult+ug,0,100);
        });
        { const pt=[];
          if(am) pt.push(`공격 +${Math.round(am*100)}%`);
          if(sm) pt.push(`속도 +${Math.round(sm*100)}%`);
          if(ug) pt.push(`필살 게이지 +${ug}`);
          push(`아군 전체 ${pt.join(" · ")}`,"heal",u.uid); } break; }
      case "ult_guard": {
        const h=Math.round(eff(u,"atk")*p*1.9*healMulOf(u)), sh=Math.round(eff(u,"def")*p*2.9);
        { const pp=[];
          tg.forEach(t=>{ const h0=t.hp; t.hp=Math.min(t.maxHp,t.hp+h); recHeal(u, t.hp-h0); t.shield=Math.max(t.shield,sh);
            if(t.hp>h0) pp.push({u:t.uid,v:t.hp-h0,k:"heal"});
            pp.push({u:t.uid,v:sh,k:"shield"});
            addFx(t,{name:"성역",kind:"b",turns:dur+1,stat:"def",mode:"mul",val:.35}); });
          push(`아군 전체 회복 ${fmt(h)} · 보호막 ${fmt(sh)} · 방어 강화`,"heal",u.uid,null,pp); } break; }
      case "ult_heal": {
        const h=Math.round(eff(u,"atk")*p*2.9*healMulOf(u));
        { const pp=[]; const back=[];
          tg.forEach(t=>{ const h0=t.hp; t.hp=Math.min(t.maxHp,t.hp+h); recHeal(u, t.hp-h0); if(t.hp>h0) pp.push({u:t.uid,v:t.hp-h0,k:"heal"});
            t.fx=t.fx.filter(f=>f.kind!=="d"&&f.kind!=="dot"); });
          /* 부활 — 쓰러진 아군을 일으킨다 (전투당 1인 1회) */
          if(sk.revive) (allies||[]).forEach(t=>{
            if(t.alive || t.revived) return;
            t.revived = true; t.alive = true; t.fx = []; t.shield = 0; t.mir = 0; t.atb = 0;
            t.hp = Math.min(t.maxHp, h); recHeal(u, t.hp);
            pp.push({u:t.uid,v:t.hp,k:"heal"}); back.push(epiH(t.name));
          });
          push(`아군 전체 회복 ${fmt(h)} · 약화 해제${back.length? ` · <b>${back.join("</b>, <b>")}</b> 다시 일어선다`:""}`,"heal",u.uid,null,pp); } break; }
      case "regen": {
        tg.forEach(t=>{ if(!t.alive) return;
          addFx(t,{name:sk.name,kind:"b",turns:dur+1,stat:null,val:0,regen:p,src:u.uid}); });
        push(`${tg.length>1?`아군 ${tg.length}인`:`<b>${epiH(tg[0].name)}</b>`} 지속 회복 — 차례마다 최대 체력 ${Math.round(p*100)}% (${dur}턴)`,"heal",u.uid);
        break; }
      case "charge": {
        const g = sk.ultGive|0;
        u.ult = clamp(u.ult + g, 0, 100);
        push(`<b>${epiH(u.name)}</b> 필살 게이지 +${g}`,"heal",u.uid);
        break; }
      case "ult_unseal": {
        const kk = p/sk.power, v = (sk.unseal!=null? sk.unseal : .1)*kk, ag = (sk.atbGive!=null? sk.atbGive : .3);
        addFx(u,{name:sk.name,kind:"b",turns:dur+1,stat:null,mode:"mul",val:v,allT:true,
                 stats:["atk","def","spd","crit","critDmg","acc","eva","skAcc","skRes","leech"]});
        u.atb = Math.min(1999, u.atb + 1000*ag);
        push(`<b>${epiH(u.name)}</b> 봉인 해제 — 모든 능력 +${Math.round(v*100)}% · 단일 기술이 전체로 · 행동 게이지 +${Math.round(ag*100)}% (${dur}턴)`,"heal",u.uid);
        break; }
      case "ult_time": {
        tg.forEach(t=>{ t.atb = 0; });
        aliveOf(allies).forEach(a=> a.ult = clamp(a.ult+30,0,100));
        push(`적 전체 행동 정지 · 아군 필살 게이지 +30`,"heal",u.uid); break; }
    }
  }
  return {winner, frames, acts:totalActs, A, B,
    formA: (opt.formA && FORMS[opt.formA])? opt.formA : null,
    formB: (opt.formB && FORMS[opt.formB])? opt.formB : null,
    plusA: !!opt.plusA, plusB: !!opt.plusB, slotsB: opt.slotsB||null,
    names:all.map(u=>{
    const us = (u.skills||JOBS[u.job].skills).find(x=>x.kind==="ult");
    return {name:u.name,job:u.job,side:u.side,lv:u.lv,row:u.row,ult:us?us.name:"필살기"};
  })};
}

function newGame(name){

  try{ leagueNewId(); }catch(e){}
  S = {
    v:1, acadName: name || (pick(ACAD)+" 용사 학원"),
    master:{name:"마스터", lead:0, info:0, net:0, pts:6},
    tier:1, fame:0, gold:5000, sp:0, debt:DEBT_START, debtV:1, bank:{repay:0}, jobUnlock:0, actUnlock:0, jobN:{}, jobEv:{}, diet:"plain",
    year:1, phase:"spring", week:0,
    students:[], graduates:[], log:[],
    facil:{expand:0,gym:0,hall:0,chapel:0,infirm:0,library:0,arena:0,counsel:0}, facilV:FACIL_VER, shopUnlock:0,
    items:{}, church:{}, epiUsed:[], epiLog:[], focusPrev:null, focusHist:[], books:0, scouts:null, incoming:[], history:[], opts:{report:true, fxA:FX_A_DEFAULT}, mission:newMission(), relicPool:[], skillPool:[],
    lastTour:null
  };

  const byRole = r => JOB_KEYS.filter(j=> JOBS[j].role===r && !JOBS[j].mon);
  const jobs = shuffle(["paladin", pick(byRole("dps")), pick(byRole("heal"))]);
  const un=[];
  const startGrade = ()=> wchoose({D:30, C:40, B:23, A:7});   // 개교 시점에는 S급이 오지 않는다
  const startEval = base => Math.max(0, base + ri(-10,10));
  for(let i=0;i<3;i++){ const st=newStudent(1, startGrade(), jobs[i%jobs.length]); st.note = pickUnique(ENROLL_NOTE, un); S.students.push(st); }
  S.students.forEach(st=> st.cond = 100);
  handInit();
  S.teams = newTeams();
  S.teams.forEach((t,i)=>{ t.form = FORM_KEYS[i % FORM_KEYS.length]; });
  S.teamCap = 1;
  autoFillAllTeams();
  logE(`<b>${S.acadName}</b> 개교 — 1학년 <b>3명</b>이 입학했다. 전원 컨디션 100으로 첫 학기를 연다.`,"big");
  logE(`남은 학생이 셋뿐이라 팀은 <b>하나</b>다. 학생이 셋 늘 때마다 팀을 하나씩 더 짤 수 있다.`,"");
  logE(`<b>${TIERS[0].n}</b> 학원이다. 가을 시내 대회와 봄 신인전이 첫 무대가 된다.`,"");
}

  net: {n:"호소력", s:"스카우트 · 자금",      d:"스카우트 성공률 포인트당 +5%p · 모든 자금 획득량 포인트당 2% 증가 · 상담 멘탈리티 상승폭이 2배가 될 확률 포인트당 +4%p"}
};
/* 마스터 포인트 — 확정 전까지는 임시 배분 */
function mpDraft(){ if(!UI.mpDraft) UI.mpDraft = {lead:0, info:0, net:0}; return UI.mpDraft; }
function mpSpent(){ const d=mpDraft(); return d.lead+d.info+d.net; }
function mpAvail(){ return Math.max(0, (S.master.pts||0) - mpSpent()); }
function mpVal(k){ return S.master[k] + mpDraft()[k]; }
function mpClear(){ UI.mpDraft = {lead:0, info:0, net:0}; }
function mpCommit(){
  const d = mpDraft(), n = mpSpent();
  if(!n) return false;
  ["lead","info","net"].forEach(k=>{ S.master[k] = Math.min(MASTER_MAX, S.master[k] + d[k]); });
  S.master.pts = Math.max(0, S.master.pts - n);
  const txt = ["lead","info","net"].filter(k=>d[k]).map(k=>`${MASTER_INFO[k].n} +${d[k]}`).join(" · ");
  logE(`마스터 육성 — ${txt}`,"good");
  mpClear(); save();
  toast(`육성 확정 — ${txt}`);
  return true;
}
function masterRow(k, attr){
  const M = MASTER_INFO[k], d = mpDraft()[k];
  const full = mpVal(k) >= MASTER_MAX, can = mpAvail()>0 && !full;
  return `<div class="mrow" title="${esc(M.d)}">
    <span class="mn">${M.n}</span><span class="md">${M.s}</span>
    <span class="mv num">${S.master[k]}${d? `<span style="color:var(--brass)"> +${d}</span>`:""} / ${MASTER_MAX}</span>
    <button class="btn sm" ${attr}-minus="${k}" ${d?"":"disabled"}>−</button>
    <button class="btn sm" ${attr}="${k}" ${can?"":"disabled"}>+</button></div>`;
}
function masterConfirmRow(idOk, idNo){
  const n = mpSpent();
  return `<div class="btnrow" style="margin-top:8px">
    <button class="btn sm primary" id="${idOk}" ${n?"":"disabled"}>확정 ${n? `(${n}점)`:""}</button>
    <button class="btn sm ghost" id="${idNo}" ${n?"":"disabled"}>되돌리기</button>
    <span class="hint" style="font-size:11.5px;color:var(--dim)">잔여 ${mpAvail()}pt</span></div>`;
}
function addGold(n){ S.gold += Math.round(n * (1 + S.master.net*.02)); }
function infoMulOf(mi){ return 1 + clamp(mi|0, 0, MASTER_MAX)*.02; }
function infoBattleMul(){ return infoMulOf(S.master.info); }
function tierOf(){ return TIERS[S.tier-1]; }
function checkTier(){
  for(let i=TIERS.length-1;i>=0;i--){
    if(S.fame>=TIERS[i].fame && S.tier<TIERS[i].id){
      S.tier = TIERS[i].id;
      logE(`학원 승급 — <b>${TIERS[i].n}</b>${ro(TIERS[i].n)} 인정받았다. ${TIERS[i].d}`,"big");
      return true;
    }
  }
  return false;
}
/* 한 번 넘어선 명성 구간 아래로는 떨어지지 않는다 */
const FAME_MARKS = [
  {f:400,   t:"백작 인가",
   m:"학원이 대중의 입에 오르내리고 백작에게 정식으로 인가를 받았다."},
  {f:900,   t:"공국 인가",
   m:"학원의 이름이 전역에 퍼지며 진동한다. 공작에게 인가를 받아 강호 학원들의 한 축으로 거듭났다."},
  {f:2600,  t:"왕국 인가",
   m:"학원의 이름은 이미 왕국을 넘어 모르는 나라가 없을 정도로 유명해졌다. 왕국 공인 학원으로 거듭났다."},
  {f:10000, t:"초명문",
   m:"인간계를 넘어 마계와 천계에서 주시하기 시작한다..."}
];
function fameFloor(){ return S.fameFloor|0; }
function addFame(n){
  S.fame = Math.max(0, S.fame + Math.round(n));
  FAME_MARKS.forEach(M=>{
    if(S.fame >= M.f && fameFloor() < M.f){
      S.fameFloor = M.f;
      queueCeremony({type:"fame", year:S.year, mark:M});
    }
  });
  S.fame = Math.max(S.fame, fameFloor());
  checkTier();
}

function setCond(st, v){ st.cond = Math.round(clamp(v, 0, 100)); return st.cond; }
const COND_HI = 70, COND_MID = 40;
function condEff(c){
  if(c>=COND_HI)  return {mul:1.0, pct:100, tone:"ok"};
  if(c>=COND_MID) return {mul:.6,  pct:60,  tone:"warn"};
  return {mul:.2, pct:20, tone:"bad"};
}

/* ============================================================
   부상
   ------------------------------------------------------------
   · 훈련 실패 시에만 발생 (컨디션 70 이상은 실패하지 않는다)

const TRAIN_FAIL_MUL = .25;   // 훈련 실패 시 성장/경험치 배율

  if(resting) return 1;                        // 휴식 주간은 +1.0 → 항상 성공

/* ══════ 식단 (0929) ══════

const DIETS = [

  {k:"balanced", n:"균형 잡힘", price:40, eff:.10, need:["tavern",1]},

function dietOpen(d){ return !d.need || jobEvLv(d.need[0]) >= d.need[1]; }
function dietDef(){ const d = DIETS.find(x=> x.k===S.diet); return (d && dietOpen(d)) ? d : DIETS[0]; }

function doFocus(st, dayMul, condMul){
  const f = focusOf(st);
  if(!f) return false;
  if(st.cond < 25) return false;   // 지쳐 있으면 개인 훈련은 거른다
  if(isInjured(st)) return false;  // 부상 중에는 개인 집중 훈련도 불가
  const m = dayMul || 1, cm = (condMul==null ? m : condMul);
  const g = {}; for(const k in f.gains) g[k] = f.gains[k]*m;
  trainStudent(st, Object.assign({}, f, {gains:g, cond:f.cond*cm}), true,
    {noExp:true, noRecover:true, mul: rivalFocusMul(st)});
  return true;
}
function trainStudent(st, tr, success, opt){
  opt = opt||{};
  const gains = tr.gains||{};
  const potM = .55 + st.ment.pot/100*.95;
  const condM = condEff(st.cond).mul;
  const leadM = 1 + S.master.lead*.035;
  const fM = facMul(tr.fac);
  const partM = success ? 1 : TRAIN_FAIL_MUL;
  const dietM = tr.id === "job" ? 1 : dietMul();      // 식단 (0929) — 의뢰는 훈련이 아니다
  let notable = null;
  for(const k in gains){
    const top = mentCapOf(st, k);         // 이 학생의 이 항목 한계
    const cur = st.ment[k];
    const room = cur >= top ? 0 : clamp(1 - (cur-10)/mentGrowCap(st, k), .09, 1);
    let d = 2.4*gains[k]*potM*condM*leadM*fM*partM*dietM*room*rnd(.7,1.35)*(opt.mul||1);
    if(cur >= MENT_SOFT) d *= MENT_OVER_G;   // 한계를 넘어선 구간은 더디다
    st.ment[k] = clamp(st.ment[k] + d, 1, top);
    if(d>.9 && (!notable || d>notable.d)) notable={k,d};
  }
  if(!opt.noExp){
    if(!tr.rest){
      const xp = ((tr.special==="camp"? 132 : 88) + st.level*7) * (opt.xpMul||1);
      st._up = (st._up||0) + gainExp(st, xp*(success?1:TRAIN_FAIL_MUL), true);
    } else st._up = 0;
  }
  let c = tr.cond * (success?1:.5);
  if(tr.rest) c *= tonicMul();
  setCond(st, st.cond - c);
  if(!opt.noRecover) setCond(st, st.cond + (S.facil.infirm|0)*(opt.recMul||1));
  return notable;
}

const CAMP_GAIN = 3, CAMP_COND = 3;   // 여름 합숙 — 효과 ×3 · 컨디션 소모 ×3 (휴식 회복도 ×3)
function isCampWeek(){ return S.phase==="summer"; }   // 여름 방학 — 6주 내내 합숙
/* 휴식 계열 스케줄의 회복량 (이미 요일 배율이 반영된 훈련을 받는다) */
function restWeekGain(tr){
  if(!tr || !tr.rest) return 0;
  return -tr.cond * tonicMul() + (S.facil.infirm|0)*DAY_MUL;
}
function doRestFocus(s, tr){
  setCond(s, s.cond + Math.max(restFocusGain()*DAY_MUL, restWeekGain(tr)));

/* 카드 한 장을 하루치 훈련으로 환산 */
function dayTrOf(tr, bonus, mark){
  const camp = isCampWeek(), cg = camp? CAMP_GAIN : 1, cc = camp? CAMP_COND : 1;
  const mm = (mark && mark.mul) || 1;               // 카드 표식 — 두 배 / 절반
  const g = {};
  for(const k in (tr.gains||{})) g[k] = tr.gains[k] * DAY_MUL * (1+bonus) * cg * mm;
  return Object.assign({}, tr, {
    gains: g,
    cond: tr.cond * DAY_MUL * (tr.rest ? (1+bonus)*cc : cc),   // 합숙 중에는 휴식 회복도 ×CAMP_COND
    _xpMul: DAY_MUL * (1+bonus) * cg * mm
  });
}

let DAYLOG = [];
function dlog(t, k){ DAYLOG.push({t:t, k:k||""}); }

/* 멘탈리티는 소수로 쌓이고 화면에는 반올림해서 보여준다.

function mentCross(snap, who){

    MENTAL.forEach(m=>{
      if(m.k==="pot") return;
      const d = Math.round(s.ment[m.k]) - Math.round(b.ment[m.k]);
      if(d>=1) out.push({s:s, n:m.n, d:d});
    });
  });

}
function chainTag(bonus){

function dayRun(tr0, bonus, day, opt){
  opt = opt||{};

  S.students.forEach(s=>{

  {
    const seen = new Set();
    S.students.forEach(s=>{
      if(seen.has(s.id) || (skip && skip.has(s.id))) return;
      const r = rivalOf(s);
      if(!r || seen.has(r.id) || (skip && skip.has(r.id))) return;
      seen.add(s.id); seen.add(r.id);
      if(actOf(s)==="auto" && actOf(r)==="auto" && s._act!=="rest" && r._act!=="rest" && s._act!=="none" && r._act!=="none") r._act = s._act;
      if(s._act==="train" && r._act==="train"){ const k = pairWeakestMent(s, r); s._fk = k; r._fk = k; }
      else if(r._act!=="train") r._fk = null;
      else if(!r._fk) r._fk = weakestMent(r);
    });
  }
  if(opt.charge){
    const n = S.students.filter(s=> !(skip && skip.has(s.id)) && s._act!=="rest").length;
    dayCharge(cardCost(opt.charge) * n);
  }
  S.students.forEach(s=>{

    if(s._act==="rest"){ doRestFocus(s, tr); rested++; sceneStatus[s.id]="rest"; return; }

    const g = Math.round(Math.max(0, S.students.reduce((a,s)=> a + (s.cond - snap[s.id].cond), 0) / Math.max(1,S.students.length)));
    dlog(`전체 컨디션 <b style="color:var(--ok)">${g}</b> 상승${rested? ` · 휴식 ${rested}명 별도 회복`:""}`, "sub");
  } else {
    dlog(opt.head || `${D}요일 훈련으로 <b>${tr.n}</b>${eulr(tr.n)} 단련했다!${chainTag(bonus)}`, "head");
    const cd = Math.round(trained.reduce((a,s)=> a + (snap[s.id].cond - s.cond), 0) / Math.max(1,trained.length));
    const xp = Math.round(expSum / Math.max(1,trained.length));
    dlog(`전체 컨디션 ${cd>0? `<b style="color:var(--bad)">${cd}</b> 하락`: cd<0? `<b style="color:var(--ok)">${-cd}</b> 상승`:"유지"}, 경험 <b>${fmt(xp)}</b> 획득${
      (active-parts)>0? ` · <span style="color:var(--bad)">훈련 실패 ${active-parts}명</span>`:""}${
      hurt? ` · <b style="color:var(--bad)">부상 ${hurt}명</b>`:""}`, "sub");
  }
  if(mark && mark.cond){
    S.students.forEach(x=>{ x.cond = clamp(x.cond + mark.cond, 0, 100); });
    dlog(`<b style="color:${mark.c}">${mark.i} ${mark.n}</b> — 전원 컨디션 <b style="color:${mark.c}">${mark.cond>0?"+":""}${mark.cond}</b>`, "note");
  }
  if(mark && mark.mul !== 1){
    dlog(`<b style="color:${mark.c}">${mark.i} ${mark.n}</b> — 이날 훈련 효과 <b style="color:${mark.c}">${mark.mul>1? "두 배":"절반"}</b>`, "note");
  }
  // 훈련 성과 — 정수 자리가 오른 멘탈리티
  {
    const cs = mentCross(snap, trained);
    const g = {};
    cs.forEach(x=>{ const k = x.n+"|"+x.d; (g[k]=g[k]||[]).push(dnH(x.s)); });
    const keys = Object.keys(g);
    if(keys.length) keys.forEach(k=>{
      const [n,d] = k.split("|");
      dlog(`${g[k].join(", ")}의 <b>${n}</b> ${d} 상승`, "sub");
    });
    else if(!resting){
      const fine = [];
      trained.forEach(s=> MENTAL.forEach(m=>{
        if(m.k==="pot") return;
        const d = s.ment[m.k] - snap[s.id].ment[m.k];
        if(d>=.05) fine.push({s:s, n:m.n, d:d});
      }));
      fine.sort((a,b)=>b.d-a.d);
      if(fine.length) dlog(`${fine.slice(0,3).map(x=>`${dnH(x.s)} <b>${x.n}</b> +${x.d.toFixed(1)}`).join(", ")}`, "sub");
      else dlog(`<span style="color:var(--dim)">눈에 띄는 변화 없이 기초가 쌓였다.</span>`, "sub");
    }
  }
  // 오후 — 개인 행동 (훈련 · 의뢰)
  reportRecord(day, tr, bonus, "am", snap, S.students.filter(s=>!skip || !skip.has(s.id)), sceneStatus, sceneLogStart);
  if(!resting){
    const fs = mentSnap();
    const focusLogStart = DAYLOG.length;
    const jobWho = [];
    let J = null, pay = 0;
    S.students.forEach(s=>{
      if(skip && skip.has(s.id)) return;
      if(s._act==="train"){
        const cmp = isCampWeek();
        if(doFocus(s, DAY_MUL*(cmp?CAMP_GAIN:1), DAY_MUL*(cmp?CAMP_COND:1))){ foc++; focWho.push(s); }
      } else if(s._act==="job"){
        J = J || weekJob(day);
        const g = doJob(s, J);
        if(g){ pay += g; jobWho.push(s); if(UI.wrun) UI.wrun.jobPay = (UI.wrun.jobPay||0) + g; }
      }
    });
    if(foc){
      dlog(`오후 개인 행동 — <b>훈련</b> ${foc}명이 각자 가장 약한 분야를 단련했다!`, "head2");
      const cs = mentCross(fs, focWho);
      if(cs.length) cs.forEach(x=> dlog(`${dnH(x.s)} <b>${x.n}</b> ${x.d} 증가`, "sub"));
      else {
        const fine = [];
        focWho.forEach(s=> MENTAL.forEach(m=>{
          if(m.k==="pot") return;
          const d = s.ment[m.k] - fs[s.id].ment[m.k];
          if(d>=.05) fine.push({s:s, n:m.n, d:d});
        }));
        fine.sort((a,b)=>b.d-a.d);
        dlog(fine.length? fine.slice(0,3).map(x=>`${dnH(x.s)} <b>${x.n}</b> +${x.d.toFixed(1)}`).join(", ")
          : `<span style="color:var(--dim)">${foc}명이 각자의 분야를 조금씩 다듬었다.</span>`, "sub");
      }
      reportRecord(day, tr, bonus, "pm", fs, focWho, {}, focusLogStart);
    }
    if(jobWho.length){
      const jobLogStart = DAYLOG.length;
      dlog(`오후 개인 행동 — <b>의뢰 · ${J.n}</b> ${jobWho.length}명 · 보수 <b style="color:var(--brass)">+${fmt(pay)} G</b>`, "head2");
      const lines = [];
      jobWho.forEach(s=>{
        const b = fs[s.id], ch = [];
        [J.up, J.down].forEach(k=>{ const d = Math.round(s.ment[k]) - Math.round(b.ment[k]); if(d) ch.push(`<b>${mentName(k)}</b> ${d>0?"+":""}${d}`); });
        if(ch.length) lines.push(`${dnH(s)} ${ch.join(" · ")}`);
      });
      dlog(lines.length? lines.join(", ")
        : `<span style="color:var(--dim)">${mentName(J.up)}은(는) 조금 오르고 ${mentName(J.down)}은(는) 조금 내렸다.</span>`, "sub");
      const st = {}; jobWho.forEach(s=> st[s.id] = "job");
      reportRecord(day, tr, bonus, "pm", fs, jobWho, st, jobLogStart,
        {facility:UI.wrun ? UI.wrun.jobFac : "hall", reward:`${J.n} 보수 +${fmt(pay)} G`, job:J.k, jobIntro: !!(UI.wrun && UI.wrun.jobDay===day)});
    }
  }
}

function weekRunGo(quick){
  const ph = PHASES[S.phase];
  /* 치르지 않은 대회가 남아 있으면 주차부터 넘길 수 없다 */
  if(UI.pendingTour && UI.tour){
    UI.tour._prepOpen = true;
    renderTournament();
    if(!quick) toast(`${UI.tour.title||"대회"}부터 치러야 한다.`);
    return;
  }
  if(S.week >= ph.weeks){
    if(UI.pendingTour){ renderTournament(); return; }
    logE(`학사 일정 정리 — ${ph.n} 일정이 모두 끝나 시즌을 마무리한다.`,"");
    endPhase(); save(); render(); return;
  }
  if(!S.opts) S.opts = {report:true};
  if(!slotsFull()){
    if(quick) autoFillSlots();
    else { toast("월요일부터 금요일까지 다섯 칸을 모두 채워야 한다."); return; }
  }
  /* 훈련 비용이 모자라도 진행한다 — 자금은 마이너스(빚)로 내려갈 수 있다 (0926) */
  if(!quick && S.master.pts>0 && !UI.skipPtWarn){ masterPointModal(1); return; }
  if(!quick && !UI.skipRestWarn && restWasteList().length){ restWasteModal(); return; }
  /* 원정 카드를 처음 넣고 주를 돌리는 순간 — 원정 안내를 한 장 띄우고 이어서 진행한다 */
  if(!quick && !tutSeen("6") && (S.slots||[]).some(c=> c && TR[c.t] && TR[c.t].special==="exped")){
    tutOnePage("6", ()=> weekRunGo(quick));
    return;
  }
  DAYLOG = []; RUN = {expeds:[]}; FIN = {upkeep:0, interest:0};
  S.students.forEach(x=>{ x._att=0; x._miss=0; x._exp=0; x._up=0; });
  focusHistPush();
  UI.wrun = {quick:!!quick, day:0, days:S.slots.slice(),
    snap:snapStudents(), startWeek:S.week, startPhase:S.phase, startYear:S.year,
    g0:S.gold, f0:S.fame, r0:(S.relicPool||[]).length, jobOn0:jobUnlocked()};
  { const dc = dietCostWeek();                      // 식단 — 주를 시작할 때 한 번에 낸다 (0929)
    if(dc){ S.gold -= dc; UI.wrun.diet = dc; UI.wrun.dietN = dietDef().n; } }
  if(isCampWeek()) dlog(`<b>합숙 기간</b> — 이번 주 훈련 효과가 크게 오르지만 컨디션 소모도 크다.`, "note");
  weekRunStep();
}
function weekRunStep(){
  try{ weekRunStepGo(); }
  catch(e){
    errPush("week", e.message, e.stack);
    UI.wrun = null; modalEscape();
    toast("주간 진행 중 문제가 생겼다 — 화면 위 안내를 확인해 주세요.");
    render();
  }
}
function weekRunStepGo(){
  const R = UI.wrun; if(!R) return;
  while(R.day < WEEK_DAYS){
    const card = R.days[R.day];
    const tr = (card && TR[card.t]) || TR.free;
    /* 일과 비용은 그날 스케줄에 실제로 나온 학생 수만큼 (0929) — 부상 · 개인 행동으로 쉰 학생은 내지 않는다.
       원정은 떠난 인원만큼 (expedDone), 나머지는 dayRun 안에서 아침에 할 일이 정해진 뒤에 낸다 */
    const bonus = chainOf(R.days, R.day);
    const mark = markOf(card);
    if(tr.special==="exped"){ expedDay(R, bonus); return; }   // 팝업으로 넘어간다
    dayRun(tr, bonus, R.day, {mark:mark, charge:card});
    dlog("", "gap");
    R.day++;
  }
  weekRunEnd();
}
function weekRunEnd(){
  const R = UI.wrun; if(!R) return;
  UI.wrun = null;
  UI.skipRestWarn = false;        // 다음 주에는 다시 물어본다
  // 쓴 카드는 버리고 새로 다섯 장 — 한 주가 지났으니 손패도 한 주 늙고, 다 늙은 카드는 사라진다
  S.slots = Array(WEEK_DAYS).fill(null);
  S.weekSeq = (S.weekSeq|0) + 1;
  handExpire();
  tickInjury();
  tryBonds();
  tryPortalLetter();
  tryGuildJob();
  tryJobGrade();
  tryJobEvents();
  tryValentine();
  trySparkler();
  tryFriendly();
  tryCounsel();
  tryEvolve();
  const dealt = handRefill();
  const finish = ()=>{
    tryMarkTut();
    levelReport(S.students.map(s=>({s:s, n:s._up||0})));
    const acts = R.days.map(c=> (TR[c.t]||TR.free).n);
    logE(`${R.startWeek+1}주 — ${acts.join(" · ")}${R.cost? ` · 훈련 비용 <b>-${fmt(R.cost)} G</b>`:""}${R.diet? ` · 식단(${esc(R.dietN||"")}) <b>-${fmt(R.diet)} G</b>`:""}`, "");
    if(!R.quick) weekReport(R);
    else if(!UI.pendingTour && (UI.ceremonies||[]).length) showCeremony();
    save();
  };
  {
    const sl = FRIENDLY_PHASES[S.phase] ? friendlySlotAt(S.week) : null;
    if(sl){ S.week++; startFriendly(sl); finish(); return; }
  }
  S.week++;
  if(S.phase==="fall" && S.fallRun && S.fallRun.alive && S.week < PHASES.fall.weeks){
    const cfg = LADDER[S.fallRun.step];
    if(cfg && S.week === cfg.week){ startLadder(S.fallRun.step); finish(); return; }
  }
  if(S.week >= PHASES[S.phase].weeks){ endPhase(); }
  finish();
}
function weekReport(R){
  const ranTo = (S.phase===R.startPhase && S.year===R.startYear) ? S.week : PHASES[R.startPhase].weeks;
  const F = FIN || {upkeep:0, interest:0};
  const fin = {g0:R.g0, train:R.cost||0, diet:R.diet||0, job:R.jobPay||0, upkeep:F.upkeep, interest:F.interest, depInt:F.depInt||0, g1:S.gold - (F.later||0), repaid:repayDone(), jobOn:!!R.jobOn0};
  fin.other = fin.g1 - fin.g0 - (fin.job - fin.train - fin.diet - fin.upkeep - fin.interest + fin.depInt);   // 원정 수입 · 구매 등
  FIN = null;
  showReport({snap:R.snap, startWeek:R.startWeek, ranTo:ranTo, startPhase:R.startPhase, startYear:R.startYear,
    acts: R.days.map(c=>({n:(TR[c.t]||TR.free).n})),
    daylog: DAYLOG.slice(), scenes: R.scenes || [],
    gold:S.gold-R.g0, fame:S.fame-R.f0, relics:(S.relicPool||[]).length-R.r0, fin});
}
function runWeek(){ weekRunGo(true); }
function runWeeks(n){
  for(let i=0;i<n;i++){
    if(UI.pendingTour) break;
    const before = S.phase+S.year;
    if(weekRunGo(true) === false) break;     // 자금 부족 등으로 시작하지 못했다
    if(UI.pendingTour) break;
    if(S.phase+S.year !== before) break;
  }
  render();
}

function dl(v, unit, digits){

  return `<span style="color:${c};font-weight:600">${v>0?"+":"−"}${t}${unit||""}</span>`;
}

function reportRecord(day, tr, bonus, phase, before, members, status, logStart, extra){
  if(!UI.wrun) return;
  const groups = {};
  members.forEach(s=>{
    const fac = extra?.facility || (phase==="pm" ? FOCUS_FAC[s._fk] : status[s.id]==="rest" ? "infirm" : tr.fac) || "gym";
    (groups[fac] ||= []).push(s);

  const scenes = UI.wrun.scenes ||= [];
  Object.entries(groups).forEach(([facility, group])=> scenes.push({
    day, season:UI.wrun.startPhase || S.phase, training:tr.n, trainingId:tr.id, color:cardColor(UI.wrun.days?.[day] || tr.id).c, bonus, phase, facility,
    logs:DAYLOG.slice(logStart), reward:extra?.reward || "", job:extra?.job || null, jobIntro:!!extra?.jobIntro,
    students:group.map(s=>{
      const old=before[s.id], changes=[];

          if(m.k==="pot")return;
          const from=Math.round(old.ment[m.k]), to=Math.round(s.ment[m.k]), d=to-from;
          if(d) changes.push({label:m.n,from,to,value:d,kind:d>0?"gain":"loss"});

        if(cond)changes.push({label:"컨디션",from:Math.round(old.cond),to:Math.round(s.cond),value:cond,kind:cond>0?"heal":"loss"});
        const xp=Math.round(s.totalExp||0)-Math.round(old.exp);

        state:status[s.id] || (phase==="pm"?"focus":"returned"),changes};
    })

}

function reportBeachPositions(){
  // Presentation-only randomness; never consume the simulation's random stream.
  const slots=REPORT_LAYOUTS.beach.slots, keys=crypto.getRandomValues(new Uint32Array(slots.length));
  const candidates=slots.map((slot,i)=>({slot,key:keys[i]})).sort((a,b)=>a.key-b.key), chosen=[];
  for(const {slot} of candidates){
    // One position per column keeps sprites and growth labels from overlapping.
    if(chosen.every(p=>Math.abs(p[0]-slot[0])>=12))chosen.push(slot);
    if(chosen.length===REPORT_LAYOUTS.beach.capacity)break;
  }
  return chosen;
}
// Keep full records for the text report, but never tour every focus/rest facility.
function reportScenesForPlayback(records){
  const out=[];
  [...new Set(records.map(s=>s.day))].sort((a,b)=>a-b).forEach(day=>{
    let daily=records.filter(s=>s.day===day);
    // Merge summer training/rest groups into one beach per phase, without changing gains.
    const summer=daily.filter(s=>s.season==="summer" && s.phase!=="exped");
    if(summer.length){
      daily=daily.filter(s=>!summer.includes(s));
      for(const phase of ["am","pm"]){
        const group=summer.filter(s=>s.phase===phase);
        if(group.length)daily.push({...group[0],facility:"beach",
          students:group.flatMap(s=>s.students.map(x=>({...x,trainingFacility:s.facility}))) });
      }
    }
    const morning=daily.filter(s=>s.phase!=="pm"), afternoon=daily.filter(s=>s.phase==="pm");
    const choose=list=>list.slice().sort((a,b)=>b.students.length-a.students.length)[0];
    const am=morning.find(s=>s.phase==="exped") || choose(morning.filter(s=>s.students.some(x=>x.state!=="rest"))) || choose(morning);
    const pm=afternoon.find(s=>s.jobIntro) || choose(afternoon);
    if(am)out.push(am);
    if(pm)out.push(pm);
  });
  return out;
}

  root.querySelectorAll("[data-dr-speed]").forEach(b=>b.onclick=()=>{speed=+b.dataset.drSpeed;PREF.reportSpeed=speed;prefSave();sync();});
  UI._drPause=()=>{if(disposed)return;paused=true;sync();};
  $("#dlSkip").onclick=()=>{full=!full;paused=true;$("#drFullLog").hidden=!full;$("#dlSkip").textContent=full?"전체 기록 접기":"한 번에 보기";sync();if(full)finPopupShow();if(full)$("#drFullLog").scrollIntoView({block:"start",behavior:reduced?"instant":"smooth"});};
  $("#drDetail").addEventListener("toggle",()=>{if($("#drDetail").open){paused=true;sync();}});
  timer=setInterval(()=>{const now=performance.now(),dt=Math.min(now-last,60);last=now;if(disposed||paused||document.hidden){if(document.hidden)silence();return;}if(!$("#drStage")){reportPlayerStop();return;}elapsed+=dt*speed;timeline(true);if(elapsed>=duration){if(at<scenes.length-1){seek(at+1);return;}elapsed=duration;paused=true;sync();finPopupShow();}progress();},30);
  draw();
}

function finPopupShow(){

  if(!box) return;
  UI._finShown = true;
  if(UI._drPause) UI._drPause();
  const sg = v=> `${v>0?"+":v<0?"-":""}${fmt(Math.abs(v))} G`;
  const rows = [
    {n:"주 시작 자금", v:fin.g0, base:true},
    {n:"훈련 비용", v:-fin.train},
    {n:"식단 비용", v:-(fin.diet||0)},
    ...((fin.jobOn || fin.job)? [{n:"의뢰 보수", v:fin.job}] : []),          // 의뢰가 열리기 전에는 숨김 (0929)
    ...((shopUnlocked() || fin.upkeep)? [{n:"유지비", v:-fin.upkeep}] : []),   // 시설 기능이 열리기 전에는 숨김 (0929)
    ...((!fin.repaid || fin.interest)? [{n:"이자 상환", v:-fin.interest}] : []),

  ];
  if(fin.other) rows.push({n:"원정 · 기타", v:fin.other});
  rows.push({n:"비용 증감 총합", v:fin.g1 - fin.g0, sum:true});
  rows.push({n:"주 완료 후 자금", v:fin.g1, base:true, end:true});
  const el = document.createElement("div");

    <div class="fin-head"><div class="eyebrow">경과 보고</div><h3>이번 주 자금 상황</h3></div>
    <div class="fin-rows">${rows.map((r,i)=>`<div class="fin-row${r.sum?" sum":""}${r.end?" end":""}" data-fin="${i}">
      <span>${r.n}</span><b style="color:${r.base ? (r.v<0? "var(--bad)" : "var(--text)") : r.v>0? "var(--ok)" : r.v<0? "var(--bad)" : "var(--dim)"}">${r.base? `${fmt(r.v)} G` : sg(r.v)}</b></div>`).join("")}</div>
    <div class="ji-btn"><button class="btn primary" id="finOk" disabled>${UI.pendingTour? "대회로" : "확인"}</button></div></div>`;
  box.appendChild(el);
  const ok = el.querySelector("#finOk");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;
  const step = ()=>{
    if(!el.isConnected) return;
    const row = el.querySelector(`[data-fin="${i}"]`);
    if(row){
      row.classList.add("on");
      if(sfxGain() > 0){ const a = new Audio(REPORT_STATUP); a.volume = sfxGain(); a.play().catch(()=>{}); }
    }
    i++;
    if(i < rows.length) setTimeout(step, reduced ? 120 : 420);
    else { ok.disabled = false; ok.focus(); }
  };
  setTimeout(step, 250);
  ok.onclick = ()=> reportDone();
}

/* ============================================================
   원정
   ============================================================ */
/* 상대 생성 프로필
   rival — 봄 신인전처럼 우리 또래와 붙는 학원. 우리 신입생과 같은 등급 분포를 쓴다.
   elite — 원래의 강한 학원 (지금은 쓰이지 않지만 남겨둔다)
   mon   — 이름만 몬스터로 바꾼 잡몹 */
const FOE_PROFILE = {
  rival:{ grade:{D:28, C:44, B:21, A:7}, mentK:0.85, mentCap:74, cond:92, named:true },
  elite:{ grade:{C:40, B:40, A:18, S:4}, mentK:1.25, mentCap:92, cond:92, named:true },
  mon:  { grade:{C:40, B:40, A:18, S:4}, mentK:1.00, mentCap:78, cond:92, named:false }
};
function genFoeTeam(level, tone, n, prof){
  n = n||3;
  const P = FOE_PROFILE[prof] || (tone ? FOE_PROFILE.elite : FOE_PROFILE.mon);
  const jobs = shuffle(JOB_KEYS.slice()).slice(0,n);
  return jobs.map(j=>{
    const st = newStudent(1, wchoose(P.grade), j);
    st.level=1; st.exp=0; st.relics=[];
    for(let i=1;i<level;i++) levelUp(st,true);
    st.cond = P.cond;
    MENTAL.forEach(m=>{ if(m.k!=="pot") st.ment[m.k] = clamp(st.ment[m.k] + level*rnd(.6,1.5)*P.mentK, 5, P.mentCap); });
    if(!P.named) st.name = monsterName();
    return st;
  });
}
const MON = ["망령 기사","石 수호상","늪지 추적자","붉은 살쾡이","폐허 술사","뼈 궁수","성소 파수꾼","그림자 무희","심연 사제","시계탑 인형"];
function monsterName(){ return pick(MON); }

/* 원정은 구간마다 전투 팝업을 띄울 수 있도록 단계로 쪼개 둔다 */
const EXPED_GOLD = 8, EXPED_GOLD_TIER = 12;   // 구간당 자금
const CHARM_EXTRA_P = .25;                    // 행운의 부적 — 유물 하나당 추가 획득 확률
const EXPED_EXP_MUL = .12;                    // 구간당 경험치 배율 (0.2 에서 60% 로 하향)
const EXPED_RWD_MUL = .2;                     // 업보·명성·진로 평가 배율
const EXPED_COND = 1;                         // 전투 한 판당 컨디션 소모
/* 화면에 쓰는 실효 수치 */
function dgExp(d){ return Math.round(d.exp * EXPED_EXP_MUL); }
function dgFame(d){ return Math.round((d.fameClear||0) * EXPED_RWD_MUL); }
function dgKarma(d){ return (d.karma||0) * EXPED_RWD_MUL; }
function dgGold(d){ return (EXPED_GOLD + d.tier*EXPED_GOLD_TIER) * (d.goldMul!=null ? d.goldMul : 1); }   // goldMul 0 = 자금 없음 (학원 지하 수련장)
function expedInit(dg, team, TM){
  const avgStam = team.reduce((a,s)=>a+mentEff(s).stam,0)/team.length;
  const avgWill = team.reduce((a,s)=>a+mentEff(s).will,0)/team.length;
  const E = {dg:dg, team:team, TM:TM, avgWill:avgWill,
    maxSec: clamp(Math.round(3 + avgStam/12), 1, dg.secs), sec:1, hpLeft:{},
    res:{dg:dg, team:team.map(s=>dn(s)), ids:team.map(s=>s.id), secs:[], exp:0, gold:0,
         relics:[], stopped:null, reached:0, fameGain:0}};
  team.forEach(s=> E.hpLeft[s.id]=1);
  return E;
}
function expedBattle(E){
  const mon = genMonster(E.dg, E.sec);
  const b = runBattle(E.team, mon, Object.assign({titleA:"원정대", titleB:`${monLabel(mon)} · ${E.sec}구간`, hpA:E.hpLeft,
    rowsB: mon.rows||null, slotsB: mon.slots||null},
    E.TM? teamBattleOpt(E.TM) : {}));
  return {b:b, mon:mon};
}
/* 전투 하나를 반영 — 더 갈 수 있으면 true */
function expedApply(E, b, mon){
  const res = E.res;
  const muscle = !!mon.muscle;
  res.secs.push({sec:E.sec, win:b.winner==="A", frames:b.frames, foe:monLabel(mon), muscle});
  b.A.forEach(u=>{ E.hpLeft[u.ref] = u.alive ? clamp(u.hp/u.maxHp + .18, .06, 1) : .25; });
  if(b.winner!=="A"){ res.stopped = `${E.sec}구간 ${monLabel(mon)}에게 전멸 — 철수`; return false; }
  res.reached = E.sec;
  res.exp += E.dg.exp*(1+E.sec*.14)*EXPED_EXP_MUL * (muscle? MUSCLE_RWD : 1);
  if(muscle) res.muscleN = (res.muscleN||0) + 1;
  const retire = clamp((.02 + E.sec*.015) * (1 - E.avgWill/120), 0, .35);
  if(E.sec < E.dg.secs && RNG()<retire){ res.stopped = `${E.sec}구간 의식에서 정신이 꺾여 리타이어`; return false; }
  E.sec++;
  if(E.sec > E.maxSec && E.sec <= E.dg.secs){ res.stopped = `지구력 한계 — ${E.sec-1}구간에서 철수`; return false; }
  return E.sec <= E.dg.secs;
}
function expedFinish(E){
  const dg = E.dg, team = E.team, res = E.res, hpLeft = E.hpLeft;
  {
    /* 유물 하나를 얻을 때마다, 행운의 부적이 있으면 그 자리에서 한 개를 더 굴린다 */
    const drop = ()=>{
      res.relics.push(makeRelic(wchoose(dg.relic)));
      if(S.items.charm && RNG() < CHARM_EXTRA_P){
        res.relics.push(makeRelic(wchoose(dg.relic)));
        res.charmN = (res.charmN||0) + 1;
      }
    };
    const per = clamp(dg.relicP||.2, 0, 1);
    for(let i=0;i<res.reached;i++){ if(RNG() < per) drop(); }
    for(let i=0;i<(res.muscleN||0);i++) drop();          // 그뉵이용 — 유물 확정
    /* 완주(보스 처치) 시 유물 보장은 없앴다 (0926) — 구간마다 확률로만 나온다 */
  }
  const ups=[];
  if(res.reached>0){
    res.evalGain = [];
    team.forEach(s=>{
      const cap = dg.evalCap||0, cur = s.eval||0;
      if(cur >= cap) return;
      const g = ((cap-cur)*.13*(res.reached/dg.secs) + res.reached*.25) * EXPED_RWD_MUL;
      const d = addEval(s, g, cap);
      if(d>0) res.evalGain.push(`${dnH(s)} +${d.toFixed(1)}`);
    });
  }
  {
    const tids = team.map(x=>x.id);
    team.forEach(s=>{ ups.push({s:s, n:gainExp(s, res.exp*broExpMul(s,tids), true)});
      setCond(s, s.cond - EXPED_COND*Math.max(1, res.secs.length)); s.fame += Math.round(res.reached*2*EXPED_RWD_MUL); });
    res.karma = (dg.karma||0) * res.secs.length * EXPED_RWD_MUL;
    if(res.karma) team.forEach(s=> addKarma(s, res.karma));
  }
  res.gold = Math.round(dgGold(dg) * (res.reached + (MUSCLE_RWD-1)*(res.muscleN||0)));   // 그뉵이용 구간은 자금 ×10
  if(res.gold) addGold(res.gold);
  if(res.reached >= dg.secs){
    res.fameGain = Math.round((dg.fameClear||0) * EXPED_RWD_MUL); addFame(res.fameGain);
    const lastFoe = (res.secs[res.secs.length-1]||{}).foe || dg.mon || "미지의 존재";
    res.epi = tryEpithet("exped", team, {event:`${dg.n} 완주`, place:dg.n, foe:lastFoe,
      score: s=> .6 + (hpLeft[s.id]||0)*1.8});
  }
  res.relics.forEach(r=> addRelicToPool(r));
  levelReport(ups);
  logE(`원정 — <b>${dg.n}</b> ${res.reached}/${dg.secs}구간 도달.${res.muscleN? ` <b style="color:var(--brass)">그뉵이용 ${res.muscleN}회 격파!</b> 그 구간 경험·자금 ×${MUSCLE_RWD} · 유물 확정.`:""} 경험 ${fmt(res.exp)}${res.gold? ` · 자금 +${fmt(res.gold)}`:""}${res.fameGain? ` · <b>완주</b> 학원 명성 +${res.fameGain}`:""} · 유물 ${res.relics.length}개${res.charmN? ` <span style="color:var(--brass)">(부적 +${res.charmN})</span>`:""}${res.relicSafe? " <span style=\"color:var(--brass)\">(완주 보장)</span>":""}${res.karma? ` · <b style="color:var(--bad)">업보 +${res.karma.toFixed(1)}</b>`:""}${(res.evalGain&&res.evalGain.length)? ` · 진로 평가 ${res.evalGain.join(", ")}`:""}${res.stopped? ` (${res.stopped})`:""}`, res.reached>=dg.secs?"good":(res.stopped?"bad":""));
  return res;
}
function expedLoop(E, quick, done){
  const bm = expedBattle(E);
  const after = ()=>{
    const cont = expedApply(E, bm.b, bm.mon);
    if(!cont){ done(expedFinish(E)); return; }
    expedLoop(E, quick, done);
  };
  if(quick) after();
  else openBattle(bm.b, {titleA:"원정대", titleB:monLabel(bm.mon), field:String(E.dg.mon||"").replace(/^mon_/,""),
    bgm:"friendly", jingle: E.sec>=E.dg.secs || !!bm.mon.muscle,

function addRelicToPool(r){

/* 유물 능력치 표시 순서 — 능력치 목록(BATTLE) 순서로 통일한다
   체력 → 공격력 → 방어력 → 속도 → 크리 확률 → 크리 피해 → 피해 명중 → 피해 회피
   → 스킬 성공률 → 스킬 저항률 → 받는 크리 감소 → 필살 게이지 → 피흡 */
const AFF_ORDER = (()=>{ const o={}; BATTLE.forEach((b,i)=> o[b.k]=i); return o; })();
function affSorted(list){ return (list||[]).slice().sort((a,b)=> (AFF_ORDER[a.k]??99) - (AFF_ORDER[b.k]??99)); }
function affValTxt(v){ return v<1&&v>0 ? (v*100).toFixed(1)+"%" : fmt(v); }
/* 한 줄에 하나씩, 최대 4줄 — 넘치면 앞줄부터 둘씩 묶는다 */
function affLines(items){
  const n = items.length, L = Math.min(4, n), out = [];
  let i = 0;
  for(let l=0; l<L; l++){ const k = (l < n - L) ? 2 : 1; out.push(items.slice(i, i+k)); i += k; }
  return out;
}
function relicAffHtml(r){
  const items = affSorted(r.aff).map(a=> `${esc(a.n)} <b>+${affValTxt(a.v)}</b>`);
  return `<div class="od raff">${affLines(items).map(l=> `<div>${l.join(" · ")}</div>`).join("")}</div>`;
}
function relicAffText(r){ return affSorted(r.aff).map(a=>`${a.n} +${affValTxt(a.v)}`).join(" · "); }
/* 유물 이름 — 학생 · 스킬처럼 이름 옆에 등급 태그 */
function relicNameHtml(r){ return `<div class="on" style="color:${GRADE_COLOR[r.grade]}">${esc(r.name)} ${gradeTag(r.grade)}</div>`; }
/* 두 유물의 효과 차이 — 항목별 순증감. 오르는 건 연두색 +, 내리는 건 붉은색 − */
function relicDiffText(oldR, newR){
  const map = {}, order = [];
  const put = (a, sign)=>{ if(!map[a.n]){ map[a.n] = {d:0, pct:false}; order.push(a.n); } map[a.n].d += sign*a.v; if(a.v<1 && a.v>0) map[a.n].pct = true; };
  affSorted((newR.aff||[]).concat(oldR.aff||[])).forEach(a=> put(a, 0));   // 순서만 먼저 정한다
  (newR.aff||[]).forEach(a=> put(a, +1));
  (oldR.aff||[]).forEach(a=> put(a, -1));
  return order.map(n=>{
    const {d, pct} = map[n];
    if(Math.abs(d) < 1e-9) return `<span style="color:var(--dim)">${n} ±0</span>`;
    const v = pct ? (Math.abs(d)*100).toFixed(1)+"%" : fmt(Math.round(Math.abs(d)*100)/100);
    return `<span style="color:var(--${d>0?"ok":"bad"})">${n} ${d>0?"+":"−"}${v}</span>`;
  }).join(" · ");
}
/* 유물 칸이 가득 찬 학생에게 보관고 유물을 장착하려 할 때 — 어느 유물과 바꿀지 고른다 */
/* ══════ 유물 합성 ══════
   장착하지 않은 S급 유물 둘 → S급 유물 하나 (5% 로 S+).
   · 두 유물에 같은 능력치가 있으면 그 능력치는 확정 — 값은 (두 값의 합 / 2 × 1.1) ~ S급 최대치
   · 나머지 칸은 무작위 — 두 유물에서 공통이 아니고 고정하지 않은 능력치를 모두 후보로 두고
     남은 칸 수만큼 겹치지 않게 뽑는다 (공통 2 + 고정 1 → 후보 3 중 1 · 공통 0 → 후보 8 중 4). 값은 S급 최소 ~ 최대
   · 무작위 후보 하나를 고정할 수 있다 (합성 가격 2배) — 고정한 능력치는 값 그대로 옮겨 온다
   · S+ — 네 옵션 값이 모두 2배 */
const SYNTH_COST = 10000, SYNTH_LOCK_MUL = 2, SYNTH_AVG_MUL = 1.1, SYNTH_PLUS_P = .05, SYNTH_PLUS_MUL = 2;
function synthOn(){ return !!(S.items && S.items.synth); }
function affDef(k){ return RELIC_AFFIX.find(x=> x.k===k) || null; }
function relicSRange(k){ const a = affDef(k), m = 1.4*RELIC_POWER; return a ? [a.v[0]*m, a.v[1]*m] : [0,0]; }
function affRound(k, v){ const a = affDef(k); return (a && a.int) ? Math.max(1, Math.round(v)) : Math.round(v*1000)/1000; }
function affRangeTxt(k, lo, hi){ const a = affValTxt(affRound(k,lo)), b = affValTxt(affRound(k,hi)); return a===b ? a : `${a}~${b}`; }
function synthCands(exclude){ return (S.relicPool||[]).filter(r=> r && r.grade==="S" && r.id && exclude.indexOf(r.id) < 0); }
function relicById(id){ return (S.relicPool||[]).find(r=> r && r.id===id) || null; }
/* 결과 예상 — 확정 칸 · 고정 칸 · 무작위 칸 */
function synthPlan(A, B, lock){
  const kb = new Set(B.aff.map(x=>x.k)), ka = new Set(A.aff.map(x=>x.k));
  const shared = affSorted(A.aff.filter(a=> kb.has(a.k))).map(a=>{
    const b = B.aff.find(x=> x.k===a.k), [, mx] = relicSRange(a.k);
    return {type:"shared", k:a.k, n:a.n, min:Math.min(mx, (a.v + b.v)/2*SYNTH_AVG_MUL), max:mx};
  });
  /* 공통이 아닌 능력치 — 두 유물 것을 모두 모은다 */
  const rest = affSorted(A.aff.filter(a=> !kb.has(a.k)).map(a=> Object.assign({src:"a"}, a))
                 .concat(B.aff.filter(b=> !ka.has(b.k)).map(b=> Object.assign({src:"b"}, b))));
  const lk = lock ? rest.find(o=> o.src===lock.src && o.k===lock.k) || null : null;
  const pool = rest.filter(o=> o !== lk);
  const slots = Math.min(4, shared.length + rest.length);
  const nRand = Math.max(0, slots - shared.length - (lk ? 1 : 0));
  return {shared, lock:lk, pool, nRand, rest, slots};

function synthCost(lock){ return SYNTH_COST * (lock ? SYNTH_LOCK_MUL : 1); }
function synthRoll(plan){
  const out = [];
  plan.shared.forEach(x=> out.push({k:x.k, n:x.n, v:affRound(x.k, rnd(x.min, x.max))}));
  if(plan.lock) out.push({k:plan.lock.k, n:plan.lock.n, v:plan.lock.v});
  shuffle(plan.pool.slice()).slice(0, plan.nRand).forEach(o=>{
    const [lo, hi] = relicSRange(o.k);
    out.push({k:o.k, n:o.n, v:affRound(o.k, rnd(lo, hi))});
  });
  const plus = RNG() < SYNTH_PLUS_P;
  if(plus) out.forEach(a=> a.v = affRound(a.k, a.v*SYNTH_PLUS_MUL));
  const grade = plus ? "S+" : "S";
  return {id:"r"+RNG().toString(36).slice(2,9), grade, name:pick(RELIC_ADJ[grade])+" "+pick(RELIC_NOUN), aff:affSorted(out), synth:true};
}

    : plan.shared.map((x,i)=> `<div class="syn-slot"><span class="syn-no">${i+1}</span><div><b>${esc(x.n)}</b> ${affRangeTxt(x.k, x.min, x.max)}</div></div>`).join("")
      + (plan.lock ? `<div class="syn-slot lock"><span class="syn-no">${plan.shared.length+1}</span><div><b>${esc(plan.lock.n)}</b> +${affValTxt(plan.lock.v)}</div></div>` : "")

      + (plan.nRand ? `<div class="syn-cands"><div class="syn-sub" style="margin-bottom:3px">무작위 후보 — ${plan.pool.length}개 중 ${plan.nRand}개</div>${
          plan.pool.map(o=>{ const [lo,hi] = relicSRange(o.k); return `<div>${esc(o.n)} <span style="color:var(--dim)">${affRangeTxt(o.k, lo, hi)}</span></div>`; }).join("")}</div>` : "");
  const other = U.pick === "a" ? U.b : U.a;
  const cands = U.pick ? synthCands([U.a, U.b].filter(Boolean)) : [];
  const picker = !U.pick ? "" : `<div class="rule"></div>
    <div class="eyebrow" style="margin-bottom:6px">대상 유물 ${U.pick==="a"?1:2}로 쓸 S급 유물 <span style="color:var(--dim)">— 장착하지 않은 것만</span></div>
    ${cands.length ? `<div class="grid2 syn-pick">${cands.map(r=> `<button class="opt" data-synpick="${r.id}" style="text-align:left">${relicNameHtml(r)}${relicAffHtml(r)}</button>`).join("")}</div>`
      : `<div class="empty">고를 수 있는 다른 S급 유물이 없다.</div>`}`;
