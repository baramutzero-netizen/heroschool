<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>용사 학원 키우기 — 학원이 망했다</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EBE9EF; --surface:#F7F6FA; --surface2:#E2E0EA; --line:#CFCDDC; --line-soft:#DEDCE8;
  --text:#191A24; --muted:#5B5D72; --dim:#82849A;
  --brass:#8A6A15; --brass-b:#B98E23; --brass-soft:rgba(185,142,35,.14);
  --indigo:#4B47B0; --indigo-soft:rgba(75,71,176,.12);
  --ok:#2F7F58; --warn:#B5661A; --bad:#B33F32;
  --tank:#3C6E9E; --dps:#A5432F; --heal:#2F7F58; --supp:#6D4BA8;
  --shadow:0 1px 2px rgba(25,26,36,.08),0 8px 24px rgba(25,26,36,.06);
  --ex:#B02E6B;
  --rainbow:linear-gradient(90deg,#e24b3f,#e08b2c,#d6c62c,#46a65f,#3c8fd0,#6a5fd0,#b455c0);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121319; --surface:#1B1D26; --surface2:#232633; --line:#333747; --line-soft:#282C39;
    --text:#E8E7F0; --muted:#9C9EB4; --dim:#797C92;
    --brass:#C8A24A; --brass-b:#E0BB64; --brass-soft:rgba(200,162,74,.14);
    --indigo:#8A86EC; --indigo-soft:rgba(138,134,236,.14);
    --ex:#F0629E;
    --ok:#5CB287; --warn:#DE9038; --bad:#D9604F;
    --tank:#6FA5D8; --dps:#E07A63; --heal:#5CB287; --supp:#A88BE6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#1B1D26; --surface2:#232633; --line:#333747; --line-soft:#282C39;
  --text:#E8E7F0; --muted:#9C9EB4; --dim:#797C92;
  --brass:#C8A24A; --brass-b:#E0BB64; --brass-soft:rgba(200,162,74,.14);
  --indigo:#8A86EC; --indigo-soft:rgba(138,134,236,.14);
  --ok:#5CB287; --warn:#DE9038; --bad:#D9604F;
  --tank:#6FA5D8; --dps:#E07A63; --heal:#5CB287; --supp:#A88BE6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}

/* ---------- shell ---------- */
#app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0;margin-inline:-16px;padding-inline:16px}
.crestrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:34px;height:34px;flex:none}
.acad-name{font-size:19px;line-height:1.1}
.acad-sub{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.meters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.fbbtn{flex:none;align-self:center;padding:0;border:0;border-radius:4px;background:none;
  cursor:pointer;overflow:hidden;line-height:0;height:52px;transition:transform .12s,border-color .12s}
.fbbtn:hover{transform:translateY(-1px)}
.fbbtn img{display:block;height:100%;width:auto}
/* 폰 — 피드백 아이콘이 셋째 줄을 혼자 차지하지 않게, 학생 옆(둘째 줄 오른쪽)에 붙인다 */
@media(max-width:820px){.fbbtn{height:44px;align-self:center;margin-left:auto;width:76px;position:relative;order:2}
  .crestrow > .meters{order:3}
  .crestrow > .acadblk{flex:1 1 0;min-width:0}
  .fbbtn img{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto}}
.meter{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;padding:4px 10px;min-width:76px}
.meter .k{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.meter .v{font-size:15px;font-weight:600;line-height:1.2}
.meter .sub{font-size:10px;color:var(--brass);font-weight:600;letter-spacing:.02em;margin-top:-1px}
.meter.date .v{color:var(--brass)}
/* 자금이 모자란 상품 — 누를 수는 있고(누르면 '자금이 부족하다') 값만 붉게 (0929) */
.opt.poor .price{color:var(--bad)!important}
.btn.poor{color:var(--bad)}
/* 지침 타일 (0929) — 누르면 지침 팝업. 예전 오른쪽 지침 상자는 이 팝업으로 옮겼다 */
button.meter.mis{font:inherit;color:inherit;text-align:left;cursor:pointer;max-width:130px;transition:border-color .12s,transform .12s}
button.meter.mis:hover{border-color:var(--brass);transform:translateY(-1px)}
button.meter.mis .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.missionpop .panel-h h2{font-size:20px!important}
.missionpop .mtitle{font-size:19px}
.missionpop .mdesc{font-size:13.5px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:8px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current="true"]{color:var(--text);border-bottom-color:var(--brass)}
nav button .badge{display:inline-block;margin-left:5px;background:var(--brass);color:var(--bg);border-radius:8px;font-size:10px;padding:0 5px;font-weight:700}
/* 폰 메뉴 — 4열 2줄 + 더보기. PC 에서는 #nav 한 줄 그대로 */
nav#navm{display:none}
@media(max-width:640px){
  nav#nav{display:none}
  nav#navm{display:block;overflow:visible;margin-top:8px}
  .navm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 2px}
  .navm-grid button{padding:7px 4px;font-size:12.5px;text-align:center;justify-content:center;display:flex;align-items:center;white-space:nowrap;min-width:0}
  .navm-grid button.hot{border-radius:3px 3px 0 0}
  .navm-grid button .badge{margin-left:4px}
  .navm-grid .morebtn{color:var(--dim)}
  .navm-grid .morebtn.open,.navm-grid .morebtn[aria-current="true"]{color:var(--text)}
  .navm-grid .morebtn[aria-current="true"]{border-bottom-color:var(--brass)}
  .navm-grid .morebtn i{font-style:normal;font-size:10px;margin-left:3px;color:var(--dim)}
  .moremenu{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 10px;border-top:1px dashed var(--line-soft)}
  .moremenu[hidden]{display:none}
  .moremenu button{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;padding:6px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .moremenu button[aria-current="true"]{border-color:var(--brass);color:var(--text);background:var(--brass-soft)}
}
/* 스케줄 — 한 주를 넘기는 탭이라 늘 눈에 띄게 둔다 */
nav button.hot{color:var(--brass);font-weight:700;background:var(--brass-soft);border-radius:3px 3px 0 0;
  display:inline-flex;align-items:center;gap:0;white-space:nowrap;flex:none}
nav button.hot:hover{color:var(--brass-b)}
nav button.hot::before{content:"";display:block;width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--brass);margin-right:6px;animation:hotdot 1.8s ease-in-out infinite}
nav button.hot[aria-current="true"]{background:transparent;color:var(--text)}
nav button.hot[aria-current="true"]::before{animation:none;opacity:.55}
nav button.hot .wk{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--brass);flex:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace;opacity:.85;
  border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:2px;padding:0 4px}
@keyframes hotdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:16px}
/* 계절 배경 — 스케줄 패널 뒤에 은은하게 깔린다 */
.panel.fldp{position:relative;overflow:hidden;background:transparent;isolation:isolate}
.panel.fldp::before{content:"";position:absolute;inset:0;z-index:-2;
  background-image:var(--fld);background-size:cover;background-position:center 40%}
.panel.fldp::after{content:"";position:absolute;inset:0;z-index:-1;
  background:var(--surface);opacity:var(--fld-a,.86)}
.panel + .panel{margin-top:14px}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font-size:16px}
.panel-h .hint{font-size:11.5px;color:var(--dim);margin-left:auto}
.panel-h.planhead{align-items:center}
.panel-h.planhead .hint{margin-left:0}
.panel-h.planhead .runpair{margin-left:auto;align-items:center}
.rule{height:1px;background:var(--line-soft);margin:12px 0}

/* ---------- buttons ---------- */
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--brass)}
.btn.icon{padding:3px 5px;line-height:0;border-color:transparent;background:none;color:var(--dim);
  vertical-align:middle;margin-left:5px;border-radius:3px}
.btn.icon:hover{color:var(--brass);border-color:var(--line);background:var(--surface2)}
.btn.icon svg{display:block}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#16171E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--brass-b);border-color:var(--brass-b)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.bigrun{padding:9px 20px;font-size:14.5px;letter-spacing:.01em;box-shadow:0 2px 0 color-mix(in srgb,var(--brass) 55%,#000)}
.btn.bigrun:active{transform:translateY(1px);box-shadow:0 1px 0 color-mix(in srgb,var(--brass) 55%,#000)}
.btn.ghost{background:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- tags ---------- */
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tag.role-tank{color:var(--tank);border-color:color-mix(in srgb,var(--tank) 45%,transparent)}
.tag.role-dps{color:var(--dps);border-color:color-mix(in srgb,var(--dps) 45%,transparent)}
.tag.role-heal{color:var(--heal);border-color:color-mix(in srgb,var(--heal) 45%,transparent)}
.tag.role-supp{color:var(--supp);border-color:color-mix(in srgb,var(--supp) 45%,transparent)}
.tag.gr{border-color:var(--brass);color:var(--brass)}
.tag.yr{background:var(--surface2);border-color:transparent}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.scard{border:1px solid var(--line-soft);border-radius:3px;background:var(--bg);padding:10px 12px;text-align:left;width:100%;display:block;transition:border-color .12s}
.scard:hover{border-color:var(--brass)}
.scard.sel{border-color:var(--brass);background:var(--brass-soft)}
.scard .n1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.scard .nm{font-weight:600;font-size:14.5px}
.scard .n2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.scard .lv{margin-left:auto;font-size:11.5px;color:var(--dim)}
.scard .bars{margin-top:7px;display:grid;gap:3px}
/* 학생 카드 v2 — 얼굴 + 핵심 정보만 */
.scard.sc2{display:flex;gap:10px;align-items:flex-start}
.scard.sc2 .sface{flex:none}
.scard.sc2 .sface .facebox{width:74px;height:74px}
.scard.sc2 .sbody{flex:1;min-width:0}
.scard.sc2 .n1{gap:6px}
.scard.sc2 .n2{margin-top:4px}
.scard.sc2 .bars{margin-top:6px}
.scard.sc2 .sfoot{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.scard.sc2 .skup{margin-left:auto;font-size:10px;padding:1px 5px}
/* 레벨업 팝업 (0929) */
.lvstage{height:190px;margin:12px 0 4px;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 85%,var(--brass-soft),transparent 70%),var(--surface2);border:1px solid var(--line-soft)}
.lvstage .spr-anchor{margin-bottom:10px}
.lvstage .facebox{width:150px;height:150px;margin-bottom:20px}
.lvrows{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:10px}
.lvrow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.lvrow span{color:var(--muted);flex:none;width:44px}
.lvrow b{font-weight:600}.lvrow b i{font-style:normal;color:var(--dim);margin:0 2px}
.lvrow em{font-style:normal;margin-left:auto;color:var(--ok);font-weight:700}
.lvnote{margin-top:8px;padding:8px 12px;border:1px solid var(--brass);border-radius:4px;font-size:13px;background:var(--brass-soft)}
.lvnote span{color:var(--dim);font-size:12px}
.lvnever{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
@media (max-width:640px){ .lvrows{grid-template-columns:1fr} }
/* 상점 주인 (0929) — 초상화와 말풍선. 색은 UI 컨셉(심플 · 일지)을 따른다 */
.npcband{--npc-fill:var(--bg);--npc-stroke:var(--line);--npc-ink:var(--text);
  display:flex;align-items:center;gap:26px;margin:0 0 14px;padding:14px 16px;border-radius:6px;
  background:var(--surface) radial-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px, transparent 1.4px) 0 0/16px 16px;
  border:1px solid var(--line-soft)}
.npcport{flex:none;width:128px;height:128px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);overflow:hidden}
.npcport img{width:100%;height:100%;object-fit:cover;display:block}
.npcbub{position:relative;flex:1;min-width:0;max-width:440px;background:var(--npc-fill);border:3px solid var(--npc-stroke);border-radius:22px;
  padding:14px 20px;font-size:18px;line-height:1.45;font-weight:700;color:var(--npc-ink);word-break:keep-all;
  box-shadow:0 2px 0 color-mix(in srgb,var(--npc-stroke) 35%,transparent)}
.npctail{position:absolute;left:-29.5px;top:50%;width:32px;height:40px;margin-top:-22px;overflow:visible;pointer-events:none}
.npctail path{fill:var(--npc-fill);stroke:var(--npc-stroke);stroke-width:3;stroke-linejoin:round;stroke-linecap:butt}
.npcname{display:block;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600;margin-bottom:2px}
html[data-ui-concept="journal"] .npcband{--npc-fill:#fbf3df;--npc-stroke:#7a5a3a;--npc-ink:#35291f;
  background-color:var(--surface);background-image:var(--journal-paper);background-size:auto;background-position:0 0;border-color:#a1845b;border-radius:5px 8px 6px 4px;
  box-shadow:inset 0 0 0 3px #f7e7c52b,inset 0 0 22px #81532018,0 3px 12px #0004}
html[data-ui-concept="journal"] .npcport{border:3px solid #7a5a3a;border-radius:5px;
  background:radial-gradient(ellipse at 50% 35%,#f3e2bf,#d6b98a);box-shadow:0 0 0 1px #4d3c2d,inset 0 0 0 2px #f4dfb9,0 2px 5px #0003}
html[data-ui-concept="journal"] .npcbub{border-radius:20px 24px 22px 18px;box-shadow:inset 0 0 14px #9a6c3014,0 2px 0 #5a3f2833}
html[data-ui-concept="journal"] .npcname{color:#8a6a45}
@media (max-width:640px){
  .npcband{gap:26px;padding:10px 12px}
  .npcport{width:100px;height:100px}
  .npcbub{font-size:15.5px;padding:11px 15px;border-radius:18px}
}
  .npcbub{font-size:16px;padding:12px 16px;border-width:4px;border-radius:22px}
}
/* 인사 한마디 말풍선 (0929) — 얼굴 아래에서 위로 꼬리를 올린다 */
.scard.sc2.gcard{position:relative;gap:14px}
.scard.sc2.gcard .sface{position:relative;width:74px;display:flex;flex-direction:column;align-items:flex-start}
.greet{position:relative;margin:13px 0 2px -5px;width:86px;z-index:2;pointer-events:none;
  background:#fffdf8;border:2.5px solid #83603f;border-radius:16px;padding:7px 8px;
  font-size:11.5px;line-height:1.45;font-weight:600;color:#2d241b;word-break:keep-all;text-align:left;
  box-shadow:0 2px 0 #5a3f2826}
.greet::after{content:"";position:absolute;left:38px;top:-8px;width:12px;height:12px;background:#fffdf8;
  border-left:2.5px solid #83603f;border-top:2.5px solid #83603f;transform:rotate(45deg) skew(8deg,8deg);border-top-left-radius:2px}
.bar{height:5px;background:var(--surface2);border-radius:2px;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:var(--brass);transition:width .35s ease}
.bar.cond > i{background:var(--ok)}
.bar.cond.mid > i{background:var(--warn)}
.bar.cond.low > i{background:var(--bad)}
.barlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}

/* ---------- stat table ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:2px 14px}
.st{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--line-soft)}
.st .k{color:var(--muted)}
.st .v{margin-left:auto;font-weight:600}
.st .up{color:var(--ok);font-size:11px}
.mentbar{height:4px;flex:1;background:var(--surface2);border-radius:2px;overflow:hidden;max-width:54px;position:relative}
.mentbar.full > i{background:var(--brass)}
.mentbar > i{display:block;height:100%;background:var(--indigo)}
.mentbar.over > i{background:var(--brass)}
.mentv.over{color:var(--brass)}
.mental-grade{display:inline-block;font-weight:900;margin-right:.3em;line-height:1}.mentv{white-space:nowrap}

/* ---------- schedule ---------- */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.wk{border:1px solid var(--line-soft);border-radius:3px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.wk.done{opacity:.5}
.wk.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.wk .wl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.wk select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:4px 5px;font-size:12px}
.wk .eff{font-size:10.5px;color:var(--muted);min-height:15px}

/* ---------- 훈련 카드 보드 ---------- */
.dayrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.handrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:16px}
.dslot{position:relative;border:1px dashed var(--line);border-radius:5px;background:var(--bg);
  min-height:172px;display:flex;flex-direction:column;transition:border-color .12s,background .12s}
.dslot > .dh{font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:center;padding:5px 0 3px;flex:none}
.dslot > .dh b{color:var(--muted);font-weight:600}
.dslot.filled{border-style:solid;border-color:var(--line-soft)}
.dslot.over{border-color:var(--brass);background:var(--brass-soft)}
.dslot .dempty{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);
  text-align:center;line-height:1.5;padding:0 6px}
.dslot .dchain{position:absolute;top:-8px;right:-4px;font-size:10px;font-weight:700;color:#fff;
  background:var(--brass);border-radius:9px;padding:1px 7px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 1px 3px rgba(0,0,0,.45)}
.card{position:relative;border:1px solid var(--cc);border-radius:5px;background:linear-gradient(180deg,var(--cs),transparent 62%),var(--surface);
  padding:8px 7px 7px;display:flex;flex-direction:column;gap:3px;min-height:172px;cursor:grab;user-select:none;
  transition:transform .1s,box-shadow .1s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.card.dragging{opacity:.4;cursor:grabbing}
.card .ctop{display:flex;align-items:center;gap:4px;flex:none}
.card.marked{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mk) 55%,transparent)}
.cmark{position:absolute;bottom:-7px;right:-7px;z-index:2;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;
  color:#fff;background:var(--mk);border:1.5px solid var(--surface);
  box-shadow:0 1px 3px rgba(25,26,36,.3)}
.dslot .cmark{bottom:-6px;right:-6px}
/* 카드 수명 배지 — 좌상단, 카드 위로 올려 색 라벨(청·녹·적)을 가리지 않는다. 3주 회색 → 2주 황동 → 이번 주까지 붉은색 */
.card .clife{position:absolute;top:-11px;left:-6px;z-index:2;height:17px;padding:0 6px;border-radius:9px;display:inline-flex;align-items:center;gap:3px;
  font-size:9.5px;font-weight:700;line-height:1;white-space:nowrap;color:var(--text);background:var(--surface);border:1.5px solid var(--line);
  box-shadow:0 1px 3px rgba(25,26,36,.25);pointer-events:none}
.card .clife i{width:5px;height:5px;border-radius:50%;background:var(--dim);display:inline-block}
.card .clife.l2{border-color:var(--brass);color:var(--brass)}.card .clife.l2 i{background:var(--brass)}
.card .clife.l1{border-color:var(--bad);color:#fff;background:var(--bad)}.card .clife.l1 i{background:#fff;animation:lifePulse 1s ease-in-out infinite}
@keyframes lifePulse{0%,100%{opacity:1}50%{opacity:.2}}
.dslot .clife{display:none}
.handrow{padding-top:6px}
.card .cdot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.card .ccol{font-size:9.5px;color:var(--cc);letter-spacing:.08em}
.card .cname{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.25;word-break:keep-all;flex:none}
.card .cdesc{font-size:10.5px;color:var(--muted);line-height:1.4;word-break:keep-all;flex:none}
.card .ccost{color:var(--brass);font-weight:600;min-height:1.4em}
.card .cfx{flex:1;display:flex;flex-direction:column;gap:1px;justify-content:flex-end;margin-top:5px}
.card .fxl{font-size:10px;color:var(--ok);display:flex;justify-content:space-between;gap:4px;
  line-height:1.35;word-break:keep-all}
.card .fxl b{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.5px;font-weight:700}
.card .fxl.bad{color:var(--bad)}
.card .ceff{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace;flex:none;
  border-top:1px solid var(--line-soft);padding-top:4px}
.dslot .card{border-radius:0 0 4px 4px;border:none;border-top:1px solid var(--cc);min-height:0;flex:1;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent)}
.dslot .card:hover{transform:none;box-shadow:inset 0 0 0 1px var(--cc)}
.handzone.over{outline:2px dashed var(--brass);outline-offset:6px;border-radius:5px}
/* 카드 위에서 시작한 손짓은 전부 드래그로 쓴다 (줄이 스크롤되지 않으므로) */
.card{touch-action:none}
.cardlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim);margin-top:10px}
.cardlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.marklegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--dim);margin-top:5px;align-items:center}
.marklegend i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  margin-right:4px;vertical-align:-3px;color:#fff;font-size:9px;font-weight:700;font-style:normal}


/* ---------- 리그 ---------- */
.lgpick{display:flex;flex-direction:column;gap:4px}
.lgpick > .opt{flex:1}
.lgtr{display:flex;justify-content:flex-end;align-items:center;font-size:11.5px;min-height:26px}
.lgbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.lgstat{flex:1;min-width:120px;border:1px solid var(--line-soft);border-radius:4px;background:var(--bg);padding:9px 12px}
.lgstat span{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
.lgstat b{font-size:17px;color:var(--text)}
.opt.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;background:var(--brass-soft)}

/* ---------- 전투 · 떠오르는 숫자 ---------- */
.popwrap{position:absolute;left:0;right:0;top:12px;height:0;z-index:7;pointer-events:none;text-align:center}
.pop{position:absolute;left:50%;white-space:nowrap;line-height:1;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;
  text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 7px rgba(0,0,0,.45);
  opacity:0;animation:popRise var(--pd,760ms) cubic-bezier(.2,.9,.3,1) forwards}
@keyframes popRise{
  0%  {opacity:0; transform:translate(-50%,8px) scale(.6)}
  16% {opacity:1; transform:translate(-50%,-5px) scale(1.18)}
  30% {opacity:1; transform:translate(-50%,0)    scale(1)}
  72% {opacity:1; transform:translate(-50%,-14px) scale(1)}
  100%{opacity:0; transform:translate(-50%,-30px) scale(.96)}
}
.pop.dmg   {color:#FFFFFF; font-size:20px}
.pop.crit  {color:#FFD34D; font-size:27px}
.pop.miss  {color:#E2E2E2; font-size:16px; letter-spacing:.1em}
.pop.die   {color:#FF6A55; font-size:15px; letter-spacing:.1em}
.pop.heal  {color:#5CE08E; font-size:19px}
.pop.shield{color:#79C7FF; font-size:18px}
.pop.absorb{color:#A8D5FF; font-size:14px}
.popcrit{display:block;font-size:10.5px;letter-spacing:.12em;color:#FF5A43;margin-bottom:1px;font-weight:700}
@media (prefers-reduced-motion:reduce){ .pop{animation-duration:1ms;opacity:1} }

/* ---------- SP 상점 ---------- */
.exitem{border-color:color-mix(in srgb,var(--ex) 45%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--ex) 6%,var(--surface)),var(--surface))}
.exaff{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--muted);
  border-top:1px solid var(--line-soft);padding-top:7px}
.exaff span{white-space:nowrap}
.raff{display:flex;flex-direction:column;gap:1px;line-height:1.55}
/* 유물 합성 */
.syn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;align-items:start}
.syn-col .eyebrow{margin-bottom:6px;text-align:center}
.syn-card{cursor:default}
.syn-empty{border:1px dashed var(--line);border-radius:8px;padding:22px 12px;text-align:center;color:var(--dim);font-size:12.5px}
.syn-ln{font:inherit;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:12.5px;line-height:1.55;color:var(--muted);background:none;border:0;padding:1px 0;text-align:left}
.syn-lockable{cursor:pointer;border-radius:4px;padding:2px 4px;margin:0 -4px;width:calc(100% + 8px)}
.syn-lockable:hover{background:var(--brass-soft)}
.syn-lockable.on{background:var(--brass-soft);outline:1px solid var(--brass)}
.syn-tg{flex:none;font-size:10.5px;padding:0 6px;border:1px solid var(--line);border-radius:10px;color:var(--dim)}
.syn-tg.shared{border-color:var(--ok);color:var(--ok)}
.syn-tg.lock{border-color:var(--brass);color:var(--brass);font-weight:700}
.syn-res{display:flex;flex-direction:column;gap:6px}
.syn-slot{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.syn-slot.rand{border-style:dashed}
.syn-slot.lock{border-color:var(--brass)}
.syn-no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--text);font-size:11px;display:grid;place-items:center;margin-top:1px}
.syn-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.syn-note{font-size:11.5px;color:var(--dim);text-align:center;margin-top:8px}
.syn-cands{padding:7px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12px;line-height:1.6;color:var(--muted)}
.syn-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.syn-pick{max-height:300px;overflow:auto}
.syn-card.splus{border-color:#2A9D74;box-shadow:0 0 0 1px #2A9D74,0 0 18px #2A9D7455}
@media(max-width:640px){.syn-grid,.syn-btns{grid-template-columns:1fr}}
.raff b{color:var(--text);font-weight:600}
.exaff.raff{flex-direction:column;flex-wrap:nowrap;gap:1px}
.exitem.owned{opacity:.72;border-color:var(--line-soft);background:var(--surface)}
.exitem.owned .on{color:var(--muted) !important}

/* ---------- 문제 기록 ---------- */
.errbox{border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
.errrow{padding:8px 11px;border-top:1px solid var(--line-soft)}
.errrow:first-child{border-top:none}
.errmeta{font-size:11px;color:var(--dim)}
.errmsg{font-size:12px;color:var(--bad);font-family:"IBM Plex Mono",ui-monospace,monospace;
  margin-top:2px;word-break:break-word}

/* ---------- 문제 알림 띠 ---------- */
#errbar{position:fixed;left:0;right:0;bottom:0;z-index:99;display:none;align-items:center;gap:10px;
  padding:9px 14px;background:var(--bad);color:#fff;font-size:12.5px;
  box-shadow:0 -2px 12px rgba(25,26,36,.18)}
#errbar b{flex:none}
#errbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px}
#errbar .btn{flex:none;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
#errbar .btn:hover{background:rgba(255,255,255,.28)}

/* ---------- 순위표 ---------- */
.rktable{margin-top:4px}
.rkrow{display:flex;align-items:center;gap:14px;padding:11px 8px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.rkrow.me{background:var(--brass-soft);border-radius:4px}
.rkno{width:40px;flex:none;text-align:right;font-size:19px;font-weight:700;color:var(--dim)}
.rkrow:nth-child(1) .rkno{color:var(--brass)}
.rkacad{flex:1;min-width:150px}
.rkan{font-size:14px;font-weight:700}
.rkad{font-size:11.5px;color:var(--dim);margin-top:2px}
.rklp{flex:none;font-size:19px;font-weight:700;color:var(--brass);text-align:right;min-width:74px}
.rklp span{font-size:10.5px;color:var(--dim);margin-left:3px;font-weight:500}
.rkmem{flex:none;display:flex;gap:8px}
.rku{width:92px;text-align:center}
.rkusp{height:64px;display:flex;align-items:flex-end;justify-content:center}
.rkusp .spr{image-rendering:pixelated}
.rkuno{display:inline-block;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;
  padding:13px 7px;line-height:1;white-space:nowrap}
.rkun{font-size:11.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkul{font-size:10.5px;color:var(--dim);font-family:"IBM Plex Mono",ui-monospace,monospace;white-space:nowrap}
@media (max-width:760px){
  /* 폰 — 좌측 여백까지 써서 가로 스크롤 없이 (5인 조합도 한 줄) (0929)
     스프라이트 캔버스는 투명한 여백이 양옆으로 삐져나온다 — 가로만 잘라 낸다 (머리 위는 그대로) */
  .rktable{overflow-x:clip;overflow-y:visible}
  .rkrow{gap:6px 10px;padding:9px 4px}
  .rkno{width:24px;font-size:16px}
  .rkacad{min-width:0}
  .rklp{min-width:0;font-size:17px}
  .rkmem{width:100%;padding-left:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,80px);gap:4px;justify-content:start}
  .rku{width:auto;min-width:0}
  .rkusp{height:58px}
  .rkun{font-size:10.5px}
  .rkul{font-size:9.5px;overflow:hidden;text-overflow:ellipsis}
}

/* ---------- 설정 ---------- */
.optrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--line-soft);border-radius:4px;background:var(--bg);padding:14px 16px}
.optlab{flex:1;min-width:240px}
.optlab > b{display:block;font-size:13.5px;margin-bottom:3px}
.optlab span{font-size:11.5px;color:var(--muted);line-height:1.55}
.optctl{display:flex;align-items:center;gap:12px;flex:none;max-width:100%;flex-wrap:wrap}
.optctl input[type=range]{width:220px;max-width:100%;accent-color:var(--brass)}
@media(max-width:640px){
  .optctl{flex:1 1 100%;min-width:0}
  .optctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
  .optlab{min-width:0;flex:1 1 100%}
}
.optval{font-size:12px;color:var(--dim);display:flex;align-items:baseline;gap:3px}
.optval b{font-size:17px;color:var(--brass)}
.opthint{font-size:11.5px;color:var(--dim);margin:8px 0 0}
.fxdemo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.fxcell{border:1px solid var(--line-soft);border-radius:4px;background:var(--surface);
  height:132px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fxcell .fxname{position:absolute;top:6px;left:8px;font-size:11px;color:var(--dim);z-index:4}
.fxcell .fxstage{position:relative;width:128px;height:128px;display:block}
.fxcell .fxspr{top:0}

/* REPORT_SCENE_STYLE_START */
/* A common 3:1 viewport crops each square source at its facility-specific origin. */
.modal.dr-modal{width:min(1080px,100%)!important;padding:20px;max-height:94vh}
.dr-player{margin:4px 0 22px}
.dr-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:12px}
.dr-days button{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line-soft);border-radius:9px;padding:10px 11px;background:var(--surface);color:var(--muted);cursor:pointer;min-width:0}
.dr-days button span{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.dr-days strong{font-size:13px;color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dr-days em{font-size:10px;color:var(--brass);font-style:normal}
.dr-days .current{border-color:#b49253;background:#e8dfcc;color:#694d25;box-shadow:0 2px 8px #4d37111a}.dr-days .current:after{content:"";position:absolute;bottom:0;left:0;height:3px;background:#a47b32;width:var(--progress,0%)}.dr-days .done i{color:var(--ok)}.dr-days button:disabled{opacity:.45;cursor:default}
.dr-stage{width:100%;margin-inline:auto;aspect-ratio:3 / 1;position:relative;isolation:isolate;background:#d7cee6;border-radius:10px;overflow:hidden;border:1px solid #b9aec7;container-type:inline-size}
.dr-room{position:absolute;width:104.166667%;height:312.5%;left:-2.083333%;top:var(--crop-top,-73.4375%);object-fit:fill;max-width:none;user-select:none;pointer-events:none}
.dr-stage[data-facility="beach"] .dr-room{width:100%;height:100%;left:0;top:0;object-fit:cover}
.dr-top{position:absolute;top:18px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;z-index:90;pointer-events:none;gap:8px}
.dr-top>div{padding:11px 15px;border-radius:12px;background:#fff9eeef;box-shadow:0 3px 18px #32263d20;backdrop-filter:blur(5px);color:#534734}.dr-eyebrow{font-size:10px;letter-spacing:.16em;color:#957543}.dr-top h3{font-size:24px;margin:3px 0 5px;color:#3e3046;line-height:1.2}.dr-top #drActivity{font-size:11px}.dr-chain{border-radius:20px;background:#926b21;color:#fff6d1;padding:7px 13px;font-size:12px;font-weight:700;box-shadow:0 2px 12px #493d2730}
.dr-bottom{position:absolute;bottom:12px;left:14px;right:14px;z-index:90;display:flex;justify-content:space-between;gap:8px;color:#5a4a61;font-size:11px;pointer-events:none}.dr-bottom span{border-radius:14px;padding:5px 9px;background:#fffaf1dc}
.dr-student{position:absolute;width:12cqw;height:12cqw;transform:translate(-50%,-65%);border:0;padding:0;background:none;cursor:pointer;color:#392d33;overflow:visible}
.dr-avatar{position:absolute;left:50%;top:50%;width:128px;height:128px;transform:translate(-50%,-50%) scale(calc(100cqw / var(--sprite-unit,1050px)));pointer-events:none}.dr-shadow{position:absolute;left:28%;right:28%;bottom:17%;height:9%;border-radius:50%;background:#39282536;filter:blur(2px)}
.dr-name{position:absolute;top:82%;left:50%;transform:translateX(-50%);max-width:160%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-size:clamp(9px,1.5cqw,13px);font-weight:700;border:1px solid #d2bc97;background:#fffaf1ed;padding:3px 8px;border-radius:16px;box-shadow:0 2px 4px #45341b25}
.dr-bubbles{position:absolute;bottom:91%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;animation:dr-rise .7s both;animation-delay:var(--delay)}.dr-bubbles .dr-chip{white-space:nowrap;box-shadow:0 2px 6px #24352e22;font-size:clamp(8px,1.5cqw,13px);padding:4px 8px}.dr-chip{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;background:var(--surface);color:var(--muted);line-height:1.25}.dr-chip.gain{background:#e0efe5;color:#236148}.dr-chip.heal,.dr-chip.exp{background:#dcecf5;color:#27657b}.dr-chip.loss{background:#f5e1dc;color:#a04537}.dr-chip.fail{background:#625b70;color:white}.dr-bubbles .gain{background:#367859;color:#fff}.dr-bubbles .heal{background:#3e8ca5;color:#fff}.dr-bubbles .loss{background:#ac5345;color:#fff}
.dr-phases{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.dr-phases button{border:1px solid var(--line-soft);border-radius:20px;background:var(--surface);color:var(--muted);padding:6px 13px;font-size:12px;cursor:pointer}.dr-phases .active{background:#554865;color:#fff;border-color:#554865}

/* 진화?! 팝업 — 가운데 스프라이트, 1쪽에서는 하얗게 반짝인다 */
.evo-stage{position:relative;width:220px;height:150px;margin:14px auto 4px;display:flex;justify-content:center;align-items:flex-end}
.evo-stage .spr-anchor{margin-bottom:-14px}
.evo-stage.spark .spr-anchor{animation:evoGlow 1.1s ease-in-out infinite}
@keyframes evoGlow{0%,100%{filter:drop-shadow(0 0 2px #fff) brightness(1)}50%{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px rgba(255,255,255,.6)) brightness(1.4)}}
.evo-stage.spark i{position:absolute;width:12px;height:12px;background:#fff;filter:drop-shadow(0 0 5px #fff);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:evoSpark 1.4s ease-in-out infinite}
.evo-stage.spark i:nth-child(2){left:28%;top:26%}
.evo-stage.spark i:nth-child(3){left:68%;top:18%;animation-delay:.35s}
.evo-stage.spark i:nth-child(4){left:22%;top:60%;animation-delay:.7s}
.evo-stage.spark i:nth-child(5){left:74%;top:56%;animation-delay:1.05s}
@keyframes evoSpark{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.evo-txt{text-align:center;font-size:16px;line-height:1.8;margin:6px 0 14px;color:var(--text);word-break:keep-all}
@media(prefers-reduced-motion:reduce){.evo-stage.spark .spr-anchor,.evo-stage.spark i{animation:none}}

const MON_SPR = (typeof MON_IMG !== "undefined") ? MON_IMG : {};
function monHas(job){ return !!MON_SPR[job]; }
function monHTML(job, mot){
  const m = MON_SPR[job];
  if(!m) return "";
  const k = m.k || 1, w = Math.round(m.w*k), h = Math.round(m.h*k);
  /* flash / redflash 는 같은 그림을 마스크로 떠서 단색 실루엣으로 겹친다 */
  if(mot==="flash" || mot==="redflash")
    return `<span class="monspr ${mot}" style="width:${w}px;height:${h}px;--m:url('${m.src}')"></span>`;
  return `<img class="monspr ${mot||""}" src="${m.src}" width="${w}" height="${h}" alt="">`;
}

const SPR_HUE_N = 24, SPR_TONE = [1.00, .70, .25];

function sprPal(pi){

  const hi = pi % SPR_HUE_N, ti = Math.floor(pi/SPR_HUE_N) % SPR_TONE.length;
  return {h: hi/SPR_HUE_N, s: SPR_TONE[ti]};
}

function sprFrameAt(j, m, elapsed, ms, ended, loop){
  if(loop == null) loop = !!SPR_LOOP[m];
  const frames = SPR_META[SPR_KEYS[j]][m];
  if(!loop && ended) return frames.length-1;
  const rawTotal = frames.reduce((s,f)=>s+f.duration,0);
  const total = frames.length*ms/SPR_PLAYBACK_RATE;
  let t = loop ? ((elapsed%total)+total)%total : Math.max(0,Math.min(elapsed,total));

  if(!t) return true;

  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28 !== 0;
  if(c>=0x30 && c<=0x39) return [0,1,3,6,7,8].indexOf(c-0x30)>=0;

/* 같은 학원 안에서도, 한 번에 여러 명을 만들 때도 이름이 겹치지 않게 다시 뽑는다.
   NAME_RECENT 는 방금 내준 이름 24개를 기억한다 — 상대 팀 3인이 같은 이름을 다는 일이 없다. */
let NAME_RECENT = [];
function freshName(job){
  const used = new Set(NAME_RECENT);
  try{ (S.students||[]).forEach(x=> used.add(x.name)); }catch(e){}
  let n = fantasyName(job);
  for(let i=0; i<14 && used.has(n); i++) n = fantasyName(job);
  NAME_RECENT.push(n);
  if(NAME_RECENT.length > 24) NAME_RECENT.shift();
  return n;
}

function passiveOf(job){ return PASSIVES[job] || null; }
function healMulOf(u){ const P=u.pas||passiveOf(u.job); return P && P.healMul ? 1+P.healMul : 1; }
function passiveDmgMul(src, tgt, sk){
  let m = 1;
  const Ps = src.pas||passiveOf(src.job), Pt = tgt.pas||passiveOf(tgt.job);
  if(Ps){
    if(Ps.vsBack && tgt.row==="back") m *= 1+Ps.vsBack;
    if(Ps.vsFront && tgt.row==="front") m *= 1+Ps.vsFront;
    if(Ps.vsLow && tgt.hp/tgt.maxHp <= .4) m *= 1+Ps.vsLow;
    if(Ps.vsHigh && tgt.hp/tgt.maxHp > .4) m *= 1+Ps.vsHigh;
    if(Ps.aoe && sk && (sk.type==="dmg_aoe"||sk.type==="ult_aoe"||sk.type==="ult_drain")) m *= 1+Ps.aoe;
  }
  if(Pt){
    if(Pt.take) m *= 1-Pt.take;
    if(Pt.takeLow && (tgt.hp/tgt.maxHp*100) < consThr(tgt.ment.stam)) m *= 1-Pt.takeLow;
  }
  return m;
}

const FORM_KEYS = Object.keys(FORMS);
const SLOT_IDS = ["f1","f2","f3","b1","b2","b3"];
const FORM_PLUS_SUFFIX = "·改";
/* 진형 강화의 서 — 우리 팀 진형에 두 자리를 더한다 */
function formPlusOn(){ return !!(S && S.items && S.items.formbook); }
/* 진형 데이터 — plus 가 참이면 강화판(자리 +2 · 이름 뒤에 ·改) */
function formData(k, plus){
  const B = FORMS[k] || FORMS.wedge;
  if(!plus || !B.plus) return B;
  if(!B._plus){
    const P = B.plus;
    const front = SLOT_IDS.filter(x=> x.charAt(0)==="f" && (B.front.includes(x) || (P.front||[]).includes(x)));
    const back  = SLOT_IDS.filter(x=> x.charAt(0)==="b" && (B.back.includes(x)  || (P.back||[]).includes(x)));
    B._plus = {n:B.n + FORM_PLUS_SUFFIX, sh:`${front.length}-${back.length}`, front, back, d:B.d,
               fx:Object.assign({}, B.fx, P.fx||{}), txt:B.txt.concat(P.txt||[]), plus:true, base:k};
  }
  return B._plus;
}
function formOf(k){ return formData(k, formPlusOn()); }
function formSlots(k){ const F=formOf(k); return F.front.concat(F.back); }
function slotRow(id){ return id.charAt(0)==="f" ? "front" : "back"; }
const TEAM_NAMES = ["A","B","C","D","E"];
function newTeams(){ return TEAM_NAMES.map(n=>({n, form:"wedge", slots:{}})); }
/* 편성 가능한 팀 수 — 총원 3명당 1팀. 한 번 늘어난 상한은 인원이 줄어도 내려가지 않는다 */
const TEAM_MAX = TEAM_NAMES.length;
function teamCapNow(){ return clamp(Math.floor(S.students.length/3), 1, TEAM_MAX); }
function teamCap(){
  const now = teamCapNow();

  if(now > S.teamCap) S.teamCap = now;

}
function bumpTeamCap(){
  const before = teamCap(), now = teamCapNow();
  if(now > before){

    logE(`팀 편성 — 학생이 ${S.students.length}명이 되어 <b>${now}번째 팀</b>까지 짤 수 있게 됐다.`,"good");
  }

}
function allTeams(){
  if(!Array.isArray(S.teams) || S.teams.length!==TEAM_MAX){
    const old = Array.isArray(S.teams)? S.teams : [];
    S.teams = TEAM_NAMES.map((n,i)=> old[i] || {n, form:"wedge", slots:{}});
    S.teams.forEach((t,i)=>{ t.n = TEAM_NAMES[i]; });

function cleanTeams(){

  teamsOf().forEach(t=>{
    const live = formSlots(t.form);
    Object.keys(t.slots).forEach(k=>{

    });

function teamRows(t){

function assignFoeForm(arr, fk, plus){
  fk = (fk && FORMS[fk]) ? fk : pick(FORM_KEYS);
  const F = formData(fk, !!plus);
  arr.form = fk; arr.plus = !!plus;
  const order = F.front.concat(F.back);
  arr.rows = {};
  arr.forEach((st,i)=>{ const k = order[i]; if(k) arr.rows[st.id] = slotRow(k); });

}

function foeBattleOpt(arr){

}

function teamLabel(t){ if(typeof t==="string") t = teamByName(t); return (t && t.label) ? t.label : `팀 ${t?t.n:"?"}`; }

/* 진형별 자리 요구 역할 — 앞에서부터 우선순위 */
const FORM_ROLES = {
  wedge:   {f2:["tank"],              b1:["dps"],            b3:["heal","supp"],   f1:["dps","tank"], f3:["supp","heal"]},
  pocket:  {f1:["tank"],              f3:["heal","supp","tank"], b2:["dps"],       b1:["dps"],        b3:["heal","supp"]},
  echelon: {f1:["tank","supp"],       b2:["dps"],            b3:["dps"],           f2:["tank","dps"], b1:["supp","heal"]},
  line:    {f1:["tank"],              f2:["dps"],            f3:["heal","supp"],   b1:["dps"],        b2:["heal","supp"]}
};
function roleOf(st){ return JOBS[st.job] ? JOBS[st.job].role : "dps"; }
/* 진형 기준 자동 편성 — 빈 자리에 미배정 학생을 역할에 맞춰 넣는다 */
/* 자리에 학생을 넣는다 — 같은 팀이면 자리 교환, 다른 팀이면 옮겨온다 */
function teamAssign(tn, k, id){
  const t = teamByName(tn);
  if(!t || !id) return;
  if(t.slots[k]===id){ delete t.slots[k]; return; }
  const at = teamOfStudent(id);
  if(at){
    if(at.t.n===t.n){ const prev=t.slots[k]; t.slots[k]=id; if(prev) t.slots[at.slot]=prev; else delete t.slots[at.slot]; }
    else { delete at.t.slots[at.slot]; t.slots[k]=id; }
  } else t.slots[k]=id;
}
function autoFillTeam(t, pool){
  const want = FORM_ROLES[t.form] || {};
  const slots = formSlots(t.form).filter(k=> !t.slots[k]);
  const take = (roles)=>{
    if(roles){
      for(const r of roles){
        const i = pool.findIndex(x=> roleOf(x)===r);
        if(i>=0) return pool.splice(i,1)[0];
      }
    }
    return pool.length ? pool.shift() : null;   // 조건에 맞는 학생이 없으면 전투력 순
  };
  const filled = [];
  slots.forEach(k=>{
    const st = take(want[k]);
    if(st){ t.slots[k] = st.id; filled.push({slot:k, st, want:want[k]||null}); }
  });
  return filled;
}
function autoFillAllTeams(){
  const taken = new Set();
  teamsOf().forEach(t=> formSlots(t.form).forEach(k=>{ if(t.slots[k]) taken.add(t.slots[k]); }));
  const pool = S.students.filter(x=> !taken.has(x.id)).sort((a,b)=> power(b)-power(a));
  const out = [];
  teamsOf().forEach(t=>{
    const f = autoFillTeam(t, pool);
    if(f.length) out.push({t, filled:f});
  });
  return out;
}
function teamOfStudent(id){
  for(const t of teamsOf()){
    for(const k of formSlots(t.form)) if(t.slots[k]===id) return {t, slot:k};
  }
  return null;
}

/* 가중치대로 겹치지 않게 n 개를 뽑는다 */
function relicAffixPick(n){
  const left = RELIC_AFFIX.slice(), out = [];
  while(out.length < n && left.length){
    const tot = left.reduce((a,x)=> a + (x.w||1), 0);
    let r = RNG()*tot, i = 0;
    for(; i < left.length-1; i++){ r -= (left[i].w||1); if(r < 0) break; }
    out.push(left.splice(i,1)[0]);
  }
  return out;
}

                    "S+":["초월한","영겁의","찬란한"]};
const RELIC_GRADE_AFFIX = {C:1,B:2,A:3,S:4};
const GRADE_COLOR = {D:"var(--dim)",C:"var(--muted)",B:"var(--tank)",A:"var(--supp)",S:"var(--brass)","S+":"#2A9D74",EX:"var(--ex)"};
function mentalGrade(value){

  return v>=100?"EX":v>=85?"S":v>=70?"A":v>=55?"B":v>=40?"C":v>=25?"D":v>=10?"E":"F";
}

  return `<b class="mental-grade" style="color:${color}" aria-label="${grade} 등급">${grade}</b>`;
}


const RELIC_POWER = 1.2;    // 유물 효과 배율
function makeRelic(grade){
  const n = RELIC_GRADE_AFFIX[grade]||1;
  const pool = relicAffixPick(n);
  const mul = ({C:.6,B:.85,A:1.1,S:1.4}[grade]) * RELIC_POWER;
  const aff = pool.map(a=>{
    let v = rnd(a.v[0],a.v[1])*mul;
    if(a.int) v = Math.max(1,Math.round(v)); else v = Math.round(v*1000)/1000;
    return {k:a.k,n:a.n,v};
  });
  return {id:"r"+RNG().toString(36).slice(2,9), grade, name:pick(RELIC_ADJ[grade])+" "+pick(RELIC_NOUN), aff};
}

/* ============================================================
   훈련 카드 — 한 주는 월~금 다섯 칸, 손패 9장에서 골라 채운다
   ============================================================ */
const WEEK_DAYS = 5;
const DAY_N     = ["월","화","수","목","금"];
const HAND_SIZE = 9;
const DAY_MUL   = .2;      // 1주를 5칸으로 나눴으니 훈련·휴식 증가치는 20%
const CHAIN_STEP= .25;     // 전날과 같은 색이 이어질 때마다 +25% (최대 +100%)
const CHAIN_MAX = 4;
const CARD_COLOR = {
  red  : {n:"적",   c:"#e0616a", s:"rgba(224,97,106,.14)"},
  green: {n:"녹",   c:"#54ae70", s:"rgba(84,174,112,.14)"},
  blue : {n:"청",   c:"#5b87dd", s:"rgba(91,135,221,.14)"},
  sky  : {n:"하늘", c:"#48c3d8", s:"rgba(72,195,216,.14)"},
  gold : {n:"황",   c:"#d9a63c", s:"rgba(217,166,60,.14)"},
  none : {n:"무",   c:"#8a8f98", s:"rgba(138,143,152,.10)"}
};
const CARD_COL = {
  mock:"red",  spar:"red",
  basic:"green", heavy:"green",
  tact:"blue", form:"blue",
  medit:"sky", deep:"sky",
  free:"gold", strike:"gold",
  rest:null,          // 뽑을 때 다섯 색 중 하나를 달고 들어온다
  exped:"none"        // 무색 — 체인에 끼지 않는다
};
const REST_COLORS = ["green","red","blue","sky","gold"];
/* 카드 한 장의 실제 색 — 휴식은 카드마다 다르다 */
function colOf(c){
  if(!c) return null;
  if(typeof c === "string") return CARD_COL[c] || "none";
  return c.c || CARD_COL[c.t] || "none";
}
const DECK_BASE = ["rest","basic","spar","tact","medit","free","exped"];
const DECK_ITEM = ["form","heavy","strike","deep","mock"];
function cardColor(t){ return CARD_COLOR[colOf(t)] || CARD_COLOR.none; }
/* 지금 뽑힐 수 있는 카드 — 아이템을 사면 그 훈련이 덱에 들어온다 */
function deckPool(){
  const a = DECK_BASE.slice();
  DECK_ITEM.forEach(id=>{ const t=TR[id]; if(t && t.need && S.items && S.items[t.need]) a.push(id); });
  return campNoExped() ? a.filter(id=> id!=="exped") : a;   // 합숙 중에는 원정을 나가지 않는다
}
function campNoExped(){ return typeof isCampWeek==="function" && isCampWeek(); }
/* ── 카드 표식 ──
   낮은 확률로 카드가 표식을 달고 들어온다. 그 카드를 쓴 날에만 효과가 붙는다. */
const CARD_MARK_P = .10;                 // 표식이 붙을 확률
const CARD_MARK = {
  heal : {n:"회복", i:"✚",  w:40, mul:1,  cond:+1, c:"var(--ok)",    d:"쓰는 날 전원 컨디션 +1"},
  dbl  : {n:"두 배", i:"×2", w:40, mul:2,  cond:0,  c:"var(--brass)", d:"그날 훈련 효과가 두 배"},
  skull: {n:"소진", i:"☠",  w:10, mul:1,  cond:-1, c:"var(--bad)",   d:"쓰는 날 전원 컨디션 −1"},
  half : {n:"절반", i:"½",  w:10, mul:.5, cond:0,  c:"var(--dim)",   d:"그날 훈련 효과가 절반"}
};
const CARD_MARK_W = Object.keys(CARD_MARK).reduce((a,k)=>{ a[k]=CARD_MARK[k].w; return a; }, {});
function markOf(c){ return (c && c.m && CARD_MARK[c.m]) ? CARD_MARK[c.m] : null; }
/* 휴식과 원정은 덱이 늘어나도 뽑힐 확률이 고정이고,
   남은 몫을 훈련 카드가 똑같이 나눠 갖는다.
   합숙 기간처럼 원정이 덱에서 빠지면 그 몫도 훈련 카드로 돌아간다. */
const CARD_FIXED_P = {rest: 1/6, exped: 1/7};
const CARD_FIXED = Object.keys(CARD_FIXED_P);
function cardWeights(){
  const pool = deckPool();
  const fixed = CARD_FIXED.filter(id=> pool.indexOf(id) >= 0);
  const train = pool.filter(id=> CARD_FIXED.indexOf(id) < 0);
  const w = {};
  if(!train.length){ pool.forEach(id=> w[id] = 1); return w; }
  let used = 0;
  fixed.forEach(id=>{ w[id] = CARD_FIXED_P[id] || 0; used += w[id]; });
  const share = Math.max(0, 1 - used) / train.length;
  train.forEach(id=> w[id] = share);
  return w;
}
function drawCardType(){ return wchoose(cardWeights()); }
/* 손패 수명 — 뽑힌 카드는 CARD_LIFE 주 동안만 쥘 수 있다. w = 뽑힌 시점의 주 일련번호(S.weekSeq).
   남은 주 = CARD_LIFE - (지난 주 수). 0 이 되면 주가 끝날 때 사라진다. w 가 없는 옛 카드는 새 카드로 본다 */
const CARD_LIFE = 3;
function cardLeft(c){ if(!c || c.w==null) return CARD_LIFE; return CARD_LIFE - ((S.weekSeq|0) - (c.w|0)); }
function cardLeftText(n){ return n<=1 ? "이번 주까지" : `${Math.min(n,CARD_LIFE)}주`; }
function handExpire(){
  const gone = (S.hand||[]).filter(c=> c && cardLeft(c) <= 0);
  if(!gone.length) return 0;
  S.hand = S.hand.filter(c=> !(c && cardLeft(c) <= 0));
  logE(`일과 — ${CARD_LIFE}주 동안 쓰지 않은 카드 <b>${gone.length}장</b>(${gone.map(c=> (TR[c.t]||TR.free).n).join(" · ")})이 사라졌다.`, "");
  return gone.length;
}
function newCard(){
  S.cardSeq = (S.cardSeq||0)+1;
  const c = {u:S.cardSeq, t:drawCardType(), w:(S.weekSeq|0)};
  if(CARD_COL[c.t] === null) c.c = pick(REST_COLORS);
  if(RNG() < CARD_MARK_P) c.m = wchoose(CARD_MARK_W);
  return c;
}
/* 튜토리얼 12 — 표식이 붙은 카드가 처음 손패(또는 칸)에 들어온 주에 한 번 */
function tryMarkTut(){
  if(tutSeen("12")) return false;
  const has = (S.hand||[]).some(c=> c && c.m) || (S.slots||[]).some(c=> c && c.m);
  if(!has) return false;
  UI.ceremonies = UI.ceremonies||[];
  if(UI.ceremonies.some(c=> c.type==="tut" && c.page==="12")) return false;
  queueCeremony({type:"tut", page:"12"});
  return true;
}
function handInit(){
  S.hand = []; S.slots = Array(WEEK_DAYS).fill(null); S.cardSeq = 0;
  for(let i=0;i<HAND_SIZE;i++) S.hand.push(newCard());
}
/* 손패 보충 — 손패 + 칸에 올린 카드가 합쳐 HAND_SIZE 가 되도록만 채운다.
   (칸에 다섯 장을 올린 채 화면이 다시 열리면(폰 탭 복원 등) 손패만 9장으로 채워져 14장이 되던 버그 방지) */
function handRefill(){
  S.hand = S.hand||[];
  const placed = (S.slots||[]).filter(Boolean).length;
  let n=0;
  while(S.hand.length + placed < HAND_SIZE){ S.hand.push(newCard()); n++; }
  handTrim();
  return n;
}
/* 어떤 경로로든 손패 + 칸이 HAND_SIZE 를 넘었으면, 손패 뒤쪽(가장 나중에 들어온 카드)부터 잘라낸다 */
function handTrim(){
  const placed = (S.slots||[]).filter(Boolean).length;
  const over = (S.hand||[]).length + placed - HAND_SIZE;
  if(over <= 0) return 0;
  S.hand.splice(S.hand.length - over, over);
  logE(`일과 정리 — 규정 ${HAND_SIZE}장을 넘은 카드 ${over}장을 치웠다.`, "");
  return over;
}
function slotPut(u, day){
  if(day<0 || day>=WEEK_DAYS) return;
  const hi = (S.hand||[]).findIndex(c=>c && c.u===u);
  if(hi>=0){
    const card = S.hand.splice(hi,1)[0];
    if(S.slots[day]) S.hand.push(S.slots[day]);
    S.slots[day] = card;
    return;
  }
  const j = (S.slots||[]).findIndex(c=>c && c.u===u);
  if(j<0 || j===day) return;
  const tmp = S.slots[day]; S.slots[day] = S.slots[j]; S.slots[j] = tmp;   // 슬롯끼리는 자리 교환
}
function slotClear(day){
  if(!S.slots || !S.slots[day]) return;
  S.hand.push(S.slots[day]); S.slots[day] = null;
}
function slotsFull(){ return (S.slots||[]).filter(Boolean).length === WEEK_DAYS; }
/* 자동 배치 — 컨디션을 보고 고르고, 같은 색끼리 붙여 체인을 만든다 */
function autoFillSlots(){
  S.slots = S.slots || Array(WEEK_DAYS).fill(null);
  S.hand = S.hand || [];
  /* 손패는 채우지 않는다 — 손패 9장은 주가 끝날 때만 다시 받는다. 이미 올린 카드만큼 손패가 줄어 있어야 한다 */
  const need = WEEK_DAYS - S.slots.filter(Boolean).length;
  if(need<=0) return;
  const avg = S.students.length ? S.students.reduce((a,s)=>a+s.cond,0)/S.students.length : 100;
  const pri = c=> c.t==="exped" ? 0 : c.t==="rest" ? (avg<55 ? 3 : 1) : 2;
  const cnt = {};
  S.hand.forEach(c=>{ const k=colOf(c); cnt[k]=(cnt[k]||0)+1; });
  const picked = S.hand.slice().sort((a,b)=>{
    const pa=pri(a), pb=pri(b);
    if(pa!==pb) return pb-pa;
    const ka=colOf(a), kb=colOf(b);
    if(cnt[ka]!==cnt[kb]) return cnt[kb]-cnt[ka];
    return ka<kb? -1 : ka>kb? 1 : 0;
  }).slice(0, need);
  picked.sort((a,b)=>{ const ka=colOf(a), kb=colOf(b); return ka<kb?-1:ka>kb?1:0; });
  for(let d=0; d<WEEK_DAYS && picked.length; d++){
    if(S.slots[d]) continue;
    const c = picked.shift();
    const i = S.hand.findIndex(x=>x.u===c.u);
    if(i>=0) S.hand.splice(i,1);
    S.slots[d] = c;
  }
  while(S.slots.filter(Boolean).length < WEEK_DAYS){
    const d = S.slots.findIndex(x=>!x);
    S.slots[d] = S.hand.shift() || newCard();   // 손패가 비면 그 자리만 새 카드로
  }
}
/* 전날부터 거슬러 올라가 같은 색이 몇 장 이어졌는지 — 10%씩, 최대 40% */
function chainOf(list, i){
  if(!list || !list[i]) return 0;
  const c = colOf(list[i]);
  if(!c || c === "none") return 0;          // 무색 카드는 체인을 받지도 잇지도 않는다
  let n = 0;
  for(let k=i-1; k>=0; k--){ if(list[k] && colOf(list[k])===c) n++; else break; }
  return Math.min(n, CHAIN_MAX) * CHAIN_STEP;
}

function missionCur(){ const m=S.mission; return (m && m.idx<MISSIONS.length)? MISSIONS[m.idx] : null; }
function missionDeadline(){
  const c = missionCur(); if(!c || !c.years) return null;
  return S.mission.startYear + c.years - 1;
}
function missionProgress(step){
  const c = missionCur();
  if(!c || c.step!==step) return;
  S.mission.done.push({id:c.id, n:c.n, year:S.year});
  S.mission.idx++;
  S.mission.startYear = S.year;
  if(c.unlock && !unlocked(c.unlock)){
    S.pendingUnlock = (S.pendingUnlock||[]).concat([c.unlock]);
    logE(`<b>${UNLOCKS[c.unlock].n}</b> 참가 자격을 얻었다 — 초대장은 내년 입학식에 도착한다.`,"big");
  }
  const nx = missionCur();
  logE(`<b>지침 달성 — ${c.n}</b>${nx? ` · 다음 지침: ${nx.n}` : " · 모든 지침을 완수했다"}`,"big");
  toast(`지침 달성 — ${c.n}`);
}

const PHASE_WEEKS = 12;
const VAC_WEEKS   = 6;         // 방학 계절 (여름 · 겨울) — 절반 길이
const HALF_WEEKS = 6;          // 상반기 / 하반기 경계 (12주 계절 기준)
const PHASES = {
  spring:{n:"봄",  weeks:PHASE_WEEKS, d:"신학기 · 친선전"},
  summer:{n:"여름",weeks:VAC_WEEKS,   d:"여름 합숙"},
  fall:  {n:"가을",weeks:PHASE_WEEKS, d:"시내 대회, 광역 대회, 학원제"},
  winter:{n:"겨울",weeks:VAC_WEEKS,   d:"스카우트, 친선전, 신인전"}
};
/* 주차(0-based)가 하반기인가 */
function phaseWeeks(ph){ return ((PHASES[ph||S.phase]||{}).weeks) || PHASE_WEEKS; }
function halfWeeks(ph){ return Math.floor(phaseWeeks(ph)/2); }
function isLateHalf(w, ph){ return (w|0) >= halfWeeks(ph); }
function halfLabel(w){ return isLateHalf(w) ? "하반기" : "상반기"; }
function halfStart(w){ return isLateHalf(w) ? halfWeeks() : 0; }
function halfEnd(w){ return isLateHalf(w) ? phaseWeeks() : halfWeeks(); }
function halfLeft(){ return Math.max(0, halfEnd(S.week) - S.week); }
const PHASE_ORDER = ["spring","summer","fall","winter"];
/* 연도 표시 (0926) — 1년차 = 왕국력 231년. 저장은 그대로 1, 2, 3… 으로 두고 보여줄 때만 바꾼다 */

/* 졸업 기록에서 전투에 세울 수 있는 유닛을 되살린다.
   멘탈리티가 안 남아 있는 옛 기록은 되살릴 수 없다 (null). */
function gradCanFight(g){ return !!(g && g.ment && g.job && JOBS[g.job]); }
function gradUnit(g){
  if(!gradCanFight(g)) return null;
  const st = newStudent(3, g.grade || "C", g.job);
  st.id = "g" + (g.sid || RNG().toString(36).slice(2,9));
  st.name = g.raw || g.name || st.name;
  st.epithet = g.epithet || null;
  st.pers = g.pers || "plain";
  st.level = Math.max(1, g.lv|0);
  st.exp = 0; st.injured = 0; st.focus = "free"; st.cond = 100; delete st._injFocus;
  st.karma = g.karma|0; st.trust = 0; st.rival = null; st.bro = null;
  /* 졸업생 멘탈리티는 소수점을 버린 값으로 되살린다 — 리그에 올리는 값 · 순위표 · 전투력 표시가 모두 같아진다 */
  MENTAL.forEach(m=>{ if(g.ment[m.k] != null) st.ment[m.k] = Math.floor(g.ment[m.k]); });
  st.skMod = JSON.parse(JSON.stringify(g.skMod || {}));
  st.relics = (g.relics||[]).map(r=>({id:"r"+RNG().toString(36).slice(2,9),
    grade:r.grade, name:r.name, aff:(r.aff||[]).map(a=>({k:a.k,n:a.n,v:a.v}))}));
  return st;
}
/* 등급별 잠재력 구간 — 넓힌 뒤에도 옛 기록을 옮길 수 있게 이전 구간을 함께 둔다 */
const POT_RANGE = {D:[25,39], C:[40,54], B:[55,69], A:[70,84], S:[85,99]};
const POT_RANGE_OLD = {D:[10,20], C:[21,40], B:[41,60], A:[61,80], S:[81,99]};
const POT_VER = 1;
/* 등급 안에서의 상대 위치를 지키며 새 구간으로 옮긴다 */
function potMigrate(o){
  if(!o || !o.ment || typeof o.ment.pot !== "number") return;
  const a = POT_RANGE_OLD[o.grade] || POT_RANGE_OLD.C;
  const b = POT_RANGE[o.grade] || POT_RANGE.C;
  const t = (a[1] > a[0]) ? clamp((o.ment.pot - a[0]) / (a[1] - a[0]), 0, 1) : .5;
  o.ment.pot = clamp(Math.round(b[0] + t*(b[1]-b[0])), 1, 99);
  if(o.cap) delete o.cap;          // 한계는 새 잠재력으로 다시 정해진다
}
function newStudent(year, grade, job){
  grade = grade || wchoose({D:30,C:40,B:22,A:7,S:1});
  job = job || pick(JOB_KEYS);
  const g = {D:0,C:1,B:2,A:3,S:4}[grade];
  const m = {};
  MENTAL.forEach(x=>{
    if(x.k==="pot"){ const r = POT_RANGE[grade]||POT_RANGE.D; m.pot = ri(r[0], r[1]); return; }
    m[x.k] = Math.round(clamp(rnd(8,20) + g*rnd(3.5,6.5),5,95));
  });
  const st = {
    id:"s"+RNG().toString(36).slice(2,9),
    name: freshName(job), job, year, grade,
    level:1, exp:0, cond:ri(78,96), fame:0, eval:0,
    ment:m, focus:"auto", relics:[], skMod:{}, sp:0, hist:[], injured:0, karma:0, trust:0, epithet:null,
    pers: wchoose(PERSONA_KEYS.reduce((a,k)=>{ a[k]=PERSONA[k].w; return a; }, {}))
  };
  applyPersona(st);
  rollMentCaps(st);                 // 항목별 한계는 입학할 때 정해진다
  st.ment0 = Object.assign({}, st.ment);   // 졸업 증서용 — 입학 당시 멘탈리티

  // 상급생은 이미 어느 정도 성장해 있다
  const preLv = year===1?0 : year===2? ri(4,7) : ri(9,14);
  for(let i=0;i<preLv;i++) levelUp(st,true);
  if(year>1){
    MENTAL.forEach(x=>{ if(x.k!=="pot") st.ment[x.k]=Math.round(clamp(st.ment[x.k]+ (year-1)*rnd(6,15),5,mentCapOf(st, x.k))); });
    st.fame = Math.round((year-1)*rnd(10,45));
  }
  const slots = relicSlots(st);
  for(let i=0;i<Math.min(slots, year-1);i++) st.relics.push(makeRelic(wchoose({C:60,B:30,A:10})));
  return st;
}
/* 유물 칸 — 기본 1칸, 5레벨마다 하나씩 (5·10·15레벨), 최대 4칸 */
const RELIC_SLOT_MAX = 4, RELIC_SLOT_EVERY = 5;
function relicSlots(st){ return Math.min(RELIC_SLOT_MAX, 1 + Math.floor((st.level||1)/RELIC_SLOT_EVERY)); }
/* 성장 곡선 — 11·21 레벨에서 기울기를 올린다. 이음매에서 값이 튀지 않게 계수를 맞춰 뒀다. */
function expNeed(lv){
  if(lv < 11) return Math.round(80 + lv*32 + Math.pow(lv,1.7)*5);
  if(lv < 21) return Math.round(80 + lv*40 + Math.pow(lv,2.0)*5);
  return              Math.round(80 + lv*20 + Math.pow(lv,2.3)*4.5);
}

function levelUp(st, silent){
  st.level++;
  // 2레벨마다 스킬 강화 포인트
  if(st.level%2===0){
    st.sp = (st.sp||0)+1;
    if(!silent) logE(`<b>${dnH(st)}</b> — 스킬 강화 포인트 획득 (보유 ${st.sp})`,"good");
  }
  const before = st.relics.length, slots = relicSlots(st);
  if(!silent && slots>before && st.level%RELIC_SLOT_EVERY===0) logE(`<b>${dnH(st)}</b> 레벨 ${st.level} — 유물 칸 ${slots}개로 확장`,"good");
  if(!silent) logE(`<b>${dnH(st)}</b> 레벨 ${st.level} 달성`,"good");
}
const EXP_MUL = .5;   // 전체 경험치 획득 배율
function gainExp(st, amt, quiet){
  amt = Math.round((amt||0) * EXP_MUL);
  st.exp += amt;
  st.totalExp = (st.totalExp||0) + amt;
  let n=0;
  while(st.level<30 && st.exp >= expNeed(st.level)){ st.exp -= expNeed(st.level); levelUp(st, quiet); n++; }
  if(n) lvupQueue(st, st.level - n);
  return n;
}
/* 레벨업 팝업 (0929) — 재학생이 레벨이 오르면 한 명씩 차례로 띄운다. 같은 학생이 아직 안 본 팝업이 있으면 그 팝업에 합친다 */
function lvupQueue(st, lv0){
  if(PREF.lvPopup === false || typeof S === "undefined" || !S || !(S.students||[]).includes(st)) return;
  const q = UI.ceremonies = UI.ceremonies || [];
  const c = q.find(x=> x.type==="lvup" && x.sid===st.id);
  if(c){ c.lv1 = st.level; return; }
  q.push({type:"lvup", sid:st.id, lv0, lv1:st.level});
}
function lvupCeremony(c){
  const st = (S.students||[]).find(x=> x.id===c.sid);
  setTimeout(()=> sfxPlay("levelup"), 80);
  if(!st) return `<div class="cerhead"><h2 style="font-size:26px">레벨 업!</h2></div>
    <div class="btnrow" style="margin-top:16px"><button class="btn primary" id="cerOk">확인</button></div>`;
  const lv0 = c.lv0, lv1 = Math.max(c.lv1, lv0);
  const A = battleStats(st), B = battleStats(Object.assign({}, st, {level:lv0}));

  }).join("");
  const sp = Math.floor(lv1/2) - Math.floor(lv0/2);

  const extra = [
    sp>0? `<div class="lvnote">스킬 강화 포인트 <b>+${sp}</b> <span>(보유 ${st.sp||0})</span></div>` : "",
    sl1>sl0? `<div class="lvnote">장착 가능한 유물 칸 <b>${sl0} → ${sl1}칸</b></div>` : ""
  ].join("");
  return `<div class="cerhead">
      <div class="eyebrow">${dnH(st)} · ${esc(JOBS[st.job].name)}</div>
      <h2 style="font-size:28px;margin-top:2px">레벨 업!</h2>
      <p style="color:var(--muted);font-size:13.5px;margin-top:4px"><b class="num" style="color:var(--brass)">Lv.${lv0} → Lv.${lv1}</b></p></div>
    <div class="lvstage">${sprHas(st.job)? sprHTML(st.job, "win", 1.2, {p:sprPalOf(st), once:true}) : (faceHas(st.job)? faceHTML(st.job, dn(st)) : "")}</div>
    <div class="lvrows">${rows}</div>
    ${extra}
    <div class="btnrow" style="margin-top:16px;align-items:center">
      <label class="lvnever"><input type="checkbox" id="lvNever"> 이후 보지 않음</label>
      <button class="btn primary" id="cerOk" style="margin-left:auto">확인</button></div>`;
}
/* 경기 한 판 요약 — "16강 · vs 백결 학원 · 승리 · 생존 3명" */
function matchAlive(sc){
  const a = String(sc||"").split("-");
  return {me:(+a[0])||0, foe:(+a[1])||0, ok:a.length>1 && a[0]!==""};
}
function matchLine(r){
  const al = matchAlive(r.score);
  const bits = [];
  if(r.label) bits.push(esc(r.label));
  if(r.vs) bits.push("vs " + esc(r.vs));
  bits.push(r.win? "승리" : "패배");
  if(al.ok) bits.push(`생존 ${al.me}명`);
  return bits.join(" · ");
}

/* 표시용 이름 — 이명이 있으면 이름 앞에 붙는다 */
/* 이벤트 팝업(의식)을 그리는 동안에는 이명을 빼고 이름만 쓴다 (0929) — NAME_PLAIN 이 켜져 있을 때 */
let NAME_PLAIN = false;
function dn(st){ if(!st) return ""; return (st.epithet && !NAME_PLAIN) ? ("\u201c" + st.epithet + "\u201d " + st.name) : st.name; }
/* 저장된 이름 문자열도 그대로 받아 이명 부분만 황동색으로 */
function epiH(nm){
  const v = String(nm==null? "" : nm);
  const m = v.match(/^\u201c([^\u201d]+)\u201d\s+([\s\S]+)$/);
  if(m && NAME_PLAIN) return esc(m[2]);
  return m ? `<span class="epi">\u201c${esc(m[1])}\u201d</span> ${esc(m[2])}` : esc(v);
}
function dnH(st){ return epiH(dn(st)); }
function hasEpi(st){ return !!(st && st.epithet); }
function epiPool(job, key){ const M = key==="t"? EPI_TITLES : EPI_DEEDS; return M[job] || M.sword; }
function pickEpiTitle(st){
  // 현재 학원에서 쓰이는 이명만 피한다 (자기 이명 포함 — 반드시 바뀐다)
  const used = new Set((S.students||[]).map(x=>x.epithet).filter(Boolean));
  const all = epiPool(st.job, "t");
  const left = all.filter(t=> !used.has(t));
  if(left.length) return pick(left);
  const other = all.filter(t=> t !== st.epithet);   // 최소한 지금 이명과는 달라야 한다
  return pick(other.length? other : all);
}
function epiScene(kind, st, ctx){
  const nm = st.name;
  const where = (kind==="exped")
    ? `${ctx.place}에서 ${ctx.foe}${eulr(ctx.foe)} 상대로`
    : `${ctx.foeAcad}의 ${ctx.foe}${eulr(ctx.foe)} 상대로`;
  return `${S.acadName}의 ${nm}${eunn(nm)} ${where} ${ctx.deed}`;
}
const EPI_FAME = 50;   // 이명을 얻으면 개인 명성이 이만큼 오른다
function grantEpithet(kind, st, ctx){
  const prev  = st.epithet || null;
  const title = pickEpiTitle(st);
  const deed  = pick(epiPool(st.job, "d"));
  const c = Object.assign({}, ctx, {deed});
  st.fame = Math.round((st.fame||0) + EPI_FAME);
  const rec = {kind, sid:st.id, name:st.name, job:st.job, title, prev,
    scene: epiScene(kind, st, c), crowd: EPI_CROWD[kind] || "사람들",
    fame: EPI_FAME, fameNow: Math.round(st.fame),
    event: ctx.event||"", year:S.year, phase:S.phase, week:S.week+1};
  st.epithet = title;
  S.epiUsed = (S.epiUsed||[]).concat([title]);
  S.epiLog = (S.epiLog||[]); S.epiLog.unshift(rec); if(S.epiLog.length>80) S.epiLog.length=80;
  logE(prev
    ? `이명 — <b>${esc(st.name)}</b>의 이름이 <span style="color:var(--dim)">&ldquo;${esc(prev)}&rdquo;</span>에서 <b style="color:var(--brass)">&ldquo;${esc(title)}&rdquo;</b>${ro(title)} 바뀌었다. (${esc(rec.event)})`
    : `이명 — <b>${esc(st.name)}</b>에게 <b style="color:var(--brass)">&ldquo;${esc(title)}&rdquo;</b>${jo(title,"이라는","라는")} 이름이 붙었다. (${esc(rec.event)})`,"big");
  logE(`<b>${esc(st.name)}</b>의 개인 명성 <b style="color:var(--brass)">+${EPI_FAME}</b> → ${fmt(st.fame)}`,"good");
  queueCeremony({type:"epithet", rec});
  return rec;
}
/* 대회·친선전 공통 — 승리한 경기가 있으면 그 경기의 활약자에게 */
function tryEpithetTour(kind, t, parts, eventName){
  const wins = (t.results||[]).filter(r=>r.win);
  if(!wins.length) return null;
  const pool = [...parts].map(id=> S.students.find(x=>x.id===id)).filter(Boolean);
  const winOf = s => wins.filter(r=> (r.myIds||[]).includes(s.id)).length;
  const cand = pool.filter(s=> winOf(s) > 0);
  if(!cand.length) return null;
  const top = cand.reduce((a,b)=> winOf(b)>winOf(a)? b:a, cand[0]);
  const r = wins.find(x=> (x.myIds||[]).includes(top.id)) || wins[0];
  const foes = (r.foes||[]).filter(Boolean);
  return tryEpithet(kind, cand, {
    event: eventName, foeAcad: r.vs || "상대 학원",
    foe: foes.length? pick(foes) : (r.vs||"상대"),
    score: s=> 1 + winOf(s)*2            // 승리한 경기가 많을수록 가중치
  });
}
/* 이벤트마다 최대 1명 */
/* 활약이 클수록 뽑힐 확률이 높되, 나머지에게도 기회가 간다 */
const EPI_HAS_MUL = .5;   // 이미 이명이 있으면 다시 뽑힐 가중치 절반
function epiWeight(s, score){
  let w = Math.max(.15, score(s) || 0);
  if(hasEpi(s)) w *= EPI_HAS_MUL;
  return w;
}
function tryEpithet(kind, pool, ctx){
  const cand = (pool||[]).filter(Boolean);   // 이미 이명이 있어도 대상 — 새 이명이 덮어쓴다
  if(!cand.length) return null;
  if(RNG() >= (EPI_CHANCE[kind] != null ? EPI_CHANCE[kind] : .3)) return null;
  const score = ctx.score || (s=> 1 + power(s)/1200);
  const ws = cand.map(s=> epiWeight(s, score));
  const tot = ws.reduce((a,b)=>a+b, 0);
  if(tot <= 0) return grantEpithet(kind, pick(cand), ctx);
  let r = RNG()*tot, chosen = cand[cand.length-1];
  for(let i=0;i<cand.length;i++){ r -= ws[i]; if(r <= 0){ chosen = cand[i]; break; } }
  return grantEpithet(kind, chosen, ctx);
}
