<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 얼굴 프로필 새 원화</title><style>body{margin:0;background:#25252c;color:#efe4ce;font:16px system-ui;padding:24px}h1{font-size:26px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:#37353a;border:1px solid #625645;border-radius:16px;padding:16px;text-align:center}h2{font-size:18px;margin:0 0 8px}.large{width:180px;height:180px;object-fit:contain}.sizes{display:flex;align-items:center;justify-content:center;gap:12px;background:#e8d6b7;border-radius:12px;padding:10px;color:#483627}.sizes img{object-fit:contain}small{display:block;margin:6px;color:#cdbb9f}</style><h1>학생 얼굴 프로필 · 새 원화</h1><p>전투 캐릭터의 외형을 유지한 얼굴 전용 일러스트입니다. 아래는 기존 48px / 새 48px / 새 72px 비교입니다.</p><main></main><script>const jobs={paladin:'팔라딘',sword:'소드맨',monk:'몽크',druid:'드루이드',archer:'아처',rogue:'로그',wizard:'마법사',forcemage:'배틀메이지',spellsword:'마법검사',gunner:'거너',ninja:'닌자',priest:'프리스트',darkpriest:'암흑 사제',timemage:'타임 매지션',enchanter:'인챈터',bard:'바드'};document.querySelector('main').innerHTML=Object.entries(jobs).map(([k,n])=>`<article><h2>${n}</h2><img class="large" src="${k}.png"><div class="sizes"><img width="48" height="48" src="../face_img/${k}.webp"><img width="48" height="48" src="${k}.png"><img width="72" height="72" src="${k}.png"></div></article>`).join('')</script></html>
