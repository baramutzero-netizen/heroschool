<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아처 · 스타일리시 스킬</title><style>body{margin:0;background:#191e20;color:#e7f2eb;font:16px system-ui}main{max-width:1200px;margin:auto;padding:28px}p{color:#adbfb5}article{margin:30px 0}img{max-width:100%;border-radius:12px}.assets{display:flex;gap:12px;flex-wrap:wrap}.assets img{width:45%;object-fit:contain;background:#333b39}</style><main><h1>아처 · 스타일리시 스킬</h1><article><h2>조준 사격</h2><p>직업 고유: 주변을 감싸는 녹색 바람줄기</p><img src="skill-ar_b-A-archer.png?v=perspective-rain"></article><article><h2>관통 화살</h2><p>첫 대상 바로 앞에서 시작해 적 대열을 꿰뚫고 화면 밖까지 이어지는 녹색 빛줄기</p><img src="skill-ar_1-A-archer.png?v=perspective-rain"></article><article><h2>매의 눈</h2><p>머리 위의 매 얼굴 선화</p><img src="skill-ar_2-A-archer.png?v=perspective-rain"></article><article><h2>유성 화살</h2><p>시전자 쪽 상단에서 퍼지는 녹색 빛의 폭우. 가는 빛은 대상 뒤로, 굵은 빛은 앞으로 쏟아지며 복부에 섬광이 발생합니다. 단일 대상 유지.</p><img src="skill-ar_u-A-archer.png?v=perspective-rain"></article><article><h2>반대 방향</h2><img src="skill-ar_1-B-archer.png?v=perspective-rain"><img src="skill-ar_u-B-archer.png?v=perspective-rain"></article><article><h2>전수받은 유성 화살</h2><img src="skill-ar_u-A-paladin.png?v=perspective-rain"></article><div class="assets"><img src="wind.png" alt="wind"><img src="pierce-offscreen.png" alt="pierce"><img src="hawk-outline.png" alt="hawk"><img src="meteor-perspective-back.svg" alt="meteor"></div></main></html>
