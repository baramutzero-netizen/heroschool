<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>닌자 · 스타일리시 스킬</title><style>body{margin:0;background:#191e20;color:#e7f2eb;font:16px system-ui}main{max-width:1200px;margin:auto;padding:28px}p{color:#adbfb5}article{margin:30px 0}img{max-width:100%;border-radius:12px}.assets{display:flex;gap:12px;flex-wrap:wrap}.assets img{width:45%;object-fit:contain;background:#333b39}.spin-demo{height:160px;display:grid;place-items:center;overflow:hidden;background:#303b40}.spin-plane{width:300px;height:300px;transform:rotate(-18deg) scaleY(.65)}.spin-plane img{width:100%;animation:spin .514s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style><main><h1>닌자 · 스타일리시 스킬</h1><article><h2>파도로 이루어진 고속 회전 잔상</h2><div class="spin-demo"><div class="spin-plane"><img src="fuma-water-spin.png" alt="고속 회전하는 수리검"></div></div></article><p>일본 판화풍의 물결과 포말. 직업 고유 효과와 스킬 대상 효과를 분리합니다.</p><article><h2>쿠나이</h2><p>시전자 발밑의 일렁이는 물결</p><img src="skill-nj_b-A-ninja.png?v=water-material"></article><article><h2>수둔 · 수렁</h2><p>적 주변의 붉은 궤적과 적 그룹 아래의 늪</p><img src="skill-nj_1-A-ninja.png?v=water-material"></article><article><h2>수둔 · 수룡아</h2><p>아래 경계선의 파도에서 대각선으로 솟는 노란 눈의 수룡</p><img src="skill-nj_2-A-ninja.png?v=water-material"></article><article><h2>천류 · 풍마수리검</h2><p>캐릭터 뒤의 파도 꽃 관통 효과와, 적 뒤에서 날이 보이지 않을 만큼 고속 회전하는 납작한 수리검 잔상</p><img src="skill-nj_u-A-ninja.png?v=water-material"></article><article><h2>반대 방향 수룡아</h2><img src="skill-nj_2-B-ninja.png?v=water-material"></article><article><h2>팔라딘이 전수받은 풍마수리검</h2><img src="skill-nj_u-A-paladin.png?v=water-material"></article><div class="assets"><img src="ripple.png" alt="ripple"><img src="swamp.png" alt="swamp"><img src="dragon.png" alt="dragon"><img src="fuma-water-spin.png" alt="회전 수리검"><img src="water-flower.png" alt="관통 물보라"><img src="boundary-wave.png" alt="경계선 파도"></div></main></html>
