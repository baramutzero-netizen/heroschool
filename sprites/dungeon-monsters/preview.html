<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원정 몬스터 14종</title><style>body{margin:24px;background:#eeeaf2;color:#252331;font:15px system-ui}main{max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}article{background:#fff9ed;border:1px solid #c6b893;border-radius:14px;padding:16px}img{width:100%;max-height:230px;object-fit:contain;image-rendering:auto}h2{margin-top:30px}h3{margin:8px 0}p{font-size:13px;line-height:1.7}small{color:#75694d}iframe{display:none}@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}</style><main><h1>원정 몬스터</h1><p>원정별 새로운 적 14종 · 마지막 구간에는 기존 원정지 주인이 등장합니다.</p><div id="list">불러오는 중…</div></main><iframe id="game"></iframe><script>
const f=document.querySelector('iframe');f.onload=()=>{if(!f.srcdoc)return;const data=f.contentWindow.eval(`DUNGEONS.map(d=>({name:d.n,boss:JOBS[d.mon].name,monsters:DUNGEON_MONSTERS[d.id].map(k=>({key:k,...JOBS[k]}))}))`);document.querySelector('#list').innerHTML=data.map(d=>`<h2>${d.name}</h2><small>마지막 구간: ${d.boss}</small><section class="grid">${d.monsters.map(m=>`<article><img src="${m.key}.png"><h3>${m.name}</h3><p>${m.desc}</p>${m.skills.map((s,i)=>`<p><strong>${['기본 공격','스킬 1','스킬 2','필살기'][i]} · ${s.name}</strong><br>${s.txt}</p>`).join('')}</article>`).join('')}</section>`).join('')};fetch('../../heroschool.html').then(r=>r.text()).then(h=>{const isolated=`<script>for(const key of ['localStorage','sessionStorage']){const m=new Map();Object.defineProperty(window,key,{value:{getItem:k=>m.get(String(k))??null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}});}<\/script>`;f.srcdoc=h.replace('<head>','<head>'+isolated)});
</script></html>
