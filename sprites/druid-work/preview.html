<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드루이드 생활 동작 샘플</title><style>body{margin:30px auto;padding:0 20px;max-width:1100px;background:#252327;color:#f4e8cf;font-family:system-ui}button,a{color:inherit}button{background:#544534;padding:10px;border:1px solid #b69c6f;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}article{background:#383238;border-radius:10px;padding:18px;text-align:center}canvas{width:256px;max-width:100%;image-rendering:pixelated}small{display:block;color:#bfae94}p{line-height:1.7}</style><h1>드루이드 전투 · 생활 애니메이션</h1><p>각 4프레임 · 갈색 땋은 머리 · 꽃 장식 · 녹색 망토 / 팔라딘 기준 SD 체형 / SD 비율<br>전투 5종과 생활 6종 · 게임 적용 완료</p><p><button id="play">일시정지</button> <button id="step">한 프레임</button> <a href="druid-complete.png">원본 시트</a> · <a href="druid-complete.aseprite">Aseprite 파일</a></p><main></main><script>
const labels=['대기','공격','피격','쓰러짐','승리','풀 뽑기','걸레로 바닥 닦기','벽 먼지 털기','음식 나르기','명상','책 페이지 넘기기'],dur=[180,100,100,180,180,220,200,220,180,400,300];let playing=true,step=0;const im=new Image;im.src='druid-complete.png?v=initial';const cs=labels.map((n,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${n}</h2><canvas width="256" height="256"></canvas><small>4프레임</small>`;document.querySelector('main').append(a);return a.querySelector('canvas')});document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#step').onclick=()=>{playing=false;step=(step+1)%4;document.querySelector('#play').textContent='재생'};function draw(t){if(im.complete&&im.naturalWidth)cs.forEach((c,i)=>{let f=playing?Math.floor(t/dur[i])%4:step;let x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,256,256);x.drawImage(im,f*im.width/4,i*im.height/11,im.width/4,im.height/11,0,0,256,256);c.nextElementSibling.textContent=`${f+1} / 4프레임`});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
