/* 상대 생성 프로필
   rival — 봄 신인전처럼 우리 또래와 붙는 학원. 우리 신입생과 같은 등급 분포를 쓴다.
   elite — 원래의 강한 학원 (지금은 쓰이지 않지만 남겨둔다)
   mon   — 이름만 몬스터로 바꾼 잡몹 */
const FOE_PROFILE = {
  rival:{ grade:{D:28, C:44, B:21, A:7}, mentK:0.85, mentCap:74, cond:92, named:true },
  elite:{ grade:{C:40, B:40, A:18, S:4}, mentK:1.25, mentCap:92, cond:92, named:true },
  mon:  { grade:{C:40, B:40, A:18, S:4}, mentK:1.00, mentCap:78, cond:92, named:false }
};
function genFoeTeam(level, tone, n, prof){
  n = n||3;
  const P = FOE_PROFILE[prof] || (tone ? FOE_PROFILE.elite : FOE_PROFILE.mon);
  const jobs = shuffle(JOB_KEYS.slice()).slice(0,n);
  return jobs.map(j=>{
    const st = newStudent(1, wchoose(P.grade), j);
    st.level=1; st.exp=0; st.relics=[];
    for(let i=1;i<level;i++) levelUp(st,true);
    st.cond = P.cond;
    MENTAL.forEach(m=>{ if(m.k!=="pot") st.ment[m.k] = clamp(st.ment[m.k] + level*rnd(.6,1.5)*P.mentK, 5, P.mentCap); });
    if(!P.named) st.name = monsterName();
    return st;
  });
}
const MON = ["망령 기사","石 수호상","늪지 추적자","붉은 살쾡이","폐허 술사","뼈 궁수","성소 파수꾼","그림자 무희","심연 사제","시계탑 인형"];
function monsterName(){ return pick(MON); }

/* 원정은 구간마다 전투 팝업을 띄울 수 있도록 단계로 쪼개 둔다 */
const EXPED_GOLD = 8, EXPED_GOLD_TIER = 12;   // 구간당 자금
const EXPED_EXP_MUL = .2;                     // 구간당 경험치 배율
const EXPED_RWD_MUL = .2;                     // 업보·명성·진로 평가 배율
const EXPED_COND = 1;                         // 전투 한 판당 컨디션 소모
/* 화면에 쓰는 실효 수치 */
function dgExp(d){ return Math.round(d.exp * EXPED_EXP_MUL); }
function dgFame(d){ return Math.round((d.fameClear||0) * EXPED_RWD_MUL); }
function dgKarma(d){ return (d.karma||0) * EXPED_RWD_MUL; }
function dgGold(d){ return EXPED_GOLD + d.tier*EXPED_GOLD_TIER; }
function expedInit(dg, team, TM){
  const avgStam = team.reduce((a,s)=>a+mentEff(s).stam,0)/team.length;
  const avgWill = team.reduce((a,s)=>a+mentEff(s).will,0)/team.length;
  const E = {dg:dg, team:team, TM:TM, avgWill:avgWill,
    maxSec: clamp(Math.round(3 + avgStam/12), 1, dg.secs), sec:1, hpLeft:{},
    res:{dg:dg, team:team.map(s=>dn(s)), ids:team.map(s=>s.id), secs:[], exp:0, gold:0,
         relics:[], stopped:null, reached:0, fameGain:0}};
  team.forEach(s=> E.hpLeft[s.id]=1);
  return E;
}
function expedBattle(E){
  const mon = genMonster(E.dg, E.sec);
  const b = runBattle(E.team, mon, Object.assign({titleA:"원정대", titleB:`${mon[0].name} · ${E.sec}구간`, hpA:E.hpLeft},
    E.TM? teamBattleOpt(E.TM) : {}));
  return {b:b, mon:mon};
}
/* 전투 하나를 반영 — 더 갈 수 있으면 true */
function expedApply(E, b, mon){
  const res = E.res;
  res.secs.push({sec:E.sec, win:b.winner==="A", frames:b.frames, foe:mon[0].name});
  b.A.forEach(u=>{ E.hpLeft[u.ref] = u.alive ? clamp(u.hp/u.maxHp + .18, .06, 1) : .25; });
  if(b.winner!=="A"){ res.stopped = `${E.sec}구간 ${mon[0].name}에게 전멸 — 철수`; return false; }
  res.reached = E.sec;
  res.exp += E.dg.exp*(1+E.sec*.14)*EXPED_EXP_MUL;
  const retire = clamp((.02 + E.sec*.015) * (1 - E.avgWill/120), 0, .35);
  if(E.sec < E.dg.secs && Math.random()<retire){ res.stopped = `${E.sec}구간 의식에서 정신이 꺾여 리타이어`; return false; }
  E.sec++;
  if(E.sec > E.maxSec && E.sec <= E.dg.secs){ res.stopped = `지구력 한계 — ${E.sec-1}구간에서 철수`; return false; }
  return E.sec <= E.dg.secs;
}
function expedFinish(E){
  const dg = E.dg, team = E.team, res = E.res, hpLeft = E.hpLeft;
  const charm = S.items.charm ? 1.35 : 1;
  {
    const per = clamp((dg.relicP||.2) * charm, 0, 1);
    for(let i=0;i<res.reached;i++){
      if(Math.random() < per) res.relics.push(makeRelic(wchoose(dg.relic)));
    }
  }
  const ups=[];
  if(res.reached>0){
    res.evalGain = [];
    team.forEach(s=>{
      const cap = dg.evalCap||0, cur = s.eval||0;
      if(cur >= cap) return;
      const g = ((cap-cur)*.13*(res.reached/dg.secs) + res.reached*.25) * EXPED_RWD_MUL;
      const d = addEval(s, g, cap);
      if(d>0) res.evalGain.push(`${dnH(s)} +${d.toFixed(1)}`);
    });
  }
  {
    const tids = team.map(x=>x.id);
    team.forEach(s=>{ ups.push({s:s, n:gainExp(s, res.exp*broExpMul(s,tids), true)});
      setCond(s, s.cond - EXPED_COND*Math.max(1, res.secs.length)); s.fame += Math.round(res.reached*2*EXPED_RWD_MUL); });
    res.karma = (dg.karma||0) * res.secs.length * EXPED_RWD_MUL;
    if(res.karma) team.forEach(s=> addKarma(s, res.karma));
  }
  res.gold = Math.round((EXPED_GOLD + dg.tier*EXPED_GOLD_TIER) * res.reached);
  if(res.gold) addGold(res.gold);
  if(res.reached >= dg.secs){
    res.fameGain = Math.round((dg.fameClear||0) * EXPED_RWD_MUL); addFame(res.fameGain);
    const lastFoe = (res.secs[res.secs.length-1]||{}).foe || dg.mon || "미지의 존재";
    res.epi = tryEpithet("exped", team, {event:`${dg.n} 완주`, place:dg.n, foe:lastFoe,
      score: s=> .6 + (hpLeft[s.id]||0)*1.8});
  }
  res.relics.forEach(r=> addRelicToPool(r));
  levelReport(ups);
  logE(`원정 — <b>${dg.n}</b> ${res.reached}/${dg.secs}구간 도달. 경험 ${fmt(res.exp)} · 자금 +${fmt(res.gold)}${res.fameGain? ` · <b>완주</b> 학원 명성 +${res.fameGain}`:""} · 유물 ${res.relics.length}개${res.karma? ` · <b style="color:var(--bad)">업보 +${res.karma.toFixed(1)}</b>`:""}${(res.evalGain&&res.evalGain.length)? ` · 진로 평가 ${res.evalGain.join(", ")}`:""}${res.stopped? ` (${res.stopped})`:""}`, res.reached>=dg.secs?"good":(res.stopped?"bad":""));
  return res;
}
function expedLoop(E, quick, done){
  const bm = expedBattle(E);
  const after = ()=>{
    const cont = expedApply(E, bm.b, bm.mon);
    if(!cont){ done(expedFinish(E)); return; }
    expedLoop(E, quick, done);
  };
  if(quick) after();
  else openBattle(bm.b, {titleA:"원정대", titleB:bm.mon[0].name,
    head:`${E.dg.n} — ${E.sec}/${E.dg.secs}구간`, doneLabel: E.sec>=E.dg.secs? "결과 확정":"다음 구간"}, after);
}
function runExpedition(dg, team, TM){
  const E = expedInit(dg, team, TM);
  let out = null;
  expedLoop(E, true, r=>{ out = r; });
  return out;
}

function expedDgList(){ return DUNGEONS.filter(d=> S.fame >= d.needFame); }
/* 휴식 집중인 학생은 원정에 끌려가지 않는다 — 그런 학생이 낀 팀은 파견 자체가 안 된다 */
function teamResting(t){ return teamMembers(t).filter(isRestFocus); }

function expedDone(R, bonus, res, TM){
  const day = R.day, D = DAY_N[day];
  const ok = res.reached >= res.dg.secs;
  dlog(`${D}요일은 ${res.team.map(n=>esc(n)).join(", ")}${iga(res.team[res.team.length-1]||"")} <b>${esc(res.dg.n)}</b>로 원정을 떠나 <b>${res.reached}/${res.dg.secs}구간</b>까지 나아가 ${ok? `<b style="color:var(--ok)">완주했다!</b>` : `<b style="color:var(--bad)">돌아왔다.</b>`}${chainTag(bonus)}`, "head");
  if(res.stopped) dlog(`<span style="color:var(--dim)">${esc(res.stopped)}</span>`, "sub");
  dlog(`경험 <b>${fmt(Math.round(res.exp))}</b> · 자금 <b style="color:var(--brass)">+${fmt(res.gold)}</b>${res.fameGain? ` · 명성 <b style="color:var(--ok)">+${fmt(res.fameGain)}</b>`:""} · 유물 <b>${res.relics.length}</b>개${res.karma? ` · <span style="color:var(--bad)">업보 +${res.karma.toFixed(1)}</span>`:""}`, "sub");
  RUN.expeds.push(res);
  UI.lastExped = res;
  const skip = new Set(res.ids);
  res.ids.forEach(id=>{ const s=S.students.find(x=>x.id===id); if(s) s._exp=(s._exp||0)+1; });
  if(S.students.some(s=> !skip.has(s.id)))
    dayRun(TR.free, bonus, day, {skip:skip, head:`남은 학생들은 <b>자율 훈련</b>으로 하루를 보냈다.`});
  dlog("", "gap");
  R.day++;
  closeModal();
  weekRunStep();
}
function expedDay(R, bonus){
  const day = R.day, D = DAY_N[day];
  const dgs = expedDgList(), tms = expedTeams();
  if(!tms.length){
    const rst = expedFullTeams().some(t=> teamResting(t).length);
    dlog(`${D}요일 <b>원정 무산</b> — ${rst? "나갈 수 있는 팀이 모두 <b>휴식 집중</b> 중이다" : "3인으로 채워진 팀이 없다"}. 자율 훈련으로 대신했다.`, "bad");
    dayRun(TR.free, bonus, day, {head:`${D}요일은 <b>자율 훈련</b>으로 하루를 보냈다.`});
    dlog("", "gap"); R.day++; weekRunStep(); return;
  }
  if(R.quick){
    const dg = dgs[dgs.length-1] || DUNGEONS[0];
    const TM = tms[0];
    expedDone(R, bonus, runExpedition(dg, teamMembers(TM), TM), TM);

function scoutLevel(){ return clamp(Math.floor(S.master.info/3) + (S.items.scope?1:0), 0, 3); }
function rivalAcademy(strength, teams, prof, name){
  name = name || (pick(ACAD)+" 학원");
  const T=[];
  for(let i=0;i<teams;i++){
    const lv = Math.max(1, Math.round(strength + rnd(-2,2) - i*1.1));
    const t = genFoeTeam(lv, 1, 3, prof||"rival");
    // 전형적인 탱-딜-힐 구성으로 보정
    const comp = pick([
      ["paladin","archer","priest"],["sword","rogue","priest"],["monk","archer","timemage"],
      ["sword","archer","priest"],["paladin","rogue","timemage"],["monk","rogue","priest"],
      ["druid","wizard","priest"],["paladin","wizard","enchanter"],["sword","forcemage","darkpriest"],
      ["druid","archer","darkpriest"],["monk","wizard","enchanter"],["forcemage","rogue","priest"],
      ["druid","forcemage","darkpriest"],["paladin","wizard","timemage"],["sword","wizard","enchanter"]]);
    t.forEach((s,k)=>{ s.job=comp[k]; autoSkMod(s, lv); });
    T.push(assignFoeForm(t));
  }
  return {name, teams:T};
}
function ourAvgLevel(pool){ const p = pool||S.students; return p.reduce((a,s)=>a+s.level,0)/Math.max(1,p.length); }

const SPRING_LV_OFF = -3;   // 신인전 상대 기준 레벨 = 우리 1·2학년 평균 + 이 값
function startSpringTour(){

/* 봄 신인전 순위표 — 우리 4경기 뒤, 상대 학원끼리 남은 경기를 시뮬레이션한다 */
function springTable(t){
  const R = t.rivals || [];
  t.results.forEach((r,i)=>{ const v=R[i]; if(!v) return;
    if(r.win){ v.l++; } else { v.w++; v.pts+=3; } });
  for(let i=0;i<R.length;i++) for(let j=i+1;j<R.length;j++){
    const p = R[i].str/(R[i].str+R[j].str);
    if(Math.random()<p){ R[i].pts+=3; R[i].w++; R[j].l++; } else { R[j].pts+=3; R[j].w++; R[i].l++; }
  }
  const wins = t.results.filter(r=>r.win).length;
  const me = {name:S.acadName, pts:wins*3, w:wins, l:t.results.length-wins, me:true};
  const table = R.map(r=>({name:r.name, pts:r.pts, w:r.w, l:r.l})).concat([me]);
  table.sort((a,b)=> b.pts-a.pts || b.w-a.w || (b.me?-1:0)-(a.me?-1:0) || Math.random()-.5);
  t.standings = table;
  t.rank = table.findIndex(x=>x.me)+1;
  t.champ = t.rank===1;
  return table;
}
function tourMatchStudents(ids){ return ids.map(id=>S.students.find(s=>s.id===id)).filter(Boolean); }

function finishTournament(t){
  const wins = t.results.filter(r=>r.win).length;
  const total = t.results.length;
  const tierM = [1,1.7,2.7][S.tier-1];
  let fame=0, gold=0, msg="";
  if(t.kind==="spring"){
    if(!t.standings) springTable(t);
    fame = wins*34*tierM; gold = wins*260*tierM;
    msg = `봄 신인전 ${t.rank}위 (${wins}승 ${total-wins}패)`;
    if(t.champ){ fame*=1.6; gold*=1.45; msg = `봄 신인전 우승! (${wins}승 ${total-wins}패)`; missionProgress("debut"); }
  } else {
    const champ = t.roundWins===t.maxRound;
    fame = t.roundWins*95*tierM + (champ?260*tierM:0);
    gold = t.roundWins*620*tierM + (champ?1500*tierM:0);
    msg = champ? `가을 대회 우승!` : `가을 대회 ${t.roundWins}라운드 진출`;
  }
  if(S.items.banner){ fame*=1.25; }
  addFame(fame); addGold(gold);
  // 출전 학생 개인 명성
  const ups=[], rows=[];
  const parts = new Set();
  t.results.forEach(r=> (r.myIds||[]).forEach(id=>parts.add(id)));
  // 진로 평가 — 승리는 크게, 무승은 감점
  const evalNotes = [];
  parts.forEach(id=>{
    const s = S.students.find(x=>x.id===id); if(!s) return;
    const myW = t.results.filter(r=>r.win && (r.myIds||[]).includes(id)).length;
    let d = 0;
    if(t.kind==="spring"){
      d = wins*4 + (t.champ? 8:0);
      if(wins===0) d = -6;
    } else {
      const myWins = t.results.filter(r=>r.win && (r.myIds||[]).includes(id)).length;
      const champ = t.roundWins===t.maxRound;
      d = myWins*4 + (t.roundWins||0)*5 + (champ? 12:0);
      if(wins===0) d = -8;
    }
    const got = addEval(s, d);
    if(got) evalNotes.push(`${dnH(s)} ${got>0?"+":""}${got.toFixed(0)}`);
    const fg = Math.round((t.kind==="spring"?wins*9:(t.roundWins||0)*22)+8);
    s.fame += fg;
    const lv0 = s.level;
    let xp = t.kind==="spring"? 320+wins*130 : 900+(t.roundWins||0)*480;
    xp = Math.round(xp * broExpMul(s, [...parts]));
    const n = gainExp(s, xp, true);
    ups.push({s, n});
    rows.push({name:dn(s), job:JOBS[s.job].name, wins:myW, lv0, lv1:s.level, lvUp:n>0,
      exp:Math.round(xp), ev:Math.round(got||0), fame:fg});
  });
  rows.sort((a,b)=> b.wins-a.wins || b.ev-a.ev);
  tryEpithetTour("tour", t, parts, t.title);
  if(evalNotes.length) logE(`진로 평가 — ${evalNotes.join(", ")}`, wins? "good":"bad");
  levelReport(ups);
  logE(`<b>${msg}</b> — 명성 +${fmt(fame)} · 자금 +${fmt(gold)}`,"big");
  S.lastTour = {title:t.title, msg, fame:Math.round(fame), gold:Math.round(gold), results:t.results.map(r=>({vs:r.vs,win:r.win,score:r.score}))};
  const REC = {title:t.title, msg, w:wins, l:total-wins, fame:Math.round(fame), gold:Math.round(gold),
    matches:t.results.map(r=>({label:r.label, vs:r.vs, win:r.win, score:r.score})),
    standings:(t.kind==="spring"? t.standings : null), top2:false, rows, next:null};
  UI.tour=null; UI.pendingTour=false;
  closeModal();
  advancePhase();
  UI.view = "home";
  save();
  tourResultModal(REC, ()=>{ if((UI.ceremonies||[]).length) showCeremony(); else render(); });
}

function ladderRun(t, quick){

  const after = ()=> ladderRecord(t, b, foe.name, ids);
  if(quick) after();

function ladderRecord(t, b, oppName, ids){
  if(UI.tour!==t) return;
  t._busy = false;
  const win = b.winner==="A";
  const aliveA = b.A.filter(u=>u.alive).length, aliveB = b.B.filter(u=>u.alive).length;
  t.results.push({vs:oppName, win, score:`${aliveA}-${aliveB}`, myIds:ids.slice(), label:ladderMatchLabel(t), foes:b.B.map(u=>u.name)});
  if(t.cfg.kind==="cup"){
    const U = ladderUse(t.step);
    const tie = ladderTie(t);
    if(win){ t.rw++; if(!tie && t.wonSlot==null) t.wonSlot = t.slot; }
    else   { t.rl++; if(!tie && t.lostSlot==null) t.lostSlot = t.slot; }
    t.slot++;
    // 라운드가 결정됐는가
    const need = U===3 ? 2 : U;            // 1팀=1승, 2팀=2승, 3팀=2승
    let took = null;
    if(U===1)      took = win;
    else if(U===2){
      if(t.rw>=2) took = true;
      else if(t.rl>=2) took = false;
      else if(tie) took = win;             // 1:1 뒤 결정전
      // 1:1 이면 결정전으로 (took 는 null 유지)
    } else {
      if(t.rw>=2) took = true; else if(t.rl>=2) took = false;
    }
    if(took === null){ renderTournament(); return; }
    const sc = tie ? `${t.rw}:${t.rl} (결정전)` : `${t.rw}:${t.rl}`;
    logE(`${t.title} ${ladderRoundLabel(t)} — <b>${esc(oppName)}</b> 상대 ${sc} ${took?"승리":"패배"}`, took?"good":"bad");
    if(took){
      t.w++; t.round++;
      if(t.step==="city" && t.round===2) missionProgress("debut");   // 시내 4강 진입
      if(t.round >= t.maxRound){ t.stage="result"; t.advanced=true; renderTournament(); return; }
      t.slot=0; t.rw=0; t.rl=0; t.wonSlot=null; t.lostSlot=null;
      t.stage = U>1 ? "scout" : "match";
      renderTournament(); return;
    }
    t.l++; t.stage="result"; t.advanced=false; renderTournament(); return;
  }
  if(win) t.w++; else t.l++;
  // 리그
  t.rivals[t.round].pts += win? 0 : 3;
  t.rivals[t.round].l += win?1:0; t.rivals[t.round].w += win?0:1;
  t.round++;
  if(t.round >= t.maxRound){ ladderLeagueTable(t); t.stage="result"; renderTournament(); return; }
  t.useTeam = (t.useTeam+1) % ladderUse(t.step);
  renderTournament();
}

const CSL_LEAD = .04, CSL_INFO = .06, CSL_NET = .04;
function cslLead(){ return S.master.lead + cslFacBonus().lead; }
function cslInfo(){ return S.master.info + cslFacBonus().info; }
function cslNet(){  return S.master.net  + cslFacBonus().net;  }
function cslLeadP(){ return clamp(cslLead()*CSL_LEAD, 0, .95); }
function cslInfoP(){ return clamp(cslInfo()*CSL_INFO, 0, .95); }
function cslNetP(){  return clamp(cslNet() *CSL_NET,  0, .95); }
const CSL_QUEUE_MAX = 5;
const CSL_PER_STUDENT = 3;   // 학생 한 명이 한 해에 찾아오는 횟수
function newCounselState(){ return {queue:[], done:[], usedC:[], usedS:[]}; }
function cslCount(C, sid){ return (C.usedS||[]).filter(x=> x===sid).length; }
function counselState(){
  if(!S.counsel || S.counsel.year !== S.year){ S.counsel = newCounselState(); S.counsel.year = S.year; }
  const C = S.counsel;
  if(!Array.isArray(C.queue)){ C.queue = C.pending? [C.pending] : []; }
  delete C.pending;
  C.done = C.done||[]; C.usedC = C.usedC||[]; C.usedS = C.usedS||[];
  // 학원을 떠난 학생(졸업 등)이나 사라진 상담거리는 대기열에서 내린다
  C.queue = C.queue.filter(q=> q && counselOf(q.cid) && S.students.some(x=>x.id===q.sid));
  return C;
}
function counselOf(id){ return COUNSEL.find(c=>c.id===id) || null; }
function tryCounsel(){
  const C = counselState();
  if(C.queue.length >= CSL_QUEUE_MAX) return;
  if(Math.random() >= .30) return;
  const qS = C.queue.map(q=>q.sid), qC = C.queue.map(q=>q.cid);
  const cand = S.students.filter(s=> cslCount(C, s.id) < CSL_PER_STUDENT && !qS.includes(s.id));
  if(!cand.length) return;
  const pool = COUNSEL.filter(c=> !C.usedC.includes(c.id) && !qC.includes(c.id));
  if(!pool.length) return;
  const st = pick(cand), c = pick(pool);
  C.queue.push({sid:st.id, cid:c.id, order: shuffled([0,1,2]),
    reveal: Math.random() < cslInfoP(), phase:S.phase, week:S.week+1});
  const n = C.queue.length;
  logE(`상담 요청 — <b>${dnH(st)}</b>${iga(st.name)} 할 말이 있다고 찾아왔다. <b style="color:var(--brass)">상담</b> 탭에서 들어줄 수 있다.${n>1? ` (대기 ${n}건)`:""}`,"big");
}
function shuffled(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=ri(0,i); const t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function answerCounsel(qi, oi){
  const C = counselState();
  const q = C.queue[qi];
  if(!q) return;
  const st = S.students.find(x=>x.id===q.sid);
  const c = counselOf(q.cid);
  if(!st || !c){ C.queue.splice(qi,1); save(); render(); return; }
  const o = c.o[oi];
  const fit = (o.f||[]).includes(st.pers||"plain");
  // 지도력 — 성격에 맞지 않아도 설득해낸다
  const byLead = !fit && (Math.random() < cslLeadP());
  const byTrust = !fit && !byLead && trustFull(st);   // 운명 단계는 무슨 말이든 닿는다
  const ok = fit || byLead || byTrust;
  let gain = null, dbl = false;
  if(ok){
    const ks = MENTAL.filter(m=>!m.fixed && st.ment[m.k] < 99);
    if(ks.length){
      const m = pick(ks);
      let d = ri(2,4);
      // 호소력 — 상승폭 2배
      if(Math.random() < cslNetP()){ d *= 2; dbl = true; }
      const before = st.ment[m.k];
      st.ment[m.k] = clamp(before + d, 1, 99);
      gain = {k:m.k, n:m.n, d: +(st.ment[m.k]-before).toFixed(2)};
    }
  }
  const tUp = ok ? (addTrust(st, 1), true) : false;
  C.queue.splice(qi,1);
  C.usedC.push(c.id); C.usedS.push(st.id);
  C.done.push({sid:st.id, name:dn(st), pers:st.pers, cid:c.id, oi, fit:ok, byLead, dbl, gain,
    phase:q.phase||S.phase, week:q.week||(S.week+1)});
  logE(ok
    ? `상담 — <b>${dnH(st)}</b>(${personaOf(st).n})의 마음에 닿았다.${byLead? ` <span style="color:var(--brass)">지도력으로 설득</span>`:""}${byTrust? ` <span style="color:var(--brass)">운명 단계 — 무엇을 말해도 닿는다</span>`:""}${gain? ` <b style="color:var(--ok)">${gain.n} +${gain.d}</b>${dbl? ` <span style="color:var(--brass)">(호소력 2배)</span>`:""}`:""} · <span style="color:var(--brass)">신뢰 ${trustGainWord(1)}</span>`
    : `상담 — <b>${dnH(st)}</b>(${personaOf(st).n})${eunn(personaOf(st).n)} 아직 납득하지 못한 표정이다.`, ok?"good":"");
  save(); render();
  toast(ok? (gain? `${dn(st)} — ${gain.n} +${gain.d}${dbl?" (2배)":""}` : `${dn(st)}의 마음에 닿았다`) : `${dn(st)}${eunn(st.name)} 납득하지 못했다`);
}

   시즌 전환
   ============================================================ */
function endPhase(){
  if(S.phase==="fall"){
    if(S.fallRun && S.fallRun.alive && S.fallRun.step==="final"){ startLadder("final"); return; }
    advancePhase(); return;
  }
  if(S.phase==="winter"){ startSpringTour(); return; }
  advancePhase();
}
function advancePhase(){
  const i = PHASE_ORDER.indexOf(S.phase);
  if(S.phase==="fall"){ graduateAll(); }
  if(S.phase==="winter"){ enrollAll(); S.year++; S.phase="spring"; }
  else S.phase = PHASE_ORDER[i+1];
  S.week=0; S.slots = Array(WEEK_DAYS).fill(null); handRefill();
  if(S.phase==="fall"){ S.fallRun = newFallRun();
    logE(`가을 시즌 — 3주차 시내 대회를 시작으로 사다리가 열린다. 상반기 3·6주차, 하반기 9·12주차에 대회가 있다.`,"big"); }
  if(S.phase==="summer"){ logE(`여름 시작 — 상반기 ${HALF_WEEKS}주는 평소대로, 하반기 ${HALF_WEEKS}주는 합숙이다. 합숙은 전 분야가 함께 오르지만 컨디션 소모가 크다.`,"big"); }
  if(S.phase==="winter"){ genScouts(); S.master.pts += 2; UI.skipPtWarn = false;
    logE(`겨울 — 스카우트 기간 (시도 ${scoutTriesMax()}회 · <b>${fameTitle(S.fame).n}</b> 등급${fameTitleIdx(S.fame)? ` 보정 +${fameTitleIdx(S.fame)}`:""}). 마스터 육성 포인트 2를 얻었다.`,"big"); }
  if(S.phase==="spring"){ logE(`${S.year}년 신학기가 시작되었다. 신입생이 학원에 합류했다.`,"big"); }
  save();
}

function trustOf(st){ return clamp(Math.round((st && st.trust) || 0), 0, TRUST_MAX); }
function trustBand(v){ return TRUST_BANDS.find(b=> v>=b.min) || TRUST_BANDS[TRUST_BANDS.length-1]; }
function trustLineKey(v){ return v>=9?9 : v>=7?7 : v>=5?5 : v>=3?3 : v>=1?1 : 0; }
/* 학생·단계마다 고정된 한마디 (렌더할 때마다 바뀌지 않도록) */
function trustLine(st){
  const v = trustOf(st), k = trustLineKey(v);
  const per = (TRUST_LINES_P[(st && st.pers) || "plain"] || {})[k] || [];
  // 성격 전용 대사가 있으면 그것만 쓴다 — 말투가 섞이지 않도록
  const pool = per.length ? per : (TRUST_LINES[k] || TRUST_LINES[0]);
  const key = String(st.id||"") + "#" + ((st && st.pers)||"plain") + "#" + v;
  let h = 2166136261;
  for(let i=0;i<key.length;i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13;   // 낮은 비트까지 고르게
  return pool[(h >>> 0) % pool.length];
}
function trustFull(st){ return trustOf(st) >= TRUST_MAX; }
/* 신뢰 증가폭은 숫자 대신 말로 */
function trustGainWord(n){ return n>=3 ? "크게 증가" : n>=2 ? "대폭 증가" : "증가"; }
function addTrust(st, v){
  const before = trustOf(st);
  st.trust = clamp(before + v, 0, TRUST_MAX);
  if(st.trust !== before){
    const b = trustBand(st.trust), b0 = trustBand(before);
    if(b.step !== b0.step)
      logE(`신뢰 — <b>${dnH(st)}</b>와의 관계가 <b style="color:var(--brass)">${b.step}</b> 단계가 되었다. ${esc(b.rel)}.`, "good");
  }
  return st.trust;
}
function karmaOf(st){ return Math.max(0, Math.round((st && st.karma) || 0)); }
function addKarma(st, v){ st.karma = Math.max(0, karmaOf(st) + v); return st.karma; }
/* 업보로 갈리는 진로 — 조건이 맞으면 기존 진로를 덮어쓴다 */
function darkCareerFor(st){
  const km = karmaOf(st), sc = Math.round(st.eval||0);
  return DARK_CAREERS.find(c=> km >= c.karma && sc >= c.min) || null;
}
/* 다음 업보 단계 */
function nextDark(st){
  const km = karmaOf(st);
  const list = DARK_CAREERS.slice().sort((a,b)=>a.karma-b.karma);
  return list.find(c=> km < c.karma) || null;
}
function careerFor(st){
  const sc = Math.round(st.eval||0);
  const dk = darkCareerFor(st);
  if(dk) return {c:dk, sc, dark:true};
  const c = CAREERS.find(c=> sc >= c.min) || CAREERS[CAREERS.length-1];
  return {c, sc};
}
function nextCareer(sc){
  const list = CAREERS.filter(c=>c.id!=="none").slice().sort((a,b)=>a.min-b.min);
  return list.find(c=> c.min > sc) || null;
}
function addEval(st, v, cap){
  const cur = st.eval||0;
  let nv = cur + v;
  if(cap!=null && v>0) nv = Math.min(Math.max(cur, cap), nv);
  st.eval = Math.max(0, nv);
  return st.eval - cur;
}

const SCOUT_DIST = [
  {D:40, C:40, B:16, A:4,  S:0},    // 무명
  {D:26, C:38, B:24, A:11, S:0},    // 유명

];
const SCOUT_TRIES = 4;
/* 신입생 정원 — 무명·유명 3 · 강호·명문 4 · 초명문 5 */
const ENROLL_CAP = [3, 3, 4, 4, 5];
function enrollCap(){ return ENROLL_CAP[clamp(fameTitleIdx(S.fame), 0, 4)]; }
function fameTitleIdx(f){ return FAME_TITLES.reduce((a,x,i)=> f>=x.min? i : a, 0); }

function scoutOpen(){ return !scoutFull() && (S.scoutTries||0) > 0; }
function scoutRate(g){
  const base = {D:.66,C:.54,B:.40,A:.25,S:.13}[g];
  return clamp(base + S.master.net*.05 + S.fame/12000 + (S.tier-1)*.04, .08, .95);
}
function genScouts(){
  const ti = fameTitleIdx(S.fame);
  const dist = SCOUT_DIST[ti];
  S.scoutTries = scoutTriesMax();
  const GR = {S:5,A:4,B:3,C:2,D:1};
  S.scouts = Array.from({length:8},()=>{
    const g = wchoose(dist);
    const st = newStudent(1, g);
    return {st, rate:scoutRate(g), state:"open", tried:0};
  }).sort((a,b)=> (GR[b.st.grade]-GR[a.st.grade]) || (b.st.ment.pot-a.st.ment.pot));
  S.incoming = [];
}
function tryScout(i){
  const c = S.scouts[i];
  if(!c || (c.state!=="open" && c.state!=="retry")) return;
  if(scoutFull()){ toast(`이미 ${enrollCap()}명을 확보했다.`); return; }
  if((S.scoutTries||0) <= 0){ toast("남은 스카우트 시도가 없다."); return; }
  S.scoutTries--;
  c.tried = (c.tried||0)+1;
  if(Math.random() < c.rate){
    c.state="got"; S.incoming.push(c.st);
    logE(`스카우트 성공 — <b>${dnH(c.st)}</b> (${c.st.grade}급 ${JOBS[c.st.job].name}) 입학 예정.${
      scoutFull()? ` <b style="color:var(--ok)">${enrollCap()}명을 모두 확보해 스카우트를 마친다</b> (남은 시도 ${S.scoutTries}회는 소멸)`
                 : ` 남은 시도 ${S.scoutTries}회`}`,"good");
  } else if(c.tried===1){
    c.state="retry"; c.rate = clamp(c.rate + .10, 0, .97);
    logE(`스카우트 실패 — ${dnH(c.st)}${iga(c.st.name)} 망설이고 있다. 한 번 더 설득할 수 있다 (성공률 ${(c.rate*100).toFixed(0)}%). 남은 시도 ${S.scoutTries}회`,"bad");
  } else {
    c.state="lost";
    logE(`스카우트 실패 — ${dnH(c.st)}${eunn(c.st.name)} 다른 학원을 택했다. 남은 시도 ${S.scoutTries}회`,"bad");
  }

}

const SAVE_KEY = "heroacademy_v1";
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.students) return false;
    S = d; S.relicPool = S.relicPool||[];
    return true;
  }catch(e){ return false; }
}
function toast(msg){
  const r = $("#toastRoot");
  r.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ r.innerHTML=""; }, 2200);
}

/* ============================================================
   렌더링 — 공통
   ============================================================ */
const VIEWS = [
  {id:"home", n:"학원"},
  {id:"roster", n:"학생"},
  {id:"team", n:"팀 편성"},
  {id:"plan", n:"스케줄", hot:true},
  {id:"facil", n:"시설 · 상점"},
  {id:"relic", n:"유물 · 스킬"},
  {id:"record", n:"기록"}
];
function ultName(job){
  const sk = (JOBS[job].skills||[]).find(x=>x.kind==="ult");
  return sk? sk.name : "필살기";
}
function teamTag(st){
  const at = (typeof teamOfStudent==="function") ? teamOfStudent(st.id) : null;
  if(!at) return `<span class="tag tm none">무소속</span>`;
  return `<span class="tag tm" title="${esc(formOf(at.t.form).n)} · ${slotRow(at.slot)==="front"?"전열":"후열"}">${esc(teamLabel(at.t))}</span>`;
}
function persTag(st){
  const k = (st && st.pers) || "plain", P = PERSONA[k] || PERSONA.plain;
  const c = k==="genius" ? "var(--brass)" : "var(--dim)";
  return `<span class="tag" title="${esc(personaText(k))}" style="color:${c};border-color:${c}">${P.n}</span>`;
}
function roleTag(job){ const J=JOBS[job]; return `<span class="tag role-${J.tone}">${J.name}</span>`; }
function gradeTag(g){ return `<span class="tag" style="color:${GRADE_COLOR[g]};border-color:${GRADE_COLOR[g]}">${g}</span>`; }
function condClass(c){ return c>=75?"":(c>=50?"mid":"low"); }
function karmaTag(st){
  const km = karmaOf(st);
  if(km < KARMA_MIN) return "";
  const c = darkCareerFor(st);
  return `<span class="tag inj" title="업보 ${km} — 진로가 '${c?c.n:""}'(으)로 갈린다. 교회 기부로 씻을 수 있다">업보 ${km}</span>`;
}
function injTag(st, sm){
  if(!isInjured(st)) return "";
  return `<span class="tag inj" title="부상 — 잠재력을 제외한 멘탈리티가 50%로 계산되고, 휴식 외 훈련은 실패한다">부상 ${injWeeks(st)}주</span>`;
}

function renderPrepBar(){
  const bar = $("#prepBar"); if(!bar) return;
  const t = UI.tour;
  if(!(UI.pendingTour && t && t.stage==="prep" && !t._prepOpen)){ bar.hidden = true; bar.innerHTML=""; return; }
  bar.hidden = false;
  const need = tourNeedTeams(t), ready = tourReadyTeams(), can = ready >= need;
  bar.innerHTML = `<div class="prepbar"><span class="pb-k">대회 준비</span>
    <span class="pb-t">${esc(t.title)} · ${can? "정비를 마치면 시작한다" : `<b style="color:var(--bad)">3인 팀 ${ready}/${need} — ${need-ready}팀 더 필요하다</b>`}</span>
    <button class="btn sm ghost" id="pbBack">준비 화면</button>
    <button class="btn sm primary" id="pbGo" ${can?"":"disabled"}>대회 시작</button>
    ${can? "" : `<button class="btn sm" id="pbGiveUp" style="border-color:var(--bad);color:var(--bad)">기권</button>`}</div>`;
  $("#pbBack").onclick = ()=>{ t._prepOpen = true; renderTournament(); };
  { const g = $("#pbGiveUp"); if(g) g.onclick = ()=> tourForfeit(t); }
  const pg = $("#pbGo");
  if(pg) pg.onclick = ()=>{
    if(!tourCanStart(t)){ toast(`3인으로 채운 팀이 ${need}개 필요하다.`); return; }
    t.stage="entry"; t._prepOpen=true; renderTournament();
  };
}
function render(){
  if(UI.pendingTour && UI.tour && !(UI.tour.stage==="prep" && !UI.tour._prepOpen)){ renderTournament(); }
  $("#acadName").textContent = S.acadName;
  $("#acadSub").textContent = `${tierOf().n} · ${fameTitle(S.fame).n} · 지도 ${S.master.lead} / 정보 ${S.master.info} / 호소 ${S.master.net}`;
  $("#mDate").textContent = `${S.year}년 ${PHASES[S.phase].n} ${Math.min(S.week+1,PHASES[S.phase].weeks)}주`;
  $("#mFame").textContent = fmt(S.fame);
  $("#mTitle").textContent = fameTitle(S.fame).n;
  $("#mGold").textContent = fmt(S.gold);
  $("#mCnt").textContent = S.students.length;

  const tabs = VIEWS.map(v=> Object.assign({}, v));
  { // 학생 — 스킬 강화 포인트를 가진 학생 수
    const rv = tabs.find(v=>v.id==="roster");
    if(rv) rv.badge = S.students.filter(x=>(x.sp||0)>0).length || null;
  }
  if(S.phase==="winter" && S.scouts) tabs.splice(2,0,{id:"scout", n:"스카우트", badge: scoutOpen()? (S.scoutTries||0) : null});
  tabs.splice(tabs.findIndex(v=>v.id==="record"), 0, {id:"counsel", n:"상담", badge: counselState().queue.length || null});
  {  // 스케줄 탭에는 지금 몇 주차인지 붙여둔다
    const pv = tabs.find(v=>v.id==="plan");
    if(pv) pv.side = `${Math.min(S.week+1, PHASES[S.phase].weeks)}주`;
  }
  $("#nav").innerHTML = tabs.map(v=>`<button data-view="${v.id}" class="${v.hot?"hot":""}" aria-current="${UI.view===v.id}">${v.n}${
    v.side?`<span class="wk">${v.side}</span>`:""}${v.badge?`<span class="badge">${v.badge}</span>`:""}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=> b.onclick=()=>{ UI.view=b.dataset.view; render(); });

  const v = $("#view");
  if(UI.view==="home") v.innerHTML = viewHome();
  else if(UI.view==="roster") v.innerHTML = viewRoster();
  else if(UI.view==="plan") v.innerHTML = viewPlan();
  else if(UI.view==="facil") v.innerHTML = viewFacil();
  else if(UI.view==="relic") v.innerHTML = viewRelic();
  else if(UI.view==="team") v.innerHTML = viewTeam();
  else if(UI.view==="counsel") v.innerHTML = viewCounsel();
  else if(UI.view==="record") v.innerHTML = viewRecord();
  else if(UI.view==="scout") v.innerHTML = viewScout();
  else v.innerHTML = viewHome();
  bindView();
  renderPrepBar();
  renderMission();
  renderLog();
}
function renderMission(){
  const box = $("#missionBox"); if(!box) return;
  if(!S.mission) S.mission = newMission();
  S.skillPool = S.skillPool||[];
  S.students.forEach(x=>{ if(!x.skMod) x.skMod = {}; if(typeof x.sp!=="number") x.sp = 0; x.cond = Math.round(clamp(x.cond||0,0,100)); });
  const c = missionCur(), dl = missionDeadline(), done = S.mission.done||[];
  if(!c){
    box.innerHTML = `<div class="panel-h"><h2 style="font-size:13px">지침</h2><span class="hint">완수</span></div>
      <div class="mdone">모든 지침을 완수했다. 이제 학원이 어디까지 갈지는 당신이 정한다.</div>
      ${done.map(d=>`<div class="mrowdone">✓ ${esc(d.n)} <span>${d.year}년</span></div>`).join("")}`;
    return;
  }
  const over = dl && S.year > dl;
  const left = dl ? (dl - S.year) : null;
  box.innerHTML = `
    <div class="panel-h"><h2 style="font-size:13px">지침</h2><span class="hint">${S.mission.idx+1} / ${MISSIONS.length}</span></div>
    <div class="mtitle">${esc(c.n)}</div>
    <div class="mdesc">${esc(c.d)}</div>
    ${dl? `<div class="mdue ${over?"over":left<=0?"warn":""}">${over? `기한 초과 — ${dl}년까지였다` : `기한 ${dl}년 가을까지 · ${left===0?"올해가 마지막":`${left}년 남음`}`}</div>`
        : `<div class="mdue">기한 없음</div>`}
    <div class="mhint">${esc(c.hint)}</div>
    ${done.length? `<div class="rule" style="margin:10px 0 6px"></div>${done.map(d=>`<div class="mrowdone">✓ ${esc(d.n)} <span>${d.year}년</span></div>`).join("")}`:""}`;
}
function renderLog(){
  $("#logList").innerHTML = S.log.length? S.log.map(e=>`<div class="le ${e.c}"><div class="t">${e.t}</div>${e.h}</div>`).join("")
    : `<div class="empty">아직 기록이 없다.</div>`;
}

/* ---------- 학원 ---------- */
/* 화면 토글 — true 로 바꾸면 다시 나온다 */
const SHOW_YEARFLOW = false;   // 학원 탭 · 연간 흐름 안내 박스
const SHOW_BULKRUN  = false;   // 스케줄 탭 · 남은 주 일괄 진행 버튼
const SHOW_FOCUSHELP= false;   // 개인 집중 훈련 · 일괄 지정 안내 문단
function viewHome(){
  const next = PHASES[S.phase];
  const remain = next.weeks - S.week;
  const fallNext = (()=>{
    if(!S.fallRun || !S.fallRun.alive) return "3학년 졸업";
    const c = LADDER[S.fallRun.step];
    return `${c.n} (${c.week}주차)`;
  })();
  const nextEvent = S.phase==="spring"? "여름 (하반기 합숙)" : S.phase==="summer"? "가을 시내 대회 (3주차)" : S.phase==="fall"? fallNext : "봄 신인전 → 신입생 입학 · 진급";
  const nt = TIERS.find(t=>t.id===S.tier+1);
  const byYear = [1,2,3].map(y=>S.students.filter(s=>s.year===y).length);
  const top = S.students.slice().sort((a,b)=>power(b)-power(a)).slice(0,3);
  return `
  <section class="panel">
    <div class="panel-h"><h2>${esc(S.acadName)}</h2><span class="hint">${tierOf().d}</span></div>
    <div class="grid2">
      <div>
        <div class="kv"><span class="k">현재</span><span class="v">${S.year}년 ${next.n} ${S.week+1}주차</span></div>
        <div class="kv"><span class="k">시즌 잔여</span><span class="v num">${remain}주</span></div>
        <div class="kv"><span class="k">다음 행사</span><span class="v">${nextEvent}</span></div>
        <div class="kv"><span class="k">학년 구성</span><span class="v num">1학년 ${byYear[0]} / 2학년 ${byYear[1]} / 3학년 ${byYear[2]}</span></div>
        <div class="kv"><span class="k">승급까지</span><span class="v num">${nt? fmt(Math.max(0,nt.fame-S.fame))+" 명성" : "최상위 달성"}</span></div>
        <div class="kv" title="${esc(fameTitle(S.fame).d)}"><span class="k">학원 유명도</span><span class="v" style="color:var(--brass)">${fameTitle(S.fame).n}</span></div>
        <div class="kv"><span class="k">다음 유명도</span><span class="v num">${fameNext(S.fame)? `${fameNext(S.fame).n}까지 ${fmt(fameNext(S.fame).min-S.fame)}` : "최고 단계"}</span></div>
        <div class="kv" title="유명도가 한 등급 오를 때마다 겨울 스카우트 시도가 1회 늘어난다"><span class="k">겨울 스카우트 시도</span><span class="v num">${scoutTriesMax()}회${fameNext(S.fame)? ` <span style="color:var(--dim)">→ ${scoutTriesMax()+1}회</span>`:""}</span></div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">마스터 육성 (잔여 ${mpAvail()}pt)</div>
        ${["lead","info","net"].map(k=> masterRow(k,"data-mpt")).join("")}
        ${masterConfirmRow("btnMpOk","btnMpNo")}
        <div style="margin-top:10px" class="btnrow">
          <button class="btn sm" id="btnRename">학원 이름 변경</button>
          <button class="btn sm" id="btnNew">새 학원 시작</button>
        </div>
      </div>
    </div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>주요 전력</h2><span class="hint">전투력 = 스탯 종합 환산</span></div>
    <div class="roster">${top.map(s=>studentCard(s)).join("")||`<div class="empty">학생이 없다.</div>`}</div>
  </section>
  ${SHOW_YEARFLOW? `<section class="panel">
    <div class="panel-h"><h2>연간 흐름</h2><span class="hint">한 학생은 최대 3년, 3년 뒤 반드시 졸업한다</span></div>
    <ol style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:12.5px;color:var(--muted)">
      <li><b style="color:var(--text)">봄 · 12주</b> — 상반기 6주에 신입생이 합류하고 <b style="color:var(--text)">2주차에 라이벌</b>이 생긴다. 상반기가 끝나면 세 학원이 <b style="color:var(--text)">친선전</b>을 요청해오고, 받아들인 경기는 하반기 2·4·6주차 뒤에 <b style="color:var(--text)">한 팀이 한 경기씩</b> 치른다.</li>
      <li><b style="color:var(--text)">여름 · 12주</b> — 상반기 6주 중 한 주에 <b style="color:var(--text)">소울메이트</b>가 맺어진다(2년차부터). 하반기 6주는 합숙으로, 전 분야가 함께 오르지만 컨디션 소모가 크다.</li>
      <li><b style="color:var(--text)">가을 · 12주</b> — 3주마다 대회가 열리는 사다리. <b style="color:var(--text)">3주차 시내 대회</b>(<b>1팀</b> 단판 4라운드, 진출 명성 +100) → 우승 시 <b style="color:var(--text)">6주차 광역 대회</b>(<b>2팀</b>, 1:1이면 이긴 팀끼리 결정전) → 우승 시 <b style="color:var(--text)">9주차 예선 리그</b>(<b>3팀</b>, 7차전, 조 1·2위 통과, 진출 명성 +150) → 통과 시 <b style="color:var(--text)">12주차 본선</b>(<b>3팀</b> 3선 2승, 진출 명성 +300, 우승 명성 +3,000). 한 번 지면 그 해 사다리는 끝난다.
        <b style="color:var(--brass)">광역과 학원제는 처음에 잠겨 있다</b> — 지침을 달성하면 이듬해 입학식에 초대장이 온다.</li>
      <li><b style="color:var(--text)">겨울 · 12주</b> — 가을 본선이 끝나면 3학년이 졸업하고(진로가 학원 명성이 된다), 상반기에 스카우트 후보가 찾아온다. 학원 유명도가 높을수록 상위 등급 신입생이 나타나고, 한 등급 오를 때마다 스카우트 시도가 1회씩 늘어난다 (기본 ${SCOUT_TRIES}회).</li>
      <li><b style="color:var(--text)">겨울 하반기</b> — 상반기가 끝나면 다시 <b style="color:var(--text)">친선전</b> 요청이 온다. 봄 신인전을 준비하는 실전이 된다.</li>
      <li><b style="color:var(--text)">겨울 종료</b> — <b style="color:var(--text)">봄 신인전</b>(1·2학년 3인 1팀, 5개 학원 리그전)을 치른 뒤 신입생이 입학하고 학년이 오른다. 조 1위가 우승이다.</li>
      <li><b style="color:var(--text)">인원과 팀</b> — 개교 시 1학년 <b style="color:var(--text)">3명</b>. 신입생 정원은 유명도를 따른다(무명·유명 3 · 강호·명문 4 · 초명문 5). 학생이 3명 늘 때마다 팀을 하나씩 더 짤 수 있고(최대 5팀), <b style="color:var(--text)">한 번 늘어난 팀 수는 인원이 줄어도 그대로다</b>.</li>
    </ol>
    <div class="rule"></div>
    <div style="font-size:12.5px;color:var(--muted)">전투는 3인 1팀 ATB — 속도만큼 행동 게이지가 차고, 행동할 때마다 <b style="color:var(--text)">천재성</b>에 따라 스킬이 출현한다.
      <b style="color:var(--text)">적극성</b>은 어떤 행동을 고를지, <b style="color:var(--text)">침착성</b>은 누구를 노릴지를 정확하게 만든다.
      멘탈리티는 전투 능력치에도 직접 얹힌다 — 적극성은 공격력·속도, 침착성은 명중·회피·스킬 성공률, 정신력은 스킬 저항, 지구력은 체력, 천재성은 크리 확률과 필살 게이지를 올린다.
      필살 게이지가 가득 차면 필살기가 먼저 나간다.</div>
    <div class="rule"></div>
    <div style="font-size:12.5px;color:var(--muted)"><b style="color:var(--text)">의식</b> — 체력이 <b style="color:var(--text)">의식 유지선</b> 아래로 떨어지면 스킬 효율이 깎이고, 맞을 때마다 그대로 쓰러질 위험이 생긴다.
      체력 30% 미만에서는 그 속도가 두 배가 된다. <b style="color:var(--text)">지구력</b>이 높을수록 유지선이 내려가고(지구력 99면 40%, 30이면 70%, 1이면 85%),
      <b style="color:var(--text)">정신력</b>이 높을수록 그 아래에서 받는 불이익이 줄어든다.</div>
  </section>` : ""}
  ${S.lastTour? `<section class="panel"><div class="panel-h"><h2>${esc(S.lastTour.title)}</h2><span class="hint">${esc(S.lastTour.msg)}</span></div>
    <div class="scroll-x"><table class="tb"><thead><tr><th>상대</th><th>결과</th><th>스코어</th></tr></thead><tbody>
    ${S.lastTour.results.map(r=>`<tr><td>${esc(r.vs)}</td><td style="color:${r.win?"var(--ok)":"var(--bad)"}">${r.win?"승":"패"}</td><td class="num">${esc(r.score||"-")}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="rule"></div><div class="btnrow"><span class="pill">명성 +${fmt(S.lastTour.fame)}</span><span class="pill">자금 +${fmt(S.lastTour.gold)}</span></div></section>`:""}
  `;
}
function studentCard(s, sel){
  const bs = battleStats(s);
  return `<button class="scard ${sel?"sel":""}" data-sid="${s.id}">
    <div class="n1"><span class="nm">${dnH(s)}</span>${teamTag(s)}${injTag(s)}${karmaTag(s)}</div>
    <div class="n2">${persTag(s)}${gradeTag(s.grade)}${roleTag(s.job)}
      <span class="tag yr">${s.year}학년</span>${bondTags(s)}<span class="lv num">Lv.${s.level}</span></div>
    <div class="bars">
      <div class="barlab"><span>컨디션 <b style="color:var(--${condEff(s.cond).tone})">훈련 ${condEff(s.cond).pct}%</b></span><span class="num">${Math.round(s.cond)}</span></div>
      <div class="bar cond ${condClass(s.cond)}"><i style="width:${s.cond}%"></i></div>
      <div class="barlab"><span>경험치</span><span class="num">${Math.round(s.exp)}/${expNeed(s.level)}</span></div>
      <div class="bar"><i style="width:${clamp(s.exp/expNeed(s.level)*100,0,100)}%"></i></div>

const ROSTER_SORT = [
  {k:"default", n:"기본 (학년 · 전투력)"},
  {k:"team",    n:"소속 팀"},
  {k:"power",   n:"전투력"},
  {k:"eval",    n:"진로 평가"},
  {k:"cond",    n:"컨디션"},
  {k:"name",    n:"이름"}
];
function teamSortKey(st){
  const at = teamOfStudent(st.id);
  if(!at) return [9, 9];
  const ti = teamsOf().findIndex(t=>t.n===at.t.n);
  const si = formSlots(at.t.form).indexOf(at.slot);
  return [ti<0?8:ti, si<0?8:si];
}
function sortRoster(list, mode){
  const L = list.slice();
  if(mode==="team"){
    return L.sort((a,b)=>{
      const ka=teamSortKey(a), kb=teamSortKey(b);
      return ka[0]-kb[0] || ka[1]-kb[1] || b.year-a.year || power(b)-power(a);
    });
  }
  if(mode==="power") return L.sort((a,b)=> power(b)-power(a));
  if(mode==="eval")  return L.sort((a,b)=> (b.eval||0)-(a.eval||0) || power(b)-power(a));
  if(mode==="cond")  return L.sort((a,b)=> a.cond-b.cond || power(b)-power(a));
  if(mode==="name")  return L.sort((a,b)=> a.name.localeCompare(b.name,"ko"));
  return L.sort((a,b)=> b.year-a.year || power(b)-power(a));
}
function viewRoster(){
  if(!S.opts) S.opts={};
  const mode = S.opts.rsort || "default";
  const list = sortRoster(S.students, mode);

/* ---------- 교회 ---------- */
const CHURCH_DONATE = 100;    // 기부 비용
const CHURCH_KARMA  = 10;     // 기부 시 전원 업보 감소
const CHURCH_HEAL   = 1000;   // 부상 치료 비용
/* 성물 — 각 계절의 상반기·하반기마다 하나씩만 산다 */
const HOLY_WATER_G  = 500, HOLY_WATER_COND = 15;   // 신비한 성수 — 즉시 전원 컨디션 회복
/* 예지의 서 — 사뒀다가 스케줄 탭에서 손패를 갈아엎는다.
   한 권 살 때마다 100 G 씩 오르고 1,000 G 에서 멈춘다. */
const FORESIGHT_G = 200, FORESIGHT_STEP = 100, FORESIGHT_MAX = 1000;
function foresightBought(){ return churchState().bookN|0; }
function foresightPrice(){ return Math.min(FORESIGHT_G + foresightBought()*FORESIGHT_STEP, FORESIGHT_MAX); }
function churchBought(k){ return (churchState().buy||{})[k] === churchHalfKey(); }
function churchMark(k){ const c=churchState(); c.buy = c.buy||{}; c.buy[k] = churchHalfKey(); }
function bookCount(){ return S.books|0; }
function buyHolyWater(){
  if(churchBought("water")){ toast("이번 반기에는 이미 받아 갔다."); return; }
  if(S.gold < HOLY_WATER_G){ toast("자금이 모자란다."); return; }
  S.gold -= HOLY_WATER_G; churchMark("water");
  let n = 0;
  S.students.forEach(s=>{ const b=s.cond; setCond(s, s.cond + HOLY_WATER_COND); if(s.cond>b) n++; });
  logE(`<b>신비한 성수</b> — ${fmt(HOLY_WATER_G)} G. 전 학생의 컨디션이 <b style="color:var(--ok)">${HOLY_WATER_COND}</b> 회복됐다${n<S.students.length? ` (${n}명 적용)`:""}.`,"good");
  save(); render(); toast(`전원 컨디션 +${HOLY_WATER_COND}`);
}
function buyForesight(){
  if(churchBought("book")){ toast("이번 반기에는 이미 받아 갔다."); return; }
  const price = foresightPrice();
  if(S.gold < price){ toast("자금이 모자란다."); return; }
  S.gold -= price; churchMark("book");
  const c = churchState(); c.bookN = foresightBought() + 1;
  S.books = bookCount() + 1;
  const nx = foresightPrice();
  logE(`<b>예지의 서</b>를 한 권 들였다 (${fmt(price)} G). 스케줄 탭에서 손패를 통째로 바꿀 수 있다.${
    nx>price? ` 다음 권부터는 <b>${fmt(nx)} G</b>를 부른다.` : ` 값은 <b>${fmt(FORESIGHT_MAX)} G</b>에서 더 오르지 않는다.`}`,"good");
  save(); render(); toast(`예지의 서 ${bookCount()}권`);
}
/* 손패 교체 — 월~금 슬롯에 올려둔 카드는 건드리지 않는다 */
function useForesight(){
  if(bookCount() <= 0){ toast("예지의 서가 없다."); return; }
  const n = (S.hand||[]).length;
  if(!n){ toast("바꿀 손패가 없다."); return; }
  S.books = bookCount() - 1;
  S.hand = Array.from({length:n}, ()=> newCard());
  logE(`<b>예지의 서</b>를 펼쳤다 — 손패 <b>${n}장</b>을 새로 뽑았다 (남은 ${bookCount()}권).`,"good");
  save(); render(); toast(`손패 ${n}장 교체`);
}
function churchState(){ S.church = S.church || {}; return S.church; }
function churchHalfKey(){ return `${S.year}-${S.phase}-${isLateHalf(S.week)?1:0}`; }
function churchDonated(){ return churchState().don === churchHalfKey(); }
function doDonate(){
  if(churchDonated()){ toast("이번 반기에는 이미 기부했다."); return; }
  if(S.gold < CHURCH_DONATE){ toast("자금이 모자란다."); return; }
  S.gold -= CHURCH_DONATE;
  churchState().don = churchHalfKey();
  const had = S.students.filter(s=> karmaOf(s) > 0);
  had.forEach(s=> addKarma(s, -CHURCH_KARMA));
  logE(`교회 기부 — <b>${fmt(CHURCH_DONATE)} G</b>를 헌금했다. 전 학생의 업보가 <b style="color:var(--ok)">${CHURCH_KARMA}</b> 씻겼다${had.length? ` (${had.length}명)`:""}.`,"good");
  save(); render();
  toast(had.length? `업보 -${CHURCH_KARMA} (${had.length}명)` : "씻을 업보가 없었다.");
}
function doHeal(sid){
  const st = S.students.find(x=>x.id===sid);
  if(!st || !isInjured(st)) return;
  if(S.gold < CHURCH_HEAL){ toast("자금이 모자란다."); return; }
  S.gold -= CHURCH_HEAL;
  const w = injWeeks(st);
  st.injured = 0; delete st._injNew;
  setCond(st, 100);
  logE(`교회 치유 — <b>${dnH(st)}</b>의 부상(${w}주)이 나았다. 컨디션이 <b style="color:var(--ok)">100</b>으로 회복됐다. (${fmt(CHURCH_HEAL)} G)`,"good");
  save(); render();
  toast(`${dn(st)}${iga(st.name)} 완전히 회복했다.`);
}

      </button>

        <div class="od" style="color:var(--dim)">${hurt.length? `치료 대상 ${hurt.length}명` : "지금은 다친 학생이 없다"}</div>

        <div class="od">전 학생의 컨디션이 그 자리에서 <b style="color:var(--ok)">${HOLY_WATER_COND}</b> 회복된다.</div>
        <div class="od" style="color:var(--dim)">각 계절의 상반기·하반기마다 1회 · 현재 ${S.year}년 ${PHASES[S.phase].n} ${halfLabel(S.week)}</div>

        <div class="od" style="color:var(--dim)">각 계절의 상반기·하반기마다 1회 · 지금 가진 책 <b style="color:var(--brass)">${bookCount()}권</b>

      </button>`; })()}

function teachSkill(i, sid, slot){
  const e = (S.skillPool||[])[i], st = S.students.find(x=>x.id===sid);
  if(!e || !st){ toast("대상을 찾을 수 없다."); return; }
  if(st.taught){ toast(`${dn(st)}${eunn(st.name)} 이미 전수를 받았다.`); return; }
  st.skMod = st.skMod||{};
  if(e.cat==="passive"){
    st.passiveJob = e.job;
    st.skMod.passive = Object.assign({}, e.mod);
  } else {

function skillModText(m){

const RELIC_SORT = [
  {k:"default",  n:"기본 (획득순)"},
  {k:"grade",    n:"등급 높은 순"},
  {k:"gradeAsc", n:"등급 낮은 순"},
  {k:"stat",     n:"주 능력치"},
  {k:"name",     n:"이름"}
];
const SKILL_SORT = [
  {k:"default", n:"기본 (획득순)"},
  {k:"grade",   n:"등급 높은 순"},
  {k:"level",   n:"레벨 높은 순"},
  {k:"cat",     n:"종류 (패시브·필살·스킬)"},
  {k:"job",     n:"직업 계열"},
  {k:"year",    n:"졸업 연도 (최신)"},
  {k:"name",    n:"이름"}
];
const RELIC_GRADE_ORD = {D:0, C:1, B:2, A:3, S:4};
const SK_CAT_ORD = {passive:0, ult:1, skill:2, basic:3};
/* 보관고는 배열 인덱스로 장착·처분하므로 {원본 인덱스}를 유지한 채 정렬한다 */
function sortRelicPool(pool, mode){
  const L = (pool||[]).map((r,i)=>({r,i}));
  const g = x => RELIC_GRADE_ORD[x.r.grade] != null ? RELIC_GRADE_ORD[x.r.grade] : 0;
  const nm = (a,b)=> String(a.r.name||"").localeCompare(String(b.r.name||""),"ko");
  if(mode==="grade")    return L.sort((a,b)=> g(b)-g(a) || nm(a,b));
  if(mode==="gradeAsc") return L.sort((a,b)=> g(a)-g(b) || nm(a,b));
  if(mode==="stat"){
    // 유물이 가진 옵션 중 기준 목록에서 가장 앞선 능력치로 묶는다
    const ord = x => Math.min.apply(null, ((x.r.aff||[]).map(a=> RELIC_AFFIX.findIndex(z=>z.k===a.k)).filter(i=>i>=0).concat([99])));
    return L.sort((a,b)=> ord(a)-ord(b) || g(b)-g(a) || nm(a,b));
  }
  if(mode==="name")     return L.sort(nm);
  return L;
}
function sortSkillPool(pool, mode){
  const L = (pool||[]).map((e,i)=>({e,i}));
  const g  = x => clamp((x.e.mod&&x.e.mod.grade)||0, 0, 4);
  const lv = x => 1 + ((x.e.mod&&x.e.mod.up)||0);
  const nm = (a,b)=> String(a.e.name||"").localeCompare(String(b.e.name||""),"ko");
  if(mode==="grade") return L.sort((a,b)=> g(b)-g(a) || lv(b)-lv(a) || nm(a,b));
  if(mode==="level") return L.sort((a,b)=> lv(b)-lv(a) || g(b)-g(a) || nm(a,b));
  if(mode==="cat")   return L.sort((a,b)=> (SK_CAT_ORD[a.e.cat]||0)-(SK_CAT_ORD[b.e.cat]||0) || g(b)-g(a) || nm(a,b));
  if(mode==="job")   return L.sort((a,b)=> String(JOBS[a.e.job].name).localeCompare(String(JOBS[b.e.job].name),"ko") || g(b)-g(a) || nm(a,b));
  if(mode==="year")  return L.sort((a,b)=> (b.e.year||0)-(a.e.year||0) || g(b)-g(a) || nm(a,b));
  if(mode==="name")  return L.sort(nm);
  return L;
}

const RIVAL_FOCUS_MUL = 1.15;   // 같은 집중 분야일 때 성장 배율
const BRO_STAT_MUL    = 0.06;   // 같은 팀일 때 체/공/방/속
const BRO_EXP_MUL     = 0.12;   // 같은 팀일 때 경험치
function partnerOf(st, key){
  if(!st || !st[key]) return null;
  return S.students.find(x=>x.id===st[key]) || null;
}
function rivalOf(st){ return partnerOf(st,"rival"); }
function broOf(st){ return partnerOf(st,"bro"); }
/* 상대가 학원을 떠났으면 관계를 정리한다 */
function cleanBonds(){
  const ids = new Set(S.students.map(x=>x.id));
  S.students.forEach(st=>{
    if(st.rival && !ids.has(st.rival)) delete st.rival;
    if(st.bro && !ids.has(st.bro)) delete st.bro;
  });
}
function bondTags(st){
  const r = rivalOf(st), b = broOf(st);
  return (r? `<span class="tag bond rv" title="라이벌 — 같은 집중 분야를 고르면 성장이 빨라진다">라이벌 ${esc(r.name)}</span>`:"")
       + (b? `<span class="tag bond br" title="소울메이트 — 같은 팀에서 싸우면 능력치와 경험치가 오른다">소울메이트 ${esc(b.name)}</span>`:"");
}
/* 집중 훈련 배율 — 라이벌이 같은 분야를 파고들 때 */
function rivalFocusMul(st){
  const r = rivalOf(st);
  if(!r) return 1;

/* 주간 훅 — 라이벌은 봄 2주, 소울메이트는 여름 상반기 중 한 주 */
function tryBonds(){
  const wk = S.week + 1;   // 표시 기준 주차
  if(S.phase==="spring" && wk===2){
    const r = makeRivals();
    if(r) queueCeremony({type:"rival", year:S.year, phase:"spring", week:wk,
      a:r.a, b:r.b, scene:pick(RIVAL_SCENE)});
  }
  if(S.phase==="summer" && S.year>=2){
    if(!S.broYear) S.broYear = {};
    if(S.broYear.y !== S.year){
      S.broYear = {y:S.year, wk: (S.year<=1 ? 1 : ri(1, HALF_WEEKS)), done:false};
    }
    if(!S.broYear.done && wk === S.broYear.wk){
      S.broYear.done = true;
      const b = makeBrothers();
      if(b) queueCeremony({type:"bro", year:S.year, phase:"summer", week:wk,
        a:b.a, b:b.b, scene:pick(BRO_SCENE)});
    }
  }
}

const FRIENDLY_SLOTS = [7, 9, 11];        // 주차 인덱스 (하반기 2·4·6주차)
const FRIENDLY_SLOT_N = ["하반기 2주차 후", "하반기 4주차 후", "하반기 6주차 후"];
/* 유명도 등급별 상대 전력 — 대회 프로필을 빌려 쓴다 */
const FRIENDLY_TIER = [
  {n:"무명",   d:"이제 막 간판을 올린 학원", raw:{g:"D", lv:7},            rare:0},
  {n:"유명",   d:"시내 대회 16강 언저리",     foe:"city",  lvOff:-1, rare:.05},
  {n:"강호",   d:"시내 대회 우승권",          foe:"city",  lvOff:1,  rare:.20},
  {n:"명문",   d:"광역 진출 ~ 광역 우승권",   foe:"region",lvOff:1,  rare:.22, span:3},
  {n:"초명문", d:"예선 진출 ~ 본선 우승권",   foe:"qual",  lvOff:1,  rare:.28, span:3, up:"final"}
];
const FRIENDLY_PHASES = {
  spring:{teams:1, n:"가을 대회 대비", d:"가을을 대비해 세 학원이 연습 경기를 청해왔다."},

function friendlyState(ph){
  ph = ph || (FRIENDLY_PHASES[S.phase] ? S.phase : "spring");
  if(!S.friendly || S.friendly.year !== S.year) S.friendly = {year:S.year};
  const F = S.friendly;
  if(!F[ph]) F[ph] = {offers:null, slots:[null,null,null], done:[], answered:false};
  const st = F[ph];
  st.slots = st.slots || [null,null,null];
  st.done = st.done || [];
  return st;
}
/* 유명도 차이에 따른 친선전 명성 — 이기면 얻고 지면 잃는다 */
function friendlyFameUnit(){ return 20 + fameTitleIdx(S.fame)*15; }
function fameTitleUpIdx(t){ return (t && typeof t.myTier==="number") ? t.myTier : fameTitleIdx(S.fame); }
function friendlyFame(diff, win){
  const U = friendlyFameUnit();
  const k = win
    ? (diff>0 ? 1.6 : diff===0 ? 1.0 : .45)     // 상위에 이기면 크게, 하위에 이기면 조금
    : -(diff>0 ? .35 : diff===0 ? .9 : 1.6);    // 상위에 지면 조금, 하위에 지면 크게
  return Math.round(U*k);
}
function friendlyTeam(ti){
  const T = FRIENDLY_TIER[clamp(ti,0,4)];
  const comp = pick(FOE_COMPS);
  if(T.raw){
    return assignFoeForm(comp.map(job=>{
      const st = newStudent(2, T.raw.g, job);
      st.level = T.raw.lv; st.exp = 0; st.relics = []; st.cond = 92;
      MENTAL.forEach(m=>{ if(m.k!=="pot") st.ment[m.k] = ri(10,20); });
      autoSkMod(st, st.level);
      return st;
    }));
  }
  const strong = T.up && Math.random()<.45;
  const P = LADDER_FOE[strong ? T.up : T.foe];
  const span = T.span||0;
  return assignFoeForm(comp.map(job=>{
    const rare = Math.random() < (T.rare||0);
    const y = rare ? 3 : (Math.random()<.5 ? 3 : 2);
    const prof = y===3 ? P.y3 : P.y2;
    const grade = rare ? P.rare.g : prof.g;
    const lv = clamp((rare? P.rare.lv : prof.lv) + (T.lvOff||0) + ri(-1, span? span-1 : 1), 1, 30);
    const st = newStudent(y, grade, job);
    st.level = lv; st.exp = 0; st.relics = []; st.cond = 92;
    autoSkMod(st, lv);
    return st;
  }));
}
function genFriendlyOffers(){
  const me = fameTitleIdx(S.fame);
  const nt = (FRIENDLY_PHASES[S.phase]||FRIENDLY_PHASES.spring).teams;
  const nm = acadNames(3);
  return [0,1,2].map((_,k)=>{
    const ti = clamp(me + ri(-1,1), 0, 4);
    const name = nm[k];
    return {name, tier:ti, teams: Array.from({length:nt},()=> friendlyTeam(ti))};
  });
}
function tryFriendly(){
  if(!FRIENDLY_PHASES[S.phase] || S.week !== HALF_WEEKS-1) return;
  const F = friendlyState(S.phase);
  if(F.offers) return;
  F.offers = genFriendlyOffers();
  queueCeremony({type:"friendly", year:S.year, phase:S.phase});
}
/* 친선전 자리 배치 — 이미 배치된 학원이면 두 자리를 맞바꾼다 */
function friendlyPlace(F, i, oi){
  const prev = F.slots.indexOf(oi);
  if(prev === i) return;
  if(prev >= 0) F.slots[prev] = F.slots[i];
  F.slots[i] = oi;
}
function friendlySwap(F, a, b){ const t = F.slots[a]; F.slots[a] = F.slots[b]; F.slots[b] = t; }
function friendlySlotAt(w){
  if(!FRIENDLY_PHASES[S.phase]) return null;
  const F = friendlyState(S.phase);
  const i = FRIENDLY_SLOTS.indexOf(w);
  if(i<0) return null;
  const oi = F.slots[i];
  if(oi==null || !F.offers || !F.offers[oi]) return null;
  if(F.done.some(d=>d.slot===i)) return null;
  return {i, oi, foe:F.offers[oi], phase:S.phase};
}

/* 개인 집중 훈련 — 약점 / 강점 일괄 지정 */
function focusKeys(){ return MENTAL.filter(m=>!m.fixed).map(m=>m.k); }
function focusPick(st, mode){
  const ks = focusKeys().filter(k=> FOCUS_FAC[k]);
  if(!ks.length) return null;
  let best = null;
  ks.forEach(k=>{
    const v = st.ment[k]||0;
    if(!best){ best = {k, v}; return; }
    if(mode==="weak" ? v < best.v : v > best.v) best = {k, v};
    // 동률이면 무작위로 하나
    else if(v === best.v && Math.random()<.5) best = {k, v};
  });
  return best;
}
/* 부상자 휴식 집중 전환 */
function setRestInjured(){
  const who = S.students.filter(s=> isInjured(s) && !isRestFocus(s));
  if(!who.length){ toast("훈련 중인 부상자가 없다."); return; }
  who.forEach(s=>{ s._prevFocus = s.focus; s.focus = FOCUS_REST; });
  logE(`휴식 전환 — 부상자 <b>${who.length}명</b>을 휴식 집중으로 돌렸다: ${who.map(s=>`${dnH(s)}(${injWeeks(s)}주)`).join(", ")}`,"good");
  save(); render(); toast(`부상자 ${who.length}명을 휴식 집중으로 돌렸다.`);
}
/* 컨디션 기준 휴식 집중 전환 */
function setRestFocus(thr){
  const who = S.students.filter(s=> s.cond <= thr && !isRestFocus(s));
  if(!who.length){ toast(`컨디션 ${thr} 이하인 학생이 없다.`); return; }
  who.forEach(s=>{ s._prevFocus = s.focus; s.focus = FOCUS_REST; });
  logE(`휴식 전환 — 컨디션 ${thr} 이하 <b>${who.length}명</b>을 휴식 집중으로 돌렸다: ${esc(who.map(s=>s.name).join(", "))}`,"good");
  save(); render();
  showModal(`<div class="cerhead"><div class="eyebrow">개인 집중 훈련 · 휴식 전환</div>
      <h2 style="font-size:22px;margin-top:2px">컨디션 ${thr} 이하 ${who.length}명</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:6px">이 학생들은 학원 스케줄에 참여하지 않고 매주 컨디션을 <b style="color:var(--ok)">${restFocusGain()}</b> 회복한다. 회복되면 학생 탭이나 아래 버튼으로 다시 훈련에 돌린다.</p></div>
    <div class="scroll-x" style="max-height:300px;overflow-y:auto;margin-top:12px">
      <table class="tb"><thead><tr><th>학생</th><th>컨디션</th><th>훈련 효율</th><th>이전 집중 분야</th></tr></thead><tbody>
      ${who.slice().sort((a,b)=>a.cond-b.cond).map(s=>{ const e=condEff(s.cond);
        return `<tr><td>${dnH(s)}</td><td class="num" style="color:var(--${e.tone})">${Math.round(s.cond)}</td>
          <td class="num" style="color:var(--${e.tone})">${e.pct}%</td>
          <td>${s._prevFocus==="free"||!s._prevFocus? "지정 없음" : (MENTAL.find(m=>m.k===s._prevFocus)||{n:"—"}).n}</td></tr>`;
      }).join("")}</tbody></table></div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn" id="rsBack">되돌리기</button>
      <button class="btn primary" data-close>확인</button></div>`, ()=>{
    $("#rsBack").onclick = ()=>{

      closeModal(); save(); render(); toast("휴식 전환을 되돌렸다.");
    };
  }, true);
}
/* 개인 집중 훈련 — 지난 주에 쓰던 설정 */
function focusSnapshot(){ const m={}; S.students.forEach(s=> m[s.id] = s.focus||"free"); return m; }
/* focusHist[0] = 지난주에 쓴 설정 · focusHist[1] = 지지난주에 쓴 설정 */
function focusHist(){
  if(!Array.isArray(S.focusHist)) S.focusHist = S.focusPrev ? [S.focusPrev] : [];
  return S.focusHist;
}
function focusHistPush(){
  const h = focusHist();
  S.focusHist = [focusSnapshot(), h[0] || null].slice(0, 2);
  S.focusPrev = S.focusHist[0];   // 옛 세이브 호환
}
/* 두 스냅샷을 학생 단위로 비교 */
function focusMapDiff(a, b){
  if(!a || !b) return 0;
  return S.students.filter(s=> a[s.id]!=null && b[s.id]!=null && a[s.id]!==b[s.id]).length;
}
/* 이번에 바꾼 설정을 취소 — 지난주 배치로 되돌릴 인원 수 */
function focusUndoDiff(){
  const p1 = focusHist()[0];
  if(!p1) return 0;
  return S.students.filter(s=> p1[s.id]!=null && (s.focus||"free") !== p1[s.id]).length;
}
function undoFocusChange(){
  const p1 = focusHist()[0];
  if(!p1){ toast("아직 진행한 주가 없다."); return; }
  const ch = [];
  S.students.forEach(s=>{
    if(p1[s.id]==null || (s.focus||"free")===p1[s.id]) return;
    ch.push(s); s.focus = p1[s.id]; delete s._prevFocus;
  });
  if(!ch.length){ toast("이미 지난주 설정과 같다."); return; }
  logE(`개인 집중 훈련 — 바꾼 설정을 취소하고 지난주 배치로 되돌렸다 (<b>${ch.length}명</b>): ${ch.map(x=>dnH(x)).join(", ")}`, "");
  save(); render();
  toast(`${ch.length}명을 지난주 설정으로 되돌렸다.`);
}
/* 지난주에 설정을 바꿨을 때만 — 지지난주 배치로 되돌릴 인원 수 */
function focusPrevDiff(){
  const h = focusHist(), p1 = h[0], p2 = h[1];
  if(!p1 || !p2) return 0;
  if(!focusMapDiff(p2, p1)) return 0;                       // 지난주에 바뀐 게 없으면 되돌릴 것도 없다
  return S.students.filter(s=> p2[s.id]!=null && (s.focus||"free") !== p2[s.id]).length;
}
function restoreFocusPrev(){
  const h = focusHist(), p1 = h[0], p2 = h[1];
  if(!p1 || !p2){ toast("아직 비교할 지난주 기록이 없다."); return; }
  if(!focusMapDiff(p2, p1)){ toast("지난주에 바꾼 설정이 없다."); return; }
  const ch = [];
  S.students.forEach(s=>{
    if(p2[s.id]==null || (s.focus||"free")===p2[s.id]) return;
    ch.push(s); s.focus = p2[s.id]; delete s._prevFocus;
  });
  if(!ch.length){ toast("이미 지지난주 설정과 같다."); return; }
  logE(`개인 집중 훈련 — 지난주에 바꾼 설정을 취소하고 지지난주 배치로 되돌렸다 (<b>${ch.length}명</b>): ${ch.map(x=>dnH(x)).join(", ")}`, "");
  save(); render();
  toast(`${ch.length}명을 지지난주 설정으로 되돌렸다.`);
}
/* 개인 집중 훈련 — 전부 지정 없음으로 */
function clearFocusAll(){
  const who = S.students.filter(s=> s.focus && s.focus!=="free");
  if(!who.length){ toast("지정된 학생이 없다."); return; }
  const rest = who.filter(isRestFocus).length;
  who.forEach(s=>{ s.focus = "free"; delete s._prevFocus; });
  logE(`개인 집중 훈련 — <b>${who.length}명</b>의 집중 분야를 모두 해제했다${rest? ` (휴식 집중 ${rest}명 포함)`:""}.`,"");
  save(); render();
  toast(`${who.length}명의 집중 지정을 해제했다.`);
}
function setFocusAll(mode){
  const rows = [];
  S.students.forEach(st=>{
    const b = focusPick(st, mode);
    if(!b) return;
    const before = st.focus;
    delete st._prevFocus;
    st.focus = b.k;
    rows.push({st, k:b.k, v:Math.round(b.v), changed: before!==b.k});
  });
  if(!rows.length){ toast("지정할 학생이 없다."); return; }
  const label = mode==="weak" ? "약점" : "강점";
  const cnt = {};
  rows.forEach(r=> cnt[r.k] = (cnt[r.k]||0)+1);
  const sum = Object.keys(cnt).map(k=>`${MENTAL.find(m=>m.k===k).n} ${cnt[k]}명`).join(" · ");
  logE(`개인 집중 훈련 일괄 지정 (${label}) — ${sum}`,"good");
  save(); render();
  showModal(`<div class="cerhead"><div class="eyebrow">개인 집중 훈련 · 임의 설정</div>
      <h2 style="font-size:22px;margin-top:2px">${label} 기준 일괄 지정</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:6px">${rows.length}명의 집중 분야를 각자 가장 ${mode==="weak"?"낮은":"높은"} 멘탈리티로 맞췄다. ${esc(sum)}</p></div>
    <div class="scroll-x" style="max-height:340px;overflow-y:auto;margin-top:12px">
      <table class="tb"><thead><tr><th>학생</th><th>학년</th><th>집중 분야</th><th>현재 수치</th><th>시설</th></tr></thead><tbody>
      ${rows.slice().sort((a,b)=> a.v-b.v || a.st.name.localeCompare(b.st.name)).map(r=>`<tr>
        <td>${dnH(r.st)}${r.changed?"":' <span style="color:var(--dim);font-size:11px">변경 없음</span>'}</td>
        <td class="num">${r.st.year}</td>
        <td><b style="color:var(--brass)">${MENTAL.find(m=>m.k===r.k).n}</b></td>
        <td class="num">${r.v}</td>
        <td style="font-size:12px;color:var(--muted)">${FACILITIES[FOCUS_FAC[r.k]].n} Lv.${S.facil[FOCUS_FAC[r.k]]}</td></tr>`).join("")}
      </tbody></table></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn primary" data-close>확인</button></div>`, null, true);
}

  const order = p.order || [0,1,2];
  return `<div class="cslblock">

      <div class="cslwho">${dnH(st)} ${roleTag(st.job)}<span class="tag yr">${st.year}학년</span>

    </div>
    <p style="color:var(--muted);font-size:12.5px;margin:10px 0 8px">${p.reveal
      ? `<b style="color:var(--brass)">정보력으로 ${dnH(st)}에게 통할 말을 미리 파악했다.</b>`
      : `정보력이 높으면 통할 말을 미리 알아볼 수 있다.`}</p>
    <div class="grid2">
      ${order.map(i=>{
        const hit = p.reveal && (c.o[i].f||[]).includes(st.pers||"plain");
        return `<button class="opt cslopt ${hit?"cslhit":""}" data-csl="${qi}|${i}">
          <div class="on">${esc(c.o[i].t)}${hit? `<span class="price" style="color:var(--brass)">통할 말</span>`:""}</div>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

    ${g.length? `<div class="grid2">${g.map(x=>`<div class="cercard">
        <div class="on">${epiH(x.name)} ${roleTag(x.job)}<span class="price">${x.year}년 졸업 · Lv.${x.lv}</span></div>
        <div class="cerrole" style="${x.dark?"color:var(--bad)":""}">${esc(x.career)}</div>
        ${x.reason? `<div class="cerwhy">${esc(x.reason)}</div>`:""}
        <div class="cerfoot"><span>평가 ${x.score}</span>${x.trust? `<span style="color:var(--brass)">신뢰 ${trustBand(x.trust).step}</span>`:""}${x.karma? `<span style="color:var(--bad)">업보 ${fmt(x.karma)}</span>`:""}${x.pw?`<span>전투력 ${fmt(x.pw)}</span>`:""}<span style="color:var(--${x.fame<0?"bad":"brass"})">명성 ${x.fame<0?"":"+"}${fmt(x.fame)}</span></div>
      </div>`).join("")}</div>`
    : `<div class="empty">아직 졸업생이 없다. 3학년은 가을 대회가 끝나면 졸업한다.</div>`}
  </section>
  <section class="panel">
    <div class="panel-h"><h2>진로 기준</h2><span class="hint">진로 평가는 대회 성적과 원정 성과로만 쌓인다</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">신입생은 평가 0에서 시작한다. 원정은 원정지마다 정해진 상한까지만 올려주고, 그 위는 대회에서만 넘길 수 있다. 대회에 나가 1승도 못 하면 평가가 깎인다.</p>
    <div class="scroll-x"><table class="tb"><thead><tr><th>진로</th><th>필요 평가</th><th>학원 명성</th><th>후원금</th><th>설명</th></tr></thead>
    <tbody>${CAREERS.filter(c=>c.id!=="none").map(c=>`<tr><td>${c.n}</td><td class="num">${c.min}</td><td class="num">+${c.fame}</td><td class="num">${fmt(c.gold)}</td><td style="color:var(--muted)">${c.d}</td></tr>`).join("")}</tbody></table></div>
    <div class="rule"></div>
    <div class="panel-h" style="margin-bottom:8px"><h2 style="font-size:13px">업보 진로</h2><span class="hint">업보가 쌓이면 평가와 무관하게 이쪽으로 갈린다</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">업보는 <b style="color:var(--text)">안개 낀 옛 성터 이상의 원정</b>에서 구간마다 쌓인다 (성터 ${DUNGEONS[1].karma} · 종탑 ${DUNGEONS[2].karma} · 균열 ${DUNGEONS[3].karma} · 무덤 ${DUNGEONS[4].karma}).
      교회에 <b style="color:var(--text)">${fmt(CHURCH_DONATE)} G</b>를 기부하면 전 학생의 업보가 ${CHURCH_KARMA} 씻긴다 (반기당 1회).</p>
    <div class="scroll-x"><table class="tb"><thead><tr><th>진로</th><th>필요 업보</th><th>필요 평가</th><th>학원 명성</th><th>후원금</th><th>설명</th></tr></thead>
    <tbody>${DARK_CAREERS.slice().reverse().map(c=>`<tr><td style="color:var(--bad)">${c.n}</td><td class="num">${c.karma}</td><td class="num">${c.min>0?c.min:"—"}</td>
      <td class="num" style="color:var(--${c.fame>=0?"ok":"bad"})">${c.fame>=0?"+":""}${fmt(c.fame)}</td><td class="num">${fmt(c.gold)}</td><td style="color:var(--muted)">${c.d}</td></tr>`).join("")}</tbody></table></div>
  </section>`;
}

/* ---------- 스카우트 ---------- */
function viewScout(){
  const got = (S.incoming||[]).length;
  return `<section class="panel">
    <div class="panel-h"><h2>겨울 스카우트</h2><span class="hint">확보 <b style="color:var(--${got>=enrollCap()?"ok":"brass"})">${got}</b>/${enrollCap()}${
      got>=enrollCap() ? ` · <b style="color:var(--ok)">정원이 찼다 — 스카우트 종료</b>`
             : ` · 남은 시도 <b style="color:var(--brass)">${S.scoutTries||0}</b>/${scoutTriesMax()}회 · 부족분은 일반 지원자로 채워진다`}</span></div>
    ${got>=enrollCap() ? `<div class="opt" style="cursor:default;border-color:var(--ok);margin-bottom:10px">
      <div class="on" style="color:var(--ok)">신입생 ${enrollCap()}명 확보 완료</div>
      <div class="od">${(S.incoming||[]).map(x=>`${dnH(x)} (${x.grade}급 ${JOBS[x.job].name})`).join(" · ")}</div>
      <div class="od" style="color:var(--dim)">정원이 찼으므로 남은 시도 ${S.scoutTries||0}회는 쓰이지 않고 사라진다. 겨울이 끝나면 이들이 입학한다.</div>
    </div>` : ""}
    <p style="font-size:12px;color:var(--dim);margin:-6px 0 10px">신입생 정원은 현재 <b style="color:var(--brass)">${enrollCap()}명</b>이다 (무명·유명 3 · 강호·명문 4 · 초명문 5). 겨울마다 스카우트 시도는 기본 ${SCOUT_TRIES}회이며, 학원 유명도가 한 등급 오를 때마다 1회씩 늘어난다 (현재 <b style="color:var(--brass)">${fameTitle(S.fame).n}</b> — ${scoutTriesMax()}회). 자금은 들지 않고, 성공하든 실패하든 시도 1회가 소모된다. 처음 실패한 상대는 성공률 +10%p로 한 번 더 설득할 수 있고, 두 번째도 실패하면 그 학생은 떠난다. <b style="color:var(--text)">${enrollCap()}명을 확보하면 남은 시도와 관계없이 스카우트가 끝난다.</b>
      후보의 등급은 학원 유명도(<b style="color:var(--brass)">${fameTitle(S.fame).n}</b>)를 따른다.</p>
    <div class="grid2">
      ${S.scouts.map((c,i)=>{
        const s=c.st;
        const st = c.state;
        return `<div class="opt ${st!=="open"?"locked":""}" style="cursor:default">
          <div class="on">${dnH(s)} ${gradeTag(s.grade)} ${roleTag(s.job)}
            <span class="price">${st==="got"?"영입 완료":st==="lost"?"떠남":"성공률 "+(c.rate*100).toFixed(0)+"%"}</span></div>
          <div class="od">잠재력 ${Math.round(s.ment.pot)}${st==="retry"?' · <b style="color:var(--warn)">재설득 가능</b>':""}</div>
          <div class="od">${MENTAL.filter(m=>m.k!=="pot").map(m=>`${m.n} ${Math.round(s.ment[m.k])}`).join(" · ")}</div>
          ${(st==="open"||st==="retry")? `<div style="margin-top:6px"><button class="btn sm primary" data-scout="${i}" ${got>=enrollCap()||(S.scoutTries||0)<=0?"disabled":""}>${st==="retry"?"한 번 더 설득":"영입 시도"}</button></div>`:""}
        </div>`;
      }).join("")}
    </div>
  </section>`;
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-sid]").forEach(b=> b.onclick=()=>{ UI.sel = (UI.sel===b.dataset.sid?null:b.dataset.sid); UI.view="roster"; render(); });
  const fs = $("#focusSel");
  if(fs) fs.onchange = ()=>{ const s=S.students.find(x=>x.id===UI.sel); if(s){ s.focus=fs.value; save(); render(); toast(`${dn(s)}의 집중 분야 변경`);} };
  const bsu = $("#btnSkUp"); if(bsu) bsu.onclick = ()=> skillUpModal(UI.sel);
  const brn = $("#btnStName"); if(brn) brn.onclick = ()=> renameStudent(UI.sel);
  const bas = $("#btnAutoSp"); if(bas) bas.onclick = ()=> autoSkillUpConfirm();
  ["#rsort","#rsort2"].forEach(id=>{
    const el = $(id);
    if(el) el.onchange = ()=>{ if(!S.opts) S.opts={}; S.opts.rsort = el.value; save(); render(); };
  });
  { const el = $("#rlsort"); if(el) el.onchange = ()=>{ if(!S.opts) S.opts={}; S.opts.rlsort = el.value; save(); render(); }; }
  { const el = $("#sksort"); if(el) el.onchange = ()=>{ if(!S.opts) S.opts={}; S.opts.sksort = el.value; save(); render(); }; }
  v.querySelectorAll("[data-team]").forEach(b=> b.onclick=()=>{ UI.team=b.dataset.team; UI.slot=null; render(); });
  v.querySelectorAll("[data-form]").forEach(b=> b.onclick=()=>{
    const t = teamByName(UI.team||"A");
    if(t.form===b.dataset.form) return;
    const keep = teamMembers(t).map(x=>x.id);
    t.form = b.dataset.form; t.slots = {};
    formSlots(t.form).forEach((k,i)=>{ if(keep[i]) t.slots[k]=keep[i]; });
    UI.slot=null; save(); render();
  });
  v.querySelectorAll("[data-slot]").forEach(b=> b.onclick=()=>{
    UI.slot = (UI.slot===b.dataset.slot) ? null : b.dataset.slot;
    render();
  });
  v.querySelectorAll("[data-assign2]").forEach(b=> b.onclick=()=>{
    const id = b.dataset.assign2;
    let slot = UI.slot;
    if(!slot){                              // 자리를 안 골랐으면 빈 자리에 넣어준다
      const t0 = teamByName(UI.team||"A");
      const empty = formSlots(t0.form).find(k=> !t0.slots[k]);
      if(!empty){ toast("빈 자리가 없다. 자리를 먼저 고르거나 카드를 자리로 끌어다 놓는다."); return; }
      slot = `${t0.n}|${empty}`;
    }
    const [tn,k] = slot.split("|");
    teamAssign(tn, k, id);
    UI.slot=null; save(); render();
  });
  // 드래그 배치 — 명부 카드 · 배치 자리
  dragCfg(v, UI.view!=="team" ? null : {
    from: "[data-assign2],[data-slot]",
    to:   "[data-slot],.roster",
    payload: el=>{
      if(el.dataset.assign2) return {kind:"stu", id:el.dataset.assign2};
      const [tn,k] = (el.dataset.slot||"").split("|");
      const t = teamByName(tn);
      if(!t || !t.slots[k]) return null;    // 빈 자리는 집을 게 없다
      return {kind:"slot", tn, k, id:t.slots[k]};
    },
    accept: (pl, t)=> t.classList.contains("roster") ? pl.kind==="slot" : true,
    drop: (pl, t)=>{
      if(!t) return;
      if(t.classList.contains("roster")){    // 명부로 끌어내면 편성에서 뺀다
        const tm = teamByName(pl.tn);
        if(tm){ delete tm.slots[pl.k]; UI.slot=null; save(); render(); }
        return;
      }
      const [tn,k] = (t.dataset.slot||"").split("|");
      if(pl.kind==="slot" && pl.tn===tn && pl.k===k) return;
      teamAssign(tn, k, pl.id);
      UI.slot=null; save(); render();
    }
  });
  const btn2 = $("#btnTeamName"); if(btn2) btn2.onclick = ()=>{
    const t = teamByName(UI.team||"A");
    showModal(`<h2 style="font-size:17px;margin-bottom:6px">팀 이름</h2>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:10px">비워두면 <b style="color:var(--text)">팀 ${t.n}</b>${ro(t.n)} 돌아간다. 최대 12자.</p>
      <input id="tmIn" maxlength="12" placeholder="팀 ${t.n}" value="${esc(t.label||"")}"
        style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px">
      <div class="btnrow" style="margin-top:12px">
        <button class="btn primary" id="tmOk">변경</button>
        <button class="btn" data-close>취소</button></div>`, ()=>{
      const inp = $("#tmIn");
      const go = ()=>{
        const v = (inp.value||"").trim().slice(0,12);
        if(v) t.label = v; else delete t.label;
        closeModal(); save(); render(); toast(`${teamLabel(t)}${ro(teamLabel(t))} 변경`);
      };
      $("#tmOk").onclick = go;
      inp.onkeydown = e=>{ if(e.key==="Enter") go(); };
      inp.focus(); inp.select();
    });
  };
  const btc = $("#btnTeamClear"); if(btc) btc.onclick = ()=>{
    const t = teamByName(UI.team||"A"); t.slots={}; UI.slot=null; save(); render();
  };
  const btr = $("#btnTeamRole"); if(btr) btr.onclick = ()=>{
    const res = autoFillAllTeams();
    if(!res.length){ toast("빈 자리가 없거나 배정할 학생이 없다."); return; }
    const n = res.reduce((a,x)=>a+x.filled.length,0);
    logE(`팀 편성 — 진형에 맞춰 ${n}명을 배치했다 (${res.map(x=>`${teamLabel(x.t)} ${x.filled.length}명`).join(" · ")})`,"good");
    UI.slot=null; save(); render();
    showModal(`<div class="cerhead"><div class="eyebrow">팀 편성 · 진형 기준 임의 편성</div>
        <h2 style="font-size:22px;margin-top:2px">${n}명 배치</h2>
        <p style="color:var(--muted);font-size:13px;margin-top:6px">비어 있던 자리에 아직 팀이 없는 학생을 진형이 요구하는 역할대로 넣었다. 맞는 역할이 없으면 전투력이 높은 순서로 채운다.</p></div>
      ${res.map(x=>`<div class="opt" style="cursor:default;margin-top:10px">
        <div class="on">${esc(teamLabel(x.t))} <span class="tag">${formOf(x.t.form).n}</span><span class="price">${x.filled.length}명</span></div>
        ${x.filled.map(f=>`<div class="od">${slotRow(f.slot)==="front"?"전열":"후열"} —
          <b style="color:var(--text)">${dnH(f.st)}</b> ${JOBS[f.st.job].name}
          <span style="color:var(--${f.want && f.want.includes(roleOf(f.st)) ? "ok":"warn"})">${ROLE_LABEL[roleOf(f.st)]}</span>
          <span style="color:var(--dim)">${f.want? `요구 ${f.want.map(r=>ROLE_LABEL[r]).join("/")}` : "역할 무관"}${f.want && !f.want.includes(roleOf(f.st))? " · 대체 배치":""}</span>
          <span style="color:var(--dim)">· 전투력 ${fmt(power(f.st))}</span></div>`).join("")}
      </div>`).join("")}
      <div class="btnrow" style="margin-top:14px"><button class="btn primary" data-close>확인</button></div>`, null, true);
  };
  const bta = $("#btnTeamAuto"); if(bta) bta.onclick = ()=>{
    const t = teamByName(UI.team||"A");
    const taken = new Set();
    teamsOf().forEach(x=>{ if(x.n!==t.n) formSlots(x.form).forEach(k=>{ if(x.slots[k]) taken.add(x.slots[k]); }); });
    const pool = S.students.filter(x=>!taken.has(x.id)).sort((a,b)=> power(b)-power(a));
    t.slots = {};
    formSlots(t.form).forEach((k,i)=>{ if(pool[i]) t.slots[k]=pool[i].id; });
    UI.slot=null; save(); render(); toast(`${teamLabel(t)} 자동 편성`);
  };
  v.querySelectorAll("[data-unequip]").forEach(b=> b.onclick=()=>{
    const [sid,idx] = b.dataset.unequip.split("|");
    const s = S.students.find(x=>x.id===sid);
    const r = s.relics.splice(+idx,1)[0];
    if(r) addRelicToPool(r);
    save(); render();
  });
  /* 훈련 카드 — 드래그하거나 눌러서 옮긴다 */
  v.querySelectorAll("[data-card]").forEach(el=>{
    const u = +el.dataset.card;
    el.addEventListener("dragstart", e=>{
      UI.drag = u; el.classList.add("dragging");
      try{ e.dataTransfer.setData("text/plain", String(u)); e.dataTransfer.effectAllowed="move"; }catch(x){}
    });
    el.addEventListener("dragend", ()=>{ UI.drag=null; el.classList.remove("dragging"); });
    el.addEventListener("click", ()=>{
      const inSlot = (S.slots||[]).findIndex(c=>c && c.u===u);
      if(inSlot>=0){ slotClear(inSlot); }
      else {
        const d = (S.slots||[]).findIndex(c=>!c);
        if(d<0){ toast("다섯 칸이 모두 찼다. 칸의 카드를 눌러 손패로 되돌린다."); return; }
        slotPut(u, d);
      }
      save(); render();
    });
  });
  v.querySelectorAll("[data-slot]").forEach(el=>{
    el.addEventListener("dragover", e=>{ e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", ()=> el.classList.remove("over"));
    el.addEventListener("drop", e=>{
      e.preventDefault(); el.classList.remove("over");
      let u = 0;
      try{ u = +(e.dataTransfer.getData("text/plain")||0); }catch(x){}
      if(!u) u = UI.drag||0;
      if(!u) return;
      slotPut(u, +el.dataset.slot); UI.drag=null; save(); render();
    });
  });
  v.querySelectorAll("[data-handzone]").forEach(el=>{
    el.addEventListener("dragover", e=>{ e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", ()=> el.classList.remove("over"));
    el.addEventListener("drop", e=>{
      e.preventDefault(); el.classList.remove("over");
      let u = 0;
      try{ u = +(e.dataTransfer.getData("text/plain")||0); }catch(x){}
      if(!u) u = UI.drag||0;
      const j = (S.slots||[]).findIndex(c=>c && c.u===u);
      if(j>=0){ slotClear(j); UI.drag=null; save(); render(); }
    });
  });
  const bAuto = $("#btnAuto"); if(bAuto) bAuto.onclick = ()=>{ autoFillSlots(); save(); render(); };
  const bCls  = $("#btnClearSlots"); if(bCls) bCls.onclick = ()=>{ for(let i=WEEK_DAYS-1;i>=0;i--) slotClear(i); save(); render(); };
  const bfw = $("#btnFocusWeak");   if(bfw) bfw.onclick = ()=> setFocusAll("weak");
  const bfs = $("#btnFocusStrong"); if(bfs) bfs.onclick = ()=> setFocusAll("strong");
  const br40 = $("#btnRest40"); if(br40) br40.onclick = ()=> setRestFocus(39);
  const br70 = $("#btnRest70"); if(br70) br70.onclick = ()=> setRestFocus(69);
  const bfc = $("#btnFocusClear"); if(bfc) bfc.onclick = ()=> clearFocusAll();
  const bfu = $("#btnFocusUndo");  if(bfu) bfu.onclick = ()=> undoFocusChange();
  const bfp = $("#btnFocusPrev");  if(bfp) bfp.onclick = ()=> restoreFocusPrev();
  const brI = $("#btnRestInj"); if(brI) brI.onclick = ()=> setRestInjured();
  const bw = $("#btnWeek"); if(bw) bw.onclick=()=> runWithReport();
  const br = $("#btnRest"); if(br) br.onclick=()=> runWeeks(halfLeft());
  v.querySelectorAll("[data-fac]").forEach(b=> b.onclick=()=>{
    const k=b.dataset.fac, c=facCost(k);
    if(S.gold<c || (S.facil[k]||0) >= facMax(k)) return;
    S.gold-=c; S.facil[k] = (S.facil[k]||0) + 1;
    logE(`<b>${FACILITIES[k].n}</b> 확장 — Lv.${S.facil[k]}`,"good"); save(); render();
  });
  const bd = $("#btnDonate"); if(bd) bd.onclick = ()=> doDonate();
  const bhw = $("#btnWater");   if(bhw) bhw.onclick = ()=> buyHolyWater();
  const bbk = $("#btnBook");    if(bbk) bbk.onclick = ()=> buyForesight();
  const bbu = $("#btnBookUse"); if(bbu) bbu.onclick = ()=> useForesight();
  v.querySelectorAll("[data-heal]").forEach(b=> b.onclick=()=> doHeal(b.dataset.heal));
  v.querySelectorAll("[data-item]").forEach(b=> b.onclick=()=>{
    const k=b.dataset.item, it=ITEMS[k];
    if(S.items[k]||S.gold<it.price) return;
    S.gold-=it.price; S.items[k]=1;
    logE(`<b>${it.n}</b> 구비 — ${it.d}`,"good"); save(); render();
  });
  v.querySelectorAll("[data-equip]").forEach(b=> b.onclick=()=>{
    const i=+b.dataset.equip;
    const sid = v.querySelector(`[data-eqsel="${i}"]`).value;
    const s = S.students.find(x=>x.id===sid);
    if(!s) return;
    s.relics = s.relics||[];
    if(s.relics.filter(Boolean).length >= relicSlots(s)){ toast(`${dn(s)}의 유물 칸이 가득 찼다.`); return; }
    s.relics.push(S.relicPool.splice(i,1)[0]);
    save(); render(); toast(`${dn(s)}에게 장착`);
  });
  v.querySelectorAll("[data-teach]").forEach(b=> b.onclick=()=>{
    const i = +b.dataset.teach;
    const sel = v.querySelector(`[data-tsel="${i}"]`);
    teachCompare(i, sel? sel.value : null);

function showModal(html, bind, wide){
  dragCfg($("#modalRoot"), null);   // 새 팝업에는 이전 드래그 설정을 물려주지 않는다
  $("#modalRoot").innerHTML = `<div class="overlay"><div class="modal" style="${wide?"width:min(980px,100%)":""}">${html}</div></div>`;
  $("#modalRoot").querySelectorAll("[data-close]").forEach(b=> b.onclick=closeModal);
  if(bind) bind();
}
function closeModal(){ dragCfg($("#modalRoot"), null); $("#modalRoot").innerHTML=""; }

function queueCeremony(c){ UI.ceremonies = UI.ceremonies||[]; UI.ceremonies.push(c); }
function showCeremony(){
  const c = (UI.ceremonies||[]).shift();
  if(!c){ render(); return; }
  const html = c.type==="grad" ? gradCeremony(c)
    : (c.type==="rival"||c.type==="bro") ? bondCeremony(c)
    : c.type==="friendly" ? friendlyCeremony(c)
    : c.type==="epithet" ? epithetCeremony(c)
    : c.type==="unlock" ? unlockCeremony(c)
    : enrollCeremony(c);
  showModal(html, ()=>{
    if(c.type==="friendly"){
      const F = friendlyState(c.phase||"spring");
      const redraw = ()=>{ UI.ceremonies.unshift(c); closeModal(); showCeremony(); };
      $("#modalRoot").querySelectorAll("[data-fof]").forEach(b=> b.onclick=()=>{
        const oi = +b.dataset.fof;
        const at = F.slots.indexOf(oi);
        if(at>=0){ F.slots[at]=null; UI.fsel=null; }
        else UI.fsel = (UI.fsel===oi? null : oi);
        redraw();
      });
      $("#modalRoot").querySelectorAll("[data-fslot]").forEach(b=> b.onclick=()=>{
        const i = +b.dataset.fslot;
        if(F.slots[i]!=null){ F.slots[i]=null; redraw(); return; }
        if(UI.fsel==null) return;
        const prev = F.slots.indexOf(UI.fsel);
        if(prev>=0) F.slots[prev]=null;
        F.slots[i]=UI.fsel; UI.fsel=null; redraw();
      });
      dragCfg($("#modalRoot"), {
        from: "[data-fof],[data-fslot]",
        to:   "[data-fslot],.foflist",
        payload: el=>{
          if(el.dataset.fof!=null && el.dataset.fof!=="") return {kind:"offer", oi:+el.dataset.fof};
          const i = +el.dataset.fslot;
          if(F.slots[i]==null) return null;      // 빈 자리는 집을 게 없다
          return {kind:"slot", i};
        },
        accept: (pl, t)=> t.classList.contains("foflist") ? pl.kind==="slot" : true,
        drop: (pl, t)=>{
          if(!t) return;
          if(t.classList.contains("foflist")){ if(pl.kind==="slot") F.slots[pl.i]=null; }
          else {
            const i = +t.dataset.fslot;
            if(pl.kind==="offer") friendlyPlace(F, i, pl.oi);
            else if(pl.i !== i)   friendlySwap(F, pl.i, i);
          }
          UI.fsel = null; save(); redraw();
        }
      });
      $("#fDecline").onclick = ()=>{ F.slots=[null,null,null]; UI.fsel=null; F.answered=true;
        logE(`친선전 — 세 학원의 요청을 모두 거절했다.`,"");
        save(); closeModal(); showCeremony(); };
    }
    $("#cerOk").onclick = ()=>{
      if(c.type==="friendly"){
        const F = friendlyState(c.phase||"spring"); F.answered=true; UI.fsel=null;
        const n = F.slots.filter(x=>x!=null).length;
        logE(n? `친선전 회신 — ${F.slots.map((oi,i)=> oi==null? null : `${FRIENDLY_SLOT_N[i]} ${esc(F.offers[oi].name)}`).filter(Boolean).join(" · ")}`
              : `친선전 — 요청을 받아들이지 않았다.`, n?"good":"");
        save();
      }
      closeModal(); showCeremony();
    };
  }, true);
}
