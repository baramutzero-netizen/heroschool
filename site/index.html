/* ============================================================
   스킬 강화 — 레벨 2당 1포인트, 3지선다
   ============================================================ */
const SK_ASPECT = {pow:"효과량", proc:"출현 확률", dur:"지속 시간"};
function evoChance(st){
  const m = MENTAL.reduce((a,x)=>a+st.ment[x.k],0)/MENTAL.length;
  return clamp(.10 + m/100*.5, .10, .62);
}
function genSkillOptions(st){
  const list = skillsOf(st).map(sk=>({kind:"skill", sk}));
  const P = passiveOf(passiveJobOf(st));
  if(P) list.push({kind:"passive", name:P.n, id:"passive", desc:P.d});
  const pool = shuffle(list.slice());
  const evoP = evoChance(st);
  const out = [];
  for(let i=0;i<3;i++){
    const t = pool[i % pool.length];
    const isSkill = t.kind==="skill";
    const w = {pow:60};
    if(isSkill && !t.sk.kind) w.proc = 25;
    if(isSkill && skDur(st, t.sk) > 0) w.dur = 15;
    const aspect = wchoose(w);
    out.push({t, aspect, evo: Math.random() < evoP});
  }
  return out;
}
function skillOptText(st, o){
  const amt = o.evo ? SK_EVO : SK_UP;
  if(o.aspect==="dur") return `지속 시간 +${amt.dur}턴`;
  if(o.aspect==="proc") return `출현 확률 +${Math.round(amt.proc*100)}%`;
  return `효과량 +${Math.round(amt.pow*100)}%`;
}
function applySkillUp(st, o, silent){
  const id = o.t.kind==="passive" ? "passive" : o.t.sk.id;
  const m = modOf(st, id);
  const amt = o.evo ? SK_EVO : SK_UP;
  m[o.aspect] = (m[o.aspect]||0) + amt[o.aspect];
  m.up = (m.up||0) + 1;
  if(o.evo) m.grade = Math.min(4, (m.grade||0)+1);
  st.sp = Math.max(0, (st.sp||0)-1);
  if(!silent){
    const nm = o.t.kind==="passive" ? o.t.name : o.t.sk.name;
    logE(`<b>${dnH(st)}</b> — ${o.evo? "진화 강화":"강화"} · ${nm} ${skillOptText(st,o)}${o.evo? ` · 등급 ${SK_GRADE[m.grade]}`:""}`, o.evo? "big":"good");
  }
}
/* 개교 시점의 상급생 — 쌓인 포인트를 임의로 소비한 상태로 시작 */
function autoSpendSp(st){
  let guard = 0;
  while((st.sp||0) > 0 && guard++ < 40){
    const list = skillsOf(st).map(sk=>({kind:"skill", sk}));
    const P = passiveOf(passiveJobOf(st));
    if(P) list.push({kind:"passive", name:P.n, id:"passive"});
    const t = pick(list);
    const w = {pow:60};
    if(t.kind==="skill" && !t.sk.kind) w.proc = 25;
    if(t.kind==="skill" && skDur(st, t.sk) > 0) w.dur = 15;
    applySkillUp(st, {t, aspect: wchoose(w), evo: Math.random() < evoChance(st)}, true);
  }
  st.skOpts = null;
}
function hydrateOpt(st, o){
  if(o.id==="passive"){
    const P = passiveOf(passiveJobOf(st));
    return {t:{kind:"passive", name: P? P.n : "패시브", id:"passive"}, aspect:o.aspect, evo:o.evo};
  }
  const sk = skillsOf(st).find(x=>x.id===o.id) || skillsOf(st)[0];
  return {t:{kind:"skill", sk}, aspect:o.aspect, evo:o.evo};
}
function spReady(){ return S.students.filter(s=>(s.sp||0)>0); }
function spTotal(){ return spReady().reduce((a,s)=>a+(s.sp||0),0); }
function autoSkillUpAll(){
  const targets = spReady();
  if(!targets.length){ toast("강화 포인트가 남은 학생이 없다."); return; }
  const rows = [];
  targets.forEach(st=>{
    const got = [];
    let guard = 0;
    while((st.sp||0) > 0 && guard++ < 40){
      if(!st.skOpts || !st.skOpts.length){
        st.skOpts = genSkillOptions(st).map(o=>({
          id: o.t.kind==="passive" ? "passive" : o.t.sk.id, aspect:o.aspect, evo:o.evo }));
      }
      const o = hydrateOpt(st, pick(st.skOpts));
      const id = o.t.kind==="passive" ? "passive" : o.t.sk.id;
      const txt = skillOptText(st, o);
      applySkillUp(st, o, true);
      st.skOpts = null;
      got.push({nm: o.t.kind==="passive"? o.t.name : o.t.sk.name, txt, evo:o.evo,
        lv: skLevel(st,id), g: skGrade(st,id)});
    }
    rows.push({name:dn(st), job:JOBS[st.job].name, got});
  });
  const evoN = rows.reduce((a,r)=> a + r.got.filter(g=>g.evo).length, 0);
  const upN  = rows.reduce((a,r)=> a + r.got.length, 0);
  logE(`임의 강화 — <b>${rows.length}명</b>이 강화 포인트 ${upN}점을 소비했다${evoN? ` · <b style="color:var(--brass)">진화 강화 ${evoN}건</b>`:""}`, evoN?"big":"good");
  save(); render();
  showModal(`<div class="cerhead"><div class="eyebrow">임의 강화 결과</div>
      <h2 style="font-size:22px;margin-top:2px">${rows.length}명 · 강화 ${upN}회</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:6px">각 학생의 제안 세 가지 중 하나가 무작위로 선택되었다.${evoN? ` 이 중 <b style="color:var(--brass)">진화 강화 ${evoN}건</b>.`:""}</p></div>
    <div class="grid2" style="margin-top:12px">
      ${rows.map(r=>`<div class="opt" style="cursor:default">
        <div class="on">${esc(r.name)} <span class="tag">${esc(r.job)}</span><span class="price">${r.got.length}회</span></div>
        ${r.got.map(g=>`<div class="od" style="color:${g.evo?"var(--brass)":"var(--muted)"}">${g.evo? "진화 · ":""}${esc(g.nm)} ${esc(g.txt)} <span style="color:var(--dim)">Lv.${g.lv} · ${g.g}</span></div>`).join("")}
      </div>`).join("")}
    </div>
    <div class="btnrow" style="margin-top:14px"><button class="btn primary" data-close>확인</button></div>`, null, true);
}
function autoSkillUpConfirm(){
  const targets = spReady();

/* ============================================================
   드래그 배치 — 마우스 · 터치 공용
   ------------------------------------------------------------
   dragBind(root) 으로 한 번 연결하고, 렌더할 때마다
   root.__dragCfg 에 {from, to, payload, accept, drop} 을 갈아끼운다.
   ============================================================ */
const DRAG = {block:false};
function dragBind(root){
  if(!root || root.__dragBound) return;
  root.__dragBound = true;
  const TH = 6;           // 이만큼 움직여야 드래그로 친다 (클릭은 그대로 산다)
  let st = null;
  const cfg = ()=> root.__dragCfg;
  const clearHi = ()=> document.querySelectorAll(".drop-on").forEach(x=>x.classList.remove("drop-on"));
  const clear = ()=>{
    if(st && st.ghost) st.ghost.remove();
    clearHi();
    document.body.classList.remove("dragging");
    st = null;
  };
  const targetAt = (x,y)=>{
    const c = cfg(); if(!c) return null;
    if(st && st.ghost) st.ghost.style.display = "none";
    const under = document.elementFromPoint(x,y);
    if(st && st.ghost) st.ghost.style.display = "";
    const t = (under && under.closest) ? under.closest(c.to) : null;
    if(!t) return null;
    if(c.accept && !c.accept(st.payload, t)) return null;
    return t;
  };
  root.addEventListener("pointerdown", e=>{
    DRAG.block = false;
    const c = cfg(); if(!c) return;
    if(e.button!=null && e.button!==0) return;
    const el = e.target && e.target.closest ? e.target.closest(c.from) : null;
    if(!el) return;
    const payload = c.payload(el);
    if(payload==null) return;
    st = {x:e.clientX, y:e.clientY, el, payload, started:false};
  }, true);
  window.addEventListener("pointermove", e=>{
    if(!st) return;
    const c = cfg(); if(!c){ clear(); return; }
    if(!st.started){
      if(Math.abs(e.clientX-st.x) + Math.abs(e.clientY-st.y) < TH) return;
      st.started = true;
      const r = st.el.getBoundingClientRect();
      const g = st.el.cloneNode(true);
      g.classList.add("dragghost");
      g.style.width = r.width+"px";
      g.removeAttribute("disabled");
      document.body.appendChild(g);
      st.ghost = g; st.ox = e.clientX-r.left; st.oy = e.clientY-r.top;
      document.body.classList.add("dragging");
    }
    st.ghost.style.transform = `translate(${e.clientX-st.ox}px, ${e.clientY-st.oy}px)`;
    clearHi();
    const t = targetAt(e.clientX, e.clientY);
    if(t) t.classList.add("drop-on");
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  const finish = e=>{
    if(!st) return;
    const c = cfg(), started = st.started, payload = st.payload;
    const t = started ? targetAt(e.clientX, e.clientY) : null;
    clear();
    if(started){
      DRAG.block = true;                     // 드래그 직후의 click 은 무시한다
      if(c && c.drop) c.drop(payload, t);
    }
  };
  window.addEventListener("pointerup", finish);
  window.addEventListener("pointercancel", ()=> clear());
  root.addEventListener("click", e=>{
    if(DRAG.block){ DRAG.block = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function dragCfg(root, c){ if(root){ dragBind(root); root.__dragCfg = c || null; } }

  {min:85, n:"행복함"},   {min:70, n:"의욕적임"},

/* 상대 전력 노출 — 상대 유명도가 높을수록 더 많은 정보력을 요구한다
   확정 노출 정보력: 무명 4 · 유명 5 · 강호 6 · 명문 8 · 초명문 10 (1 모자랄 때마다 -20%p) */
const FOE_INFO_NEED = [4, 5, 6, 8, 10];

function foePowerSeenP(tier){
  const need = FOE_INFO_NEED[clamp(tier,0,4)];

/* 기본치 50 · 컨디션 70 기준 ±(+20/-30) · 상대 전력 비교 ±40 */
function baseMood(st, myP, foeP){
  let v = MOOD_BASE;
  const c = st.cond;
  v += (c>=COND_HI) ? (c-COND_HI)/(100-COND_HI)*20 : -((COND_HI-c)/COND_HI)*30;
  const hi = Math.max(1, myP, foeP);
  v += clamp((foeP-myP)/hi*3, -1, 1) * 40;   // 전력 1.5배 차이에서 ±40
  return Math.round(clamp(v, 0, 100));
}

/* 경기 단위로 한 번만 만들어진다 */
function lockerState(t, key, my, foe, foeTier){
  if(!t.locker || t.locker.key !== key){
    const myP = teamPowerOf(my), foeP = teamPowerOf(foe);
    const mood = {};
    (my||[]).forEach(s=> mood[s.id] = baseMood(s, myP, foeP));
    const tier = clamp(foeTier||0, 0, 4);
    t.locker = {key, myP, foeP, tier, seen: Math.random() < foePowerSeenP(tier),
                base:Object.assign({}, mood), mood,
                offers:makeSpeechOffers(), said:null, res:{}, conv:{}};
  }
  return t.locker;
}
function lockerApply(t, key, my, foe, foeTier){
  return lockerState(t, key, my, foe, foeTier);
}
function lockerSpeak(t, L, idx, my){
  if(L.said != null) return;
  const o = L.offers[idx];
  if(!o) return;
  L.said = idx;
  const netP = moodNetP();
  const names = {ok:[], no:[]};
  (my||[]).forEach(st=>{
    let ok;
    if(o.type==="expect")      ok = L.myP >= L.foeP;
    else if(o.type==="relief") ok = L.myP <  L.foeP;
    else                       ok = (o.fit||[]).indexOf(st.pers||"plain") >= 0;
    let conv = false, byTrust = false;
    if(!ok && trustFull(st)){ ok = true; byTrust = true; }        // 운명 단계는 언제나 통한다
    else if(!ok && Math.random() < netP){ ok = true; conv = true; }
    if(ok) addTrust(st, o.type==="motive" ? 2 : 1);   // 동기부여는 신뢰가 두 배로 쌓인다
    L.res[st.id] = ok; L.conv[st.id] = conv; L.byTrust = L.byTrust||{}; L.byTrust[st.id] = byTrust;
    L.mood[st.id] = Math.round(clamp(L.mood[st.id] + (ok? MOOD_SPEECH : -MOOD_SPEECH), 0, 100));
    (ok? names.ok : names.no).push(st.name);
  });
  logE(`락커룸 — <b>${SPEECH_TYPE[o.type].n}</b> &ldquo;${esc(o.t)}&rdquo;${
    names.ok.length? ` · <b style="color:var(--ok)">통함 ${esc(names.ok.join(", "))}</b> <span style="color:var(--brass)">신뢰 ${trustGainWord(o.type==="motive"?2:1)}</span>`:""}${
    names.no.length? ` · <span style="color:var(--bad)">빗나감 ${esc(names.no.join(", "))}</span>`:""}`, "");
}

function friendlyRun(t, quick){

  const TM = teamByName(t.entryTeams[i] || t.entryTeams[0] || "A");

    head:`${t.title} — 제${i+1}경기`, doneLabel:"결과 확정"}, after);

function friendlyRecord(t, b, ids){
  if(UI.tour!==t) return;
  t._busy = false;
  const win = b.winner==="A";
  const aliveA = b.A.filter(u=>u.alive).length, aliveB = b.B.filter(u=>u.alive).length;
  t.results.push({label:`제${t.matchIdx+1}경기`, vs:t.foe.name, win, score:`${aliveA}-${aliveB}`, myIds:ids.slice(), foes:b.B.map(u=>u.name)});

function finishFriendly(t){
  const F = friendlyState(t.ph||"spring");
  const tierM = 1 + t.foe.tier*.18;
  const gold = Math.round((140 + t.w*180) * tierM);
  addGold(gold);
  // 명성 — 등급 차이에 따라 걸고 한다
  const diff = t.foe.tier - fameTitleUpIdx(t);
  let fame = 0;
  t.results.forEach(r=>{ fame += friendlyFame(diff, r.win); });
  const fameBefore = S.fame;
  if(fame) addFame(fame);
  const fameReal = S.fame - fameBefore;
  const parts = new Set(); t.results.forEach(r=> r.myIds.forEach(id=>parts.add(id)));
  const rows=[], ups=[];
  parts.forEach(id=>{
    const s2 = S.students.find(x=>x.id===id); if(!s2) return;
    const myWins = t.results.filter(r=>r.win && r.myIds.includes(id)).length;
    const got = addEval(s2, myWins*2 + 1);
    const fg = Math.round(myWins*4 + 2);
    s2.fame += fg;
    const lv0 = s2.level;
    const mates = t.results.filter(r=>r.myIds.includes(id)).reduce((a,r)=>a.concat(r.myIds),[]);
    const xp = Math.round((220 + myWins*180) * tierM * broExpMul(s2, mates));
    const n = gainExp(s2, xp, true);
    ups.push({s:s2, n});
    rows.push({name:dn(s2), job:JOBS[s2.job].name, wins:myWins, lv0, lv1:s2.level, lvUp:n>0,
      exp:xp, ev:Math.round(got||0), fame:fg});
  });
  levelReport(ups);
  rows.sort((a,b2)=> b2.wins-a.wins || b2.ev-a.ev);
  tryEpithetTour("friendly", t, parts, `친선전 — ${t.foe.name}`);
  const msg = t.w===t.need? (t.need>1?"전승!":"승리") : t.w===0? (t.need>1?"전패":"패배") : `${t.w}승 ${t.l}패`;

  F.done.push({slot:t.slot, name:t.foe.name, tier:t.foe.tier, w:t.w, l:t.l, fame:fameReal});
  const REC = {title:t.title, msg:`친선전 ${msg}`, w:t.w, l:t.l, fame:fameReal, gold, 
    matches:t.results.map(r=>({label:r.label, vs:r.vs, win:r.win, score:r.score})),
    standings:null, rows, next:null};
  UI.tour=null; UI.pendingTour=false; closeModal();
  UI.view="home"; save();
  tourResultModal(REC, ()=>{
    // 마지막 주차(하반기 6주차) 친선전이면 이 자리에서 시즌이 끝난다

  });
}

function tourForfeit(t){
  const need = tourNeedTeams(t);
  logE(`<b>${esc(t.title)}</b> 기권 — 3인으로 채운 팀 ${need}개를 만들지 못했다 (학생 ${S.students.length}명).`,"bad");
  if(t.kind==="ladder" && S.fallRun){
    S.fallRun.done.push({step:t.step, w:0, l:0, advanced:false, forfeit:true});
    S.fallRun.alive = false; S.fallRun.pending = null;
  }
  if(t.kind==="friendly"){
    const F = friendlyState(t.ph||"spring");
    F.done.push({slot:t.slot, name:t.foe.name, tier:t.foe.tier, w:0, l:0, fame:0, forfeit:true});
  }
  UI.tour = null; UI.pendingTour = false; UI.view = "home";
  closeModal();
  if(S.week >= PHASES[S.phase].weeks) endPhase();
  save();
  if((UI.ceremonies||[]).length) showCeremony(); else render();
  toast("기권했다. 남은 일정은 그대로 진행된다.");
}

      <div class="grid2">${t.opps.map((o,i)=>`<div class="opt" style="cursor:default"><div class="on">${esc(o.name)}${t.kind==="fall"?` <span class="tag">${i+1}라운드</span>`:""}</div>
        ${o.teams.map((tm,k)=> (t.kind==="fall"? `<div class="od" style="color:var(--dim)">${"ABC"[k]}팀</div>`:"")+oppInfo(tm,lvl)).join("")}</div>`).join("")}</div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn primary" id="tEntry" ${ok?"":"disabled"}>${ok? (need===1? `${esc(teamLabel(t.entryTeams[0]))}${ro(teamLabel(t.entryTeams[0]))} 출전` : "엔트리 확정") : `팀을 고른다 (${t.entryTeams.length}/${need})`}</button>
        <span class="hint" style="font-size:12px;color:var(--dim)">${t.entryTeams.length? esc(t.entryTeams.map(n=>teamLabel(n)).join(" → ")) : "선택 없음"}</span>
      </div>`, ()=>{
      $("#modalRoot").querySelectorAll("[data-etm]").forEach(b=> b.onclick=()=>{
        const n = b.dataset.etm, i = t.entryTeams.indexOf(n);
        if(i>=0) t.entryTeams.splice(i,1);
        else if(t.entryTeams.length<need) t.entryTeams.push(n);
        renderTournament();
      });
      $("#tEntry").onclick = ()=>{
        t.myTeams = t.entryTeams.map(n=> teamMembers(teamByName(n)).map(x=>x.id));
        t.stage = t.kind==="spring" ? "match" : "scout";
        t.matchIdx=0; t.roundWins=0; t.roundScore=[0,0];
        renderTournament();
      };
    }, true);
    return;
  }
  if(t.stage==="scout"){
    const o = t.opps[t.round];
    showModal(`<h2 style="font-size:18px">${esc(t.title)} — ${t.round+1}라운드</h2>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 12px">상대: <b style="color:var(--text)">${esc(o.name)}</b> · 정찰 ${lvl}단계.
        우리 팀을 상대 팀에 어떻게 붙일지 정한다. 유리한 상성으로 두 판만 가져오면 된다.</p>
      <div class="grid2">
        ${[0,1,2].map(k=>`<div class="opt" style="cursor:default">
          <div class="on">${esc(o.name)} ${"ABC"[k]}팀</div>
          ${oppInfo(o.teams[k], lvl)}
          <div style="margin-top:6px;display:flex;gap:6px;align-items:center">
            <span style="font-size:11.5px;color:var(--dim)">배치</span>
            <select data-assign="${k}" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:4px">
              ${[0,1,2].map(m=>`<option value="${m}" ${t.assign[m]===k?"selected":""}>우리 ${"ABC"[m]}팀 — ${t.myTeams[m].map(id=>S.students.find(s=>s.id===id).name).join(", ")}</option>`).join("")}
            </select>
          </div>
        </div>`).join("")}
      </div>
      <div class="btnrow" style="margin-top:14px"><button class="btn primary" id="tGo">대진 확정</button></div>`, ()=>{
      $("#modalRoot").querySelectorAll("[data-assign]").forEach(sel=> sel.onchange=()=>{
        const oppK = +sel.dataset.assign, myM = +sel.value;
        const prevM = t.assign.findIndex(x=>x===oppK);
        const swapOpp = t.assign[myM];
        t.assign[myM] = oppK; t.assign[prevM] = swapOpp;
        renderTournament();
      });
      $("#tGo").onclick = ()=>{ t.stage="match"; t.matchIdx=0; t.roundScore=[0,0]; renderTournament(); };
    }, true);
    return;
  }
  if(t.stage==="match"){
    const isSpring = t.kind==="spring";
    const total = isSpring? 4 : 3;
    const head = isSpring? `제 ${t.matchIdx+1}경기 / 4` : `${t.round+1}라운드 제 ${t.matchIdx+1}경기 (${t.roundScore[0]} : ${t.roundScore[1]})`;
    const oppName = isSpring? t.opps[t.matchIdx].name : t.opps[t.round].name;
    const myIds = isSpring? t.myTeams[0] : t.myTeams[t.matchIdx];
    const oppTeam = isSpring? t.opps[t.matchIdx].teams[0] : t.opps[t.round].teams[t.assign[t.matchIdx]];
    const mMy = tourMatchStudents(myIds);
    const mL  = lockerState(t, `m${t.round||0}-${t.matchIdx}`, mMy, oppTeam, foeTierOf(isSpring? t.opps[t.matchIdx] : t.opps[t.round]));
    showModal(`<h2 style="font-size:18px">${esc(t.title)}</h2>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 12px">${head} · 상대 <b style="color:var(--text)">${esc(oppName)}</b></p>
      <div class="grid2">
        <div class="opt" style="cursor:default"><div class="on">우리 ${isSpring?"":`${"ABC"[t.matchIdx]}팀`}</div>
          <div class="od">${myIds.map(id=>{const s=S.students.find(x=>x.id===id); return `${dnH(s)}(${JOBS[s.job].name} Lv.${s.level})`;}).join(" · ")}</div></div>
        <div class="opt" style="cursor:default"><div class="on">${esc(oppName)}</div>${oppInfo(oppTeam, Math.max(1,lvl))}</div>
      </div>
      ${lockerHtml(mL, mMy)}
      <div class="btnrow" style="margin-top:14px">
        <button class="btn primary" id="tPlay">경기 시작</button>
        <button class="btn" id="tQuick">빠르게 결과만</button>
      </div>
      ${t.results.length? `<div class="rule"></div><div class="eyebrow" style="margin-bottom:5px">경과</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${t.results.map(r=>`<span class="pill ${r.win?"ok":"bad"}">${esc(r.vs)} ${r.win?"승":"패"}</span>`).join("")}</div>`:""}
      `, ()=>{
      bindLocker(t, mL, mMy, renderTournament);
      const run = (quick)=>{
        if(UI.tour!==t || t._busy) return;
        t._busy = true;
        $("#tPlay").disabled = true; $("#tQuick").disabled = true;
        const my = tourMatchStudents(myIds);
        const TM = teamByName((t.entryTeams||[])[isSpring? 0 : t.matchIdx] || "A");
        const L2 = lockerApply(t, `m${t.round||0}-${t.matchIdx}`, my, oppTeam, foeTierOf(isSpring? t.opps[t.matchIdx] : t.opps[t.round]));
        const b = runBattle(my, oppTeam, Object.assign({titleA:S.acadName, titleB:oppName, moodA:L2.mood}, teamBattleOpt(TM), foeBattleOpt(oppTeam)));
        const after = ()=> recordMatch(t, b, oppName, myIds);
        if(quick){ after(); }
        else openBattle(b, {titleA:S.acadName, titleB:oppName, head:`${t.title} — ${head}`, doneLabel:"결과 확정"}, after);
      };
      $("#tPlay").onclick=()=>run(false);
      $("#tQuick").onclick=()=>run(true);
    }, true);
    return;
  }
}
function recordMatch(t, b, oppName, myIds){
  if(UI.tour!==t) return;
  t._busy = false;
  const win = b.winner==="A";
  const aliveA = b.A.filter(u=>u.alive).length, aliveB = b.B.filter(u=>u.alive).length;
  t.results.push({vs:oppName, win, score:`${aliveA}-${aliveB}`, myIds:myIds.slice(), foes:b.B.map(u=>u.name)});
  if(t.kind==="spring"){
    t.matchIdx++;
    if(t.matchIdx>=4){ finishTournament(t); render(); return; }
    renderTournament();
    return;
  }
  t.roundScore[win?0:1]++;
  if(t.roundScore[0]>=2 || t.roundScore[1]>=2){
    if(t.roundScore[0]>=2){
      t.roundWins = (t.roundWins||0)+1;
      logE(`${t.title} ${t.round+1}라운드 — <b>${esc(oppName)}</b>에게 ${t.roundScore[0]}:${t.roundScore[1]} 승리`,"good");
      if(t.round+1 >= t.maxRound){ finishTournament(t); render(); return; }
      t.round++; t.stage="scout"; renderTournament(); return;
    } else {
      logE(`${t.title} ${t.round+1}라운드 — <b>${esc(oppName)}</b>에게 ${t.roundScore[0]}:${t.roundScore[1]} 패배. 탈락.`,"bad");
      finishTournament(t); render(); return;
    }
  }
  t.matchIdx++;
  renderTournament();
}

function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function showTitle(canContinue){
  $("#modalRoot").innerHTML = `<div class="overlay"><div class="titlecard">
    <svg viewBox="0 0 40 40" class="tcrest" aria-hidden="true">
      <path d="M20 2 L35 7 V20 C35 29 28 35 20 38 C12 35 5 29 5 20 V7 Z" fill="none" stroke="var(--brass)" stroke-width="1.4"/>
      <path d="M20 10 V30 M14 15 L20 12 L26 15 M13 21 H27" fill="none" stroke="var(--brass)" stroke-width="1.2"/>
    </svg>
    <div class="eyebrow">용사 학원 운영 시뮬레이션</div>
    <h1 class="ttitle">용사 학원 운영기</h1>
    <p class="tsub">쓰러진 아버지의 학원을 물려받았다.<br>남은 것은 영문을 모르는 신입생 세 명과 갱신이 걸린 라이선스뿐이다.</p>
    <div class="tbtns">
      <button class="btn primary" id="tNew">새 시나리오 시작</button>
      <button class="btn" id="tCont" ${canContinue?"":"disabled"}>이어하기</button>
    </div>
    <div class="tsave">${canContinue? `저장된 학원 — ${esc(S.acadName)} · ${S.year}년 ${PHASES[S.phase].n} ${Math.min(S.week+1,PHASES[S.phase].weeks)}주` : "저장된 기록이 없다"}</div>
  </div></div>`;
  $("#tNew").onclick = ()=> askAcademyName();
  const c = $("#tCont");
  if(canContinue && c) c.onclick = ()=>{ closeModal(); UI.view="home"; render(); };
}
function askAcademyName(){
  let nm = pick(ACAD)+" 용사 학원";
  const draw = ()=> showModal(`<div class="cerhead"><div class="eyebrow">새 시나리오</div>
      <h2 style="font-size:24px;margin-top:2px">학원의 이름</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:6px">아버지가 세운 학원의 간판을 다시 건다. 이름은 언제든 바꿀 수 있다.</p></div>
    <input id="nsName" value="${esc(nm)}" maxlength="24"
      style="width:100%;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px;font-size:15px">
    <div class="btnrow" style="margin-top:12px">
      <button class="btn primary" id="nsOk">이 이름으로 시작</button>
      <button class="btn" id="nsRand">다른 이름 제안</button>
      <button class="btn ghost" id="nsBack">뒤로</button>
    </div>`, ()=>{
    $("#nsOk").onclick = ()=>{ const v=$("#nsName").value.trim(); showPrologue(v||nm, 0); };
    $("#nsRand").onclick = ()=>{ nm = pick(ACAD)+" 용사 학원"; draw(); };
    $("#nsBack").onclick = ()=> showTitle(hasSave());

}
function showPrologue(name, i){
  const pg = PROLOGUE[i], last = i>=PROLOGUE.length-1;
  const start = ()=>{
    newGame(name); S.mission = newMission(); save();
    closeModal(); UI.view="home"; UI.sel=null; render();
    toast("새 학기가 시작되었다.");
  };
  showModal(`<div class="prol">
      <div class="eyebrow">프롤로그 ${i+1} / ${PROLOGUE.length}</div>
      <h2 class="ptitle">${esc(pg.h)}</h2>
      ${pg.p.map(x=>`<p>${x}</p>`).join("")}
      <div class="btnrow" style="margin-top:18px">
        <button class="btn primary" id="pNext">${last? "학원으로 향한다" : "계속"}</button>
        ${last? "" : `<button class="btn ghost" id="pSkip">프롤로그 건너뛰기</button>`}
      </div>
    </div>`, ()=>{
    $("#pNext").onclick = ()=> last? start() : showPrologue(name, i+1);
    const sk = $("#pSkip"); if(sk) sk.onclick = start;
  }, true);
}
function boot(){
  const had = load();
  if(!had) newGame();
  S.relicPool = S.relicPool||[];
  S.church = S.church||{};
  S.epiUsed = S.epiUsed||[]; S.epiLog = S.epiLog||[];
  S.facil = S.facil||{};
  Object.keys(FACILITIES).forEach(k=>{ if(typeof S.facil[k]!=="number") S.facil[k] = facStart(k); });
  teamsOf(); cleanTeams(); cleanBonds();
  if(S.plan) delete S.plan;   // 주 단위 스케줄은 카드 덱으로 대체됐다
  if(typeof S.books !== "number") S.books = 0;
  // 카드 덱 — 구버전 세이브는 여기서 처음 손패를 받는다
  if(!Array.isArray(S.hand) || !Array.isArray(S.slots)) handInit();
  if(S.slots.length !== WEEK_DAYS){ S.slots = Array(WEEK_DAYS).fill(null); }
  S.hand = S.hand.filter(c=> c && TR[c.t]);
  S.slots = S.slots.map(c=> (c && TR[c.t]) ? c : null);
  handRefill();
  if(S.broYear && S.broYear.wk > HALF_WEEKS) S.broYear.wk = ri(1, HALF_WEEKS);
  S.students.forEach(x=>{
    if(/[A-Za-z]/.test(x.name)) x.name = x.name.charAt(0) + pick(GIV);
    if(typeof x.eval !== "number") x.eval = x.year>=3? 46 : x.year===2? 20 : 0;
    if(typeof x.karma !== "number") x.karma = 0;
    if(typeof x.trust !== "number") x.trust = 0;
    if(typeof x.epithet === "undefined") x.epithet = null;
    if(typeof x.injured !== "number") x.injured = 0;
    if(x.focus==="pot") x.focus = "free";
    if(!x.pers){ x.pers = wchoose(PERSONA_KEYS.reduce((a,k)=>{ a[k]=PERSONA[k].w; return a; }, {})); applyPersona(x); }
  });
  if(S.phase==="winter" && S.scouts && typeof S.scoutTries!=="number") S.scoutTries = scoutTriesMax();
  if(S.phase==="fall" && !S.fallRun) S.fallRun = newFallRun();
  if(!S.mission) S.mission = newMission();
  // 해금 · 팀 상한 — 예전 세이브 보정
  S.unlock = S.unlock || {};
  S.pendingUnlock = S.pendingUnlock || [];
  {
    const done = (S.mission.done||[]).map(d=>d.id);
    if(done.includes("m1") || done.includes("m2") || S.tier>=2) S.unlock.region = true;
    if(done.includes("m2") || done.includes("m3") || S.tier>=3) S.unlock.fest = true;
    if(S.fallRun && ["region","qual","final"].includes(S.fallRun.step)) S.unlock.region = true;
    if(S.fallRun && ["qual","final"].includes(S.fallRun.step)) S.unlock.fest = true;
  }
  allTeams();
  if(typeof S.teamCap !== "number") S.teamCap = teamCapNow();
  teamCap();
  S.scouts && S.scouts.forEach(c=>{ if(typeof c.tried!=="number") c.tried = c.state==="lost"?2:0; });
  if(S.week >= PHASES[S.phase].weeks) endPhase();
  if(!UI.tour && S.phase==="fall" && S.fallRun && S.fallRun.alive && S.fallRun.pending && LADDER[S.fallRun.pending]){
    startLadder(S.fallRun.pending);
  }
  // 대회 주차가 바뀌어 이미 지나쳐 버린 세이브 — 지금 열어준다
  if(!UI.tour && S.phase==="fall" && S.fallRun && S.fallRun.alive && !S.fallRun.pending){
    const cfg = LADDER[S.fallRun.step];
    if(cfg && S.week >= cfg.week && S.week < PHASES.fall.weeks){
      logE(`대회 일정 개편 — <b>${cfg.n}</b>이(가) ${cfg.week}주차로 옮겨졌다. 놓치지 않도록 지금 연다.`,"big");
      startLadder(S.fallRun.step);
    }
  }
  UI.view = "home";
  render();
  showTitle(had);
}
boot();
