<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>용사 학원 운영기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EBE9EF; --surface:#F7F6FA; --surface2:#E2E0EA; --line:#CFCDDC; --line-soft:#DEDCE8;
  --text:#191A24; --muted:#5B5D72; --dim:#82849A;
  --brass:#8A6A15; --brass-b:#B98E23; --brass-soft:rgba(185,142,35,.14);
  --indigo:#4B47B0; --indigo-soft:rgba(75,71,176,.12);
  --ok:#2F7F58; --warn:#B5661A; --bad:#B33F32;
  --tank:#3C6E9E; --dps:#A5432F; --heal:#2F7F58; --supp:#6D4BA8;
  --shadow:0 1px 2px rgba(25,26,36,.08),0 8px 24px rgba(25,26,36,.06);
  --rainbow:linear-gradient(90deg,#e24b3f,#e08b2c,#d6c62c,#46a65f,#3c8fd0,#6a5fd0,#b455c0);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121319; --surface:#1B1D26; --surface2:#232633; --line:#333747; --line-soft:#282C39;
    --text:#E8E7F0; --muted:#9C9EB4; --dim:#797C92;
    --brass:#C8A24A; --brass-b:#E0BB64; --brass-soft:rgba(200,162,74,.14);
    --indigo:#8A86EC; --indigo-soft:rgba(138,134,236,.14);
    --ok:#5CB287; --warn:#DE9038; --bad:#D9604F;
    --tank:#6FA5D8; --dps:#E07A63; --heal:#5CB287; --supp:#A88BE6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#1B1D26; --surface2:#232633; --line:#333747; --line-soft:#282C39;
  --text:#E8E7F0; --muted:#9C9EB4; --dim:#797C92;
  --brass:#C8A24A; --brass-b:#E0BB64; --brass-soft:rgba(200,162,74,.14);
  --indigo:#8A86EC; --indigo-soft:rgba(138,134,236,.14);
  --ok:#5CB287; --warn:#DE9038; --bad:#D9604F;
  --tank:#6FA5D8; --dps:#E07A63; --heal:#5CB287; --supp:#A88BE6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}

/* ---------- shell ---------- */
#app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0;margin-inline:-16px;padding-inline:16px}
.crestrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:34px;height:34px;flex:none}
.acad-name{font-size:19px;line-height:1.1}
.acad-sub{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.meters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.meter{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;padding:4px 10px;min-width:76px}
.meter .k{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.meter .v{font-size:15px;font-weight:600;line-height:1.2}
.meter .sub{font-size:10px;color:var(--brass);font-weight:600;letter-spacing:.02em;margin-top:-1px}
.meter.date .v{color:var(--brass)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:8px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current="true"]{color:var(--text);border-bottom-color:var(--brass)}
nav button .badge{display:inline-block;margin-left:5px;background:var(--brass);color:var(--bg);border-radius:8px;font-size:10px;padding:0 5px;font-weight:700}
/* 스케줄 — 한 주를 넘기는 탭이라 늘 눈에 띄게 둔다 */
nav button.hot{color:var(--brass);font-weight:700;background:var(--brass-soft);border-radius:3px 3px 0 0;
  display:inline-flex;align-items:center;gap:0;white-space:nowrap;flex:none}
nav button.hot:hover{color:var(--brass-b)}
nav button.hot::before{content:"";display:block;width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--brass);margin-right:6px;animation:hotdot 1.8s ease-in-out infinite}
nav button.hot[aria-current="true"]{background:transparent;color:var(--text)}
nav button.hot[aria-current="true"]::before{animation:none;opacity:.55}
nav button.hot .wk{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--brass);flex:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace;opacity:.85;
  border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:2px;padding:0 4px}
@keyframes hotdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:16px}
.panel + .panel{margin-top:14px}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font-size:16px}
.panel-h .hint{font-size:11.5px;color:var(--dim);margin-left:auto}
.rule{height:1px;background:var(--line-soft);margin:12px 0}

/* ---------- buttons ---------- */
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--brass)}
.btn.icon{padding:3px 5px;line-height:0;border-color:transparent;background:none;color:var(--dim);
  vertical-align:middle;margin-left:5px;border-radius:3px}
.btn.icon:hover{color:var(--brass);border-color:var(--line);background:var(--surface2)}
.btn.icon svg{display:block}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#16171E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--brass-b);border-color:var(--brass-b)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.bigrun{padding:9px 20px;font-size:14.5px;letter-spacing:.01em;box-shadow:0 2px 0 color-mix(in srgb,var(--brass) 55%,#000)}
.btn.bigrun:active{transform:translateY(1px);box-shadow:0 1px 0 color-mix(in srgb,var(--brass) 55%,#000)}
.btn.ghost{background:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- tags ---------- */
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);font-weight:600;letter-spacing:.02em}
.tag.role-tank{color:var(--tank);border-color:color-mix(in srgb,var(--tank) 45%,transparent)}
.tag.role-dps{color:var(--dps);border-color:color-mix(in srgb,var(--dps) 45%,transparent)}
.tag.role-heal{color:var(--heal);border-color:color-mix(in srgb,var(--heal) 45%,transparent)}
.tag.role-supp{color:var(--supp);border-color:color-mix(in srgb,var(--supp) 45%,transparent)}
.tag.gr{border-color:var(--brass);color:var(--brass)}
.tag.yr{background:var(--surface2);border-color:transparent}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.scard{border:1px solid var(--line-soft);border-radius:3px;background:var(--bg);padding:10px 12px;text-align:left;width:100%;display:block;transition:border-color .12s}
.scard:hover{border-color:var(--brass)}
.scard.sel{border-color:var(--brass);background:var(--brass-soft)}
.scard .n1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.scard .nm{font-weight:600;font-size:14.5px}
.scard .n2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.scard .lv{margin-left:auto;font-size:11.5px;color:var(--dim)}
.scard .bars{margin-top:7px;display:grid;gap:3px}
.bar{height:5px;background:var(--surface2);border-radius:2px;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:var(--brass);transition:width .35s ease}
.bar.cond > i{background:var(--ok)}
.bar.cond.mid > i{background:var(--warn)}
.bar.cond.low > i{background:var(--bad)}
.barlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}

/* ---------- stat table ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:2px 14px}
.st{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--line-soft)}
.st .k{color:var(--muted)}
.st .v{margin-left:auto;font-weight:600}
.st .up{color:var(--ok);font-size:11px}
.mentbar{height:4px;flex:1;background:var(--surface2);border-radius:2px;overflow:hidden;max-width:54px}
.mentbar > i{display:block;height:100%;background:var(--indigo)}

/* ---------- schedule ---------- */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.wk{border:1px solid var(--line-soft);border-radius:3px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.wk.done{opacity:.5}
.wk.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.wk .wl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.wk select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:4px 5px;font-size:12px}
.wk .eff{font-size:10.5px;color:var(--muted);min-height:15px}

/* ---------- 훈련 카드 보드 ---------- */
.dayrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.handrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:16px}
.dslot{position:relative;border:1px dashed var(--line);border-radius:5px;background:var(--bg);
  min-height:172px;display:flex;flex-direction:column;transition:border-color .12s,background .12s}
.dslot > .dh{font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:center;padding:5px 0 3px;flex:none}
.dslot > .dh b{color:var(--muted);font-weight:600}
.dslot.filled{border-style:solid;border-color:var(--line-soft)}
.dslot.over{border-color:var(--brass);background:var(--brass-soft)}
.dslot .dempty{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);
  text-align:center;line-height:1.5;padding:0 6px}
.dslot .dchain{position:absolute;top:-8px;right:-4px;font-size:10px;font-weight:700;color:#141118;
  background:var(--brass);border-radius:9px;padding:1px 7px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  box-shadow:0 1px 3px rgba(0,0,0,.45)}
.card{position:relative;border:1px solid var(--cc);border-radius:5px;background:linear-gradient(180deg,var(--cs),transparent 62%),var(--surface);
  padding:8px 7px 7px;display:flex;flex-direction:column;gap:3px;min-height:172px;cursor:grab;user-select:none;
  transition:transform .1s,box-shadow .1s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.card.dragging{opacity:.4;cursor:grabbing}
.card .ctop{display:flex;align-items:center;gap:4px;flex:none}
.card .cdot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.card .ccol{font-size:9.5px;color:var(--cc);letter-spacing:.08em}
.card .cname{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.25;word-break:keep-all;flex:none}
.card .cdesc{font-size:10.5px;color:var(--muted);line-height:1.4;word-break:keep-all;flex:none}
.card .cfx{flex:1;display:flex;flex-direction:column;gap:1px;justify-content:flex-end;margin-top:5px}
.card .fxl{font-size:10px;color:var(--ok);display:flex;justify-content:space-between;gap:4px;
  line-height:1.35;word-break:keep-all}
.card .fxl b{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.5px;font-weight:700}
.card .fxl.bad{color:var(--bad)}
.card .ceff{font-size:10px;color:var(--dim);font-family:"IBM Plex Mono",ui-monospace,monospace;flex:none;
  border-top:1px solid var(--line-soft);padding-top:4px}
.dslot .card{border-radius:0 0 4px 4px;border:none;border-top:1px solid var(--cc);min-height:0;flex:1;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent)}
.dslot .card:hover{transform:none;box-shadow:inset 0 0 0 1px var(--cc)}
.handzone.over{outline:2px dashed var(--brass);outline-offset:6px;border-radius:5px}
.cardlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim);margin-top:10px}
.cardlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- 주간 일지 ---------- */
.daylog{border:1px solid var(--line-soft);border-radius:4px;background:var(--bg);padding:12px 14px;
  margin:2px 0 8px;max-height:392px;overflow:auto;font-size:12.5px;line-height:1.66;position:relative}
.daylog > div{opacity:0;transform:translateY(-2px);transition:opacity .16s ease,transform .16s ease}
.daylog > div.on{opacity:1;transform:none}
.daylog .dlline{color:var(--muted)}
.daylog .dlline.head{color:var(--text);font-weight:700;font-size:13px}
.daylog .dlline.head2{color:var(--text);font-weight:600;margin-top:7px}
.daylog .dlline.rest{color:var(--ok);font-weight:700;font-size:13px}
.daylog .dlline.bad{color:var(--bad);font-weight:700;font-size:13px}
.daylog .dlline.note{color:var(--brass);font-weight:700}
.daylog .dlline.sub{padding-left:11px;font-size:12px}
.daylog .dlgap{height:11px}
@media (max-width:820px){
  .handrow{grid-template-columns:repeat(5,1fr)}
  .dayrow{grid-template-columns:repeat(3,1fr)}
}

/* ---------- log ---------- */
.titlecard{background:var(--bg);border:1px solid var(--brass);border-radius:6px;max-width:520px;width:100%;
  padding:38px 34px;text-align:center;box-shadow:var(--shadow)}
.tcrest{width:62px;height:62px;margin-bottom:14px}
.ttitle{font-size:40px;line-height:1.1;margin:4px 0 0;letter-spacing:-.02em}
.tsub{color:var(--muted);font-size:13.5px;line-height:1.8;margin:14px 0 0}
.tbtns{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.tbtns .btn{padding:10px 22px;font-size:14px}
.tsave{margin-top:14px;font-size:11.5px;color:var(--dim)}
.prol{max-width:640px}
.prol .ptitle{font-size:26px;margin:4px 0 14px}
.prol p{font-size:14px;line-height:2;color:var(--muted);margin:0 0 14px;text-align:justify}
.prol p b{color:var(--brass)}
.missionbox{background:var(--surface);border:1px solid var(--brass);border-radius:4px;padding:12px;margin-bottom:14px}
.mtitle{font-family:"Gowun Batang",serif;font-size:17px;font-weight:700;color:var(--brass);line-height:1.3}
.mdesc{font-size:12.5px;color:var(--text);margin-top:4px}
.mdue{font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.mdue.warn{color:var(--warn);font-weight:600}
.mdue.over{color:var(--bad);font-weight:600}
.mhint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:8px;border-left:2px solid var(--brass-soft);padding-left:8px}
.mdone{font-size:12.5px;color:var(--muted);line-height:1.6}
.mrowdone{font-size:11.5px;color:var(--ok);display:flex;justify-content:space-between;padding:2px 0}
.mrowdone span{color:var(--dim)}
.logbox{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:12px;position:sticky;top:118px}
.loglist{max-height:min(62vh,620px);overflow-y:auto;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.le{border-left:2px solid var(--line);padding-left:8px;color:var(--muted)}
.le b{color:var(--text);font-weight:600}
.le.good{border-color:var(--ok)}
.le.bad{border-color:var(--bad)}
.le.big{border-color:var(--brass)}
.le .t{font-size:10px;color:var(--dim);letter-spacing:.06em}

/* ---------- battle ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,11,15,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:5px;width:min(880px,100%);max-height:92vh;overflow-y:auto;padding:18px;box-shadow:var(--shadow)}
.field{display:grid;grid-template-columns:1fr;gap:10px}
.side{border:1px solid var(--line-soft);border-radius:3px;padding:10px;background:var(--surface)}
/* 드래그 배치 */
.dragging{cursor:grabbing}
.dragging *{cursor:grabbing !important}
.dragghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;opacity:.94;
  box-shadow:0 10px 28px rgba(0,0,0,.38);transform-origin:top left}
.drop-on{outline:2px dashed var(--brass);outline-offset:2px;background:var(--brass-soft)}
.drg{touch-action:none;-webkit-user-select:none;user-select:none}
.drg:active{cursor:grabbing}
.trustsay{margin:5px 0 8px;padding:7px 9px;border-left:2px solid var(--brass);background:var(--brass-soft);
  font-size:12.5px;color:var(--text);line-height:1.6;border-radius:0 2px 2px 0}
.lkrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:620px){.lkrow{grid-template-columns:1fr}}
.lkcard{border:1px solid var(--line-soft);border-radius:3px;background:var(--surface);padding:8px 10px}
.lkn{font-size:13px;font-weight:600;line-height:1.35}
.lkp{margin:4px 0 6px}
.lkm{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lkm.ok{color:var(--ok)}
.lkm.bad{color:var(--bad)}
.lkm .num{font-size:12px;font-weight:600;opacity:.75}
.lkb{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:6px 0 5px}
.lkb i{display:block;height:100%;background:var(--muted)}
.lkb i.ok{background:var(--ok)}
.lkb i.bad{background:var(--bad)}

/* ── 도트 스프라이트 런타임 ─────────────────────────────────
   시트: 가로=프레임, 세로=모션 5행. 아틀라스는 직업별로 5행씩 세로로 쌓여 있다.
   canvas.spr 엘리먼트를 rAF 한 바퀴로 전부 갱신한다. 프레임 위상을 엘리먼트가
   아니라 시계에서 가져오기 때문에 DOM 을 통째로 다시 그려도 튀지 않는다.
   머리색은 팔레트 치환 — 원본 아틀라스에서 머리 계열 색만 갈아끼운 사본을
   (직업 × 색) 단위로 만들어 캐시한다. 그림은 한 장만 있으면 된다. */
const SPR_M   = {idle:0, attack:1, hit:2, down:3, win:4};
const SPR_MS  = [180, 70, 90, 110, 150];
const SPR_LOOP= [1, 0, 0, 0, 1];
const SPR_KEYS= Object.keys(SPR_JOB);
const SPR_IDX = (()=>{ const o={}; SPR_KEYS.forEach((k,i)=>o[k]=i); return o; })();
/* 머리색 — 원본의 명도·채도 단계는 그대로 두고 색상만 돌린다.
   색상 24단 × 진하기 3단 = 72가지. 열두 명이면 겹칠 일이 거의 없다. */
const SPR_HUE_N = 24, SPR_TONE = [1.00, .70, .25];
const SPR_HUE_NAME = ["빨강","주홍","주황","호박","노랑","연노랑","연두","풀색","초록","비취","청록","터콰즈",
                      "하늘","담청","파랑","군청","남색","보라","자주","자수정","진분홍","분홍","연분홍","산호"];
const SPR_TONE_NAME = ["선명한","차분한","옅은"];
function sprPal(pi){
  pi = pi|0;
  const hi = pi % SPR_HUE_N, ti = Math.floor(pi/SPR_HUE_N) % SPR_TONE.length;
  return {h: hi/SPR_HUE_N, s: SPR_TONE[ti]};
}
function sprHas(job){ return !!SPR_JOB[job]; }
function sprN(job,m){ const a=SPR_JOB[job]; return a? (a[m]|0) : 0; }
/* 학생 ID 로 고정 — 졸업할 때까지 안 바뀐다 */
function sprPalOf(o){
  const k = String((o && (o.id || o.sid || o.ref || o.name)) || "");
  let h = 2166136261;
  for(let i=0;i<k.length;i++){ h ^= k.charCodeAt(i); h = Math.imul(h,16777619)>>>0; }
  h ^= h>>>15; h = Math.imul(h,2246822507)>>>0; h ^= h>>>13;
  return (((h>>>11)>>>0) % SPR_TONE.length) * SPR_HUE_N + ((h>>>0) % SPR_HUE_N);
}
function sprPalName(o){
  const pi = (typeof o==="number") ? (o|0) : sprPalOf(o);
  const hi = pi % SPR_HUE_N, ti = Math.floor(pi/SPR_HUE_N) % SPR_TONE.length;
  return SPR_TONE_NAME[ti] + " " + SPR_HUE_NAME[hi];
}
function sprHTML(job, mot, k, o){
  o = o||{};
  if(!SPR_JOB[job]) return "";
  let m = SPR_M[mot]!=null ? SPR_M[mot] : 0;
  if(!sprN(job,m)) m = 0;                       // 빈 행은 idle 로 대체
  const n = sprN(job,m) || 1;
  k = k || 1;
  const ms = o.ms || SPR_MS[m];
  return `<canvas class="spr${o.flip?" flip":""}${o.cls?" "+o.cls:""}"`
    + ` width="${SPR_CELL}" height="${SPR_CELL}"`
    + ` data-j="${SPR_IDX[job]}" data-p="${o.p|0}" data-m="${m}" data-n="${n}" data-ms="${ms}"`
    + ` data-t0="${o.t0||0}" style="width:${SPR_CELL*k}px;height:${SPR_CELL*k}px"></canvas>`;
}
/* ── 팔레트 치환 사본 캐시 (LRU) ── */
const SPR_BASE = new Image();
let SPR_READY = false, SPR_RAF = 0, SPR_T0 = 0;
const SPR_CACHE = new Map(), SPR_CAP = 20;
function sprHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h/=6; }
  return [h, mx? d/mx : 0, mx];
}
function sprRgb(h,s,v){
  const i=Math.floor(h*6), f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0: r=v;g=t;b=p; break; case 1: r=q;g=v;b=p; break; case 2: r=p;g=v;b=t; break;
    case 3: r=p;g=q;b=v; break; case 4: r=t;g=p;b=v; break; default: r=v;g=p;b=q;
  }
  return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
}
function sprSheet(ji, pi){
  const key = ji+"|"+pi;
  let cv = SPR_CACHE.get(key);
  if(cv){ SPR_CACHE.delete(key); SPR_CACHE.set(key, cv); return cv; }   // LRU 갱신
  const job = SPR_KEYS[ji];
  const W = SPR_COLS*SPR_CELL, H = 5*SPR_CELL;
  cv = document.createElement("canvas"); cv.width=W; cv.height=H;
  const cx = cv.getContext("2d", {willReadFrequently:true});
  cx.imageSmoothingEnabled = false;
  cx.drawImage(SPR_BASE, 0, ji*H, W, H, 0, 0, W, H);
  const hairs = (typeof SPR_HAIR!=="undefined" && SPR_HAIR[job]) || [];
  const P = sprPal(pi);
  if(P && hairs.length){
    const lut = new Map();
    hairs.forEach(hx=>{
      const r=parseInt(hx.slice(0,2),16), g=parseInt(hx.slice(2,4),16), b=parseInt(hx.slice(4,6),16);
      const v = sprHsv(r,g,b);
      lut.set((r<<16)|(g<<8)|b, sprRgb(P.h, Math.min(1, v[1]*P.s), v[2]));
    });
    const im = cx.getImageData(0,0,W,H), d = im.data;
    for(let i=0;i<d.length;i+=4){

function sprTick(){

  if(!SPR_READY) return;
  const now = performance.now();
  const list = document.querySelectorAll("canvas.spr");
  for(let q=0;q<list.length;q++){
    const el = list[q];
    const m = +el.dataset.m, n = +el.dataset.n || 1, j = +el.dataset.j, pi = +el.dataset.p || 0;
    const ms = +el.dataset.ms || SPR_MS[m] || 120;
    let f;
    if(SPR_LOOP[m]) f = Math.floor(now/ms) % n;
    else {
      const t0 = +el.dataset.t0;
      if(!t0) f = n-1;                          // t0 없으면 = 이미 끝난 모션, 마지막 프레임 유지
      else { f = Math.floor((now-t0)/ms); if(f>=n) f=n-1; if(f<0) f=0; }
    }
    if(el.__f===f && el.__key===j+"|"+pi+"|"+m) continue;
    el.__f=f; el.__key=j+"|"+pi+"|"+m;
    const cx = el.__cx || (el.__cx = el.getContext("2d"));
    cx.imageSmoothingEnabled = false;
    cx.clearRect(0,0,SPR_CELL,SPR_CELL);
    cx.drawImage(sprSheet(j,pi), f*SPR_CELL, m*SPR_CELL, SPR_CELL, SPR_CELL, 0,0, SPR_CELL, SPR_CELL);

function hasJong(w){
  const t = String(w||"").replace(/<[^>]*>/g,"").trim();
  if(!t) return true;
  const c = t.charCodeAt(t.length-1);
  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28 !== 0;
  if(c>=0x30 && c<=0x39) return [0,1,3,6,7,8].indexOf(c-0x30)>=0;

  const t = String(w||"").replace(/<[^>]*>/g,"").trim();
  const c = t.charCodeAt(t.length-1);
  let rieul = false;
  if(c>=0xAC00 && c<=0xD7A3) rieul = (c-0xAC00)%28 === 8;
  else if(c>=0x30 && c<=0x39) rieul = (c-0x30)===1 || (c-0x30)===7 || (c-0x30)===8;

function passiveOf(job){ return PASSIVES[job] || null; }
function healMulOf(u){ const P=u.pas||passiveOf(u.job); return P && P.healMul ? 1+P.healMul : 1; }
function passiveDmgMul(src, tgt, sk){
  let m = 1;
  const Ps = src.pas||passiveOf(src.job), Pt = tgt.pas||passiveOf(tgt.job);
  if(Ps){
    if(Ps.vsBack && tgt.row==="back") m *= 1+Ps.vsBack;
    if(Ps.vsFront && tgt.row==="front") m *= 1+Ps.vsFront;
    if(Ps.vsLow && tgt.hp/tgt.maxHp <= .5) m *= 1+Ps.vsLow;
    if(Ps.vsHigh && tgt.hp/tgt.maxHp > .5) m *= 1+Ps.vsHigh;
    if(Ps.aoe && sk && (sk.type==="dmg_aoe"||sk.type==="ult_aoe"||sk.type==="ult_drain")) m *= 1+Ps.aoe;
  }
  if(Pt){
    if(Pt.take) m *= 1-Pt.take;
    if(Pt.takeLow && (tgt.hp/tgt.maxHp*100) < consThr(tgt.ment.stam)) m *= 1-Pt.takeLow;
  }
  return m;
}

function genMonster(dg, sec){
  const key = dg.mon, J = JOBS[key];
  const lv = dg.lv + (sec-1);
  const st = {
    id:"m"+Math.random().toString(36).slice(2,8), name:J.name, job:key, year:1, grade:"A",
    level:lv, exp:0, cond:100, fame:0, eval:0, focus:"free", relics:[], skMod:{}, sp:0, hist:[],
    ment:{team:50, aggr:72, calm:72, will:85, stam:62, genius:58, pot:55}
  };
  autoSkMod(st, lv);
  const k = dg.monK || 1;
  st.mul = {hp:k, atk:Math.pow(k,.7), def:Math.pow(k,.5), spd:Math.pow(k,.12)};
  return [st];
}

function formOf(k){ return FORMS[k] || FORMS.wedge; }
function formSlots(k){ const F=formOf(k); return F.front.concat(F.back); }
function slotRow(id){ return id.charAt(0)==="f" ? "front" : "back"; }
const TEAM_NAMES = ["A","B","C","D","E"];
function newTeams(){ return TEAM_NAMES.map(n=>({n, form:"wedge", slots:{}})); }
/* 편성 가능한 팀 수 — 총원 3명당 1팀. 한 번 늘어난 상한은 인원이 줄어도 내려가지 않는다 */
const TEAM_MAX = TEAM_NAMES.length;
function teamCapNow(){ return clamp(Math.floor(S.students.length/3), 1, TEAM_MAX); }
function teamCap(){
  const now = teamCapNow();
  if(typeof S.teamCap !== "number") S.teamCap = now;
  if(now > S.teamCap) S.teamCap = now;
  return clamp(S.teamCap, 1, TEAM_MAX);
}
function bumpTeamCap(){
  const before = teamCap(), now = teamCapNow();
  if(now > before){
    S.teamCap = now;
    logE(`팀 편성 — 학생이 ${S.students.length}명이 되어 <b>${now}번째 팀</b>까지 짤 수 있게 됐다.`,"good");
  }
  return teamCap();
}
function allTeams(){
  if(!Array.isArray(S.teams) || S.teams.length!==TEAM_MAX){
    const old = Array.isArray(S.teams)? S.teams : [];
    S.teams = TEAM_NAMES.map((n,i)=> old[i] || {n, form:"wedge", slots:{}});
    S.teams.forEach((t,i)=>{ t.n = TEAM_NAMES[i]; });
  }
  S.teams.forEach(t=>{ if(!FORMS[t.form]) t.form="wedge"; t.slots = t.slots||{}; });
  return S.teams;
}
/* 상한 밖의 팀은 아예 없는 것처럼 다룬다 */
function teamsOf(){ return allTeams().slice(0, teamCap()); }
/* 학원에 없는 학생·진형에서 빠진 칸 정리 */
function cleanTeams(){
  const ids = new Set(S.students.map(s=>s.id));
  allTeams().slice(teamCap()).forEach(t=>{ t.slots = {}; });   // 상한 밖은 비운다
  teamsOf().forEach(t=>{
    const live = formSlots(t.form);
    Object.keys(t.slots).forEach(k=>{
      if(!live.includes(k) || !ids.has(t.slots[k])) delete t.slots[k];
    });
  });
}
function teamMembers(t){
  return formSlots(t.form).map(k=> t.slots[k]).filter(Boolean)
    .map(id=> S.students.find(s=>s.id===id)).filter(Boolean);
}
function teamFull(t){ return teamMembers(t).length===3; }
function teamRows(t){
  const out = {};
  formSlots(t.form).forEach(k=>{ if(t.slots[k]) out[t.slots[k]] = slotRow(k); });
  return out;
}
function teamBattleOpt(t){ return {formA: t.form, rowsA: teamRows(t)}; }
/* 상대 팀 — 진형을 붙이고 전투 옵션으로 변환 */
function assignFoeForm(arr, fk){
  fk = (fk && FORMS[fk]) ? fk : pick(FORM_KEYS);
  const F = FORMS[fk];
  arr.form = fk;
  const order = F.front.concat(F.back);
  arr.rows = {};
  arr.forEach((st,i)=>{ const k = order[i]; if(k) arr.rows[st.id] = slotRow(k); });
  return arr;
}
function foeBattleOpt(arr){
  if(!arr || !arr.form) return {};
  return {formB: arr.form, rowsB: arr.rows||{}};
}
function teamByName(n){ return teamsOf().find(t=>t.n===n) || teamsOf()[0]; }
function teamLabel(t){ if(typeof t==="string") t = teamByName(t); return (t && t.label) ? t.label : `팀 ${t?t.n:"?"}`; }
/* 어느 팀에 들어가 있는지 */
/* 진형별 자리 요구 역할 — 앞에서부터 우선순위 */
const FORM_ROLES = {
  wedge:   {f2:["tank"],              b1:["dps"],            b3:["heal","supp"]},
  pocket:  {f1:["tank"],              f3:["heal","supp","tank"], b2:["dps"]},
  echelon: {f1:["tank","supp"],       b2:["dps"],            b3:["dps"]},
  line:    {f1:["tank"],              f2:["dps"],            f3:["heal","supp"]}
};
function roleOf(st){ return JOBS[st.job] ? JOBS[st.job].role : "dps"; }
/* 진형 기준 자동 편성 — 빈 자리에 미배정 학생을 역할에 맞춰 넣는다 */
/* 자리에 학생을 넣는다 — 같은 팀이면 자리 교환, 다른 팀이면 옮겨온다 */
function teamAssign(tn, k, id){
  const t = teamByName(tn);
  if(!t || !id) return;
  if(t.slots[k]===id){ delete t.slots[k]; return; }
  const at = teamOfStudent(id);
  if(at){
    if(at.t.n===t.n){ const prev=t.slots[k]; t.slots[k]=id; if(prev) t.slots[at.slot]=prev; else delete t.slots[at.slot]; }
    else { delete at.t.slots[at.slot]; t.slots[k]=id; }
  } else t.slots[k]=id;
}
function autoFillTeam(t, pool){
  const want = FORM_ROLES[t.form] || {};
  const slots = formSlots(t.form).filter(k=> !t.slots[k]);
  const take = (roles)=>{
    if(roles){
      for(const r of roles){
        const i = pool.findIndex(x=> roleOf(x)===r);
        if(i>=0) return pool.splice(i,1)[0];
      }
    }
    return pool.length ? pool.shift() : null;   // 조건에 맞는 학생이 없으면 전투력 순
  };
  const filled = [];
  slots.forEach(k=>{
    const st = take(want[k]);
    if(st){ t.slots[k] = st.id; filled.push({slot:k, st, want:want[k]||null}); }
  });
  return filled;
}
function autoFillAllTeams(){
  const taken = new Set();
  teamsOf().forEach(t=> formSlots(t.form).forEach(k=>{ if(t.slots[k]) taken.add(t.slots[k]); }));
  const pool = S.students.filter(x=> !taken.has(x.id)).sort((a,b)=> power(b)-power(a));
  const out = [];
  teamsOf().forEach(t=>{
    const f = autoFillTeam(t, pool);
    if(f.length) out.push({t, filled:f});
  });
  return out;
}
function teamOfStudent(id){
  for(const t of teamsOf()){
    for(const k of formSlots(t.form)) if(t.slots[k]===id) return {t, slot:k};
  }
  return null;
}

/* ============================================================
   훈련 카드 — 한 주는 월~금 다섯 칸, 손패 9장에서 골라 채운다
   ============================================================ */
const WEEK_DAYS = 5;
const DAY_N     = ["월","화","수","목","금"];
const HAND_SIZE = 9;
const DAY_MUL   = .2;      // 1주를 5칸으로 나눴으니 훈련·휴식 증가치는 20%
const CHAIN_STEP= .10;     // 전날과 같은 색이 이어질 때마다 +10% (최대 +40%)
const CHAIN_MAX = 4;
const CARD_COLOR = {
  red  : {n:"적",   c:"#e0616a", s:"rgba(224,97,106,.14)"},
  green: {n:"녹",   c:"#54ae70", s:"rgba(84,174,112,.14)"},
  blue : {n:"청",   c:"#5b87dd", s:"rgba(91,135,221,.14)"},
  sky  : {n:"하늘", c:"#48c3d8", s:"rgba(72,195,216,.14)"},
  gold : {n:"황",   c:"#d9a63c", s:"rgba(217,166,60,.14)"},
  pink : {n:"홍",   c:"#e37fb0", s:"rgba(227,127,176,.14)"}
};
const CARD_COL = {
  mock:"red",  spar:"red",
  basic:"green", heavy:"green",
  tact:"blue", form:"blue",
  medit:"sky", deep:"sky",
  free:"gold", strike:"gold",
  rest:"pink", exped:"pink"
};
const DECK_BASE = ["rest","basic","spar","tact","medit","free","exped"];
const DECK_ITEM = ["form","heavy","strike","deep","mock"];
function cardColor(t){ return CARD_COLOR[CARD_COL[t]] || CARD_COLOR.gold; }
/* 지금 뽑힐 수 있는 카드 — 아이템을 사면 그 훈련이 덱에 들어온다 */
function deckPool(){
  const a = DECK_BASE.slice();
  DECK_ITEM.forEach(id=>{ const t=TR[id]; if(t && t.need && S.items && S.items[t.need]) a.push(id); });
  return a;
}
function newCard(){ S.cardSeq = (S.cardSeq||0)+1; return {u:S.cardSeq, t:pick(deckPool())}; }
function handInit(){
  S.hand = []; S.slots = Array(WEEK_DAYS).fill(null); S.cardSeq = 0;
  for(let i=0;i<HAND_SIZE;i++) S.hand.push(newCard());
}
function handRefill(){
  S.hand = S.hand||[];
  let n=0;
  while(S.hand.length < HAND_SIZE){ S.hand.push(newCard()); n++; }
  return n;
}
function slotPut(u, day){
  if(day<0 || day>=WEEK_DAYS) return;
  const hi = (S.hand||[]).findIndex(c=>c && c.u===u);
  if(hi>=0){
    const card = S.hand.splice(hi,1)[0];
    if(S.slots[day]) S.hand.push(S.slots[day]);
    S.slots[day] = card;
    return;
  }
  const j = (S.slots||[]).findIndex(c=>c && c.u===u);
  if(j<0 || j===day) return;
  const tmp = S.slots[day]; S.slots[day] = S.slots[j]; S.slots[j] = tmp;   // 슬롯끼리는 자리 교환
}
function slotClear(day){
  if(!S.slots || !S.slots[day]) return;
  S.hand.push(S.slots[day]); S.slots[day] = null;
}
function slotsFull(){ return (S.slots||[]).filter(Boolean).length === WEEK_DAYS; }
/* 자동 배치 — 컨디션을 보고 고르고, 같은 색끼리 붙여 체인을 만든다 */
function autoFillSlots(){
  S.slots = S.slots || Array(WEEK_DAYS).fill(null);
  S.hand = S.hand || [];
  handRefill();
  const need = WEEK_DAYS - S.slots.filter(Boolean).length;
  if(need<=0) return;
  const avg = S.students.length ? S.students.reduce((a,s)=>a+s.cond,0)/S.students.length : 100;
  const pri = c=> c.t==="exped" ? 0 : c.t==="rest" ? (avg<55 ? 3 : 1) : 2;
  const cnt = {};
  S.hand.forEach(c=>{ const k=CARD_COL[c.t]; cnt[k]=(cnt[k]||0)+1; });
  const picked = S.hand.slice().sort((a,b)=>{
    const pa=pri(a), pb=pri(b);
    if(pa!==pb) return pb-pa;
    const ka=CARD_COL[a.t], kb=CARD_COL[b.t];
    if(cnt[ka]!==cnt[kb]) return cnt[kb]-cnt[ka];
    return ka<kb? -1 : ka>kb? 1 : 0;
  }).slice(0, need);
  picked.sort((a,b)=>{ const ka=CARD_COL[a.t], kb=CARD_COL[b.t]; return ka<kb?-1:ka>kb?1:0; });
  for(let d=0; d<WEEK_DAYS && picked.length; d++){
    if(S.slots[d]) continue;
    const c = picked.shift();
    const i = S.hand.findIndex(x=>x.u===c.u);
    if(i>=0) S.hand.splice(i,1);
    S.slots[d] = c;
  }
  while(S.slots.filter(Boolean).length < WEEK_DAYS){
    const d = S.slots.findIndex(x=>!x);
    handRefill();
    S.slots[d] = S.hand.shift() || newCard();
  }
}
/* 전날부터 거슬러 올라가 같은 색이 몇 장 이어졌는지 — 10%씩, 최대 40% */
function chainOf(list, i){
  if(!list || !list[i]) return 0;
  const c = CARD_COL[list[i].t];
  let n = 0;
  for(let k=i-1; k>=0; k--){ if(list[k] && CARD_COL[list[k].t]===c) n++; else break; }
  return Math.min(n, CHAIN_MAX) * CHAIN_STEP;
}

function unlocked(k){ return !!(S.unlock && S.unlock[k]); }
function newMission(){ return {idx:0, startYear:1, done:[]}; }
function missionCur(){ const m=S.mission; return (m && m.idx<MISSIONS.length)? MISSIONS[m.idx] : null; }
function missionDeadline(){
  const c = missionCur(); if(!c || !c.years) return null;
  return S.mission.startYear + c.years - 1;
}
function missionProgress(step){
  const c = missionCur();
  if(!c || c.step!==step) return;
  S.mission.done.push({id:c.id, n:c.n, year:S.year});
  S.mission.idx++;
  S.mission.startYear = S.year;
  if(c.unlock && !unlocked(c.unlock)){
    S.pendingUnlock = (S.pendingUnlock||[]).concat([c.unlock]);
    logE(`<b>${UNLOCKS[c.unlock].n}</b> 참가 자격을 얻었다 — 초대장은 내년 입학식에 도착한다.`,"big");
  }
  const nx = missionCur();
  logE(`<b>지침 달성 — ${c.n}</b>${nx? ` · 다음 지침: ${nx.n}` : " · 모든 지침을 완수했다"}`,"big");
  toast(`지침 달성 — ${c.n}`);
}

function isLateHalf(w){ return (w|0) >= HALF_WEEKS; }
function halfLabel(w){ return isLateHalf(w) ? "하반기" : "상반기"; }
function halfStart(w){ return isLateHalf(w) ? HALF_WEEKS : 0; }
function halfEnd(w){ return isLateHalf(w) ? PHASE_WEEKS : HALF_WEEKS; }
function halfLeft(){ return Math.max(0, halfEnd(S.week) - S.week); }

function newStudent(year, grade, job){
  grade = grade || wchoose({D:30,C:40,B:22,A:7,S:1});
  job = job || pick(JOB_KEYS);
  const g = {D:0,C:1,B:2,A:3,S:4}[grade];
  const m = {};
  const POT_RANGE = {D:[10,20], C:[21,40], B:[41,60], A:[61,80], S:[81,99]};
  MENTAL.forEach(x=>{
    if(x.k==="pot"){ const r = POT_RANGE[grade]||POT_RANGE.D; m.pot = ri(r[0], r[1]); return; }
    m[x.k] = Math.round(clamp(rnd(8,20) + g*rnd(3.5,6.5),5,95));
  });
  const st = {
    id:"s"+Math.random().toString(36).slice(2,9),
    name: pick(SUR)+pick(GIV), job, year, grade,
    level:1, exp:0, cond:ri(78,96), fame:0, eval:0,
    ment:m, focus:"free", relics:[], skMod:{}, sp:0, hist:[], injured:0, karma:0, trust:0, epithet:null,
    pers: wchoose(PERSONA_KEYS.reduce((a,k)=>{ a[k]=PERSONA[k].w; return a; }, {}))
  };
  applyPersona(st);

  // 상급생은 이미 어느 정도 성장해 있다
  const preLv = year===1?0 : year===2? ri(4,7) : ri(9,14);
  for(let i=0;i<preLv;i++) levelUp(st,true);
  if(year>1){
    MENTAL.forEach(x=>{ if(x.k!=="pot") st.ment[x.k]=Math.round(clamp(st.ment[x.k]+ (year-1)*rnd(6,15),5,99)); });
    st.fame = Math.round((year-1)*rnd(10,45));
  }
  const slots = relicSlots(st);
  for(let i=0;i<Math.min(slots, year-1);i++) st.relics.push(makeRelic(wchoose({C:60,B:30,A:10})));
  return st;
}
function relicSlots(st){ return Math.min(5, 1 + Math.floor(st.level/4)); }
function expNeed(lv){ return Math.round(80 + lv*32 + Math.pow(lv,1.7)*5); }

function levelUp(st, silent){
  st.level++;
  // 2레벨마다 스킬 강화 포인트
  if(st.level%2===0){
    st.sp = (st.sp||0)+1;
    if(!silent) logE(`<b>${dnH(st)}</b> — 스킬 강화 포인트 획득 (보유 ${st.sp})`,"good");
  }
  const before = st.relics.length, slots = relicSlots(st);
  if(!silent && slots>before && st.level%4===0) logE(`<b>${dnH(st)}</b> 레벨 ${st.level} — 유물 칸 ${slots}개로 확장`,"good");
  if(!silent) logE(`<b>${dnH(st)}</b> 레벨 ${st.level} 달성`,"good");
}
const EXP_MUL = .5;   // 전체 경험치 획득 배율
function gainExp(st, amt, quiet){
  amt = Math.round((amt||0) * EXP_MUL);
  st.exp += amt;
  st.totalExp = (st.totalExp||0) + amt;
  let n=0;
  while(st.level<30 && st.exp >= expNeed(st.level)){ st.exp -= expNeed(st.level); levelUp(st, quiet); n++; }
  return n;
}

/* 표시용 이름 — 이명이 있으면 이름 앞에 붙는다 */
function dn(st){ if(!st) return ""; return st.epithet ? ("\u201c" + st.epithet + "\u201d " + st.name) : st.name; }
/* 저장된 이름 문자열도 그대로 받아 이명 부분만 황동색으로 */
function epiH(nm){
  const v = String(nm==null? "" : nm);
  const m = v.match(/^\u201c([^\u201d]+)\u201d\s+([\s\S]+)$/);
  return m ? `<span class="epi">\u201c${esc(m[1])}\u201d</span> ${esc(m[2])}` : esc(v);
}
function dnH(st){ return epiH(dn(st)); }
function hasEpi(st){ return !!(st && st.epithet); }
function epiPool(job, key){ const M = key==="t"? EPI_TITLES : EPI_DEEDS; return M[job] || M.sword; }
function pickEpiTitle(st){
  // 현재 학원에서 쓰이는 이명만 피한다 (자기 이명 포함 — 반드시 바뀐다)
  const used = new Set((S.students||[]).map(x=>x.epithet).filter(Boolean));
  const all = epiPool(st.job, "t");
  const left = all.filter(t=> !used.has(t));
  if(left.length) return pick(left);
  const other = all.filter(t=> t !== st.epithet);   // 최소한 지금 이명과는 달라야 한다
  return pick(other.length? other : all);
}
function epiScene(kind, st, ctx){
  const nm = st.name;
  const where = (kind==="exped")
    ? `${ctx.place}에서 ${ctx.foe}${eulr(ctx.foe)} 상대로`
    : `${ctx.foeAcad}의 ${ctx.foe}${eulr(ctx.foe)} 상대로`;
  return `${S.acadName}의 ${nm}${eunn(nm)} ${where} ${ctx.deed}`;
}
function grantEpithet(kind, st, ctx){
  const prev  = st.epithet || null;
  const title = pickEpiTitle(st);
  const deed  = pick(epiPool(st.job, "d"));
  const c = Object.assign({}, ctx, {deed});
  const rec = {kind, sid:st.id, name:st.name, job:st.job, title, prev,
    scene: epiScene(kind, st, c), crowd: EPI_CROWD[kind] || "사람들",
    event: ctx.event||"", year:S.year, phase:S.phase, week:S.week+1};
  st.epithet = title;
  S.epiUsed = (S.epiUsed||[]).concat([title]);
  S.epiLog = (S.epiLog||[]); S.epiLog.unshift(rec); if(S.epiLog.length>80) S.epiLog.length=80;
  logE(prev
    ? `이명 — <b>${esc(st.name)}</b>의 이름이 <span style="color:var(--dim)">&ldquo;${esc(prev)}&rdquo;</span>에서 <b style="color:var(--brass)">&ldquo;${esc(title)}&rdquo;</b>${ro(title)} 바뀌었다. (${esc(rec.event)})`
    : `이명 — <b>${esc(st.name)}</b>에게 <b style="color:var(--brass)">&ldquo;${esc(title)}&rdquo;</b>${jo(title,"이라는","라는")} 이름이 붙었다. (${esc(rec.event)})`,"big");
  queueCeremony({type:"epithet", rec});
  return rec;
}
/* 대회·친선전 공통 — 승리한 경기가 있으면 그 경기의 활약자에게 */
function tryEpithetTour(kind, t, parts, eventName){
  const wins = (t.results||[]).filter(r=>r.win);
  if(!wins.length) return null;
  const pool = [...parts].map(id=> S.students.find(x=>x.id===id)).filter(Boolean);
  const winOf = s => wins.filter(r=> (r.myIds||[]).includes(s.id)).length;
  const cand = pool.filter(s=> winOf(s) > 0);
  if(!cand.length) return null;
  const top = cand.reduce((a,b)=> winOf(b)>winOf(a)? b:a, cand[0]);
  const r = wins.find(x=> (x.myIds||[]).includes(top.id)) || wins[0];
  const foes = (r.foes||[]).filter(Boolean);
  return tryEpithet(kind, cand, {
    event: eventName, foeAcad: r.vs || "상대 학원",
    foe: foes.length? pick(foes) : (r.vs||"상대"),
    score: s=> 1 + winOf(s)*2            // 승리한 경기가 많을수록 가중치
  });
}

/* 활약이 클수록 뽑힐 확률이 높되, 나머지에게도 기회가 간다 */
const EPI_HAS_MUL = .5;   // 이미 이명이 있으면 다시 뽑힐 가중치 절반
function epiWeight(s, score){
  let w = Math.max(.15, score(s) || 0);
  if(hasEpi(s)) w *= EPI_HAS_MUL;
  return w;
}
function tryEpithet(kind, pool, ctx){
  const cand = (pool||[]).filter(Boolean);   // 이미 이명이 있어도 대상 — 새 이명이 덮어쓴다
  if(!cand.length) return null;
  if(Math.random() >= (EPI_CHANCE[kind] != null ? EPI_CHANCE[kind] : .3)) return null;
  const score = ctx.score || (s=> 1 + power(s)/1200);
  const ws = cand.map(s=> epiWeight(s, score));
  const tot = ws.reduce((a,b)=>a+b, 0);
  if(tot <= 0) return grantEpithet(kind, pick(cand), ctx);
  let r = Math.random()*tot, chosen = cand[cand.length-1];
  for(let i=0;i<cand.length;i++){ r -= ws[i]; if(r <= 0){ chosen = cand[i]; break; } }
  return grantEpithet(kind, chosen, ctx);
}

    </div>
    ${st? `<div class="opt" style="cursor:default;margin-top:10px">

      <div class="od" style="color:var(--dim)">${r.prev? "이전 이명은 더 이상 불리지 않는다." : "이제 어디서든 이름 앞에 이명이 함께 불린다."}</div>

}

/* 전투 스탯 산출: 직업 기본 + 레벨 성장(잠재력 연동) + 유물 */
/* 멘탈리티가 전투 능력치에 주는 보정 (수치 100 기준) */
function MENT_BONUS(m){
  m = m||{};
  return {
    atkM: 1 + (m.aggr||0)/100*.16,      // 적극성 — 공격력
    spdM: 1 + (m.aggr||0)/100*.13,      // 적극성 — 속도
    hpM:  1 + (m.stam||0)/100*.26,      // 지구력 — 체력
    ultM: 1 + (m.genius||0)/100*.30,    // 천재성 — 필살 게이지
    acc:  (m.calm||0)/100*.05,          // 침착성 — 피해 명중
    eva:  (m.calm||0)/100*.18,          // 침착성 — 피해 회피
    skAcc:(m.calm||0)/100*.20,          // 침착성 — 스킬 성공률
    skRes:(m.will||0)/100*.30,          // 정신력 — 스킬 저항률
    critRes:(m.will||0)/100*.42,        // 정신력 — 받는 크리 피해 감소
    crit: (m.genius||0)/100*.15         // 천재성 — 크리 확률
  };
}
function battleStats(st){
  const J = JOBS[st.job], b = J.base, g = J.grow;
  const ME = mentEff(st);
  const potF = .58 + ME.pot/100*.85;
  const lv = st.level-1;
  const s = {
    hp: b.hp + g.hp*lv*potF,
    atk: b.atk + g.atk*lv*potF,
    def: b.def + g.def*lv*potF,
    spd: b.spd + g.spd*lv*potF,
    crit:b.crit, critDmg:b.critDmg, acc:b.acc, eva:b.eva,
    skAcc:b.skAcc, skRes:b.skRes, ultGain:b.ultGain, leech:b.leech,
    critRes: 0
  };
  // 멘탈리티 → 전투 능력치 보정
  const M = MENT_BONUS(ME);
  s.atk *= M.atkM; s.spd *= M.spdM; s.hp *= M.hpM; s.ultGain *= M.ultM;
  s.acc += M.acc; s.eva += M.eva; s.skAcc += M.skAcc; s.skRes += M.skRes; s.crit += M.crit;
  s.critRes += M.critRes||0;
  (st.relics||[]).forEach(r=>{ if(!r) return; r.aff.forEach(a=> s[a.k] = (s[a.k]||0)+a.v); });
  if(st.mul) for(const k in st.mul) s[k] = (s[k]||0)*st.mul[k];
  // 컨디션 보정 (±12%)
  const cf = .82 + (st.cond/100)*.28;
  ["hp","atk","def","spd"].forEach(k=> s[k]*=cf);
  return s;
}
function corePower(st){ const c=st.cond; st.cond=100; const v=power(st); st.cond=c; return v; }
function power(st){ const s=battleStats(st); return Math.round(s.hp*.06 + s.atk*2.2 + s.def*1.8 + s.spd*1.4 + s.crit*180 + s.ultGain*40); }
function mentAvg(st){ return Math.round(MENTAL.reduce((a,x)=>a+st.ment[x.k],0)/MENTAL.length); }

/* ============================================================
   로그
   ============================================================ */
function logE(html, cls){
  S.log.unshift({t:`${S.year}년 ${PHASES[S.phase].n} ${S.week+1}주`, h:html, c:cls||""});
  if(S.log.length>260) S.log.length=260;
}

/* ============================================================
   전투 (ATB)
   ============================================================ */
function mkUnit(st, side, idx, row){
  const s = battleStats(st);
  return {
    uid: side+idx, ref: st.id, name: dn(st), job: st.job, side, idx,
    row: row || ROW_OF(st.job), lv: st.level,
    ment: Object.assign({}, mentEff(st)), injured: injWeeks(st), skMod: st.skMod||{}, skills: skillsOf(st), passiveJob: passiveJobOf(st),
    base: s, maxHp: Math.round(s.hp), hp: Math.round(s.hp),
    atb: ri(0,300), ult:0, shield:0, fx:[], alive:true, acted:0,
    dDealt:0, dHeal:0, dTaken:0
  };
}
function eff(u, key){
  let v = u.base[key]||0, add=0, mul=0;
  u.fx.forEach(f=>{ if(f.stat===key){ if(f.mode==="mul") mul+=f.val; else add+=f.val; } });
  if(["crit","acc","eva","skAcc","skRes","leech","critDmg","ultGain","critRes"].includes(key)) return Math.max(0, v+add+ v*mul);
  return Math.max(1, (v+add)*(1+mul));
}
function consThr(stam){
  stam = clamp(stam||1, 1, 99);
  return stam<=30 ? 85 - (stam-1)*(15/29) : 70 - (stam-30)*(30/69);
}
function consOf(u){
  const hpP = u.maxHp? u.hp/u.maxHp*100 : 0;
  const thr = consThr(u.ment.stam);
  if(hpP >= thr || !u.alive) return {skill:1, ko:0, thr, hpP, lv:0};
  const mit = clamp(1 - (u.ment.will||0)/100*.7, .3, 1);
  const mild = Math.max(0, thr - Math.max(hpP, 30));
  const sev  = Math.max(0, 30 - hpP);
  return {
    skill: clamp(1 - (mild*.01 + sev*.02)*mit, .15, 1),
    ko:    clamp((mild*.001 + sev*.005)*mit, 0, .85),
    thr, hpP, lv: hpP<30? 2 : 1
  };
}
function aliveOf(team){ return team.filter(u=>u.alive); }

function hasFx(t, sk){ return !!(t && t.fx && t.fx.some(f=> f.name===sk.name && f.turns>1)); }
function freshFirst(pool, actor, sk){
  if(!pool || pool.length<2) return pool;
  if(!skDur(actor, sk)) return pool;
  const fresh = pool.filter(t=> !hasFx(t, sk));
  return fresh.length ? fresh : pool;
}
function pickTarget(actor, foes, allies, sk){
  const calmP = clamp(.3 + actor.ment.calm/100*.65, .3, .95);
  const smart = Math.random() < calmP;
  const t = sk.target;
  if(t==="self") return [actor];
  if(t.startsWith("ally")){
    let pool = aliveOf(allies);
    if(t==="ally_other" && pool.length>1) pool = pool.filter(u=>u.uid!==actor.uid);
    if(!pool.length) return [];
    if(t==="ally_all") return pool;
    if(smart) pool = freshFirst(pool, actor, sk);
    if(smart){ return [pool.slice().sort((a,b)=> a.hp/a.maxHp - b.hp/b.maxHp)[0]]; }
    return [pick(pool)];
  }
  let pool = aliveOf(foes);
  if(!pool.length) return [];
  if(t==="enemy_all") return pool;
  if(smart){
    pool = freshFirst(pool, actor, sk);
    if(t==="enemy_front"){ const f=pool.filter(u=>u.row==="front"); if(f.length) pool=f; }
    if(t==="enemy_back"){ const f=pool.filter(u=>u.row==="back"); if(f.length) pool=f; }
    if(t==="enemy_low") return [pool.slice().sort((a,b)=>a.hp-b.hp)[0]];
    return [pool.slice().sort((a,b)=> (a.hp/a.maxHp) - (b.hp/b.maxHp))[0]];
  }
  return [pick(pool)];
}

let DMG_K = 1.8, DEF_K = 290;
/* ---------- 스킬 성장 ---------- */
const SK_GRADE = ["D","C","B","A","S"];
const SK_UP = {pow:.12, proc:.15, dur:1};
const SK_EVO = {pow:.28, proc:.32, dur:2};
function skillsOf(st){ return (st && st.skills) ? st.skills : JOBS[st.job].skills; }
function passiveJobOf(st){ return (st && st.passiveJob) || st.job; }
function modOf(o, id){
  if(!o.skMod) o.skMod = {};
  return o.skMod[id] || (o.skMod[id] = {pow:0, proc:0, dur:0, grade:0, up:0});
}
function autoSkMod(st, level){
  st.skMod = {};
  const ids = JOBS[st.job].skills.map(x=>x.id).concat(["passive"]);
  let n = Math.max(0, Math.floor(level/2));
  while(n-- > 0){
    const m = modOf(st, pick(ids));
    m.pow += .12; m.up++;
    if(Math.random() < .16) m.grade = Math.min(4, m.grade+1);
  }
}
function ownerJobOf(skillId){
  for(const k in JOBS){ if((JOBS[k].skills||[]).some(x=>x.id===skillId)) return k; }
  return null;
}
function skGrade(o, id){ return SK_GRADE[clamp(((o.skMod&&o.skMod[id])||{}).grade||0, 0, 4)]; }
function skLevel(o, id){ return 1 + (((o.skMod&&o.skMod[id])||{}).up||0); }
function skPow(o, sk){ return sk.power * (1 + (modOf(o,sk.id).pow||0)); }
function skDur(o, sk){ return (sk.dur||0) + (modOf(o,sk.id).dur||0); }
function skProc(o, sk, genius){
  return clamp(sk.proc * (1 + (modOf(o,sk.id).proc||0)) * (1 + (genius||0)/100*.55), 0, .85);
}
function passiveFor(o){
  const P = passiveOf(passiveJobOf(o));
  if(!P) return null;
  const k = 1 + (((o.skMod&&o.skMod.passive)||{}).pow||0);
  const out = Object.assign({}, P);
  ["takeLow","ultBasic","vsBack","vsFront","vsLow","vsHigh","healMul","aoe","regen","take","leech","evaSelf"].forEach(x=>{ if(out[x]) out[x] = out[x]*k; });
  out.k = k;
  return out;
}

function runBattle(teamA, teamB, opt){
  opt = opt||{};
  const rowA = opt.rowsA||null, rowB = opt.rowsB||null;
  const A = teamA.map((st,i)=>mkUnit(st,"A",i, rowA? rowA[st.id] : null));
  const B = teamB.map((st,i)=>mkUnit(st,"B",i, rowB? rowB[st.id] : null));
  // 진형 보정
  [[A,opt.formA],[B,opt.formB]].forEach(([U,fk])=>{
    U.forEach(u=>{ u.fOut=0; u.fIn=0; u.fGuard=0; });
    if(!fk || !FORMS[fk]) return;
    const F = FORMS[fk].fx;
    U.forEach(u=>{
      if(u.row==="front"){
        if(F.fOut) u.fOut += F.fOut;
        if(F.fIn)  u.fIn  += F.fIn;
        if(F.fEva) u.base.eva = (u.base.eva||0) + F.fEva;
      } else {
        if(F.bOut) u.fOut += F.bOut;
        if(F.bIn)  u.fIn  += F.bIn;
        if(F.bCrit) u.base.crit = (u.base.crit||0) + F.bCrit;
        if(F.bInGuard) u.fGuard += F.bInGuard;
      }
    });
  });
  // 팀워크 진형 보정
  const infoM = infoBattleMul();
  [[A,teamA,opt.hpA,"A"],[B,teamB,opt.hpB,"B"]].forEach(([U,T,ratio,side])=>{
    const tw = T.reduce((a,s)=>a+mentEff(s).team,0)/T.length;
    const m = tw/100*.13;
    const im = side==="A" ? infoM : 1;
    const mood = side==="A" ? (opt.moodA||null) : (opt.moodB||null);
    U.forEach(u=>{
      const stu = T[u.idx];
      const mm = (mood && stu) ? moodStatMul(mood[stu.id]) : 1;
      u.moodMul = mm;
      ["atk","def","hp"].forEach(k=> u.base[k]*=(1+m)*im*mm);
      u.maxHp=Math.round(u.base.hp); u.hp=u.maxHp; u.formBonus=m;
      if(ratio && ratio[u.ref]!=null) u.hp = Math.max(1, Math.round(u.maxHp*clamp(ratio[u.ref],.05,1)));
    });
  });
  // 소울메이트 — 같은 팀에 함께 서면
  [A,B].forEach(U=>{
    const refs = U.map(u=>u.ref);
    U.forEach(u=>{
      const st = S.students && S.students.find(x=>x.id===u.ref);
      if(!st || !st.bro || refs.indexOf(st.bro)<0) return;
      ["hp","atk","def","spd"].forEach(k=> u.base[k] *= (1+BRO_STAT_MUL));
      u.bro = true;
      u.maxHp = Math.round(u.base.hp);
      u.hp = Math.min(u.maxHp, Math.round(u.hp*(1+BRO_STAT_MUL)));
    });
  });
  // 패시브 — 상시 스탯
  [A,B].forEach(U=> U.forEach(u=>{
    const P = passiveFor(u); u.pas = P; if(!P) return;
    if(P.leech) u.base.leech = (u.base.leech||0) + P.leech;
    if(P.evaSelf) u.base.eva = (u.base.eva||0) + P.evaSelf;
  }));
  // 패시브 — 전투 개시
  [[A,"A"],[B,"B"]].forEach(([U])=> U.forEach(u=>{
    const P = u.pas; if(!P || !P.onStart) return;
    if(P.onStart==="shieldAll") U.forEach(a=> a.shield = Math.max(a.shield, Math.round(a.maxHp*.08*P.k)));
    if(P.onStart==="atbSelf")   u.atb = Math.max(u.atb, Math.round(400*P.k));
    if(P.onStart==="atbAll")    U.forEach(a=> a.atb = Math.max(a.atb, Math.round(150*P.k)));
    if(P.onStart==="skAccAll")  U.forEach(a=> a.base.skAcc = (a.base.skAcc||0) + .05*P.k);
  }));
  const all = A.concat(B);
  const frames = [];
  const snap = ()=> all.map(u=>({hp:u.hp,maxHp:u.maxHp,sh:u.shield,ult:u.ult,atb:clamp(u.atb/1000,0,1),alive:u.alive,
    cs:consOf(u).lv, dd:u.dDealt|0, dh:u.dHeal|0, dt:u.dTaken|0,
    fx:u.fx.map(f=>({n:f.name,k:f.kind}))}));
  /* 누적 기록 — 피해 / 회복 / 받은 피해 */
  const recDmg  = (src, tgt, v)=>{ v=Math.round(v||0); if(v<=0) return; if(src) src.dDealt+=v; if(tgt) tgt.dTaken+=v; };
  const recHeal = (src, v)=>{ v=Math.round(v||0); if(v>0 && src) src.dHeal+=v; };
  const push=(line,cls,actor)=> frames.push({line,cls:cls||"",actor:actor||null,units:snap()});
  push(`<b>${opt.titleA||"우리 팀"}</b> 대 <b>${opt.titleB||"상대"}</b> — 전투 개시`,"sec");

  let guard=0, winner=null, totalActs=0, fatigueNoted=false;
  const fatigue = ()=> 1 + Math.min(1.6, Math.max(0, totalActs-60)*.025);
  while(guard++ < 3000){
    // 필살기 — 게이지가 차는 즉시 행동 게이지와 무관하게 발동한다
    const uready = all.filter(x=> x.alive && x.ult>=100);
    if(uready.length){
      uready.sort((a,b)=> eff(b,"spd")-eff(a,"spd"));
      const uu = uready[0];
      const ufoes = uu.side==="A"?B:A, uallies = uu.side==="A"?A:B;
      uu.ult = 0;
      if(aliveOf(ufoes).length){
        const uSKL = uu.skills || JOBS[uu.job].skills;
        const uSk = uSKL.find(x=>x.kind==="ult");
        if(uSk){
          totalActs++;
          if(totalActs===61 && !fatigueNoted){ fatigueNoted=true; push(`장기전 — 양측 모두 지쳐 주고받는 피해가 커진다`,"sec"); }
          push(`<b>${epiH(uu.name)}</b> — 필살 게이지 개방`,"ult",uu.uid);
          resolve(uu, uSk, ufoes, uallies, true);
          if(checkEnd()) break;
          continue;
        }
      }
    }
    // ATB 진행
    let ready = all.filter(u=>u.alive && u.atb>=1000);
    if(!ready.length){
      let need = Infinity;
      all.forEach(u=>{ if(u.alive){ const sp=eff(u,"spd"); need=Math.min(need,(1000-u.atb)/Math.max(1,sp)); } });
      need = Math.max(need, .01);
      all.forEach(u=>{ if(u.alive) u.atb += eff(u,"spd")*need; });
      continue;
    }
    ready.sort((a,b)=> b.atb-a.atb);
    const u = ready[0];
    u.atb -= 1000;
    u.acted++; totalActs++;
    if(totalActs===61 && !fatigueNoted){ fatigueNoted=true; push(`장기전 — 양측 모두 지쳐 주고받는 피해가 커진다`,"sec"); }
    // 지속 효과 정리
    let dotDmg = 0;
    u.fx = u.fx.filter(f=>{
      if(f.kind==="dot"){ dotDmg += f.val; }
      f.turns--; return f.turns>0;
    });
    if(dotDmg>0){
      u.hp = Math.max(0, u.hp - Math.round(dotDmg));
      u.dTaken += Math.round(dotDmg);
      push(`<b>${epiH(u.name)}</b> 지속 피해 ${fmt(dotDmg)}`,"", u.uid);
      if(u.hp<=0){ u.alive=false; push(`<b>${epiH(u.name)}</b> 전투 불능`,"die",u.uid); }
    }
    if(!u.alive){ if(checkEnd()) break; continue; }
    {
      const Pr = u.pas;
      if(Pr && Pr.regen && u.hp < u.maxHp){
        const h = Math.min(u.maxHp-u.hp, Math.round(u.maxHp*Pr.regen));
        if(h>0){ u.hp += h; recHeal(u, h); push(`<b>${epiH(u.name)}</b> 자연 회복 ${fmt(h)}`,"heal",u.uid); }
      }
    }

    const foes = u.side==="A"?B:A, allies = u.side==="A"?A:B;
    if(!aliveOf(foes).length) break;
    const SKL = u.skills || JOBS[u.job].skills;
    const basic = SKL.find(s=>s.kind==="basic");
    // (필살기는 게이지 충전 즉시 루프 상단에서 발동한다)
    const acts  = SKL.filter(s=>!s.kind);

    let chosen = null;
    const isUlt = false;
    {
      // 스킬 출현 판정 — 천재성
      const proc = acts.filter(s=> Math.random() < skProc(u, s, u.ment.genius));
      if(proc.length){
        if(proc.length>1 && Math.random() < u.ment.aggr/100){
          // 적극성: 상황에 맞는 쪽을 고른다
          proc.sort((a,b)=> actValue(b,u,foes,allies) - actValue(a,u,foes,allies));
          chosen = proc[0];
        } else chosen = pick(proc);
        // 적극성 — 이미 유지 중인 효과를 다시 걸지 않는다
        if(chosen !== basic && actValue(chosen,u,foes,allies) < .2 && Math.random() < u.ment.aggr/100){
          push(`<b>${epiH(u.name)}</b> — ${chosen.name}${eunn(chosen.name)} 아직 유지 중, 다시 걸지 않는다`,"",u.uid);
          chosen = basic;
        }
        // 시전 성공 판정
        if(chosen !== basic){
          const tgt0 = pickTarget(u,foes,allies,chosen);
          const res = tgt0.length && chosen.target.startsWith("enemy") ? eff(tgt0[0],"skRes") : 0;
          if(Math.random() > clamp(eff(u,"skAcc") - res, .25, 1)){
            push(`<b>${epiH(u.name)}</b>의 ${chosen.name} — 시전 실패`,"",u.uid);
            chosen = basic;
          }
        }
      } else chosen = basic;
    }
    resolve(u, chosen, foes, allies, isUlt);
    {
      const Pm = u.pas;
      const bb = (Pm && Pm.ultBasic && chosen && chosen.kind==="basic") ? 1+Pm.ultBasic : 1;
      u.ult = clamp(u.ult + 17*eff(u,"ultGain")*bb, 0, 100);
    }
    if(checkEnd()) break;
  }
  if(!winner){
    const ra = aliveOf(A).reduce((a,u)=>a+u.hp/u.maxHp,0), rb = aliveOf(B).reduce((a,u)=>a+u.hp/u.maxHp,0);
    winner = ra>=rb ? "A":"B";
    push(`시간 종료 — 잔여 전력 판정`,"sec");
  }
  push(`<b>${winner==="A"?(opt.titleA||"우리 팀"):(opt.titleB||"상대")}</b> 승리`,"sec");

  function checkEnd(){
    if(!aliveOf(A).length){ winner="B"; return true; }
    if(!aliveOf(B).length){ winner="A"; return true; }
    return false;
  }
  function fxUp(t, sk){ return hasFx(t, sk); }
  function alreadyUp(sk, u, foes, allies){
    if(!skDur(u, sk)) return false;
    if(sk.target==="self") return fxUp(u, sk);
    const pool = sk.target.startsWith("ally") ? aliveOf(allies) : aliveOf(foes);
    if(!pool.length) return false;
    return pool.every(t=> fxUp(t, sk));
  }
  function actValue(sk,u,foes,allies){
    if(sk.type==="heal"||sk.type==="ult_heal"){
      const low = Math.min(...aliveOf(allies).map(a=>a.hp/a.maxHp));
      return (1-low)*2.2;
    }
    if(sk.type==="shield"){
      const pool = aliveOf(allies);
      const covered = pool.length>0 && pool.every(t=> t.shield > t.maxHp*.25);
      return covered ? .12 : pool.length*.5 + .4;
    }
    const dup = alreadyUp(sk, u, foes, allies);
    if(sk.type==="buff"||sk.type==="haste") return dup ? .08 : .8;
    if(sk.type==="debuff"||sk.type==="slow") return dup ? .07 : .7;
    if(sk.type==="dot") return dup ? .35 : 1.05;
    return 1.0 + (sk.type==="dmg_aoe"? aliveOf(foes).length*.22 : 0);
  }

  function dealDamage(src, tgt, mult, o){
    o=o||{};
    const hitP = clamp(eff(src,"acc") - eff(tgt,"eva"), .35, .99);
    if(Math.random()>hitP){ push(`<b>${epiH(tgt.name)}</b> 회피`,"",src.uid); return 0; }
    const pierce = o.pierce||0;
    const d = eff(tgt,"def")*(1-pierce);
    let dmg = eff(src,"atk") * mult * (1 - d/(d+DEF_K)) * rnd(.93,1.07) * fatigue() * DMG_K * passiveDmgMul(src,tgt,o);
    // 진형 — 주는 쪽 / 받는 쪽
    if(src.fOut) dmg *= (1 + src.fOut);
    if(tgt.fIn)  dmg *= (1 + tgt.fIn);
    if(tgt.fGuard){
      const allies = tgt.side==="A"? A : B;
      if(allies.some(a=> a.alive && a.row==="front")) dmg *= (1 + tgt.fGuard);
    }
    let crit = o.forceCrit || Math.random() < eff(src,"crit");
    if(crit){
      const cd = eff(src,"critDmg");
      const cr = clamp(eff(tgt,"critRes")||0, 0, .8);   // 정신력 — 받는 크리 피해 감소
      dmg *= 1 + (cd-1)*(1-cr);
    }
    if(o.execute && tgt.hp/tgt.maxHp < .4) dmg *= (1+o.execute*2);
    dmg = Math.max(1, Math.round(dmg));
    let absorbed = 0;
    if(tgt.shield>0){ absorbed = Math.min(tgt.shield, dmg); tgt.shield -= absorbed; dmg -= absorbed; }
    tgt.hp = Math.max(0, tgt.hp - dmg);
    recDmg(src, tgt, dmg);
    const lee = eff(src,"leech");
    if(lee>0 && dmg>0){ const hb=src.hp; src.hp = Math.min(src.maxHp, src.hp + Math.round(dmg*lee)); recHeal(src, src.hp-hb); }
    tgt.ult = clamp(tgt.ult + 7*eff(tgt,"ultGain"),0,100);
    push(`<b>${epiH(tgt.name)}</b>에게 ${fmt(dmg)}${absorbed? ` (보호막 ${fmt(absorbed)} 흡수)`:""}${crit?" — 치명타!":""}`, crit?"crit":"", src.uid);
    if(tgt.hp<=0){ tgt.alive=false; tgt.fx=[]; push(`<b>${epiH(tgt.name)}</b> 전투 불능`,"die",src.uid); return dmg; }
    if(dmg>0){
      const cs = consOf(tgt);
      if(cs.ko>0 && Math.random()<cs.ko){
        tgt.alive=false; tgt.fx=[]; tgt.hp = Math.max(1, tgt.hp);
        push(`<b>${epiH(tgt.name)}</b> 의식을 잃고 쓰러졌다`,"die",src.uid);
      }
    }
    return dmg;
  }
  function addFx(tgt, o){ 
    const ex = tgt.fx.find(f=>f.name===o.name);
    if(ex){ Object.assign(ex,o); } else tgt.fx.push(o);
  }
  function resolve(u, sk, foes, allies, isUlt){
    const p = skPow(u, sk) * (sk.kind==="basic" ? 1 : consOf(u).skill);
    const dur = skDur(u, sk);
    const tg = pickTarget(u, foes, allies, sk);
    if(!tg.length) return;
    const label = isUlt? `<b>${epiH(u.name)}</b> 필살기 — ${sk.name}!` : (sk.kind==="basic"? `<b>${epiH(u.name)}</b> ${sk.name}` : `<b>${epiH(u.name)}</b> 스킬 — ${sk.name}`);
    push(label, isUlt?"ult":"", u.uid);
    switch(sk.type){
      case "dmg": dealDamage(u,tg[0],p,sk); break;
      case "dmg_multi": for(let i=0;i<(sk.hits||2);i++){ const t=aliveOf(foes); if(!t.length)break; dealDamage(u, tg[0].alive?tg[0]:pick(t), p, sk); } break;
      case "dmg_aoe": tg.forEach(t=> t.alive && dealDamage(u,t,p,sk)); break;
      case "dot":
        dealDamage(u,tg[0],p*.8,sk);
        if(tg[0].alive){ addFx(tg[0],{name:sk.name,kind:"dot",turns:dur+1,val:eff(u,"atk")*p*.55,stat:null});
          push(`<b>${epiH(tg[0].name)}</b> 중독 (${dur}턴)`,"",u.uid); }
        break;
      case "heal": {
        const h = Math.round(eff(u,"atk")*p*2.0*healMulOf(u));
        tg.forEach(t=>{ const b=Math.min(t.maxHp-t.hp,h); t.hp+=b; recHeal(u, b); push(`<b>${epiH(t.name)}</b> 회복 ${fmt(b)}`,"heal",u.uid); });
        break; }
      case "shield": {
        const sh = Math.round(eff(u, sk.scale||"def")*p*2.9);
        tg.forEach(t=>{ t.shield = sh; addFx(t,{name:"보호막",kind:"s",turns:dur+1,stat:null,val:0}); });
        push(`아군 ${tg.length}인 보호막 ${fmt(sh)}`,"heal",u.uid);
        break; }
      case "buff": {
        tg.forEach(t=>{
          addFx(t,{name:sk.name,kind:"b",turns:dur+1,stat:sk.stat,mode:sk.stat==="crit"?"add":"mul",val:sk.stat==="crit"?p*.5:p});
          if(sk.leech) addFx(t,{name:sk.name+"·피흡",kind:"b",turns:dur+1,stat:"leech",mode:"add",val:sk.leech});
          if(sk.eva) addFx(t,{name:sk.name+"·회피",kind:"b",turns:dur+1,stat:"eva",mode:"add",val:sk.eva});
        });
        push(`${tg.length>1?`아군 ${tg.length}인`:`<b>${epiH(tg[0].name)}</b>`} 강화 (${dur}턴)`,"heal",u.uid);
        break; }
      case "debuff": {
        tg.forEach(t=> addFx(t,{name:sk.name,kind:"d",turns:dur+1,stat:sk.stat,mode:"add",val:-p}));
        push(`적 ${tg.length}인 약화 (${dur}턴)`,"",u.uid);
        break; }
      case "haste": {
        tg.forEach(t=>{ t.atb = Math.min(999, t.atb + 1000*p); addFx(t,{name:"가속",kind:"b",turns:dur+1,stat:"spd",mode:"mul",val:p*.6}); });
        push(`<b>${epiH(tg[0].name)}</b> 행동 게이지 +${Math.round(p*100)}%`,"heal",u.uid);
        break; }
      case "slow": {
        tg.forEach(t=>{ t.atb = Math.max(0, t.atb - 1000*p); addFx(t,{name:"지연",kind:"d",turns:dur+1,stat:"spd",mode:"mul",val:-p*.5}); });
        push(`<b>${epiH(tg[0].name)}</b> 행동 게이지 -${Math.round(p*100)}%`,"",u.uid);
        break; }
      case "ult_single": dealDamage(u,tg[0],p,sk); if(sk.heal){ const h=Math.round(u.maxHp*sk.heal*.35); const h0=u.hp; u.hp=Math.min(u.maxHp,u.hp+h); recHeal(u, u.hp-h0); push(`<b>${epiH(u.name)}</b> 회복 ${fmt(h)}`,"heal",u.uid);} break;
      case "ult_aoe": tg.forEach(t=> t.alive && dealDamage(u,t,p,sk));
        tg.forEach(t=> t.alive && addFx(t,{name:"방어 붕괴",kind:"d",turns:dur+1,stat:"def",mode:"mul",val:-.25}));
        if(sk.heal){ const h=Math.round(u.maxHp*sk.heal*.3); const h0=u.hp; u.hp=Math.min(u.maxHp,u.hp+h); recHeal(u, u.hp-h0); push(`<b>${epiH(u.name)}</b> 회복 ${fmt(h)}`,"heal",u.uid); }
        break;
      case "drain": {
        const d = dealDamage(u,tg[0],p,sk);
        if(d>0){
          const low = aliveOf(allies).slice().sort((a,b)=> a.hp/a.maxHp - b.hp/b.maxHp)[0];
          if(low){ const h=Math.round(d*(sk.drain||.7)*healMulOf(u)), ab=Math.min(low.maxHp-low.hp,h); low.hp+=ab; recHeal(u, ab);
            push(`<b>${epiH(low.name)}</b> 흡수 회복 ${fmt(ab)}`,"heal",u.uid); }
        }
        break; }
      case "ult_drain": {
        let tot=0;
        tg.forEach(t=>{ if(t.alive) tot += dealDamage(u,t,p,sk); });
        const hh=Math.round(tot*(sk.drain||.35));
        if(hh>0){ aliveOf(allies).forEach(a=>{ const h0=a.hp; a.hp=Math.min(a.maxHp,a.hp+hh); recHeal(u, a.hp-h0); });
          push(`아군 전체 ${fmt(hh)} 흡수 회복`,"heal",u.uid); }
        break; }
      case "ult_bless": {
        tg.forEach(t=>{
          addFx(t,{name:"총원 각인",kind:"b",turns:dur+1,stat:"atk",mode:"mul",val:p*.4});
          addFx(t,{name:"각인·속도",kind:"b",turns:dur+1,stat:"spd",mode:"mul",val:p*.28});
          t.ult = clamp(t.ult+18,0,100);
        });
        push(`아군 전체 공격·속도 강화 · 필살 게이지 +18`,"heal",u.uid); break; }
      case "ult_guard": {
        const h=Math.round(eff(u,"atk")*p*1.9*healMulOf(u)), sh=Math.round(eff(u,"def")*p*2.6);
        tg.forEach(t=>{ const h0=t.hp; t.hp=Math.min(t.maxHp,t.hp+h); recHeal(u, t.hp-h0); t.shield=Math.max(t.shield,sh);
          addFx(t,{name:"성역",kind:"b",turns:dur+1,stat:"def",mode:"mul",val:.35}); });
        push(`아군 전체 회복 ${fmt(h)} · 보호막 ${fmt(sh)} · 방어 강화`,"heal",u.uid); break; }
      case "ult_heal": {
        const h=Math.round(eff(u,"atk")*p*2.9*healMulOf(u));
        tg.forEach(t=>{ const h0=t.hp; t.hp=Math.min(t.maxHp,t.hp+h); recHeal(u, t.hp-h0); t.fx=t.fx.filter(f=>f.kind!=="d"&&f.kind!=="dot"); });
        push(`아군 전체 회복 ${fmt(h)} · 약화 해제`,"heal",u.uid); break; }
      case "ult_time": {
        tg.forEach(t=>{ t.atb = 0; });
        aliveOf(allies).forEach(a=> a.ult = clamp(a.ult+30,0,100));
        push(`적 전체 행동 정지 · 아군 필살 게이지 +30`,"heal",u.uid); break; }
    }
  }
  return {winner, frames, acts:totalActs, A, B,
    formA: (opt.formA && FORMS[opt.formA])? opt.formA : null,
    formB: (opt.formB && FORMS[opt.formB])? opt.formB : null,
    names:all.map(u=>{
    const us = (u.skills||JOBS[u.job].skills).find(x=>x.kind==="ult");
    return {name:u.name,job:u.job,side:u.side,lv:u.lv,row:u.row,ult:us?us.name:"필살기"};
  })};
}

function mpDraft(){ if(!UI.mpDraft) UI.mpDraft = {lead:0, info:0, net:0}; return UI.mpDraft; }

function mpVal(k){ return S.master[k] + mpDraft()[k]; }

  logE(`마스터 육성 — ${txt}`,"good");

  toast(`육성 확정 — ${txt}`);
  return true;
}

/* ============================================================
   주간 진행
   ============================================================ */
function setCond(st, v){ st.cond = Math.round(clamp(v, 0, 100)); return st.cond; }
const COND_HI = 70, COND_MID = 40;
function condEff(c){
  if(c>=COND_HI)  return {mul:1.0, pct:100, tone:"ok"};
  if(c>=COND_MID) return {mul:.6,  pct:60,  tone:"warn"};
  return {mul:.2, pct:20, tone:"bad"};
}

/* ============================================================
   부상
   ------------------------------------------------------------
   · 훈련 실패 시에만 발생 (컨디션 70 이상은 실패하지 않는다)
   · 부상 중에는 잠재력을 제외한 멘탈리티가 전투/원정에서 50%로 계산된다
   · 부상 중 훈련은 휴식을 제외하고 100% 실패 → 재부상 가능
   · 재부상은 기간을 합산하지 않고 "긴 쪽"으로 갱신한다
   ============================================================ */
const TRAIN_FAIL_MUL = .25;   // 훈련 실패 시 성장/경험치 배율
const INJ_COND_DROP  = 20;    // 부상 시 추가 컨디션 하락 (1~20)
const INJ_REPEAT_SEV = 30;    // 이미 부상 중이면 심각도 +30
function isInjured(st){ return !!st && (st.injured|0) > 0; }
function injWeeks(st){ return st ? (st.injured|0) : 0; }
/* 전투에 쓰이는 실효 멘탈리티 — 부상 중이면 잠재력 외 50% */
function mentEff(st){
  if(!isInjured(st)) return st.ment;
  const m = {};
  for(const k in st.ment) m[k] = (k==="pot") ? st.ment[k] : st.ment[k]*.5;
  return m;
}
/* 훈련 성공 확률 */
function trainSuccessP(st, resting){
  if(resting) return 1;                        // 휴식 주간은 +1.0 → 항상 성공
  if(isInjured(st)) return 0;                  // 부상 중에는 휴식 외 100% 실패
  if(st.cond >= COND_HI) return 1;             // 컨디션 70 이상은 항상 성공
  return clamp(st.cond*.01 + st.ment.team/300, 0, 1);
}
function trainSuccess(st, resting){ return Math.random() < trainSuccessP(st, resting); }
/* 훈련 실패 시 부상 확률 — (80 - 컨디션)% */
function injureChance(st){ return clamp(80 - st.cond, 0, 100); }
function injSeverity(st){ return (70 - st.cond) + ri(1,100) + (isInjured(st)? INJ_REPEAT_SEV : 0); }
function injWeeksOf(sev){
  if(sev <= 80)  return 1;
  if(sev <= 100) return 2;
  if(sev <= 130) return ri(3,4);
  return ri(5,8);
}
/* 훈련 실패 후 부상 판정. 부상하면 주수를 돌려준다 */
/* 한 주에 훈련 판정이 다섯 번 돌아가므로 부상 확률은 하루치로 나눈다 */
function tryInjure(st, mul){
  if(Math.random()*100 >= injureChance(st) * (mul===undefined ? DAY_MUL : mul)) return 0;
  const again = isInjured(st);
  const sev = injSeverity(st);
  const w = injWeeksOf(sev);
  st.injured = Math.max(st.injured|0, w);      // 재부상은 긴 쪽으로 갱신
  st._injNew = 1;
  setCond(st, st.cond - ri(1, INJ_COND_DROP)); // 부상 시 컨디션 추가 하락
  logE(`<b>${dnH(st)}</b>${eunn(st.name)} 훈련 중 ${again?"부상이 덧났다":"부상을 입었다"} — <b style="color:var(--bad)">회복까지 ${st.injured}주</b> (심각도 ${Math.round(sev)})`, "bad");
  return w;
}
/* 주말 처리 — 이번 주에 새로 다친 학생은 건너뛰고, 나머지는 1주 소진 */
function tickInjury(){
  S.students.forEach(s=>{
    if(s._injNew){ delete s._injNew; return; }
    if((s.injured|0) > 0){
      s.injured = (s.injured|0) - 1;
      if(s.injured <= 0){
        s.injured = 0;
        logE(`<b>${dnH(s)}</b>${iga(s.name)} 부상에서 회복했다.`, "good");
      }
    }
  });
}
function facMul(fk){ return fk ? 1 + (S.facil[fk]-1)*.2 : 1; }
const FOCUS_FAC = {team:"arena",aggr:"arena",calm:"hall",will:"chapel",stam:"gym",genius:"library"};
const FOCUS_REST = "rest";
const FOCUS_REST_GAIN = 18;    // 휴식 집중 — 주당 컨디션 회복 (강장제 ×1.4 · 의무실 +등급)
function restFocusGain(){
  return Math.round(FOCUS_REST_GAIN * (S.items && S.items.tonic ? 1.4 : 1)) + (S.facil.infirm-1);
}
function isRestFocus(st){ return st && st.focus===FOCUS_REST; }
function focusOf(st){
  if(isRestFocus(st)) return null;          // 휴식 집중은 성장 훈련이 아니다
  if(!st.focus || st.focus==="free") return null;
  const g = {}; g[st.focus] = .8;
  return {id:"focus", n:"집중 훈련", fac:FOCUS_FAC[st.focus], cond:6, gains:g};
}
function doFocus(st, dayMul){
  const f = focusOf(st);
  if(!f) return false;
  if(st.cond < 25) return false;   // 지쳐 있으면 개인 훈련은 거른다
  if(isInjured(st)) return false;  // 부상 중에는 개인 집중 훈련도 불가
  const m = dayMul || 1;
  const g = {}; for(const k in f.gains) g[k] = f.gains[k]*m;
  trainStudent(st, Object.assign({}, f, {gains:g, cond:f.cond*m}), true,
    {noExp:true, noRecover:true, mul: rivalFocusMul(st)});
  return true;
}
function trainStudent(st, tr, success, opt){
  opt = opt||{};
  const gains = tr.gains||{};
  const potM = .55 + st.ment.pot/100*.95;
  const condM = condEff(st.cond).mul;
  const leadM = 1 + S.master.lead*.035;
  const fM = facMul(tr.fac);
  const partM = success ? 1 : TRAIN_FAIL_MUL;
  const libM = 1 + (S.facil.library-1)*.06;
  let notable = null;
  for(const k in gains){
    const cap = 45 + st.ment.pot*.78;
    const cur = st.ment[k];
    const room = clamp(1 - (cur-10)/Math.max(20,cap), .18, 1);
    let d = 2.4*gains[k]*potM*condM*leadM*fM*partM*room*rnd(.7,1.35)*(k==="genius"||k==="pot"?libM:1)*(opt.mul||1);
    st.ment[k] = clamp(st.ment[k] + d, 1, 99);
    if(d>.9 && (!notable || d>notable.d)) notable={k,d};
  }
  if(!opt.noExp){
    if(!tr.rest){
      const xp = ((tr.special==="camp"? 132 : 88) + st.level*7) * (opt.xpMul||1);
      st._up = (st._up||0) + gainExp(st, xp*(success?1:TRAIN_FAIL_MUL), true);
    } else st._up = 0;
  }
  let c = tr.cond * (success?1:.5);
  if(tr.rest && S.items.tonic) c *= 1.4;
  setCond(st, st.cond - c);
  if(!opt.noRecover) setCond(st, st.cond + (S.facil.infirm-1)*(opt.recMul||1));
  return notable;
}
function activeStudents(){ return S.students; }

/* ============================================================
   주간 실행 — 월~금 다섯 칸을 순서대로 치른다
   ============================================================ */
const CAMP_GAIN = 1.8, CAMP_COND = 1.5;   // 여름 하반기 합숙 보정
function isCampWeek(){ return S.phase==="summer" && isLateHalf(S.week); }
/* 휴식 계열 스케줄의 회복량 (이미 요일 배율이 반영된 훈련을 받는다) */
function restWeekGain(tr){
  if(!tr || !tr.rest) return 0;
  return -tr.cond * (S.items && S.items.tonic ? 1.4 : 1) + (S.facil.infirm-1)*DAY_MUL;
}
function doRestFocus(s, tr){
  setCond(s, s.cond + Math.max(restFocusGain()*DAY_MUL, restWeekGain(tr)));
  s._rest = (s._rest||0)+1;
}
/* 카드 한 장을 하루치 훈련으로 환산 */
function dayTrOf(tr, bonus){
  const camp = isCampWeek(), cg = camp? CAMP_GAIN : 1, cc = camp? CAMP_COND : 1;
  const g = {};
  for(const k in (tr.gains||{})) g[k] = tr.gains[k] * DAY_MUL * (1+bonus) * cg;
  return Object.assign({}, tr, {
    gains: g,
    cond: tr.cond * DAY_MUL * (tr.rest ? (1+bonus) : cc),
    _xpMul: DAY_MUL * (1+bonus) * cg
  });
}

/* ---------- 주간 일지 ---------- */
let DAYLOG = [];
function dlog(t, k){ DAYLOG.push({t:t, k:k||""}); }
function mentSnap(){
  const m = {};
  S.students.forEach(s=> m[s.id] = {cond:s.cond, exp:s.totalExp||0, ment:Object.assign({}, s.ment)});
  return m;
}
/* 멘탈리티는 소수로 쌓이고 화면에는 반올림해서 보여준다.
   "지구력 1 상승"은 그 반올림한 숫자가 바뀐 날에만 찍는다 — 학생 카드의 숫자와 어긋나지 않게. */
function mentCross(snap, who){
  const out = [];
  (who||S.students).forEach(s=>{
    const b = snap[s.id]; if(!b) return;
    MENTAL.forEach(m=>{
      if(m.k==="pot") return;
      const d = Math.round(s.ment[m.k]) - Math.round(b.ment[m.k]);
      if(d>=1) out.push({s:s, n:m.n, d:d});
    });
  });
  return out;
}
function chainTag(bonus){
  return bonus>0 ? ` <b style="color:var(--brass)">${Math.round(bonus*100)}% 체인 보너스!</b>` : "";
}

function dayRun(tr0, bonus, day, opt){
  opt = opt||{};
  const skip = opt.skip || null;
  const tr = dayTrOf(tr0, bonus);
  const resting = !!tr.rest;
  const snap = mentSnap();
  const D = DAY_N[day];
  let parts=0, foc=0, rested=0, hurt=0, active=0, expSum=0;
  const focWho = [], trained = [];
  S.students.forEach(s=>{
    if(skip && skip.has(s.id)) return;
    if(isRestFocus(s)){ doRestFocus(s, tr); rested++; return; }
    active++;
    const part = trainSuccess(s, resting);
    if(part) parts++;
    if(!resting){ if(part) s._att=(s._att||0)+1; else s._miss=(s._miss||0)+1; }
    const e0 = s.totalExp||0;
    trainStudent(s, tr, part, {xpMul: tr._xpMul, recMul: DAY_MUL});
    expSum += (s.totalExp||0) - e0;
    trained.push(s);
    if(!part && !resting && tryInjure(s)) hurt++;
  });
  if(resting){
    dlog(opt.head || `${D}요일은 <b>휴식</b> 시간을 가졌다.${chainTag(bonus)}`, "rest");
    const g = Math.round(Math.max(0, S.students.reduce((a,s)=> a + (s.cond - snap[s.id].cond), 0) / Math.max(1,S.students.length)));
    dlog(`전체 컨디션 <b style="color:var(--ok)">${g}</b> 상승${rested? ` · 휴식 집중 ${rested}명 별도 회복`:""}`, "sub");
  } else {
    dlog(opt.head || `${D}요일 훈련으로 <b>${tr.n}</b>${eulr(tr.n)} 단련했다!${chainTag(bonus)}`, "head");
    const cd = Math.round(trained.reduce((a,s)=> a + (snap[s.id].cond - s.cond), 0) / Math.max(1,trained.length));
    const xp = Math.round(expSum / Math.max(1,trained.length));
    dlog(`전체 컨디션 ${cd>0? `<b style="color:var(--bad)">${cd}</b> 하락`: cd<0? `<b style="color:var(--ok)">${-cd}</b> 상승`:"유지"}, 경험 <b>${fmt(xp)}</b> 획득${
      (active-parts)>0? ` · <span style="color:var(--bad)">훈련 실패 ${active-parts}명</span>`:""}${
      hurt? ` · <b style="color:var(--bad)">부상 ${hurt}명</b>`:""}`, "sub");
  }
  // 훈련 성과 — 정수 자리가 오른 멘탈리티
  {
    const cs = mentCross(snap, trained);
    const g = {};
    cs.forEach(x=>{ const k = x.n+"|"+x.d; (g[k]=g[k]||[]).push(dnH(x.s)); });
    const keys = Object.keys(g);
    if(keys.length) keys.forEach(k=>{
      const [n,d] = k.split("|");
      dlog(`${g[k].join(", ")}의 <b>${n}</b> ${d} 상승`, "sub");
    });
    else if(!resting){
      const fine = [];
      trained.forEach(s=> MENTAL.forEach(m=>{
        if(m.k==="pot") return;
        const d = s.ment[m.k] - snap[s.id].ment[m.k];
        if(d>=.05) fine.push({s:s, n:m.n, d:d});
      }));
      fine.sort((a,b)=>b.d-a.d);
      if(fine.length) dlog(`${fine.slice(0,3).map(x=>`${dnH(x.s)} <b>${x.n}</b> +${x.d.toFixed(1)}`).join(", ")}`, "sub");
      else dlog(`<span style="color:var(--dim)">눈에 띄는 변화 없이 기초가 쌓였다.</span>`, "sub");
    }
  }
  // 오후 — 개인 집중 훈련
  if(!resting){
    const fs = mentSnap();
    S.students.forEach(s=>{
      if(skip && skip.has(s.id)) return;
      if(isRestFocus(s)) return;
      if(doFocus(s, DAY_MUL)){ foc++; focWho.push(s); }
    });
    if(foc){
      dlog(`오후에는 각자 개인적으로 집중 분야를 단련했다!`, "head2");
      const cs = mentCross(fs, focWho);
      if(cs.length) cs.forEach(x=> dlog(`${dnH(x.s)} <b>${x.n}</b> ${x.d} 증가`, "sub"));
      else {
        const fine = [];
        focWho.forEach(s=> MENTAL.forEach(m=>{
          if(m.k==="pot") return;
          const d = s.ment[m.k] - fs[s.id].ment[m.k];
          if(d>=.05) fine.push({s:s, n:m.n, d:d});
        }));
        fine.sort((a,b)=>b.d-a.d);
        dlog(fine.length? fine.slice(0,3).map(x=>`${dnH(x.s)} <b>${x.n}</b> +${x.d.toFixed(1)}`).join(", ")
          : `<span style="color:var(--dim)">${foc}명이 각자의 분야를 조금씩 다듬었다.</span>`, "sub");
      }
    }
  }
}

/* ---------- 주간 실행기 ---------- */
function weekRunGo(quick){
  const ph = PHASES[S.phase];
  if(S.week >= ph.weeks){
    if(UI.pendingTour){ renderTournament(); return; }
    logE(`학사 일정 정리 — ${ph.n} 일정이 모두 끝나 시즌을 마무리한다.`,"");
    endPhase(); save(); render(); return;
  }
  if(!S.opts) S.opts = {report:true};
  if(!slotsFull()){
    if(quick) autoFillSlots();
    else { toast("월요일부터 금요일까지 다섯 칸을 모두 채워야 한다."); return; }
  }
  if(!quick && S.master.pts>0 && !UI.skipPtWarn){ masterPointModal(1); return; }
  DAYLOG = []; RUN = {expeds:[]};
  S.students.forEach(x=>{ x._att=0; x._miss=0; x._exp=0; x._up=0; });
  focusHistPush();
  UI.wrun = {quick:!!quick, day:0, days:S.slots.slice(),
    snap:snapStudents(), startWeek:S.week, startPhase:S.phase, startYear:S.year,
    g0:S.gold, f0:S.fame, r0:(S.relicPool||[]).length};
  if(isCampWeek()) dlog(`<b>합숙 기간</b> — 이번 주 훈련 효과가 크게 오르지만 컨디션 소모도 크다.`, "note");
  weekRunStep();
}
function weekRunStep(){
  const R = UI.wrun; if(!R) return;
  while(R.day < WEEK_DAYS){
    const card = R.days[R.day];
    const tr = (card && TR[card.t]) || TR.free;
    const bonus = chainOf(R.days, R.day);
    if(tr.special==="exped"){ expedDay(R, bonus); return; }   // 팝업으로 넘어간다
    dayRun(tr, bonus, R.day);
    dlog("", "gap");
    R.day++;
  }
  weekRunEnd();
}
function weekRunEnd(){
  const R = UI.wrun; if(!R) return;
  UI.wrun = null;
  // 쓴 카드는 버리고 새로 다섯 장
  S.slots = Array(WEEK_DAYS).fill(null);
  tickInjury();
  tryBonds();
  tryFriendly();
  tryCounsel();
  const dealt = handRefill();
  const finish = ()=>{
    levelReport(S.students.map(s=>({s:s, n:s._up||0})));
    const acts = R.days.map(c=> (TR[c.t]||TR.free).n);
    logE(`${R.startWeek+1}주 — ${acts.join(" · ")}`, "");
    if(!R.quick) weekReport(R);
    else if(!UI.pendingTour && (UI.ceremonies||[]).length) showCeremony();
    save();
  };
  {
    const sl = FRIENDLY_PHASES[S.phase] ? friendlySlotAt(S.week) : null;
    if(sl){ S.week++; startFriendly(sl); finish(); return; }
  }
  S.week++;
  if(S.phase==="fall" && S.fallRun && S.fallRun.alive && S.week < PHASES.fall.weeks){
    const cfg = LADDER[S.fallRun.step];
    if(cfg && S.week === cfg.week){ startLadder(S.fallRun.step); finish(); return; }
  }
  if(S.week >= PHASES[S.phase].weeks){ endPhase(); }
  finish();
}
function weekReport(R){
  const ranTo = (S.phase===R.startPhase && S.year===R.startYear) ? S.week : PHASES[R.startPhase].weeks;
  showReport({snap:R.snap, startWeek:R.startWeek, ranTo:ranTo, startPhase:R.startPhase, startYear:R.startYear,
    acts: R.days.map(c=>({n:(TR[c.t]||TR.free).n})),
    daylog: DAYLOG.slice(),
    gold:S.gold-R.g0, fame:S.fame-R.f0, relics:(S.relicPool||[]).length-R.r0});
}
function runWeek(){ weekRunGo(true); }
function runWeeks(n){
  for(let i=0;i<n;i++){
    if(UI.pendingTour) break;
    const before = S.phase+S.year;
    weekRunGo(true);
    if(UI.pendingTour) break;
    if(S.phase+S.year !== before) break;
  }
  render();
}
function runWithReport(){ weekRunGo(false); }

function dl(v, unit, digits){
  if(Math.abs(v) < (digits?0.05:0.5)) return `<span style="color:var(--dim)">±0</span>`;
  const c = v>0? "var(--ok)":"var(--bad)";
  const t = digits? Math.abs(v).toFixed(1) : fmt(Math.abs(v));
  return `<span style="color:${c};font-weight:600">${v>0?"+":"−"}${t}${unit||""}</span>`;
}
